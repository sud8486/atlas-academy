<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>करेंट अफेयर्स टेस्ट सीरीज़</title>
<style>
:root{--bg:#fff;--fg:#1c1c1e;--card:#f4f4f6;--bd:#d9d9de;--ok:#1e8e3e;--okb:#e2f4e7;--no:#c5221f;--nob:#fbe4e3;--ac:#3b5bdb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#121214;--fg:#f0f0f3;--card:#1e1e22;--bd:#3a3a40;--ok:#6fdc8c;--okb:#14301c;--no:#ff8a84;--nob:#3a1b1a;--ac:#8ea2ff}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121214;--fg:#f0f0f3;--card:#1e1e22;--bd:#3a3a40;--ok:#6fdc8c;--okb:#14301c;--no:#ff8a84;--nob:#3a1b1a;--ac:#8ea2ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.55 system-ui,"Noto Sans Devanagari",sans-serif}
main{max-width:640px;margin:0 auto;padding:14px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
button{font:inherit;color:inherit;cursor:pointer}
.tab{flex:1;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.tab.on{border-color:var(--ac);color:var(--ac);font-weight:600}
.meta{display:flex;justify-content:space-between;font-size:14px;opacity:.8;margin-bottom:8px}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px;font-weight:600}
.opt{display:block;width:100%;text-align:left;padding:12px;margin-bottom:8px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.opt.ok{background:var(--okb);border-color:var(--ok);color:var(--ok)}
.opt.no{background:var(--nob);border-color:var(--no);color:var(--no)}
.row{display:flex;gap:8px;margin-top:10px}
.row button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card)}
.pri{background:var(--ac)!important;color:#fff!important;border-color:var(--ac)!important}
.fb{padding:10px 12px;border-radius:10px;margin-top:4px;font-size:15px}
.fb.ok{background:var(--okb);color:var(--ok)}.fb.no{background:var(--nob);color:var(--no)}
.src{font-size:13px;opacity:.65;margin-top:10px}
</style></head><body><main id="app"></main>
<script>
// [प्रश्न, [विकल्प], सही_index, स्रोत]
const ALL=[
["भारत के पहले बंदरगाह-आधारित ई-मेथनॉल संयंत्र की आधारशिला कहाँ रखी गई?",["पारादीप बंदरगाह, ओडिशा","दीनदयाल बंदरगाह प्राधिकरण, कांडला","मुंद्रा बंदरगाह, गुजरात","जवाहरलाल नेहरू बंदरगाह"],1],
["कांडला बंदरगाह गुजरात के किस जिले में स्थित है?",["जामनगर","भावनगर","सूरत","कच्छ"],3],
["पाँचवें स्वच्छ वायु सर्वेक्षण, 2026 में दस लाख से अधिक जनसंख्या वाले शहरों में प्रथम स्थान किसे मिला?",["इंदौर","जबलपुर","लखनऊ","सूरत"],2],
["बाघ अभयारण्यों के प्रबंधन प्रभावशीलता मूल्यांकन का संक्षिप्त नाम क्या है?",["NTCA-TR","MEE-TR","PMT-TR","WII-TR"],1],
["18वाँ ब्रिक्स शिखर सम्मेलन (12-13 सितंबर, 2026) किस देश की अध्यक्षता में आयोजित हुआ?",["भारत","ब्राज़ील","रूस","दक्षिण अफ्रीका"],0],
["नौवें राष्ट्रीय पोषण माह, 2026 का विषय क्या था?",["सुपोषित भारत, सशक्त भारत","पोषण भी, पढ़ाई भी","हमारी आंगनवाड़ी, हमारी जिम्मेदारी","स्वस्थ बालक, स्वस्थ भारत"],2],
["ई-श्रम पोर्टल की शुरुआत के पाँच वर्ष कब पूरे हुए?",["1 मई, 2026","15 अगस्त, 2026","2 अक्टूबर, 2026","26 अगस्त, 2026"],3],
["चंद्रयान-3 ने चंद्रमा पर सफल सॉफ्ट लैंडिंग कब की थी?",["14 जुलाई, 2023","15 अगस्त, 2023","23 अगस्त, 2023","23 अगस्त, 2024"],2],
["बिहार और झारखंड के बीच जल-बँटवारे से जुड़ी सोन नदी किस प्रमुख नदी की सहायक है?",["यमुना","गंगा","गोदावरी","ब्रह्मपुत्र"],1],
["भारत में आधिकारिक समय का वैज्ञानिक मानक किस प्रयोगशाला से संबंधित है?",["ISRO, बेंगलुरु","BARC, मुंबई","भारतीय खगोल भौतिकी संस्थान","सीएसआईआर-राष्ट्रीय भौतिक प्रयोगशाला, नई दिल्ली"],3]
].map((q,i)=>({id:"d2_"+i,q:q[0],o:q[1],a:q[2],src:"दृष्टि 2026 (2), पेज 4"}));

let saved=[];try{saved=JSON.parse(localStorage.getItem("saved_q")||"[]")}catch(e){}
const persist=()=>{try{localStorage.setItem("saved_q",JSON.stringify(saved))}catch(e){}};
let mode="all",list=[],i=0,picked=null,score=0,wrong=[];
const $=document.getElementById("app");
function start(m){mode=m;list=m==="all"?ALL.slice():ALL.filter(x=>saved.includes(x.id));i=0;picked=null;score=0;wrong=[];render()}
function tabs(){return `<div class="tabs"><button class="tab ${mode==="all"?"on":""}" onclick="start('all')">सभी प्रश्न (${ALL.length})</button><button class="tab ${mode==="saved"?"on":""}" onclick="start('saved')">⭐ सेव किए (${saved.length})</button></div>`}
function pick(k){if(picked!==null)return;picked=k;const q=list[i];if(k===q.a)score++;else wrong.push(q.id);render()}
function toggle(){const id=list[i].id;saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];persist();render()}
function next(){i++;picked=null;render()}
function saveWrong(){wrong.forEach(id=>{if(!saved.includes(id))saved.push(id)});persist();render()}
function render(){
 if(!list.length){$.innerHTML=tabs()+`<div class="q">${mode==="saved"?"अभी कोई प्रश्न सेव नहीं है। टेस्ट में किसी प्रश्न पर ☆ दबाकर सेव करें।":"कोई प्रश्न नहीं।"}</div>`;return}
 if(i>=list.length){$.innerHTML=tabs()+`<div class="q">टेस्ट पूरा! स्कोर: ${score} / ${list.length}</div><div class="row">${wrong.length?`<button onclick="saveWrong()">गलत ${wrong.length} प्रश्न सेव करें</button>`:""}<button class="pri" onclick="start('${mode}')">फिर से हल करें</button></div>`;return}
 const q=list[i],on=saved.includes(q.id);
 let h=tabs()+`<div class="meta"><span>प्रश्न ${i+1} / ${list.length}</span><span>सही: ${score}</span></div><div class="q">${q.q}</div>`;
 q.o.forEach((t,k)=>{let c="opt";if(picked!==null){if(k===q.a)c+=" ok";else if(k===picked)c+=" no"}
  h+=`<button class="${c}" onclick="pick(${k})">${"ABCD"[k]}. ${t}</button>`});
 if(picked!==null)h+=picked===q.a?`<div class="fb ok">✅ सही उत्तर!</div>`:`<div class="fb no">❌ गलत। सही उत्तर: ${"ABCD"[q.a]}. ${q.o[q.a]}</div>`;
 h+=`<div class="row"><button onclick="toggle()">${on?"⭐ सेव है (हटाएँ)":"☆ बाद के लिए सेव करें"}</button>${picked!==null?`<button class="pri" onclick="next()">${i+1<list.length?"अगला →":"परिणाम"}</button>`:""}</div><div class="src">स्रोत: ${q.src}</div>`;
 $.innerHTML=h}
start("all");
</script></body></html>
