<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>UPSC स्तर करेंट अफेयर्स टेस्ट 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Mukta:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: exam-hall answer sheet — test index, then one question at a time with an OMR-style palette */
:root{
  --bg:#f5f6f2; --paper:#ffffff; --ink:#1d2433; --muted:#5d6577; --line:#d9ddd4;
  --accent:#1f4e79; --accent-soft:#e3ecf5;
  --ok:#17803d; --ok-soft:#e2f4e8; --bad:#c0362c; --bad-soft:#fbe6e3; --skip:#9aa1ad;
  --f-display:'Tiro Devanagari Hindi','Noto Serif Devanagari',Georgia,serif;
  --f-body:'Mukta','Noto Sans Devanagari','Nirmala UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161d; --paper:#1a2029; --ink:#e7eaf0; --muted:#9aa3b2; --line:#2c3440;
  --accent:#7fb2e5; --accent-soft:#1f2c3b; --ok:#4cc27a; --ok-soft:#143022; --bad:#ef7a6e; --bad-soft:#3a1d1a; --skip:#6b7380; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --paper:#1a2029; --ink:#e7eaf0; --muted:#9aa3b2; --line:#2c3440;
  --accent:#7fb2e5; --accent-soft:#1f2c3b; --ok:#4cc27a; --ok-soft:#143022; --bad:#ef7a6e; --bad-soft:#3a1d1a; --skip:#6b7380; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:clamp(26px,5vw,36px);line-height:1.2}
.lede{color:var(--muted);margin:6px 0 0}
.rule{display:flex;flex-wrap:wrap;gap:6px 18px;margin:14px 0 22px;font-size:14px;color:var(--muted)}
.rule b{color:var(--ink);font-weight:500}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.card .t{font-family:var(--f-display);font-size:22px}
.card .s{font-size:14px;color:var(--muted)}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.card .sc{font-family:var(--f-mono);font-size:13px;color:var(--accent)}
/* test view */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.back{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 12px;font-size:15px}
.ttl{font-family:var(--f-display);font-size:20px;flex:1;min-width:120px}
.stats{display:flex;gap:12px;font-family:var(--f-mono);font-size:13px}
.stats .ok{color:var(--ok)}.stats .bad{color:var(--bad)}
.qbox{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:16px}
.qmeta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-bottom:8px}
.qmeta .tag{background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:1px 10px}
.qtext{font-size:18px;font-weight:500;margin:0 0 16px;white-space:pre-line}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.opt[disabled]{cursor:default}
.bub{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;margin-top:1px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .bub{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.opt .mk{margin-left:auto;font-weight:700;padding-left:8px}
.verdict{margin-top:14px;border-radius:10px;padding:12px 14px;font-size:16px}
.verdict.ok{background:var(--ok-soft);border-left:4px solid var(--ok)}
.verdict.bad{background:var(--bad-soft);border-left:4px solid var(--bad)}
.verdict b{display:block;margin-bottom:2px}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 18px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn[disabled]{opacity:.4;cursor:default}
.pal{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:20px}
.pal button{aspect-ratio:1;border:1px solid var(--line);background:var(--paper);border-radius:6px;font-family:var(--f-mono);font-size:12px;padding:0;min-width:0}
.pal .r{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.pal .w{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.pal .cur{outline:2px solid var(--accent);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.result{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:16px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0}
.rgrid div{border:1px solid var(--line);border-radius:8px;padding:10px}
.rgrid span{display:block;font-size:13px;color:var(--muted)}
.rgrid b{font-family:var(--f-mono);font-size:22px;font-weight:500}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
@media (max-width:480px){.pal{grid-template-columns:repeat(8,1fr)}.qbox{padding:16px}.qtext{font-size:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>

  for (let i = 0; i < 100; i++){
    const c = a[i] === undefined ? '' : (a[i] === qs[i][2] ? 'r' : 'w');
    p += `<button class="${c} ${i === cur.i ? 'cur' : ''}" data-i="${i}" aria-label="प्रश्न ${i+1}">${i+1}</button>`;
  }
  p += `</div><div class="legend"><span><i style="background:var(--ok)"></i>सही</span><span><i style="background:var(--bad)"></i>गलत</span><span><i style="border:1px solid var(--line)"></i>शेष</span></div>`;
  app.innerHTML = top + body + p;
  document.getElementById('back').onclick = () => { location.hash = ''; };
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (a[cur.i] !== undefined) return;
    a[cur.i] = +b.dataset.k; save(); testView();
  });
  app.querySelectorAll('.pal button').forEach(b => b.onclick = () => { cur.i = +b.dataset.i; cur.confirmReset = false; testView(); });
  const nx = document.getElementById('next'); if (nx) nx.onclick = () => { cur.i++; testView(); scrollTo(0,0); };
  const pv = document.getElementById('prev'); if (pv) pv.onclick = () => { cur.i--; testView(); scrollTo(0,0); };
  const fn = document.getElementById('fin'); if (fn) fn.onclick = () => { cur.i = 100; testView(); scrollTo(0,0); };
  const rs = document.getElementById('reset'); if (rs) rs.onclick = () => { cur.confirmReset = true; testView(); };
  const ry = document.getElementById('resetYes'); if (ry) ry.onclick = () => { store[t] = {}; save(); cur.i = 0; cur.confirmReset = false; testView(); };
  const rn = document.getElementById('resetNo'); if (rn) rn.onclick = () => { cur.confirmReset = false; testView(); };
  const fw = document.getElementById('firstWrong'); if (fw) fw.onclick = () => { const qs2 = DATA[t-1]; for (let i=0;i<100;i++){ if (a[i]!==undefined && a[i]!==qs2[i][2]){ cur.i=i; break; } } testView(); scrollTo(0,0); };
  const ct = document.getElementById('cont'); if (ct) ct.onclick = () => { cur.i = firstOpen(t); testView(); };
}

function result(t, s){
  const skip = 100 - s.done, acc = s.done ? Math.round(s.r*100/s.done) : 0;
  return `<div class="result"><h2>परिणाम — टेस्ट ${String(t).padStart(2,'0')}</h2>
    <div class="rgrid"><div><span>कुल स्कोर (200 में)</span><b>${fmt(s.score)}</b></div>
    <div><span>सही</span><b style="color:var(--ok)">${s.r}</b></div>
    <div><span>गलत</span><b style="color:var(--bad)">${s.w}</b></div>
    <div><span>छोड़े गए</span><b>${skip}</b></div>
    <div><span>सटीकता</span><b>${acc}%</b></div></div>
    <div class="nav" style="justify-content:flex-start">
      ${skip ? '<button class="btn pri" id="cont">बचे प्रश्न हल करें</button>' : ''}
      ${s.w ? '<button class="btn" id="firstWrong">गलत उत्तर दोबारा देखें</button>' : ''}
      ${cur.confirmReset ? '<span class="confirm">इस टेस्ट के सभी उत्तर मिटा दें? <button class="btn" id="resetYes">हाँ, मिटाएँ</button><button class="btn" id="resetNo">नहीं</button></span>' : '<button class="btn" id="reset">टेस्ट दोबारा शुरू करें</button>'}
    </div></div>`;
}

function route(){
  const m = /^#test-(\d+)$/.exec(location.hash);
  const t = m ? +m[1] : 0;
  if (t >= 1 && t <= DATA.length){
    if (cur.test !== t){ cur.test = t; cur.i = firstOpen(t); if (cur.i > 99) cur.i = 100; cur.confirmReset = false; }
    testView();
  } else home();
  scrollTo(0,0);
}
document.addEventListener('keydown', e => {
  if (!cur.test || cur.i > 99) return;
  const k = 'abcd1234'.indexOf(e.key.toLowerCase());
  if (k >= 0){ const b = app.querySelectorAll('.opt')[k % 4]; if (b && !b.disabled) b.click(); }
  if (e.key === 'ArrowRight'){ cur.i++; testView(); }
  if (e.key === 'ArrowLeft' && cur.i > 0){ cur.i--; testView(); }
});
addEventListener('hashchange', route);
route();
</script>

</body></html>
