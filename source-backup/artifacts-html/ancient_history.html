<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UPPSC प्राचीन इतिहास टेस्ट सीरीज़</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#2a1f14;--mute:#7a6a58;--line:#e6dccb;--acc:#9a3412;--acc2:#c2410c;--ok:#15803d;--okbg:#e7f6ec;--bad:#b91c1c;--badbg:#fdecec;--chip:#f3e8d6}
@media (prefers-color-scheme:dark){:root{--bg:#1a1511;--card:#241d17;--ink:#f3eadc;--mute:#b4a38d;--line:#3a2f25;--acc:#fb923c;--acc2:#fdba74;--ok:#4ade80;--okbg:#14301f;--bad:#f87171;--badbg:#3a1a1a;--chip:#33281e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Mukta,"Noto Sans Devanagari",system-ui,sans-serif;font-size:17px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 90px}
header.top{padding:18px 4px 8px}
.kicker{font-size:13px;letter-spacing:.08em;color:var(--acc);font-weight:700;text-transform:uppercase}
h1{font-size:28px;line-height:1.2;margin:4px 0 6px;font-weight:800}
.sub{color:var(--mute);font-size:15px;margin:0}
.stats{display:flex;gap:10px;margin:16px 0 6px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;flex:1;min-width:120px}
.stat b{display:block;font-size:24px;color:var(--acc)}
.stat span{font-size:13px;color:var(--mute)}
.sec{font-weight:700;margin:22px 4px 10px;font-size:15px;color:var(--mute)}
.mix{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font:inherit;cursor:pointer;border:none;border-radius:12px;padding:12px 14px;font-weight:700}
.btn.pri{background:var(--acc);color:#fff}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.ch{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;font:inherit;color:inherit;cursor:pointer}
.ch:hover{border-color:var(--acc)}
.ch .no{width:32px;height:32px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.ch .nm{flex:1;font-weight:600}
.ch .ct{font-size:13px;color:var(--mute);text-align:right}
.ch .best{display:block;color:var(--ok);font-weight:600}
.opt-row{display:flex;align-items:center;gap:8px;margin:14px 4px 0;color:var(--mute);font-size:15px}
/* quiz */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.barrow{display:flex;align-items:center;gap:10px;justify-content:space-between}
.back{background:none;border:none;color:var(--acc);font:inherit;font-weight:700;cursor:pointer;padding:4px 0}
.score{display:flex;gap:12px;font-size:15px;font-weight:700}
.score .g{color:var(--ok)}.score .r{color:var(--bad)}
.prog{height:6px;background:var(--line);border-radius:6px;margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);transition:width .25s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;margin-top:14px}
.qmeta{display:flex;justify-content:space-between;align-items:baseline;gap:8px;color:var(--mute);font-size:14px}
.qmeta b{color:var(--acc);font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.chip{background:var(--chip);border-radius:20px;padding:2px 10px;font-size:12.5px;color:var(--mute);font-family:system-ui,sans-serif}
.qtext{white-space:pre-line;font-size:18.5px;font-weight:600;margin:12px 0 14px}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:transparent;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px;font:inherit;color:inherit;cursor:pointer;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt .t{flex:1;padding-top:1px}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .l{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad .l{background:var(--bad);border-color:var(--bad);color:#fff}
.verdict{border-radius:12px;padding:10px 14px;font-weight:700;margin:6px 0 10px;font-size:17px}
.verdict.ok{background:var(--okbg);color:var(--ok)}
.verdict.bad{background:var(--badbg);color:var(--bad)}
details.ex{border-top:1px dashed var(--line);padding-top:10px}
details.ex summary{cursor:pointer;color:var(--acc);font-weight:700}
details.ex div{white-space:pre-line;font-size:16px;color:var(--ink);margin-top:8px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px}
.nav .in{max-width:760px;margin:0 auto;display:flex;gap:10px}
.nav .btn{flex:1}
.res{text-align:center;padding:26px 16px}
.big{font-size:56px;font-weight:800;color:var(--acc);line-height:1}
.rv{margin-top:18px;text-align:left}
.rvi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:15.5px}
.rvi .q{white-space:pre-line;font-weight:600}
.rvi .y{color:var(--bad)}.rvi .c{color:var(--ok)}
.jump{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.jump button{width:34px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:12px;cursor:pointer}
.jump .g{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.jump .r{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.jump .cur{outline:2px solid var(--acc)}
.foot{color:var(--mute);font-size:13px;margin-top:24px;text-align:center}
.hide{display:none}
.mist{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:14px;padding:14px 14px 12px;margin-top:18px}
.mist h2{margin:0 0 4px;font-size:18px}
.mist .nums{display:flex;gap:16px;flex-wrap:wrap;margin:6px 0 10px;font-size:15px;color:var(--mute)}
.mist .nums b{font-size:20px;display:block}
.mist .nums .r b{color:var(--bad)}.mist .nums .g b{color:var(--ok)}
.mist .row{display:flex;gap:8px;flex-wrap:wrap}
.mist .row .btn{flex:1;min-width:140px;font-size:15px;padding:10px 12px}
.sync{font-size:12.5px;color:var(--mute);margin-top:10px}
.link{background:none;border:none;color:var(--mute);text-decoration:underline;font:inherit;font-size:13px;cursor:pointer;padding:0}
.wb{display:block;color:var(--bad);font-weight:600}
.prevw{background:var(--badbg);color:var(--bad)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.filters select{font:inherit;font-size:15px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);flex:1;min-width:150px}
.rvi .tag{display:inline-block;font-size:12.5px;border-radius:20px;padding:1px 9px;margin-bottom:6px;font-weight:600}
.rvi .tag.r{background:var(--badbg);color:var(--bad)}.rvi .tag.g{background:var(--okbg);color:var(--ok)}
.rvi .meta{font-size:13px;color:var(--mute);margin-bottom:4px}
.rvi details{margin-top:6px}.rvi details summary{color:var(--acc);cursor:pointer;font-weight:600}
.rvi details div{white-space:pre-line;margin-top:4px}
.bm{font:inherit;font-size:14px;font-weight:700;border:1.5px solid var(--line);background:var(--card);color:var(--mute);border-radius:20px;padding:3px 12px;cursor:pointer;white-space:nowrap}
.bm.on{border-color:#b45309;background:#fef3c7;color:#92400e}
@media (prefers-color-scheme:dark){.bm.on{background:#3b2a10;color:#fbbf24;border-color:#b45309}}
.saved{border-left-color:#d97706}
.qmeta .r{display:flex;gap:8px;align-items:center}
.rvi .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="nav hide" id="nav"><div class="in">
<button class="btn ghost" id="prev">← पिछला</button>
<button class="btn pri" id="next">अगला →</button>
</div></div>
<script>

्ले में","बेडसा में"],"a":[2],"t":["U.P.R.O./A.R.O. (Pre) 2014"],"e":"हीनयान अवस्था का विशालतम एवं सर्वाधिक विकसित शैलकृत चैत्यगृह कार्ले में स्थित है। यह पुणे (महाराष्ट्र) के मावल तालुका में स्थित है।"},{"ch":3,"page":68,"n":117,"q":"निम्नलिखित में से किस शैलकृत गुफा में ग्यारह सिरों के बोधिसत्व का अंकन मिलता है?","o":["अजंता","एलोरा","कन्हेरी","कार्ले"],"a":[2],"t":["U.P.P.C.S. (Pre) 2017"],"e":"साल्सेट द्वीप पर स्थित कन्हेरी गुफाएं‚ महाराष्ट्र के मुंबई शहर में स्थित प्रमुख पर्यटन स्थल हैं। ये गुफाएं संजय गांधी राष्ट्रीय उद्यान परिसर में स्थित हैं। प्राचीन अभिलेखों में कान्हाशैल‚ कृष्णगिरी‚ कान्हगिरी के नाम से उल्‍लिखित कन्हेरी बौद्धों का प्रमुख केंद्र था। कन्हेरी में एक ही पहाड़ी में सर्वाधिक संख्या में गुफाओं का निर्माण हुआ है। कन्हेरी की गुफाओं का निर्माण पहली शताब्दी ई.पू. में किया गया था और ये 11वीं शताब्दी ईस्वी तक इस्तेमाल में रहीं। गुफा संख्या 41 (पहले इसे 23 नंबर क्रमांकित किया गया था) में अवलोकितेश्वर की एक रोचक मूर्ति स्थित है‚ जिसकी चार भुजाएं और ग्यारह सिर हैं। यह अपनी किस्म की भारत में स्थित एकमात्र मूर्ति है। इस रूप की उपासना चीन‚ चीनी तुर्किस्तान‚ कंबोडिया तथा जापान में 7वीं- 8वीं सदी में लोकप्रिय थी।"},{"ch":3,"page":69,"n":121,"q":"शून्यता के सिद्धांत का सर्वप्रथम प्रतिपादन करने वाले बौद्ध दार्शनिक का नाम है–","o":["नागार्जुन","नागसेन","आनंद","अश्वघोष"],"a":[0],"t":["U.P.P.C.S. (Pre) 1998"],"e":"माध्यमिक या शून्यवाद मत के प्रवर्तक नागार्जुन हैं‚ जिनकी प्रसिद्ध रचना ‘मूलमध्यमककारिका’ है। इसे सापेक्षवाद भी कहा जाता है। जिसके अनुसार‚ प्रत्येक वस्तु किसी-न-किसी कारण से उत्पन्‍न हुई है और वह उन पर निर्भर है। नागार्जुन ने ‘प्रतीत्यसमुत्पाद’ को ही शून्यता कहा है।"},{"ch":3,"page":70,"n":126,"q":"वल्‍लभी विश्वविद्यालय स्थित था–","o":["बिहार में","उत्तर प्रदेश में","बंगाल में","गुजरात में"],"a":[3],"t":["U.P.R.O./A.R.O. (Pre) 2014"],"e":"प्रश्नगत विकल्पों में नागपुर प्राचीन भारत में बौद्ध शिक्षा का प्रसिद्ध केंद्र नहीं था। प्राचीन भारत में बौद्ध शिक्षा के प्रमुख केंद्र वल्‍लभी‚ विक्रमशिला और नालंदा थे। ये सभी अपनी उन्‍नत शिक्षा व्यवस्था और बौद्ध अध्ययन के  के समीप ही भिक्षुओं के रहने के लिए आवास बनाए गए‚ जिन्हें ‘विहार’ कहा गया।"},{"ch":3,"page":73,"n":147,"q":"निम्नलिखित कथनों पर विचार कीजिए–\n1. पश्चिम गोदावरी जिले के गुंटुपल्‍ली में प्रारंभिक चैत्यगृह और विहार चट्टानों को काटकर बनाए गए हैं।\n2. पूर्वी दक्‍कन के चैत्य और विहार साधारणतया चट्टानों को काटकर बनाए गए हैं। इन कथनों में से–","o":["केवल 1 सही है।","केवल 2 सही है।","1 तथा 2 दोनों सही हैं।","न तो 1 सही है और न ही 2 सही है।"],"a":[2],"t":["U.P.P.C.S. (Pre) 2017"],"e":"गुंटुपल्‍ली में चट्टानों को काटकर प्रारंभिक चैत्यगृह एवं विहारों का निर्माण किया गया है। ध्यातव्य है कि प्रश्नकाल में गुंटुपल्‍ली‚ आंध्र प्रदेश के पश्चिमी गोदावरी जिले में स्थित था। यद्यपि वर्तमान में यह एनटीआर जिले का भाग है। अत: प्रश्नकाल के अनुसार कथन 1 सही है। पूर्वी दक्‍कन के चैत्य और विहार सामान्यत: चट्टानों को काटकर बनाए गए हैं। अत: कथन 2 भी सही है।"},{"ch":4,"page":76,"n":1,"q":"जैन धर्म के संस्थापक हैं–","o":["आर्य सुधर्मा","महावीर स्वामी","पार्श्वनाथ","ऋषभदेव"],"a":[3],"t":["U.P.P.C.S. (Mains) 2010"],"e":"जैन धर्म के मूल संस्थापक या प्रवर्तक प्रथम तीर्थंकर ऋषभदेव या ऋषभनाथ माने जाते हैं। महावीर स्वामी जैन धर्म के 24वें तीर्थंकर थे‚ जिन्होंने छठी शताब्दी ई.पू. में जैन धर्म का प्रसार किया।"},{"ch":4,"page":76,"n":3,"q":"जैन ‘तीर्थंकर’ पार्श्वनाथ निम्नलिखित स्थानों में से मुख्यत: किससे संबंधित थे?","o":["वाराणसी","कौशाम्बी","गिरिव्रज","चम्पा"],"a":[0],"t":["U.P.P.C.S (Mains) 2016"],"e":"पार्श्वनाथ तेइसवें जैन तीर्थंकर हैं। इनका जन्म वाराणसी के राजा अश्वसेन के यहां हुआ था। इनकी माता का नाम वामा देवी था। इनका प्रतीक चिह्न सर्प है।"},{"ch":4,"page":76,"n":4,"q":"सूची-I को सूची -II से सुमेलित कीजिए तथा नीचे दिए गए कूट से सही उत्तर चुनिए -\nसूची-I सूची-II (तीर्थंकर) (प्रतिमा लक्षण)\nA. आदिनाथ 1. वृषभ\nB. मल्‍लिनाथ 2. अश्व\nC. पार्श्वनाथ 3. सर्प\nD. संभवनाथ 4. जल-कलश\nकूट :\nA B C D","o":["1 4 3 2","1 3 2 4","2 4 3 1","3 1 4 2"],"a":[0],"t":["U.P.P.C.S. (Pre) 2017"],"e":"सूची-I एवं सूची-II का सुमेलन निम्नवत है-\nसूची-I सूची-II (तीर्थंकर) (प्रतिमा लक्षण) आदिनाथ वृषभ मल्‍लिनाथ जल-कलश पार्श्वनाथ स ्म कुंडग्राम या कुंडलपुर में (वैशाली के निकट) लगभग 599 ई.पू. में हुआ था। उनकी माता त्रिशला वैशाली के लिच्छवि गणराज्य के प्रमुख चेटक की बहन थीं तथा पिता सिद्धार्थ ज्ञातृक क्षत्रियों के संघ के प्रधान थे। उनके बड़े भाई नंदिवर्धन थे। कुछ प्राचीन संस्करण की NCERT पुस्तकों में महावीर स्वामी का जन्म 540 ई.पू. उद्धृत है। इसी आधार पर अनेक प्रकाशकों ने भी यही जन्म तिथि अपनी पुस्तकों में अंकित किया है‚ जिससे भ्रम की स्थिति उत्पन्‍न हुई है। महावीर स्वामी की सही जन्म तिथि 599 ई.पू. ही उचित है; क्योंकि महावीर स्वामी‚ महात्मा बुद्ध के पहले के काल के हैं। महात्मा बुद्ध का जन्म 563 ई.पू. है। NCERT के नवीन संस्करणों में भी अब महावीर स्वामी का जन्म 599 ई.पू. प्रकाशित हो चुका है।"},{"ch":4,"page":78,"n":14,"q":"तीर्थंकर शब्द संबंधित है–","o":["बौद्ध","ईसाई","हिंदू","जैन"],"a":[3],"t":["U.P.P.C.S. (Pre) 1993"],"e":"‘तीर्थंकर’ शब्द जैन धर्म से संबंधित है। जैन धर्म में कुल 24 तीर्थंकर माने जाते हैं‚ जिन्होंने समय-समय पर जैन धर्म का प्रचार-प्रसार किया। जैन धर्म के प्रथम तीर्थंकर ऋषभनाथ तथा अंतिम तीर्थंकर महावीर स्वामी थे।"},{"ch":4,"page":78,"n":16,"q":"निम्नलिखित में से कौन एक जैन तीर्थंकर नहीं था?","o":["चंद्रप्रभु","नाथमुनि","नेमि","संभव"],"a":[1],"t":["U.P.P.C.S. (Spl.) (Mains) 2004"],"e":"नाथमुनि जैन तीर्थंकर नहीं थे। विकल्प में दिए शेष सभी जैन तीर्थंकर थे।"},{"ch":4,"page":78,"n":17,"q":"प्रभासगिरि जिनका तीर्थ स्थल है‚ वे हैं -","o":["बौद्ध","जैन","शैव","वैष्णव"],"a":[1],"t":["U.P.P.C.S. (Spl.) (Pre) 2008"],"e":"प्रभासगिरि उ.प्र. के कौशाम्बी में स्थित जैन तीर्थ स्थल है। कौशाम्बी का प्रभासगिरि स्थल छठवें जैन तीर्थंकर पद्‌मप्रभ‚ से संबंधित है।"},{"ch":4,"page":78,"n":19,"q":"महावीर स्वामी को किस नदी के तट पर ज्ञानोदय प्राप्‍त हुआ था?","o":["स्वर्णसिक्ता","पलाशिनी","गंगा","ऋजुपालिका"],"a":[3],"t":["U.P.R.O./A.R.O. (Mains) 2017"],"e":"जैन धर्म में ‘पूर्ण ज्ञान’ के लिए कैवल्य शब्द का प्रयोग किया गया है। महावीर स्वामी को 12 वर्षों की कठोर तपस्या तथा साधना के पश्चात जृम्भिक ग्राम के समीप ऋजुपालिका नदी के तट पर एक साल वृक्ष के नीचे कैवल्य (पूर्ण ज्ञान) प्राप्‍त हुआ था‚ फलत: वे ‘केवलिन’ कहलाए।"},{"ch":4,"page":78,"n":20,"q":"त्रिरत्न सिद्धांत सम्यक्‌धारण‚ सम्यक्‌चरित्र एवं सम्यक्‌ज्ञान जिस धर्म की महिमा है‚ वह है–","o":["बौद्ध धर्म","ईसाई धर्म","जैन धर्म","इनमें से कोई नहीं"],"a":[2],"t":["U.P.P.C.S. (Pre) 2004"],"e":"जैन धर्म में मोक्ष के लिए तीन आवश्यक साधन बताए गए हैं–सम्यक्‌धारण/ दर्शन (सच्‍ची आस्था)‚ सम्यक्‌चरित्र (सटीक क्रिया) एवं सम्यक्‌ज्ञान (सटीक ज्ञान)। इन तीनों को जैन धर्म में ‘त्रिरत्न’ की संज्ञा दी गई है।"},{"ch":4,"page":80,"n":31,"q":"निम्नलिखित में से कौन-सा धर्म ‘विश्व विनाशकारी प्रलय’ की अवधारणा में विश्वास नहीं करता?","o":["बौद्ध धर्म","जैन धर्म","हिंदू धर्म","इस्लाम"],"a":[1],"t":["U.P.P.C.S. (Mains) 2014"],"e":"जैन धर्म में ईश्वर की कल्पना नहीं की गई है। इस धर्म के अनुसार‚ जगत की सृष्टि नहीं की गई है‚ यह संसार नित्य और शाश्वत है‚ इसमें किसी समय प्रलय नहीं होता है।"},{"ch":4,"page":80,"n":32,"q":"जैन धर्म का आधारभूत बिंदु है–","o":["कर्म","निष्ठा","अहिंसा","विराग"],"a":[2],"t":["U.P.P.C.S. (Pre) 1993"],"e":"अहिंसा जैन धर्म का आधारभूत बिंदु है। जैन धर्म में सम्यक्‌चरित्र के अंतर्गत परिव्राजकों अथवा तापसों के लिए अहिंसा‚ सत्य‚ अस्तेय‚ ब्रह्मचर्य एवं अपरिग्रह नामक पंच महाव्रत की व्यवस्था की गई है।"},{"ch":4,"page":80,"n":33,"q":"यापनीय किसका एक संप्रदाय था?","o":["बौद्ध धर्म का","जैन धर्म का","शैव धर्म का","वैष्णव धर्म का"],"a":[1],"t":["U.P.P.C.S (Pre) 2010"],"e":"‘यापनीय’ जैन धर्म का एक संप्रदाय था‚ जिसकी उत्पत्ति यद्यपि दिगंबर संप्रदाय से हुई थी‚ तथापि यह संप्रदाय कतिपय श्वेतांबर मान्यताओं का भी पालन करता था।"},{"ch":4,"page":80,"n":36,"q":"प्रारंभिक जैन साहित्य निम्नलिखित में से किस भाषा में लिखे गए?","o":["अर्ध-मागधी","पालि","प्राकृत","संस्कृत"],"a":[0],"t":["U.P.P.C.S. (Mains) 2006"],"e":"प्राय: सभी प्रारंभिक धार्मिक जैन साहित्य अर्ध-मागधी भाषा में लिखे गए हैं। इसके बारह अंग अर्ध-मागधी में ही हैं। बाद में जैन धर्म ने प्राकृत भाषा को अपनाया। ये ग्रंथ ईसा की छठी शताब्दी में गुजरात में वल्‍लभी नामक स्थान पर अंतिम रूप से संकलित किए गए।"},{"ch":4,"page":81,"n":37,"q":"निम्नलिखित में से कौन-सा स्थल पार्श्वनाथ से संबद्ध होने के कारण जैन-सिद्ध क्षेत्र माना जाता है?","o":["चंपा","पावा","सम्मेद शिखर","ऊर्जयंत"],"a":[2],"t":["U.P.P.C.S. (Pre) 2002","U.P. Lower Sub. (Pre) 2002"],"e":"पार्श्वनाथ जैन धर्म के 23वें तीर्थंकर थे‚ जिनका जन्म वाराणसी में महावीर स्वामी से 250 वर्ष पहले हुआ था। काशी के शासक इक्ष्वाकुवंशी अश्वसेन उनके पिता थे तथा महारानी वामा उनकी माता। 30 वर्ष की आयु के बाद उन्होंने गृह त्याग कर अपना जीवन वैराग्य और तपश्चर्या में लगाया। वाराणसी के निकट आश्रमपद उद्यान में समाधिस्थ होकर कठिन तपस्या करने के उपरांत उन्हें 84वें दिन ‘कैवल्य’ (ज्ञान) प्राप्‍त हुआ। पार्श्वनाथ का परिनिर्वाण सम्मेद शिखर (सम्मेद पर्वत) पर हुआ था‚ इसी कारण यह जैन सिद्ध क्षेत्र माना जाता है।"},{"ch":4,"page":81,"n":41,"q":"महावीर का प्रथम अनुयायी कौन था?","o":["जामालि","यशोदा","आणोज्‍जा","त्रिशला"],"a":[0],"t":["U.P.P.C.S. (Pre) 2008"],"e":"भगवान महावीर का जन्म ज्ञातृक क्षत्रियों के संघ के प्रधान सिद्धार्थ के यहां 599 ई.पू. में हुआ था। उनकी पत्नी का नाम यशोदा था‚ उनसे प्रियदर्शना नामक एक पुत्री उत्पन्‍न हुई। उस पुत्री का विवाह जामालि नाम के व्यक्ति से हुआ था‚ जो बाद में महावीर स्वामी का अनुयायी बन गया। यह उनका प्रथम शिष्य था।"},{"ch":4,"page":81,"n":42,"q":"किस जैन सभा में अंतिम रूप से श्वेतांबर आगम का संपादन हुआ?","o":["वैशाली में","वल्‍लभी में","पावा में","पाटलिपुत्र में"],"a":[3],"t":["U.P.P.C.S. (Mains) 2008"],"e":"चंद्रगुप्‍त मौर्य के शासनकाल में पाटलिपुत्र में प्रथम जैन संगीति आयोजित किया गया‚ जिसमें श्वेतांबर आगम का संपादन किया गया। चूंकि प्राचीन जैन शास्त्र नष्ट हो गए थे‚ अत: उन्हें पुन: एकत्र करने के लिए चतुर्थ शताब्दी ईसा पूर्व में इस प्रथम जैन महासभा का आयोजन किया गया था‚ जिसमें भद्रबाहु के अनुयायियों ने भाग नहीं लिया था।"},{"ch":4,"page":83,"n":50,"q":"‘आजीवक’ संप्रदाय के संस्थापक थे–","o":["आनंद","राहुलभद्र","मक्खलिगोसाल","उपालि"],"a":[2],"t":["39th B.P.S.C. (Pre) 1994","U.P.P.C.S. (Pre) 1996"],"e":"मक्खलिगोसाल प्रारंभ में महावीर के शिष्य थे‚ किंतु बाद में मतभेद के चलते इन्होंने महावीर की शिष्यता त्याग दी। विभिन्‍न स्रोत नंदवच्छ एवं किससंकिच्‍च नामक आजीवक आचार्यों का उल्‍लख करते हैं‚ जो मक्खलिपुत्त गोसाल से पूर्व भी कार्यरत थे। इसका अभिप्राय है कि गोसाल से पहले भी आजीवक संप्रदाय उपस्थित था। संभवत: इसे सर्वप्रथम लोकप्रियता गोसाल द्वारा दिलाई गई। अत: इन्हें ही परंपरानुसार‚ आजीवक संप्रदाय का प्रवर्तक माना गया। इनका मत ‘नियतिवाद’ या भाग्यवाद कहा जाता है‚ जिसके अनुसार‚ संसार की प्रत्येक वस्तु भाग्य द्वारा पूर्व नियंत्रित एवं संचालित होती है।"},{"ch":4,"page":83,"n":52,"q":"निम्नलिखित में से किसने प्रतिपादित किया कि भाग्य ही सब कुछ निर्धारित करता है‚ मनुष्य असमर्थ होता है?","o":["जैनियों ने","बौद्धों ने","आजीवकों ने","मीमांसकों ने"],"a":[2],"t":["U.P.P.C.S. (Pre) 2006"],"e":"मक्खलिगोसाल प्रारंभ में महावीर के शिष्य थे‚ किंतु बाद में मतभेद के चलते इन्होंने महावीर की शिष्यता त्याग दी। विभिन्‍न स्रोत नंदवच्छ एवं किससंकिच्‍च नामक आजीवक आचार्यों का उल्‍लख करते हैं‚ जो मक्खलिपुत्त गोसाल से पूर्व भी कार्यरत थे। इसका अभिप्राय है कि गोसाल से पहले भी आजीवक संप्रदाय उपस्थित था। संभवत: इसे सर्वप्रथम लोकप्रियता गोसाल द्वारा दिलाई गई। अत: इन्हें ही परंपरानुसार‚ आजीवक संप्रदाय का प्रवर्तक माना गया। इनका मत ‘नियतिवाद’ या भाग्यवाद कहा जाता है‚ जिसके अनुसार‚ संसार की प्रत्येक वस्तु भाग्य द्वारा पूर्व नियंत्रित एवं संचालित होती है।"},{"ch":4,"page":83,"n":55,"q":"‘आजीविक संप्रदाय’ के संदर्भ में, निम्नलिखित में से कौन-सा/से कथन सही है/हैं?\nI. आजीविक संप्रदाय के लोग प्राय: वनों में रहते थे।\nII. इस संप्रदाय का मौर्य युग में काफी मान रहा।\nनीचे दिए गए कूट में से सही उत्तर का चयन कीजिए :","o":["न तो I, न ही II","केवल II","I और II दोनों","केवल I"],"a":[1],"t":["U.P. R.O/A.R.O (Re. Exam) (Pre) 2023"],"e":"कथन सत्यता\nI. आजीविक असत्य – उपलब्ध बौद्ध-जैन विवरणों और पुरातत्त्व संप्रदाय के लोग साक्ष्यों से ज्ञात होता है कि आजीविक नग्‍न भ्रमणशील साधु प्राय: वनों में थे, जो गांव-नगरों में भी भिक्षाटन करते तथा पत्थर-काटकर रहते थे। बनी गुफाओं (जैस–े बाराबर-नागार्जुनी) में निवास करते थे; उन्हें विशेष रूप से “वन-वासी” नहीं कहा गया है।\nII. इस संप्रदाय सत्य – सम्राट अशोक एवं उनके पौत्र दशरथ ने बाराबर का मौर्य युग में और नागार्जुनी की गुफाएं आजीविक साधुओं को समर्पित काफी मान रहा। कीं; बिन्दुसार के काल में भी यह संप्  1998"],"e":"हखामनी साम्राज्य को ध्वस्त करने के पश्चात 327 ई. पू. में एक विशाल सेना के साथ सिकंदर भारतीय विजय के लिए चला। लगभग दो वर्ष के अभियान के पश्चात 325 ई. पू. के सितंबर माह में सिकंदर ने पाटल से वापस यूनान को प्रस्थान किया; किंतु वह चंद्रगुप्‍त मौर्य से पराजित नहीं हुआ था। इस प्रकार\n(A) सही है‚ जबकि (R) गलत है।"},{"ch":7,"page":104,"n":4,"q":"युद्ध भूमि में बड़ी संख्या में सैनिकों के मारे जाने अथवा आहत हो जाने के बाद किस भारतीय गण अथवा राज्य की स्त्रियों ने सिकंदर के विरुद्ध शस्त्र धारण किया था?","o":["अभिसार","ग्लौसाइ","कठ","मस्सग"],"a":[3],"t":["U.P.P.C.S. (Mains) 2013"],"e":"सिकंदर के आक्रमण के समय अश्वक एक सीमांत गणराज्य था‚ जिसकी राजधानी मस्सग थी। यूनानी लेखकों के अनुसार‚ सिकंदर के विरुद्ध हुए युद्ध में बड़ी संख्या में पुरुष सैनिकों के मारे जाने के पश्चात यहां की स्त्रियों ने शस्त्र धारण किए थे।"},{"ch":7,"page":104,"n":5,"q":"भारत में सिकंदर की सफलता निम्न कारणों से थी–\n1. उस समय भारत में कोई केंद्रीय सत्ता नहीं थी।\n2. उसकी फौज बेहतर थी।\n3. उसे देशद्रोही शासकों से सहायता मिली।\n4. वह एक अच्छा प्रशासक था।\nनीचे दिए गए कूट से सही उत्तर का चयन कीजिए–","o":["1 तथा 2","1, 2 तथा 3","2, 3 तथा 4","उपर्युक्त सभी"],"a":[1],"t":["U.P.P.C.S. (Pre) 2000","U.P.P.C.S. (Pre) 2003","U.P. U.D.A./L.D.A. (Pre) 2002"],"e":"सिकंदर की भारत में सफलता के उपर्युक्त कारणों में से प्रथम तीन सत्य थे। डॉ. हेमचंद्र रायचौधरी ने उस समय यहां 28 स्वतंत्र शक्तियों का उल्‍लेख किया है‚ तात्पर्य यह है कि उस समय भारत में कोई केंद्रीय सत्ता नहीं थी। उसकी सेना नि:संदेह श्रेष्ठ थी। आम्भी जैसे तमाम देशद्रोही भारतीय शासकों ने उसे सहयोग दिया‚ तथापि भारत की विजय में उसके अच्छे प्रशासक होने का कोई योगदान नहीं था। अत: उपयुक्त विकल्प (b) होगा।"},{"ch":7,"page":104,"n":6,"q":"उस वीर भारतीय राजा का नाम बताइए‚ जिसे सिकंदर ने झेलम के तट पर पराजित किया था?","o":["आम्भी","पुरु (पोरस)","चंद्रगुप्‍त मौर्य","महापद्मनंद"],"a":[1],"t":["U.P.R.O./A.R.O. (Mains) 2013"],"e":"सिकंदर ने झेलम नदी के तट पर पुरु (पोरस) को पराजित किया; परंतु उसकी वीरता से प्रभावित होकर सिकंदर ने उसे अपना मित्र बना लिया तथा उसे अपना राज्य और कुछ नए इलाके प्रदान किए।"},{"ch":7,"page":104,"n":7,"q":"निम्नलिखित में से कौन सिकंदर के साथ भारत में नहीं आया था?","o":["नियार्कस","आनेसिक्रिटस","डाइमेकस","अरिस्टोब्यूलस"],"a":[2],"t":["U.P. P.C.S. (Pre) (Re-Exam) 2015"],"e":"डाइमेकस सिकंदर के साथ भारत नहीं आया था। स्ट्रैबो के अनुसार‚ सीरिया के राजा एंटियोकस ने डाइमेकस नामक अपना एक राजदूत बिंदुसार की राज्य सभा में भेजा था।"},{"ch":8,"page":107,"n":1,"q":"प्रथम भारतीय साम्राज्य स्थापित किया गया था–","o":["कनिष्क द्वारा","हर्ष द्वारा","चंद्रगुप्‍त मौर्य द्वारा","समुद्रगुप्‍त द्वारा"],"a":[2],"t":["U.P. Lower Sub. (Pre) 2002"],"e":"चंद्रगुप्‍त मौर्य की गणना भारत के महान शासकों में होती है। वह भारत का प्रथम ऐतिहासिक सम्राट था। वह ऐसा पहला सम्राट था‚ जिसने बृहत्तर भाग पर अपना शासन स्थापित किया और जिसका विस्तार ब्रिटिश भारतीय साम्राज्य से बड़ा था। उसके साम्राज्य की सीमा ईरान से मिलती थी। उसने ही भारतीय उपमहाद्वीप को सर्वप्रथम राजनीतिक रूप से एकीकृत किया।"},{"ch":8,"page":108,"n":8,"q":"निम्न में से किसने ‘सैंड्रोकोट्स‌ ’ (चंद्रगुप्‍त मौर्य) और सिकंदर महान की भेंट का उल्‍लेख किया है?","o":["प्‍लिनी","जस्टिन","स्ट्रैबो","मेगस्थनीज"],"a":[1],"t":["U.P. Lower Sub. (Pre) 2008"],"e":"विलियम जोंस पहले विद्वान थे‚ जिन्होंने ‘सैंड्रोकोट्स‌ ’ की पहचान मौर्य शासक चंद्रगुप्‍त मौर्य से की। एपियन तथा प्‍लूटार्क ने चंद्रगुप्‍त मौर्य को एंड्रोकोट्स‌ या एंड्रोकोट्टस के रूप में वर्णित किया है। जस्टिन ने ‘सैंड्रोकोट्‌स’ (चंद्रगुप्‍त मौर्य) और सिकंदर महान की भेंट का उल्‍लेख किया है।"},{"ch":8,"page":108,"n":9,"q":"कौटिल्य प्रधानमंत्री थे–","o":["चंद्रगुप्‍त विक्रमादित्य के","अशोक के","चंद्रगुप्‍त मौर्य के","राजा जनक के"],"a":[2],"t":["U.P.P.C.S. (Pre) 2002","U.P. Lower Sub. (Spl.) (Pre) 2002"],"e":"कौटिल्य इतिहास में विष्णुगुप्‍त तथा चाणक्य इन दो नामों से भी विख्यात थे। जब चंद्रगुप्‍त मौर्य भारत का एकछत्र सम्राट बना‚ तो कौटिल्य प्रधानमंत्री‚ महामंत्री तथा प्रधान पुरोहित के पद पर आसीन हुए। उन्होंने राजनीति शास्त्र पर ‘अरश्थास्त्र’ नामक प्रसिद्ध ग्रंथ की रचना की थी। यह भारत में राजशासन के ऊपर उपलब्ध प्राचीनतम रचना है।"},{"ch":8,"page":108,"n":10,"q":"चाणक्य अपने बचपन में किस नाम से जाने जाते थे?","o":["अजय","चाणक्य","विष्णुगुप्‍त","देवगुप्‍त"],"a":[2],"t":["U.P.P.C.S. (Pre) 2006"],"e":"ऋषि चणक ने अपने पुत्र का नाम चाणक्य रखा था। ‘अर्थशास्त्र’ के लेखक के रूप में इसी पुस्तक में उल्‍लिखित ‘कौटिल्य’ तथा एक पद्यखंड में उल्‍लिखित ‘विष्णुगुप्‍त’ नाम की साम्यता चाणक्य से की जाती है। पुराणों में उसे ‘द्विजर्षभ’ (श्रेष्ठ ब्राह्मण) कहा गया है। प्रश्न में बचपन के नाम की बात कही गई है। चाणक्य पर विशेष अध्ययन करने वाले विद्वान ट्रॉटमैन के अनुसार‚ चाणक्य तथा कौटिल्य नाम चाणक्य के गोत्र-नाम हो सकते हैं। इसी प्रकार अनेक विद्वानों ने यह निष्कर्ष निर्गत किया है कि चाणक्य तथा विष्णुगुप्‍त एवं कौटिल्य अलग-अलग व्यक्ति हैं। आयोग ने इस प्रश्न का उत्तर विष्णुगुप्‍त अपनी वेबसाइट पर प्रदर्शित किया था। इसके अनुसार विकल्प (c) विष्णुगुप्‍त सही उत्तर होगा।"},{"ch":8,"page":109,"n":13,"q":"कौटिल्य का अर्थशास्त्र है‚ एक–","o":["चंद्रगुप्‍त मौर्य के संबंध में नाटक","आत्मकथा","चंद्रगुप्‍त मौर्य का इतिहास","शासन के सिद्धांतों की पुस्तक"],"a":[3],"t":["U.P. P.C.S. (Mains) 2012"],"e":"कौटिल्य (चाणक्य) द्वारा मौर्य काल में रचित अथर्शास्त्र शासन के सिद्धांतों और अभ्यास की पुस्तक है। इसमें राज्य के लिए मंडल सिद्धांत हैं‚ जो विदेश नीति की व्याख्या करता है। इसके अलावा इसमें सप्‍तांग सिद्धांत है‚ जिसमें स्वामी‚ अमात्य‚ जनपद‚ दुर्ग‚ कोषा‚ दंड एवं मित्र की व्याख्या मिलती है। अर्थशास्त्र में तत्कालीन प्रशासन एवं कृषि तथा शिल्प एवं व्यापार व्यवस्था की भी विस्तृत जानकारी प्राप्‍त होती है।"},{"ch":8,"page":109,"n":14,"q":"निम्नलिखित में से राज्य के सप्‍तांग सिद्धांत के अनुसार‚ राज्य का सातवां अंग कौन-सा था?","o":["जनपद","दुर्ग","मित्र","कोश"],"a":[2],"t":["U.P. P.C.S. (Pre) (Re-Exam) 2015"],"e":"सुहृद (मित्र) राज्य के सप्‍तांग सिद्धांत के अनुसार‚ राज्य का सातवां अंग है। सुहृद (मित्र) राज्य के कान हैं। राजा के मित्र शांति एवं युद्धकाल दोनों में ही उसकी सहायता करते हैं। इस संबंध में कौटिल्य सहज (आदर्श) तथा कृत्रिम मित्र में भेद करते हैं। सहज मित्र‚ कृत्रिम मित्र से अधिक श्रेष्ठ होता है। जिस राजा के मित्र लोभी‚ कामी तथा कायर होते हैं‚ उसका विनाश अवश्य n":34,"q":"अशोक के संदर्भ में निम्नलिखित कथनों पर विचार कीजिए–\n1. अशोक ने धम्म की जो परिभाषा दी है‚ वह ‘राहुलोवादसुत्त’ से ली गई है।\n2. अपने राज्याभिषेक के 14वें वर्ष में अशोक ने धम्ममहामात्र नामक एक नवीन प्रकार के कर्मचारी की नियुक्ति की।\nउपर्युक्त में से कौन-सा/से कथन सही है/हैं?","o":["1 और 2 दोनों","न तो 1 न ही 2","केवल 1","केवल 2"],"a":[0],"t":["U.P. P.C.S. (Pre) 2024"],"e":"अशोक का धम्म का सिद्धांत बौद्ध शिक्षाओं की उसकी समझ पर आधारित है‚ जो नैतिक और आचारिक व्यवहार‚ अहिंसा‚ सहिष्णुता और सभी जीवों के प्रति सम्मान को महत्व देती है। ‘राहुलोवादसुत्त’ एक बौद्ध ग्रंथ है‚ जो बुद्ध द्वारा अपने पुत्र राहुल को दिए गए उपदेशों से संबंधित है। इस सुत्त को ‘गेहविजय’ भी कहा गया है अर्थात ‘गृहस्थों के लिए अनुशासन ग्रंथ’। गृहस्थ बौद्ध उपासक के लिए परम उद्शदे्य स्वर्ग प्राप्‍त करना था न कि निर्वाण। कतिपय इतिहासकारों के अनुसार‚ अशोक की धम्म की परिभाषा का स्रोत ‘राहुलोवादसुत्त’ में मिलता है‚ जबकि कुछ अन्य इतिहासकार अशोक के धम्म का स्रोत ‘सिगालोवादसुत्त’ को भी मानते हैं। इस आधार पर कथन 1 सही माना जा सकता है। अशोक ने अपने राज्याभिषेक के 14वें वर्ष (तेरह वर्ष बाद) में धम्ममहामात्रों की नियुक्ति की थी‚ जो उनके साम्राज्य में धर्म (नैतिक और धार्मिक आचार) को बढ़ावा देने का कार्य करते थे। अत: कथन 2 भी सही है। इस प्रकार विकल्प (a) सही उत्तर है।"},{"ch":8,"page":112,"n":36,"q":"अशोक के निम्नलिखित अभिलेखों में से किसमें दक्षिण भारतीय राज्यों का उल्‍लेख हुआ है?","o":["तृतीय मुख्य शिलालेख","द्वितीय मुख्य शिलालेख","नौवां मुख्य शिलालेख","प्रथम स्तंभ अभिलेख"],"a":[1],"t":["U.P.P.C.S (Mains) 2016"],"e":"अशोक के अभिलेखों को तीन वर्गों में विभाजित किया गया है- (1) शिलालेख‚ (2) स्तंभलेख एवं (3) गुहालेख। अशोक के द्वितीय बृहद शिलालेख में दक्षिण भारतीय राज्यों– चोल‚ पाण्ड्‌य‚ सत्तियपुत्त‚ केरलपुत्त आदि का उल्‍लेख मिलता है।"},{"ch":8,"page":112,"n":37,"q":"भारत का प्रथम अस्पताल एवं औषधि-बाग निर्माण करवाया था–","o":["अशोक ने","चंद्रगुप्‍त मौर्य ने","भगवान महावीर ने","धन्वंतरि ने"],"a":[0],"t":["U.P. Lower Sub. (Mains) 2015"],"e":"सम्राट अशोक युद्ध के लिए इतना प्रसिद्ध नहीं हुआ‚ जितना एक धम्म विजेता एवं लोकोपकारी कार्यों से प्रसिद्ध हुआ। वह न केवल मानव वरन संपूर्ण प्राणी जगत के प्रति उदारता का दृष्टिकोण रखता था। इसी कारण उसने पशु-पक्षियों के वध पर प्रतिबंध लगा दिया था। अशोक ने लोकहित के लिए छायादार वृक्ष लगवाएं‚ धर्मशालाएं बनवाईं तथा कुएं भी खुदवाए। अशोक ने ही अपने शासनकाल में मनुष्यों व पशुओं के लिए उपयोगी औषधियों हेतु प्रथम अस्पताल (औषधालय) एवं औषधि-बागों का निर्माण करवाया।"},{"ch":8,"page":112,"n":39,"q":"निम्नलिखित में से किस स्रोत में अशोक के राज्यकाल में तृतीय बौद्ध समिति होने का उल्‍लेख मिलता है?\n1. अशोक के अभिलेख 2. दीपवंश\n3. महावंश 4. दिव्यावदान\nनीचे दिए गए कूट से सही उत्तर का चयन कीजिए–","o":["1, 2","2, 3","3, 4","1,4"],"a":[1],"t":["U.P.P.C.S. (Pre) 1999"],"e":"सिंहली अनुश्रुतियों– दीपवंश तथा महावंश के अनुसार‚ अशोक के राज्यकाल में ‘पाटलिपुत्र’ में बौद्ध धर्म की तृतीय संगीति हुई। इसकी अध्यक्षता ‘मोग्गलिपुत्त तिस्स’ नामक प्रसिद्ध बौद्ध भिक्षु ने की थी।"},{"ch":8,"page":113,"n":42,"q":"रज्‍जुक थे–","o":["चोल राज्य में व्यापारी","मौर्य शासन में अधिकारी","गुप्‍त साम्राज्य में सामंत वर्ग","शक सेना में अधिकारी"],"a":[1],"t":["U.P.P.C.S. (Pre) 1996"],"e":"अशोक के अभिलेखों में ‘रज्‍जुक’ नामक अधिकारी का उल्‍लेख मिलता है। अपने चौथे स्तंभ लेख में अशोक रज्‍जुकों में पूर्ण विश्वास प्रकट करते हुए कहता है–‘‘जिस प्रकार माता-पिता योग्य धात्री के हाथों में बच्‍चे को सौंप कर आश्वस्त हो जाते हैं‚ उसी प्रकार मैंने ग्रामीण जनता के सुख के लिए रज्‍जुकों की नियुक्ति की है।’’"},{"ch":8,"page":113,"n":44,"q":"सार्थवाह किसे कहते थे?","o":["दलालों को","व्यापारियों के काफिले को","महाजनों को","तीर्थयात्रियों को"],"a":[1],"t":["U.P.P.C.S. (Spl.) (Mains) 2008"],"e":"मौर्य काल में व्यापारिक काफिलों (कारवां) को सार्थवाह की संज्ञा दी गई थी। अमरकोश के टीकाकार क्षीरस्वामी ने लिखा है कि ‘‘जो पूंजी द्वारा व्यापार करने में पान्थों का अगुआ (प्रमुख या अध्यक्ष) हो‚ वह सार्थवाह है (सार्थान्‌ सघनान्‌ सरतो वा पान्थान्‌ वहति सार्थवाह:)। अत: प्रश्नगत विकल्पों में इसका निकटतम उत्तर विकल्प (b) होगा।"},{"ch":8,"page":113,"n":47,"q":"सारनाथ स्तंभ का निर्माण किया था–","o":["हर्षवर्धन ने","अशोक ने","गौतम बुद्ध ने","कनिष्क ने"],"a":[1],"t":["U.P. Lower Sub. (Spl.) Pre 2008"],"e":"सारनाथ स्तंभ का निर्माण अशोक ने कराया था। इस स्तंभ के शीर्ष पर चार सिंहों की आकृति बनी है‚ जो शक्ति का प्रतीक है। इस प्रतिकृति को भारत सरकार ने अपने प्रतीक चिह्न के रूप में लिया है। यह स्तंभ मौर्य युगीन वास्तुकला का सबसे अच्छा उदाहरण है। मौर्य युगीन सभी स्तंभ चुनार के बलुआ पत्थरों से निर्मित हैं।"},{"ch":8,"page":114,"n":48,"q":"निम्नलिखित में से किसे सर्वश्रेष्ठ स्तूप मानते हैं?","o":["अमरावती","भरहुत","सांची","सारनाथ"],"a":[2],"t":["U.P.P.C.S. (Mains) 2008"],"e":"स्थापत्य कला के दृष्टिकोण से सांची के स्तूप को सर्वश्रेष्ठ माना गया है। सांची‚ म.प्र. के रायसेन जिले में स्थित है। इसका निर्माण अशोक ने कराया था। इस स्तूप का आरंभिक काल तीसरी शताब्दी ईसा पूर्व था। अत: विकल्प (c) सही उत्तर है। जबकि भरहुत का स्तूप म.प्र. के सतना जिले में स्थित है। भरहुत के स्तूप की खोज अलेक्जेंडर कनिंघम ने की थी। अमरावती का स्तूप आंध्र प्रदेश के पलनाडु जिले में कृष्णा नदी के दाहिने तट पर स्थित है। कर्नल कॉलिन मैकेंजी ने 1797 ई. में इस स्तूप का पता लगाया था। सारनाथ का धमेख स्तूप मूलरूप से अशोक के समय बनवाया गया था‚ जिसका वर्तमान स्वरूप गुप्‍तकाल में निर्मित हुआ। यह स्तूप बिना अधिष्ठान के समतल भूमि पर बनाया गया है।"},{"ch":8,"page":114,"n":49,"q":"सांची का स्तूप किस शासक ने बनवाया था?","o":["बिंबिसार","अशोक","हर्षवर्धन","पुष्यमित्र"],"a":[1],"t":["U.P.P.C.S. (Pre) 1991"],"e":"स्थापत्य कला के दृष्टिकोण से सांची के स्तूप को सर्वश्रेष्ठ माना गया है। सांची‚ म.प्र. के रायसेन जिले में स्थित है। इसका निर्माण अशोक ने कराया था। इस स्तूप का आरंभिक काल तीसरी शताब्दी ईसा पूर्व था। अत: विकल्प (c) सही उत्तर है। जबकि भरहुत का स्तूप म.प्र. के सतना जिले में स्थित है। भरहुत के स्तूप की खोज अलेक्जेंडर कनिंघम ने की थी। अमरावती का स्तूप आंध्र प्रदेश के पलनाडु जिले में कृष्णा नदी के दाहिने तट पर स्थित है। कर्नल कॉलिन मैकेंजी ने 1797 ई. में इस स्तूप का पता लगाया था। सारनाथ का धमेख स्तूप मूलरूप से अशोक के समय बनवाया गया था‚ जिसका वर्तमान स्वरूप गुप्‍तकाल में निर्मित हुआ। यह स्तूप बिना अधिष्ठान के समतल भूमि पर बनाया गया है।"},{"ch":8,"page":114,"n":54,"q":"सूची-I को सूची-II से सुमेलित कीजिए तथा नीचे दिए गए कूट से सही उत्तर चुनिए –\nसूची-I सूची-II (स्थान) (स्मारक/भग्नावशेष)\nA. कौशाम्बी 1. धमेख स्तूप\nB. कुशीनगर 2. घोषिताराम मठ\nC. सारनाथ 3. रानाभर स्तूप\nD. श्रावस्ती 4. सहेत-महेत\nकूट :\nA B C D","o":["2 1 3 4","4 3 2 1","2 3 1 4","4 2 1 3"],"a":[2],"t":["U.P.P.C.S. (Mains) 2010"],"e":"दिए गए स्थान और उनसे संबंधित स्मारकों का सुमेलन निम्नानुसार है– स्थान स्मारक/भग्‍नावशेष\nकौशाम्बी – घोषिताराम मठ\nकुशीनगर – रानाभर स्तूप\nसारनाथ – धमेख स्तूप\nश्रावस्ती – सहेत-महेत"},{"ch":8,"page":115,"n":55,"q":"तीर्थयात्रा के समय सम्राट अशोक निम्नलिखित स्थानों पर गए। उन्होंने किस मार्ग का अनुगमन किया?\nनीचे दिए गए कूट से सही उत्तर चुनिए–\n1. गया 2. कपिलवस्तु\n3. कुशीनगर 4. लुम्बिनी\n5. सारनाथ 6. श्रावस्ती\nकूट :","o":["1, 2, 3, 4, 5 तथा 6","1, 3, 4, 2, 5 तथा 6","4, 5, 6, 3, 2 तथा 1","4, 2, 1, 5, 3 तथा 6"],"a":[3],"t":["U.P.P.C.S. (Pre) 1999"],"e":"अभिलेखीय साक्ष्यों के आधार पर बौद्ध धर्म ग्रहण करने के उपरांत अशोक ने आखेट तथा विहार यात्राओं को रोक दिया तथा उनके स्थान पर धर्म यात्राओं को प्रारंभ किया। वह महात्मा बुद्ध के चरण-चिह्नों से पवित्र हुए स्थानों में राज्याभिषेक के 10 वर्ष बाद (आठवां शिलालेख) संबोधि (बोधगया) तथा 20 वर्ष बाद (रुम्मिनदेई अभिलेख) लुम्बिनी गए तथा उनकी पूजा की। इतिहासकार विंसेट आर्थर स्मिथ ने अपनी पुस्तक ‘अशोका : द बुद्धिस्ट एम्परर ऑफ इंडिया’ के सातवें अध्याय ‘द इंडियन लीजेंड्स‌ ऑफ अशोका’ में साहित्यिक साक्ष्यों के आधार पर उपगुप्‍त के साथ अशोक की धम्म यात्राओं का क्रम इस प्रकार दिया है– लुम्बिनी‚ कपिलवस्तु‚ बोधगया‚ सारनाथ‚ कुशीनगर और श्रावस्ती। इस प्रकार विकल्प (d) सही उत्तर है।"},{"ch":8,"page":115,"n":60,"q":"पत्थर पर प्राचीनतम शिलालेख किस भाषा में थे?","o":["पालि","संस्कृत","प्राकृत","ब्राह्मी"],"a":[2],"t":["U.P.P.C.S. (Pre) 2009"],"e":"उपर्युक्‍त प्रश्न की व्याख्या देखें।"},{"ch":8,"page":115,"n":61,"q":"ब्राह्मी लिपि का प्रथम उद्वाचन किस पर उत्कीर्ण अक्षरों से किया गया?","o":["पत्थर की पट्टियों पर","मुहरों पर","स्तंभों पर","सिक्‍कों पर"],"a":[3],"t":["U.P.P.C.S. (Mains) 2008"],"e":"ब्राह्मी लिपि :59,"q":"निम्नलिखित शासकों में से किसके लिए ‘एका ब्राह्मण’ प्रयुक्त हुआ है?","o":["पुष्यमित्र शुंग","खारवेल","गौतमीपुत्र शातकर्णि","सुशर्मन"],"a":[2],"t":["U.P.R.O/A.R.O. (Pre) 2016"],"e":"सातवाहन शासक गौतमीपुत्र शातकर्णि को उसकी मां गौतमी बलश्री के नासिक अभिलेख में ‘एका ब्राह्मण’ कहा गया है‚ जिसका तात्पर्य है ‘अद्वितीय ब्राह्मण’।’"},{"ch":9,"page":137,"n":63,"q":"नीचे दो वक्तव्य दिए गए हैं‚ जिसमें एक को अभिकथन (A) व दूसरे को\nकारण (R) कहा गया है :\nअभिकथन (A) - सातवाहन काल में संस्कृत के साथ प्राकतृ व अन्य लोक भाषाओं का विकास हुआ।\nकारण (R) - सातवाहन राजाओं ने साहित्य-रचना के लिए संस्कृत तथा अन्य लोक भाषाओं को अपनाया।\nनीचे दिए गए कूट से सही उत्तर का चयन कीजिए।","o":["(A) तथा (R) दोनों सही हैं और (A) का सही स्पष्टीकरण (R) है।","(A) तथा (R) दोनों सही हैं; किंतु (A) का सही स्पष्टीकरण (R) नहीं है।","(A) सही है; किंतु (R) गलत है।","(A) गलत है; किंतु (R) सही है।"],"a":[0],"t":["U.P. R.O/A.R.O. (Mains) 2017"],"e":"सातवाहन नरेश स्वयं विद्वान‚ विद्या प्रेमी तथा विद्वानों के आश्रयदाता थे। हाल नामक राजा ने ‘गाथासप्‍तशती’ नामक प्राकृत भाषा में श्रृंगार रस प्रधान गीति काव्य की रचना की थी। हाल के दरबार में गुणाढ्‌य तथा सर्ववर्मन जैसे उच्‍च कोटि के विद्वान निवास करते थे। गुणाढ्‌य ने ‘बृहत्कथा’ नामक ग्रंथ की रचना की। यह पैशाची प्राकृत भाषा में लिखा गया था। सर्ववर्मन ने ‘कातंत्र’ नामक संस्कृत व्याकरण की रचना की। कन्हेरी के एक अभिलेख से ज्ञात होता है कि एक सातवाहन रानी संस्कृत का प्रयोग करती थी। इस प्रकार स्पष्ट है कि सातवाहन युग में प्राकृत एवं संस्कृत भाषाओं का विकास हुआ तथा सातवाहन राजाओं ने साहित्य रचना के लिए संस्कृत तथा अन्य लोकभाषाओं को अपनाया था। अत: इसका अभीष्ट उत्तर विकल्प (a) होगा।"},{"ch":9,"page":138,"n":64,"q":"सातवाहन शासकों के संदर्भ में निम्नलिखित कथनों में से कौन-सा/ से कथन सत्य है/हैं?\n1. सातवाहन नरेश प्राकृत भाषा के पोषक थे।\n2. सातवाहन काल में कला के लोक पक्ष को अधिक प्रोत्साहन मिला।\nनीचे दिए गए कूट से सही उत्तर को चुनिए।\nकूट :","o":["केवल 1","1 और 2 दोनों","केवल 2","न तो 1 न ही 2"],"a":[1],"t":["U.P.P.C.S. (Pre) 2021"],"e":"सातवाहन शासकों के शासनकाल में प्राकृत एवं संस्कृत भाषाओं का विकास हुआ। सातवाहन शासक हाल ने ‘गाथा सप्‍तशती’ नामक प्राकृत भाषा में श्रृंगार रस प्रधान गीति काव्य की रचना की थी। सातवाहन काल में स्थापत्य कला के उदाहरण प्राप्‍त हुए हैं‚ जो बौद्ध धर्म से संबंधित हैं।"},{"ch":9,"page":138,"n":66,"q":"निम्नलिखित में से किस स्तूप में ‘आर्यक-स्तम्भ’ वाले मंच की विशेषताएं मिलती हैं?","o":["घंटशाल","बोधगया","नागार्जुनीकोंडा","अमरावती"],"a":[3],"t":["U.P. P.C.S. (Pre) 2022"],"e":"अमरावती स्तूप में ‘आर्यक-स्तम्भ’ अथवा ‘आयक स्तम्भ’(Ayaka Pillars) वाले मंच की विशेषताएं देखने को मिलती हैं। यह आंध्र प्रदेश के पलनाडु जिले के अमरावती गांव में स्थित है।"},{"ch":9,"page":138,"n":67,"q":"निम्नलिखित में से कौन-सा युग्म सही सुमेलित नहीं है? अभिलेख शासक","o":["नासिक गौतमीपुत्र","हाथीगुम्फा खारवेल","भितरी पुलकेशिन द्वितीय","गिरनार रुद्रदामन प्रथम"],"a":[2],"t":["U.P.R.O./A.R.O. (Pre) 2017"],"e":"गौतमीपुत्र शातकर्णि सातवाहन वंश का शक्तिशाली शासक था। इसके विषय में सूचना इसकी मां गौतमी बलश्री के नासिक प्रशस्ति से प्राप्‍त होती है। उदयगिरि पहाड़ी की ‘हाथीगुम्फा’ से खारवेल का एक बिना तिथि का अभिलेख प्राप्‍त हुआ है। इसमें खारवेल के बचपन‚ शिक्षा‚ राज्याभिषेक तथा राजा होने के बाद से तेरह वर्षों तक के शासन की घटनाओं का क्रमबद्ध विवरण दिया हुआ है। भितरी स्तंभ लेख का संबंध गुप्‍त शासक स्कंदगुप्‍त से है‚ जबकि पुलकेशिन द्वितीय का संबधं ऐहोल अभिलेख से है‚ जो एक प्रशस्ति के रूप में है तथा इसकी भाषा संस्कृत है। रुद्रदामन प्रथम का जूनागढ़ (गिरनार) से शक संवत्‌ 72 (150 ई.) का शिलालेख प्राप्‍त होता है। यह प्रशस्ति के रूप में है। इससे उसकी विजयों‚ व्यक्तित्व एवं कृतियों का विवरण प्राप्‍त होता है।"},{"ch":9,"page":138,"n":68,"q":"निम्नलिखित में से किस वंश के शासकों को पुराणों में ‘श्रीपर्वतीय’ कहा गया है?","o":["वाकाटक","इक्ष्वाकु","शक","खारवेल"],"a":[1],"t":["U.P.P.C.S. (Pre) 2020"],"e":"इक्ष्वाकु वंश के शासकों को पुराणों में ‘श्रीपर्वतीय’ (श्रीपर्वत का शासक) तथा ‘आंध्रभृत्य’ (आंध्रों का नौकर) कहा गया है। पहले वे सातवाहनों के सामंत थे; किंतु उनके पतन के बाद उन्होंने अपनी स्वतंत्रता घोषित कर दी। इस वंश का संस्थापक श्रीशांतमूल था।"},{"ch":9,"page":138,"n":69,"q":"निम्न कथनों पर विचार कीजिए–\nकथन (A) : कुषाण फारस की खाड़ी और लाल सागर से होकर व्यापार करते थे।\nकारण (R) : उनकी सुसंगठित नौसेना उच्‍च कोटि की थी।\nउपर्युक्त के संदर्भ में निम्न में से कौन-सा सही उत्तर है?\nकूट :","o":["दोनों (A) और (R) सही हैं और (R), (A) का सही स्पष्टीकरण है।","दोनों (A) और (R) सही हैं; परंतु (R), (A) का सही स्पष्टीकरण नहीं है।","(A) सही है; परंतु (R) गलत है।","(A) गलत है; परंतु (R) सही है।"],"a":[2],"t":["U.P. Lower Sub. (Pre) 1998"],"e":"पेरीप्‍लस ऑफ द एरीथ्रियन सी और अरिकामेडु में हुई खुदाई से ऐसे अनेक बंदरगाहों और व्यापारिक केंद्रों की उपस्थिति के साक्ष्य मिले हैं‚ जिनसे यह स्पष्ट होता है कि कुषाणों का व्यापार पश्चिमी विश्व से फारस की खाड़ी और लाल सागर के जलमार्ग से होता था। इन सभी साक्ष्यों में किसी में भी कुषाणों की सशक्त नौसेना की उपस्थिति का उल्‍लेख नहीं मिलता है।"},{"ch":9,"page":139,"n":71,"q":"निम्नलिखित राजाओं में से कौन जैन धर्म का संरक्षक था?","o":["अशोक","हर्ष","पुलकेशिन द्वितीय","खारवेल"],"a":[3],"t":["U.P.P.S.C. (R.I.) 2014"],"e":"कलिंग का चेदिवंशीय शासक खारवेल प्राचीन भारतीय इतिहास में एक महत्‍वपूर्ण शासक था। उड़ीसा (ओडिशा) प्रांत के भुवनेश्वर से लगभग 7 किमी. की दूरी पर स्थित उदयगिरि पहाड़ी की ‘हाथीगुम्फा’ से उसका एक बिना तिथि का अभिलेख प्राप्‍त हुआ है। यह अभिलेख खारवेल का इतिहास जानने का मुख्य स्रोत है। इसका जैन धर्म के प्रति भारी झुकाव था।"},{"ch":9,"page":139,"n":72,"q":"कलिंग नरेश खारवेल निम्नलिखित में से किस वंश से संबंधित थे?","o":["चेदि","कदम्ब","कलिंग","हर्यंक"],"a":[0],"t":["U.P.P.C.S. (Spl) (Mains) 2008","U.P.P.C.S. (Mains) 2015"],"e":"कलिंग का चेदिवंशीय शासक खारवेल प्राचीन भारतीय इतिहास में एक महत्‍वपूर्ण शासक था। उड़ीसा (ओडिशा) प्रांत के भुवनेश्वर से लगभग 7 किमी. की दूरी पर स्थित उदयगिरि पहाड़ी की ‘हाथीगुम्फा’ से उसका एक बिना तिथि का अभिलेख प्राप्‍त हुआ है। यह अभिलेख खारवेल का इतिहास जानने का मुख्य स्रोत है। इसका जैन धर्म के प्रति भारी झुकाव था।"},{"ch":9,"page":139,"n":75,"q":"हाथीग्ाुम्फा का अभिलेख किस शासक के विषय में जानकारी का स्रोत है?","o":["खारवेल","अशोक","हर्षवर्धन","कनिष्क"],"a":[0],"t":["U.P.P.C.S. (Pre) 2018"],"e":"उदयगिरि पहाड़ी के ‘हाथीगुम्फा’ से शासक खारवेल का एक बिना तिथि का अभिलेख प्राप्‍त हुआ है। इसमें खारवेल के बचपन‚ शिक्षा‚ राज्याभिषेक तथा राजा होने के बाद से तेरह वर्षों के शासनकाल की घटनाओं का क्रमबद्ध विवरण दिया हुआ है। यह अभिलेख खारवेल का इतिहास जानने का मुख्य स्रोत है।"},{"ch":9,"page":140,"n":79,"q":"प्राचीन व्यापार के संदर्भ में निम्नलिखित कथनों पर विचार कीजिए–\n1. प्राचीन भारत में बहुत से नदी-बंदरगाह के संदर्भ मिलते हैं।\n2. वहां सामान और यातायात के बड़े गोदाम थे।\nउपर्युक्त में से कौन-सा/से कथन सही है/हैं?","o":["1 और 2 दोनों","न तो 1 न ही 2","केवल 1","केवल 2"],"a":[0],"t":["U.P. P.C.S. (Pre) 2024"],"e":"प्राचीन भारत में नदियां और बंदरगाह यातायात और व्यापार के प्रमुख केंद्र थे। हड़प्पा सभ्यता में लोथल जैसे नदी-बंदरगाह और हड़प्पा और मोहनजोदड़ो में बड़े गोदामों के प्रमाण मिले हैं। ऐतिहासिक काल में गंगा‚ सिंधु और कावेरी जैसी नदियां व्यापार और परिवहन का मार्ग प्रदान करती थीं तथा मुजिरिस‚ सोपारा जैसे बंदरगाह रोमन और दक्षिण-पूर्व एशियाई व्यापार के लिए प्रसिद्ध थे। प्राचीन भारत में बड़े गोदामों में अनाज और सामान का संग्रह होता था‚ जो व्यापार को संगठित बनाते थे। अत: कथन 1 और 2 दोनों सत्य हैं।"},{"ch":10,"page":143,"n":2,"q":"निम्नलिखित शासकों में से किस एक ने चार अश्वमेधों का संपादन किया था?","o":["पुष्यमित्र शुंग","प्रवरसेन प्रथम","समुद्रगुप्‍त","चंद्रगुप्‍त द्वितीय"],"a":[1],"t":["U.P.P.C.S. (Mains) 2003","U.P.P.C.S. (Mains) 2011"],"e":"वाकाटक शासक प्रवरसेन प्रथम ने चार अश्वमेध यज्ञों का संपादन किया। इसके साथ ही उसने अनेक वैदिक यज्ञ भी किए। इसी वंश के शासक प्रवरसेन द्वितीय की रुचि साहित्य में थी‚ उसने ‘सेतुबंध’ नामक ग्रंथ की रचना की।"},{"ch":10,"page":143,"n":3,"q":"‘भारत का नेपोलियन’ किसे कहा जाता है?","o":["चंद्रगुप्‍त मौर्य","चंद्रगुप्‍त द्वितीय ‘विक्रमादित्य’","अशोक महान","समुद्रगुप्‍त"],"a":[3],"t":["U.P.P.C.S. (Pre) 1990","U.P. Lower Sub. (Pre) 2009"],"e":"इतिहासकार विंसेंट स्मिथ ने अपनी रचना ‘द अर्ली हिस्ट्री ऑफ इंडिया’ में समुद्रगुप्‍त की वीरता एवं विजयों पर मुग्ध होकर उसे ‘भारतीय नेपोलियन’ की संज्ञा दी है।"},{"ch":10,"page":144,"n":5,"q":"निम्नलि द्रगुप्‍त की विजयों का उल्‍लेख है। इसके अतिरिक्त इस स्तंभ अभिलेख पर मुगल बादशाह जहांगीर का भी लेख खुदा है तथा बीरबल का भी उल्‍लेख प्राप्‍त होता है।"},{"ch":10,"page":144,"n":10,"q":"प्रयाग प्रशस्ति किसके सैन्य अभियान के बारे में जानकारी देती है?","o":["चंद्रगुप्‍त प्रथम","समुद्रगुप्‍त","चंद्रगुप्‍त द्वितीय","कुमारगुप्‍त"],"a":[1],"t":["U.P. Lower Sub. (Pre) 2004"],"e":"इलाहाबाद (प्रयागराज) स्तंभ अभिलेख अशोक तथा समुद्रगुप्‍त (335-375 ई.) के शासन के बारे में भी सूचना प्रदान करता है। इस स्तंभ पर समुद्रगुप्‍त के संधिविग्रहिक हरिषेण ने संस्कृत भाषा में प्रशंसात्मक वर्णन प्रस्तुत किया है‚ जिसे ‘प्रयाग प्रशस्ति’ कहा गया है। इसमें समुद्रगुप्‍त की विजयों का उल्‍लेख है। इसके अतिरिक्त इस स्तंभ अभिलेख पर मुगल बादशाह जहांगीर का भी लेख खुदा है तथा बीरबल का भी उल्‍लेख प्राप्‍त होता है।"},{"ch":10,"page":144,"n":12,"q":"समुद्रगुप्‍त के प्रयाग प्रशस्ति वाले स्तंभ पर निम्नलिखित में से किसका लेख मिलता है?","o":["जहांगीर","शाहजहां","औरंगजेब","दारा शिकोह"],"a":[0],"t":["U.P.R.O/A.R.O. (Pre) 2016"],"e":"प्रयाग प्रशस्ति समुद्रगुप्‍त के विषय में जानकारी का एक महत्वपूर्ण स्रोत है। इसकी रचना समुद्रगुप्‍त के संधिविग्रहिक सचिव हरिषेण ने की थी। कनिंघम के मतानुसार‚ यह लेख मूलत: कौशाम्बी में खुदवाया गया था। अकबर ने इसे कौशाम्बी से मंगाकर इलाहाबाद (प्रयागराज) के किले में स्थापित करवाया। इस पर जहांगीर का एक लेख‚ रानी का अभिलेख एवं अशोक द्वारा कौशाम्बी के महामात्रों को संघ भेद रोकने के लिए निर्देश भी उत्कीर्ण हैं।"},{"ch":10,"page":145,"n":14,"q":"‘पृथिव्या प्रथम वीर’ उपाधि थी–","o":["समुद्रगुप्‍त की","राजेंद्र प्रथम की","अमोघवर्ष की","गौतमीपुत्र शातकर्णी की"],"a":[0],"t":["U.P.P.C.S (Pre) 2016"],"e":"इतिहासकार तेज राम शर्मा ने अपनी पुस्तक ‘ए पॉलिटिकल हिस्ट्री ऑफ द इंपीरियल गुप्‍ताज’ में उल्‍लेख किया है कि समुद्रगुप्‍त ने अश्वमेध यज्ञ किया जिसके बाद उसने ‘पृथिव्यामा प्रतिरथ’ की उपाधि ग्रहण की‚ जिसका अर्थ है– ‘ऐसा व्यक्ति जिसका पृथ्वी पर कोई प्रतिद्वंद्वी न हो (पृथ्वी का प्रथम वीर)।’ उत्तर प्रदेश लोक सेवा आयोग ने अपने संशोधित उत्तर-पत्रक में इस प्रश्न को मूल्यांकन से बाहर कर दिया था।"},{"ch":10,"page":145,"n":16,"q":"सूची-I को सूची-II से सुमेलित कीजिए। नीचे दिए कूटों में सही उत्तर का चयन कीजिए।\nसूची-I सूची-II (दक्षिण भारत के समुद्रगुप्‍त (उनके राज्य) के समकालीन नरेश)\nA. धनंजय 1. अवमुक्त\nB. नीलराज 2. कांची\nC. उग्रसेन 3. कुस्तलपुर\nD. विष्णुगोप 4. पालक्‍का\nकूट :\nA B C D","o":["1 2 3 4","2 1 4 3","3 1 4 2","4 3 2 1"],"a":[2],"t":["U.P.P.C.S. (Pre) 2018"],"e":"सूची -I का सूची -II से सही सुमेलन है-\nसूची-I सूची-II (दक्षिण भारत के समुद्रगुप्‍त (उनके राज्य) के समकालीन नरेश) धनंजय कुस्तलपुर नीलराज अवमुक्त उग्रसेन पालक्‍का विष्णुगोप कांची"},{"ch":10,"page":145,"n":17,"q":"दिल्‍ली की कुव्वत-उल-इस्लाम मस्जिद के प्रांगण में उन्‍नत प्रसिद्ध लौह-स्तंभ किसकी स्मृति में है?","o":["अशोक","चंद्र","हर्ष","अनंगपाल"],"a":[1],"t":["U.P. P.C.S. (Pre) 2002"],"e":"दिल्‍ली में मेहरौली नामक स्थान से ‘मेहरौली लौह स्तंभ लेख’ प्राप्‍त हुआ है‚ जो वर्तमान में कुव्वत-उल-इस्लाम मस्जिद के प्रांगण में स्थित है। इसमें ‘चंद्र’ नामक किसी राजा की उपलब्धियों का वर्णन किया गया है‚ जिसका समीकरण गुप्‍तवंशीय शासक चंद्रगुप्‍त द्वितीय से किया जाता है। एक मान्यता के अनुसार‚ लगभग 410 ई. में चंद्रगुप्‍त द्वितीय विक्रमादित्य के समय में मेहरौली लौह स्तंभ उदयगिरि पहाड़ियों के पास विष्णुगिरि में स्थित था। चंद्रगुप्‍त द्वितीय विष्णु का उपासक था। भगवान विष्णु के सम्मान में ही उसने इस लौह स्तंभ का निर्माण कराया था। इस स्तंभ के शीर्ष भाग पर भगवान विष्णु के वाहन गरुड़ का चिह्न अंकित है।"},{"ch":10,"page":146,"n":19,"q":"कौन-सा राजवंश हूणों के आक्रमण से अत्यंत विचलित हुआ?","o":["मौर्य","कुषाण","गुप्‍त","शुंग"],"a":[2],"t":["U.P.P.C.S. (Pre) 1993"],"e":"हूणों का पहला भारतीय आक्रमण गुप्‍त सम्राट स्कंदगुप्‍त के शासनकाल में हुआ तथा स्कंदगुप्‍त के हाथों वे बुरी तरह परास्त हुए। यह आक्रमण एक धावा मात्र रहा और देश के ऊपर इसका कोई तात्कालिक प्रभाव नहीं पड़ा; किंतु परोक्ष रूप से इसने गुप्‍त साम्राज्य के पतन की गति को तेज कर दिया। स्कंदगुप्‍त की मृत्यु के बाद 5वीं शताब्दी ई. के अंत तथा छठी शताब्दी ई. के प्रारंभ में उत्तर-पश्चिम के कई क्षेत्रों पर हूणों ने कब्जा कर लिया था।"},{"ch":10,"page":146,"n":20,"q":"हूणों ने भारत पर आक्र ्र (सम्राट) देश/भुक्ति (उपरिक) विषय (विषयपति) वीथि (आयुलन व वीथिमहत्तर) (ग्रामिक/अष्टकुलाधिकारी) ग्राम (गुप्‍त काल प्रांतीय प्रशासन)"},{"ch":10,"page":149,"n":43,"q":"गुप्‍त काल में उत्तर भारतीय व्यापार निम्नलिखित में से किस एक पत्तन से संचालित होता था?","o":["ताम्रलिप्‍ति","भड़ौच","कल्याण","कॉम्बे"],"a":[0],"t":["U.P.P.S.C. (R.I.) 2014","I.A.S. (Pre) 1999"],"e":"गुप्‍त काल में ‘ताम्रलिप्‍ति’ तत्कालीन बंगाल का एक प्रमुख बंदरगाह था‚ जहां से उत्तर भारतीय व्यापार दक्षिण-पूर्व एशिया‚ चीन‚ लंका‚ जावा‚ सुमात्रा आदि देशों के साथ होता था। पश्चिमी भारत का प्रमुख बंदरगाह भृगुकच्छ (भड़ौच) था‚ जहां से उत्तर भारत का पश्चिमी देशों के साथ समुद्री व्यापार होता था। गुप्‍त काल में उत्तर भारत का सर्वाधिक व्यापार दक्षिण पूर्व एशिया से होता था। अत: इस काल का प्रमुख बंदरगाह ताम्रलिप्‍ति था। परंतु अन्य बंदरगाहों; जैसे- भड़ौच‚ कल्याण‚ कॉम्बे आदि से भी उत्तर भारतीय व्यापार होता था। अत: उपर्युक्त प्रश्न में सर्वाधिक उपयुक्त उत्तर ताम्रलिप्‍ति होगा‚ साथ ही यदि विकल्प में ‘उपर्युक्त सभी’ विकल्प होता‚ तो सटीक उत्तर ‘उपर्युक्त सभी’ होता।"},{"ch":10,"page":150,"n":52,"q":"लीलावती के लेखक थे–","o":["महावीराचार्य","हेमचंद्राचार्य","भास्कराचार्य","कालकाचार्य"],"a":[2],"t":["U.P. G.I.C. (प्रवक्ता)‚ 2017"],"e":"‘लीलावती’ की रचना प्रसिद्ध भारतीय गणितज्ञ और खगोलशास्त्री भास्कराचार्य ने की थी। यह गणित विषय का महत्वपूर्ण ग्रंथ है और संस्कृत भाषा में काव्यात्मक शैली में श्लोकबद्ध है। वस्तुत: लीलावती भास्कराचार्य द्वारा रचित ग्रंथ ‘सिद्धांत शिरोमणि’ का एक भाग है।"},{"ch":10,"page":151,"n":55,"q":"चंद्रगुप्‍त के नौ रत्नों में से निम्न में से कौन फलित-ज्योतिष से संबंधित था?","o":["वररुचि","शंकु","क्षपणक","अमर सिंह"],"a":[2],"t":["U.P. Lower Sub. (Spl.) (Pre) 2008"],"e":"चंद्रगुप्‍त द्वितीय ‘विक्रमादित्य’ के कुशल शासन की प्रशंसा चीनी यात्री फाह्यान ने भी की है। इनके नौ रत्नों की प्रसिद्धि सर्वकालिक रही है। नौ रत्नों में सर्वोत्कृष्ट महाकवि कालिदास थे‚ जबकि क्षपणक रत्न फलित ज्योतिषी (Astrologer) थे।"},{"ch":10,"page":151,"n":59,"q":"अधोलिखित में कौन गुप्‍तकालीन स्वर्ण मुद्रा है?","o":["कौड़ी","दीनार","निष्क","पण"],"a":[1],"t":["U.P.P.C.S. (Pre), 1992"],"e":"गुप्‍तकाल में स्वर्ण मुद्रा को ‘दीनार’ कहा जाता था। चीनी यात्री फाह्यान के अनुसार‚ लोग दैनिक क्रय-विक्रय में कौड़ियों का प्रयोग करते थे।"},{"ch":10,"page":152,"n":60,"q":"गुप्‍त स्वर्ण मुद्रा को कहा जाता था-","o":["कार्षापण","दीनार","निष्क","सुवर्ण"],"a":[1],"t":["U.P. R.O/A.R.O. (Mains), 2017"],"e":"गुप्‍तकाल में स्वर्ण मुद्रा को ‘दीनार’ कहा जाता था। चीनी यात्री फाह्यान के अनुसार‚ लोग दैनिक क्रय-विक्रय में कौड़ियों का प्रयोग करते थे।"},{"ch":10,"page":152,"n":61,"q":"गुप्‍तकालीन रजत मुद्राओं को नाम दिया गया था–","o":["कार्षापण","दीनार","रूपक","निष्क"],"a":[2],"t":["I.A.S. (Pre)","1996","U.P. Lower Sub. (Spl.) (Pre), 2002"],"e":"गुप्‍त शासकों के सिक्‍के उत्तर प्रदेश‚ बिहार‚ बंगाल‚ मध्य प्रदेश‚ राजस्थान और उड़ीसा (ओडिशा) में पाए गए हैं। सिक्‍कों का सबसे प्रसिद्ध प्राप्‍ति स्थल राजस्थान का बयाना (भरतपुर जिला) है। इनके द्वारा जारी किए गए चांदी के सिक्‍के ‘रूपक’ या ‘रूप्यक’ कहलाते थे तथा स्वर्ण मुद्राओं को ‘दीनार’ कहा जाता था।"},{"ch":10,"page":152,"n":62,"q":"निम्नलिखित में से किस गुप्‍त शासक ने सर्वप्रथम सिक्‍के जारी किए?","o":["चंद्रगुप्‍त प्रथम ने","घटोत्कच ने","समुद्रगुप्‍त ने","श्रीगुप्‍त ने"],"a":[0],"t":["U.P.P.C.S. (Mains), 2010","U.P.P.C.S. (Pre), 2011"],"e":"गुप्‍त शासकों में चंद्रगुप्‍त प्रथम द्वारा सर्वप्रथम सिक्‍के जारी किए गए। चंद्रगुप्‍त प्रथम के पूर्व के शासकों‚ श्रीगुप्‍त एवं घटोत्कच द्वारा सिक्‍के जारी करने का कोई साक्ष्य उपलब्ध नहीं है। समुद्रगुप्‍त द्वारा भी कई प्रकार के सिक्‍के जारी किए गए थे‚ परंतु इसका काल चंद्रगुप्‍त प्रथम के बाद का है।"},{"ch":10,"page":152,"n":64,"q":"सती प्रथा का प्रथम अभिलेखीय साक्ष्य प्राप्‍त हुआ है–","o":["एरण से","जूनागढ़ से","मंदसौर से","सांची से"],"a":[0],"t":["U.P.P.C.S. (Mains), 2010"],"e":"सती प्रथा का प्रथम अभिलेखीय साक्ष्य एरण से प्राप्‍त हुआ है। यह अभिलेख 510 ई. का है‚ जिसमें भानुगुप्‍त के मंत्री गोपराज की पत्नी के सती होने का उल्‍लेख है।"},{"ch":10,"page":152,"n":66,"q":"सूची-I का सूची-II से मिलान कीजिए तथा नीचे दिए गए कूटों का प्रयोग कर सही उत्तर चुनिए–\nसूची-I (सम्राट) सूची-II (विरुद)\nA. अशोक 1. पराक्रमांक\nB. समुद्रगुप्‍त 2. प्रियदर्शिन\nC. चंद्रगुप्‍त-II 3. क्रमादित्य\nD. स्कंदगुप्‍त 4. विक्रमादित्य\nकूट :\nA B C D","o":["1 2 3 4","3 2 1 4","2 1 4 3","4 3 2 1"],"a":[2],"t":["U.P. P.C.S. (Pre) (Re-Exam), 2015"],"e":"सही सुमेलन निम्नवत है :– सम्राट विरुद अशोक प्रियदर्शिन (प्रियदर्शी) समुद्रगुप्‍त पराक्रमांक चंद्रगुप्‍त-II विक्रमादित्य स्कंदगुप्‍त क्रमादित्य"},{"ch":10,"page":153,"n":69,"q":"प्राचीन भारत में किस वंश का शासनकाल ‘स्वर्ण युग’ कहा जाता है?","o":["मौर्य","शुंग","गुप्‍त","मगध"],"a":[2],"t":["U.P.P.C.S. (Spl.) (Pre), 2004"],"e":"गुप्‍तकाल को इतिहासकारों ने भारत का ‘स्वर्ण युग’ कहा है। इस काल को क्‍लासिक युग (Classical Age) या भारत का पेरीक्‍लीन युग भी कहा जाता है। अपनी जिन विशेषताओं के कारण गुप्‍तकाल को ‘स्वर्णकाल’ कहा जाता है‚ वे इस प्रकार हैं– महान सम्राटों का काल‚ श्रेष्ठ शासन‚ आर्थिक समृद्धि‚ धार्मिक-सहिष्णुता का काल‚ भारतीय संस्कृति के प्रचार का काल‚ साहित्य‚ विज्ञान एवं कला के उत्कर्ष का काल।"},{"ch":10,"page":153,"n":70,"q":"निम्न में से किस काल में स्त्रियों की पुरुषों से बराबरी थी?","o":["गुप्‍तकाल","मौर्यकाल","चोलों में","इनमें से किसी में भी नहीं"],"a":[3],"t":["U.P.P.C.S. (Pre), 1994"],"e":"ऋग्वैदिक काल को छोड़कर प्राचीन भारतीय इतिहास में स्त्रियों की स्थिति कभी अच्छी नहीं रही। गुप्‍त‚ मौर्य और चोल काल में भी स्त्रियों की स्थिति से संबंधित कुछ सीमित प्रसंगों को छोड़कर‚ उनकी दयनीय स्थिति का ही साक्ष्य मिलता है। अत: स्त्रियों की पुरुषों से बराबरी किसी काल में नहीं मानी जा सकती।"},{"ch":10,"page":153,"n":73,"q":"हिंदू विधि द्वारा मान्य कर कितना था?","o":["उपज का आधा भाग","उपज का छठा भाग","उपज का एक-तिहाई भाग","उपज का एक-चौथाई भाग"],"a":[1],"t":["U.P.P.C.S. (Pre), 1992"],"e":"प्राय: सभी धर्मशास्त्रों में भू-राजस्व की दर 1/6 (उपज का छठा भाग) थी।"},{"ch":10,"page":154,"n":77,"q":"प्राचीन भारत में सिंचाई कर को कहते थे–","o":["उदकभागम","हिरण्य","उदरंग","उपरनिका"],"a":[0],"t":["U.P.P.C.S. (Mains), 2009"],"e":"प्राचीन भारत में सिंचाई कर को ‘उदकभागम’ कहा गया है। ‘हिरण्य’ मौर्यकाल में लिया जाने वाला नकद कर था। गुप्‍त अभिलेखो  सांख्य-सूत्र नामक ग्रंथ की रचना की थी।"},{"ch":10,"page":156,"n":96,"q":"योग दर्शन के प्रतिपादक हैं–","o":["पतंजलि","गौतम","जैमिनी","शंकराचार्य"],"a":[0],"t":["U.P.P.C.S. (Pre), 1997","U.P. Lower Sub. (Spl.) (Pre), 2002","U.P. Lower Sub. (Spl.) (Pre), 2003","U.P.P.C.S. (Pre), 2007"],"e":"महर्षि पतंजलि को योग दर्शन का प्रतिष्ठापक आचार्य माना जाता है। यद्यपि भारतीय परंपरा में योग-साधना का इतिहास अत्यंत प्राचीन है‚ उपनिषद‚ महाभारत‚ भगवद्ग‌ीता‚ जैन और बौद्ध मतों में योग संबंधी क्रियाओं का विवेचन प्राप्‍त होता है‚ तथापि महर्षि पतंजलि ने ‘योगसूत्र’ के रूप में सर्वाधिक सूत्रबद्ध दार्शनिक प्रतिपादन किया; इसीलिए इन्हें योग दर्शन का प्रणेता कहा जाता है।"},{"ch":10,"page":157,"n":100,"q":"महाभाष्य के लेखक ‘पतंजलि’ समसामयिक थे–","o":["चंद्रगुप्‍त मौर्य के","अशोक के","पुष्यमित्र शुंग के","चंद्रगुप्‍त प्रथम के"],"a":[2],"t":["U.P.P.C.S. (Pre), 2011"],"e":"महाभाष्य के लेखक ‘पतंजलि’ शुंग वंश के संस्थापक शासक पुष्यमित्र शुंग (184-148 ई.पू.) के समकालीन थे।"},{"ch":10,"page":157,"n":101,"q":"नव्य-न्याय संप्रदाय (स्कूल) के संस्थापक कौन थे?","o":["रघुनाथ शिरोमणि","गंगेश","श्रीधर","उदयन"],"a":[1,3],"t":["U.P.P.C.S. (Pre), 1995"],"e":"मिथिला के प्रसिद्ध तर्कवादी उदयन या उदयनाचार्य न्याय दर्शन के प्रख्यात विद्वान थे। उनकी रचना कुसुमांजलि को नव्य-न्याय दर्शन का मूल स्रोत भी माना जाता है। कई विचारक उदयन को नव्य-न्याय दर्शन (संप्रदाय) का वास्तविक संस्थापक मानते हैं‚ जबकि कुछ विचारक गंगेश‚ जिन्होंने नव्यन्याय दर्शन को संगृहीत किया था‚ को इसका संस्थापक मानते हैं।"},{"ch":10,"page":158,"n":107,"q":"न्याय दर्शन को प्रचारित किया था–","o":["चार्वाक ने","गौतम ने","कपिल ने","जैमिनी ने"],"a":[1],"t":["U.P.P.C.S. (Pre), 2005","U.P.P.C.S. (Mains), 2005"],"e":"न्याय दर्शन का प्रवर्तन गौतम ने किया‚ जिन्हें ‘अक्षपाद’ भी कहा जाता है। न्याय का शाब्दिक अर्थ तर्क विधि/निर्णय तथा नियम/पद्धति होता है। न्याय दर्शन में 16 पदार्थों या तत्वों का अस्तित्व स्वीकार किया गया है। न्याय दर्शन का मूल ग्रंथ गौतम कृत ‘न्यायसूत्र’ है।"},{"ch":10,"page":158,"n":110,"q":"न्याय दर्शन के प्रवर्तक थे–","o":["गौतम","कपिल","कणाद"," िए :\n1. विक्रम संवत्‌58 ई.पू. से आरंभ हुआ।\n2. शक संवत्‌सन्‌78 ई. से आरंभ हुआ।\n3. गुप्‍तकाल सन्‌319 ई. से आरंभ हुआ।\n4. भारत में मुसलमान शासन का युग सन्‌1192 ई. से शुरू हुआ।\nकूट :","o":["1 एवं 2","3 एवं 4","1, 2 एवं 3","1, 2, 3 एवं 4"],"a":[3],"t":["U.P.P.C.S. (Pre), 2011"],"e":"विक्रम संवत्‌58 ई.पू. अथवा 57 ई.पू. से तथा शक संवत्‌78 ई. से प्रारभं हुआ था। यद्यपि गुप्‍त वंश की स्थापना श्रीगुप्‍त ने की थी‚ तथापि गुप्‍तकाल के प्रारभं से तात्पर्य गुप्‍त साम्राज्य; अर्थात चंद्रगुप्‍त प्रथम के शासनकाल के आरंभ (319 ई.) से है। साथ ही यद्यपि 8 वीं शताब्दी ई. के प्रारभं में ही मुहम्मद बिन कासिम द्वारा भारत के सिंध प्रांत को अधिकतृ कर लिया गया था; परंतु भारत में मुसलमान शासन का युग‚ मुहम्मद गोरी की तराइन के द्वितीय युद्ध में विजय (1192 ई.) से प्रारभं माना जाता है। इस प्रकार प्रश्नगत चारों कथन सही हैं। कुछ प्रश्नों के उत्तर आयोग की मान्यता पर निर्धारित होते हैं। यह प्रश्न भी ऐसे ही प्रश्नों में से एक है। यहां यदि गुप्‍तकाल के प्रारंभ से आशय श्रीगुप्‍त से हो और भारत में मुस्लिम शासन का युग 1206 ई. (गुलाम वंश की स्थापना) से माना जाए‚ तो अभीष्ट विकल्प (a) होगा। इसी प्रकार\nकथन 3 को सही और कथन 4 को गलत मानने पर अभीष्ट विकल्प (c) होगा।"},{"ch":10,"page":162,"n":134,"q":"एक चालुक्य अभिलेख के तिथि अंकन में शक संवत्‌का वर्ष 556 दिया हुआ है। इसका तुल्य वर्ष है–","o":["478 ई.","499 ई.","613 ई.","634 ई."],"a":[3],"t":["U.P.P.C.S. (Mains), 2002"],"e":"शक संवत्‌का प्रचलन कुषाणवंशीय शासक कनिष्क ने 78 ई. में किया था। यदि शक संवत्‌में 556 अंकित है‚ तो यह ईस्वी सन्‌में 556 + 78 = 634 ई. होगा।"},{"ch":10,"page":162,"n":135,"q":"पुराणों के अनुसार‚ चंद्रवंशीय शासकों का मूल स्थान था–","o":["काशी","अयोध्या","प्रतिष्ठानपुर","श्रावस्ती"],"a":[2],"t":["U.P.P.C.S. (Pre), 2009"],"e":"पुराणों के अनुसार‚ चंद्र वंश (या सोम वंश) क्षत्रिय वर्ण के मूल वंशों में से एक था। चंद्रवंशीय शासकों का मूल स्थान त्रेता युग में प्रयाग था; परंतु प्रलय के पश्चात द्वापर युग में चंद्रवंशीय संवारन ने प्रतिष्ठानपुर (वर्तमान झूंसी‚ प्रयागराज) में राजधानी की स्थापना की थी।"},{"ch":10,"page":162,"n":137,"q":"निम्नलिखित युग्मों म िर्माण हुआ। सर्वाधिक सुदं र मूर्तियां नटराज (शिव) की हैं‚ जो बड़ी संख्या में मिली हैं। इन्हें विश्व की श्रेष्ठतम प्रतिमा-रचनाओं में शामिल किया जाता है। ये मूर्तियां प्राय: चतुर्भुज हैं।"},{"ch":12,"page":190,"n":22,"q":"शिव की ‘दक्षिणामूर्ति’ प्रतिमा उन्हें किस रूप में प्रदर्शित करती है?","o":["शिक्षक","नृत्य करते हुए","विश्राम करते हुए","ध्यानमग्‍न"],"a":[0],"t":["U.P. P.C.S. (Pre) 2013"],"e":"शिव की ‘दक्षिणामूर्ति’ प्रतिमा उन्हें गुरु (शिक्षक) के रूप में प्रदर्शित करती है। इस रूप में शिव अपने भक्तों को सभी प्रकार का ज्ञान प्रदान करते हुए माने गए हैं। इस रूप में शिव की दक्षिण दिशा में मुख किए हुए प्रतिमा स्थापित की गई है।"},{"ch":12,"page":190,"n":23,"q":"‘नटराज नृत्य के भगवान’ की मूर्ति के संदर्भ में‚ निम्नलिखित में से कौन-सा/से कथन सही है/हैं?\n1. यह मूर्ति नृत्य करते हुए चार हाथों वाले शिव का प्रतिनिधित्व करती है।\n2. अपने दाएं कान में‚ वह एक पुरुष का कुंडल पहने हैं‚ बाएं में एक महिला का।\nनीचे दिए गए कूट से सही उत्तर का चयन कीजिए–\nकूट :","o":["केवल 1","केवल 2","दोनों 1 और 2","न तो 1 और ना ही 2"],"a":[2],"t":["U.P.R.O./A.R.O. (Mains) 2021"],"e":"भगवानिशव की नटराज मुद्रा की मूर्ति नृत्य करते हुए चार हाथों वाले शिव का प्रतिनिधित्व करती है। इस मूर्ति में उनके ऊपरी दाएं हाथ में डमरू (सृजन का प्रतीक) और ऊपरी बाएं हाथ में अग्‍नि (विनाश का प्रतीक) प्रदर्शित है। उनका दूसरा दाहिना हाथ अभय मुद्रा प्रदर्शित कर रहा है‚ जबकि दूसरा बायां हाथ उनके उठे हुए बाएं पैर की ओर इशारा कर रहा है‚ जो कि मोक्ष मार्ग का प्रतीक है। नटराज की इस मूर्ति में शिव को ‘अर्द्धनारीश्वर’ के रूप में दाहिने कान में पुरुष का कुंडल और बाएं कान में महिला का कुंडल पहने प्रदर्शित किया गया है।"},{"ch":12,"page":190,"n":24,"q":"72 व्यापारी‚ चीन में किसके कार्यकाल में भेजे गए थे?","o":["कुलोत्तुंग-I","राजेंद्र-I","राजराज-I","राजाधिराज-I"],"a":[0],"t":["U.P.P.C.S. (Pre) 1992"],"e":"चोल शासक कुलोत्तुंग-I के शासनकाल में 1077 ई. में 72 व्यापारियों का एक चोल दूत मंडल चीन भेजा गया था।"},{"ch":12,"page":190,"n":25,"q":"निम्न में से दक्षिण भारत का कौन-सा राजवंश अपनी नौसैनिक शक्ति के लिए प्रसिद्ध था?","o":["चोल","चेर","पल्‍लव","राष्ट्रकूट"],"a":[0],"t":["R.A.S./R.T.S. (Pre) 1993","U.P. P.C.S. (Pre) 1992","U.P. P.C.S. (Pre) 2004"],"e":"चोल राजाओं ने एक विशाल संगठित सेना का निर्माण किया था। चोलों के पास अश्व‚ गज एवं पैदल सैनिकों के साथ ही साथ एक अत्यंत शक्तिशाली नौसेना भी थी। इसी नौसेना की सहायता से उन्होंने श्रीविजय‚ सिंहल‚ मालदीव आदि द्वीपों की विजय की थी।"},{"ch":12,"page":191,"n":27,"q":"निम्नलिखित चोल शासकों में जिसने बंगाल की खाड़ी को ‘चोल झील’ का स्वरूप प्रदान कर दिया‚ वह कौन था?","o":["राजराज प्रथम","राजेंद्र प्रथम","अधिराज","कुलोत्तुंग"],"a":[1],"t":["U.P. P.C.S. (Spl.) (Pre) 2008"],"e":"राजराज प्रथम की मृत्यु के बाद उसका योग्यतम पुत्र राजेंद्र प्रथम सम्राट बना। उसने अपने पिता की साम्राज्यवादी नीति को आगे बढ़ाया। राजेंद्र प्रथम का काल चोल शक्ति का चरमोत्कर्ष काल था। राजेंद्र प्रथम के बारे में कहा गया है कि उसने बंगाल की खाड़ी को ‘चोल झील’ का स्वरूप प्रदान कर दिया था। 1017 ई. में उसने संपूर्ण सिंहल द्वीप (श्रीलंका) को जीत लिया तथा सिंहल राजा महेंद्र पंचम्‌को बंदी बनाकर चोल राज्य में लाया। राजेंद्र-I ने उत्तर भारत में गंगा घाटी तक सैन्‍य अभियान किया तथा पाल शासक महिपाल को पराजित किया। इस विजय के उपलक्ष्य में उसने ‘गंगैकोंड’ की उपाधि ग्रहण की तथा ‘गंगैकोंडचोलपुरम्‌’ नामक नई राजधानी की स्थापना की। विजय के बाद गंगा जल लाकर उसे मंदिर परिसर के सिंहकेनी जैसे टैंक में मिश्रित किए जाने का विवरण मिलता है। नवीन राजधानी के निकट ही उसने सिंचाई के लिए ‘चोलगंगम्‌’ नामक विशाल तालाब का भी निर्माण कराया।"},{"ch":12,"page":191,"n":28,"q":"‘गंगैकोंडचोलपुरम्‌’ की स्थापना किसने की थी?","o":["राजराज I","राजाधिराज","राजेंद्र I","विजयादित्य"],"a":[2],"t":["U.P.P.C.S. (Spl.) (Mains) 2008"],"e":"राजराज प्रथम की मृत्यु के बाद उसका योग्यतम पुत्र राजेंद्र प्रथम सम्राट बना। उसने अपने पिता की साम्राज्यवादी नीति को आगे बढ़ाया। राजेंद्र प्रथम का काल चोल शक्ति का चरमोत्कर्ष काल था। राजेंद्र प्रथम के बारे में कहा गया है कि उसने बंगाल की खाड़ी को ‘चोल झील’ का स्वरूप प्रदान कर दिया था। 1017 ई. में उसने संपूर्ण सिंहल द्वीप (श्रीलंका) को जीत लिया तथा सिंहल राजा महेंद्र पंचम्‌को बंदी बनाकर चोल राज्य में लाया। राजेंद्र-I ने उत्तर भारत में गंगा घाटी तक सैन्‍य अभियान किया तथा पाल शासक महिपाल को पराजित किया। इस विजय के उपलक्ष्य में उसने ‘गंगैकोंड’ की उपाधि ग्रहण की तथा ‘गंगैकोंडचोलपुरम्‌’ नामक नई राजधानी की स्थापना की। विजय के बाद गंगा जल लाकर उसे मंदिर परिसर के सिंहकेनी जैसे टैंक में मिश्रित किए जाने का विवरण मिलता है। नवीन राजधानी के निकट ही उसने सिंचाई के लिए ‘चोलगंगम्‌’ नामक विशाल तालाब का भी निर्माण कराया।"},{"ch":12,"page":191,"n":29,"q":"निम्नलिखित में से किस चोल शासक को चोलगंगम्‌ नामक बृहद कृत्रिम झील बनवाने का श्रेय दिया जाता है?","o":["राजराज प्रथम","राजेंद्र","राजाधिराज","राजराज द्वितीय"],"a":[1],"t":["U.P.P.C.S (Mains) 2016"],"e":"राजराज प्रथम की मृत्यु के बाद उसका योग्यतम पुत्र राजेंद्र प्रथम सम्राट बना। उसने अपने पिता की साम्राज्यवादी नीति को आगे बढ़ाया। राजेंद्र प्रथम का काल चोल शक्ति का चरमोत्कर्ष काल था। राजेंद्र प्रथम के बारे में कहा गया है कि उसने बंगाल की खाड़ी को ‘चोल झील’ का स्वरूप प्रदान कर दिया था। 1017 ई. में उसने संपूर्ण सिंहल द्वीप (श्रीलंका) को जीत लिया तथा सिंहल राजा महेंद्र पंचम्‌को बंदी बनाकर चोल राज्य में लाया। राजेंद्र-I ने उत्तर भारत में गंगा घाटी तक सैन्‍य अभियान किया तथा पाल शासक महिपाल को पराजित किया। इस विजय के उपलक्ष्य में उसने ‘गंगैकोंड’ की उपाधि ग्रहण की तथा ‘गंगैकोंडचोलपुरम्‌’ नामक नई राजधानी की स्थापना की। विजय के बाद गंगा जल लाकर उसे मंदिर परिसर के सिंहकेनी जैसे टैंक में मिश्रित किए जाने का विवरण मिलता है। नवीन राजधानी के निकट ही उसने सिंचाई के लिए ‘चोलगंगम्‌’ नामक विशाल तालाब का भी निर्माण कराया।"},{"ch":12,"page":191,"n":31,"q":"चोल शासक का नाम बताइए‚ जिसने श्रीलंका के उत्तरी भाग पर विजय प्राप्‍त की।","o":["राजराज प्रथम","राजेंद्र प्रथम","परांतक प्रथम","आदित्य प्रथम"],"a":[0],"t":["U.P.P.C.S. (Mains) 2014"],"e":"चोल शासक राजराज प्रथम ने सिंहल (श्रीलंका) पर आक्रमण करके उत्तरी सिंहल को जीतकर अपने राज्य में मिला लिया। विजित क्षेत्र में राजराज ने अनुराधापुर को नष्ट कर पोलोन्‍नरुवा को इस क्षेत्र की राजधानी बनाया और इसका नाम ‘जननाथ मंगलम्’‌ रखा। राजराज शैव मतावलम्बी था‚ उसने ‘शिवपादशेखर’ की उपाधि धारण की थी।"},{"ch":12,"page":192,"n":34,"q":"वह च प्‍त होती है। ये व्यापारी संघ हैंमणिग्रामम्‌‚ नानादेशिस (नानादेशि)‚ वलैंग‚ बलंजियर‚ इदंगै आदि। मणिग्रामम्‚‌ नानादेशिस दूसरे देशों के साथ भी व्यापार करते थे।"},{"ch":12,"page":193,"n":39,"q":"चालुक्य वंश का सबसे महान शासक कौन था?","o":["विक्रमादित्य","मंगलेश","पुलकेशिन द्वितीय","पुलकेशिन प्रथम"],"a":[2],"t":["U.P.P.C.S. (Pre) 1991"],"e":"पुलु केशिन द्वितीय चालुक्य वंश के शासकों में सर्वाधिक योग्य तथा शक्तिशाली था। उसने 610 ई. से 642 ई. तक शासन किया। उसकी उपलब्धियों का विवरण हमें ऐहोल प्रशस्ति से प्राप्‍त होता है।"},{"ch":12,"page":193,"n":40,"q":"निम्नलिखित में से किस वंश द्वारा प्राय: महिलाओं को प्रशासन में उच्‍च पद प्रदान किए जाते थे?","o":["चोल","चालुक्य","पाल","सेन"],"a":[1],"t":["U.P.P.C.S. (Mains) 2007"],"e":"चालुक्यों के शासनकाल में प्राय: महिलाओं को उच्‍च पदों पर नियुक्त किया जाता था। विक्रमादित्य प्रथम के भाई चंद्रादित्य की रानी विजय भट्टारिका ने अपने नाम से दो ताम्रपत्र लिखवाए थे। वह एक अच्छी कवयित्री भी थीं। विक्रमादित्य ने अपनी छोटी बहन कुमकुम देवी के कहने पर एक विद्वान ब्राह्मण को एक गांव दान में दिया था। कीर्तिवर्मन द्वितीय की महारानी महादेवी के उसके साथ रक्तपुर के स्कंधावार में उपस्थित रहने का उल्‍लेख मिलता है। इस वंश की विजय भट्टारिका ने कुशलतापूर्वक शासन संचालित किया था।"},{"ch":12,"page":193,"n":41,"q":"चालुक्यों की राजधानी कहां थी?","o":["वातापी","श्रावस्ती","कांची","कन्‍नौज"],"a":[0],"t":["U.P.P.C.S. (Pre) 1991"],"e":"बागलकोट (कर्नाटक) जिले के वातापी नामक प्राचीन नगर का आधुनिक नाम बादामी है। छठी-आठवीं शताब्दी ई. में यह चालुक्यों की राजधानी थी। वातापी के चालुक्य राजवंश का वास्तविक संस्थापक पुलकेशिन प्रथम था।"},{"ch":12,"page":193,"n":43,"q":"संस्कृत के कवि और नाटककार कालिदास का उल्‍लेख हुआ है-","o":["पुलकेशिन II के ऐहोल अभिलेख में","मिहिरभोज के ग्वालियर अभिलेख में","कुमारगुप्‍त I के करमदंडा शिवलिंग अभिलेख में","चंद्रगुप्‍त II के मथुरा स्तंभ लेख में"],"a":[0],"t":["U.P.P.C.S. (Mains) 2013"],"e":"ऐहोल प्रशस्ति बादामी के शासक पुलकेशिन II के इतिहास को जानने का एक सशक्त माध्यम है। इस लेख की भाषा संस्कृत तथा लिपि दक्षिणी ब्राह्मी है। इस लेख की रचना रविकी   const snap=await ref.get();let changed=false;const rem=snap.exists?(snap.data().p||{}):{};
  for(const id in rem){const a=rem[id],b=PROG[id];if(!b||(a.t||0)>(b.t||0))PROG[id]=a}
  for(const id in PROG){const a=PROG[id],b=rem[id];if(!b||(a.t||0)>(b.t||0))changed=true}
  const rb=snap.exists?(snap.data().b||{}):{};
  for(const id in rb){const a=rb[id],b=BM[id];if(!b||(a.t||0)>(b.t||0))BM[id]=a}
  for(const id in BM){const a=BM[id],b=rb[id];if(!b||(a.t||0)>(b.t||0))changed=true}
  store.set(BKEY,BM);store.set(PKEY,PROG);SY.ref=ref;SY.mode='cloud';if(changed)doSave();
  if(VIEW==='home')home();else if(VIEW==='list')wrongList();else if(VIEW==='saved')savedList();else if(VIEW==='quiz')render();
}catch(e){}})();
function mistakes(){const ever=[],still=[];QS.forEach(q=>{const p=PROG[qid(q)];if(p&&p.w>0){ever.push(q);if(p.r===0)still.push(q)}});return{ever,still}}
let clearAsk=false;
function clearHist(){if(!clearAsk){clearAsk=true;home();return}PROG={};store.set(PKEY,PROG);clearAsk=false;if(SY.mode==='cloud')doSave();home()}
function home(){
  S=null;VIEW='home';$('#nav').classList.add('hide');
  const best=store.get('uqa_best')||{};
  const counts=CH.map((c,i)=>QS.filter(q=>q.ch===i).length);
  let h=`<header class="top"><div class="kicker">UPPSC · पिछले वर्षों के प्रश्न</div>
  <h1>प्राचीन इतिहास टेस्ट सीरीज़</h1>
  <p class="sub">केवल उत्तर प्रदेश लोक सेवा आयोग की परीक्षाओं (PCS प्री/मेन्स, RO/ARO, लोअर सबऑर्डिनेट, UDA/LDA, GIC, BEO आदि) में पूछे गए प्रश्न। विकल्प चुनते ही पता चलेगा कि उत्तर सही है या गलत।</p></header>
  <div class="stats"><div class="stat"><b>${QS.length}</b><span>कुल प्रश्न</span></div><div class="stat"><b>${CH.length}</b><span>अध्याय-वार टेस्ट</span></div><div class="stat"><b>${Object.keys(PROG).length}</b><span>अब तक हल किए</span></div></div>
  ${(()=>{const m=mistakes();const fixed=m.ever.length-m.still.length;
   const note=SY.mode==='cloud'?'☁️ आपकी प्रगति आपके Claude खाते में सेव हो रही है, किसी भी डिवाइस पर दिखेगी।':'💾 आपकी प्रगति इसी ब्राउज़र/डिवाइस में सेव हो रही है।';
   return `<div class="mist"><h2>मेरी गलतियाँ</h2>
   ${m.ever.length?`<div class="nums"><span class="r"><b>${m.still.length}</b>अभी भी गलत</span><span class="g"><b>${fixed}</b>बाद में सही किए</span><span><b>${m.ever.length}</b>कुल गलत हुए</span></div>
   <div class="row"><button class="btn pri" ${m.still.length?'':'disabled'} onclick="start('still')">अभी भी गलत वाले हल करें (${m.still.length})</button>
   <button class="btn ghost" onclick="wrongList()">गलत प्रश्नों की सूची देखें</button></div>`
   :`<p class="sub" style="margin:4px 0 0">अभी तक कोई प्रश्न गलत नहीं हुआ। टेस्ट देते समय जो भी प्रश्न गलत होगा, वह यहाँ अपने-आप जुड़ जाएगा।</p>`}
   <div class="sync">${note}${Object.keys(PROG).length?` · ${clearAsk?`<button class="link" style="color:var(--bad)" onclick="clearHist()">पक्का? हाँ, सारा इतिहास मिटाएं</button> <button class="link" onclick="clearAsk=false;home()">रद्द करें</button>`:`<button class="link" onclick="clearHist()">इतिहास मिटाएं</button>`}`:''}</div></div>`})()}
  ${(()=>{const sv=QS.filter(isBM);return `<div class="mist saved"><h2>⭐ सेव किए प्रश्न</h2>
   ${sv.length?`<div class="nums"><span><b style="color:#d97706">${sv.length}</b>दोहराने के लिए सेव</span></div>
   <div class="row"><button class="btn pri" onclick="start('saved')">सेव किए प्रश्न हल करें (${sv.length})</button>
   <button class="btn ghost" onclick="savedList()">सेव किए प्रश्नों की सूची</button></div>`
   :`<p class="sub" style="margin:4px 0 0">टेस्ट देते समय कोई प्रश्न अच्छा लगे तो उस पर "☆ सेव करें" दबाएँ। वह यहाँ जुड़ जाएगा और बाद में सिर्फ़ सेव किए प्रश्न हल कर सकेंगे।</p>`}</div>`})()}
  <div class="sec">मिश्रित अभ्यास</div>
  <div class="mix">
   <button class="btn pri" onclick="start('mix25')">25 प्रश्न (रैंडम)</button>
   <button class="btn pri" onclick="start('mix50')">50 प्रश्न (रैंडम)</button>
   <button class="btn ghost" onclick="start('mix100')">100 प्रश्न (रैंडम)</button>
   <button class="btn ghost" onclick="start('all')">सभी ${QS.length} प्रश्न</button>
  </div>
  <label class="opt-row"><input type="checkbox" id="shuf" ${shuffleOn?'checked':''} onchange="shuffleOn=this.checked;store.set('uqa_shuf',shuffleOn)"> अध्याय-वार टेस्ट में प्रश्नों का क्रम बदलें</label>
  <div class="sec">अध्याय-वार टेस्ट</div>`;
  const still=mistakes().still;
  CH.forEach((c,i)=>{const b=best['ch'+i];const w=still.filter(q=>q.ch===i).length;h+=`<button class="ch" onclick="start('ch${i}')"><span class="no">${i+1}</span><span class="nm">${esc(c)}</span><span class="ct">${counts[i]} प्रश्न${b!=null?`<span class="best">सर्वश्रेष्ठ ${b}%</span>`:''}${w?`<span class="wb">✗ ${w} गलत</span>`:''}</span></button>`});
  h+=`<p class="foot">स्रोत: अपलोड की गई पुस्तक (पृष्ठ 8–226) · आयोग द्वारा रद्द/विवादित (*) प्रश्न शामिल नहीं</p>`;
  $('#app').innerHTML=h;window.scrollTo(0,0);
}
function start(id,list){
  let qs, title;
  if(list){qs=list;if(list===window.SAVQ){id='saved';title='सेव किए प्रश्न'}else title='गलत प्रश्नों का दोहराव'}
  else if(id==='saved'){qs=QS.filter(isBM);if(shuffleOn)qs=shuffle(qs);title='सेव किए प्रश्न'}
  else if(id==='still'){qs=mistakes().still;title='गलत प्रश्नों का दोहराव'}
  else if(id.startsWith('ch')){const i=+id.slice(2);qs=QS.filter(q=>q.ch===i);if(shuffleOn)qs=shuffle(qs);title=CH[i]}
  else if(id==='all'){qs=QS.slice();title='सभी प्रश्न'}
  else {const n=+id.slice(3);qs=shuffle(QS).slice(0,n);title=`मिश्रित अभ्यास (${n})`}
  if(!qs.length){home();return}
  VIEW='quiz';S={id,title,qs,ans:new Array(qs.length).fill(null),i:0};
  $('#nav').classList.remove('hide');render();
}
function tally(){let g=0,r=0;S.ans.forEach((a,k)=>{if(a==null)return;S.qs[k].a.includes(a)?g++:r++});return{g,r}}
function render(){
  const q=S.qs[S.i],a=S.ans[S.i],t=tally(),done=S.ans.filter(x=>x!=null).length;
  let h=`<div class="bar"><div class="barrow"><button class="back" onclick="if(confirm_back())home()">← सूची</button>
  <div class="score"><span class="g">✓ ${t.g}</span><span class="r">✗ ${t.r}</span><span>${done}/${S.qs.length}</span></div></div>
  <div class="prog"><i style="width:${done/S.qs.length*100}%"></i></div></div>
  <div class="qcard"><div class="qmeta"><b>प्रश्न ${S.i+1}</b><span class="r"><span>${esc(S.id.startsWith('ch')?'':CH[q.ch])}</span><button class="bm ${isBM(q)?'on':''}" onclick="toggleBM('${qid(q)}')">${isBM(q)?'★ सेव किया':'☆ सेव करें'}</button></span></div>
  <div class="chips">${(()=>{const p=PROG[qid(q)];return p&&p.w>0?`<span class="chip prevw">पहले ${p.w} बार गलत</span>`:''})()}${q.t.filter(x=>/^(U\.?\s?P|UPPSC)/.test(x)).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>
  <div class="qtext">${esc(q.q)}</div>`;
  q.o.forEach((o,k)=>{let c='';if(a!=null){if(q.a.includes(k))c='ok';else if(k===a)c='bad'}
    h+=`<button class="opt ${c}" ${a!=null?'disabled':''} onclick="pick(${k})"><span class="l">${L[k]}</span><span class="t">${esc(o)}</span></button>`});
  if(a!=null){const ok=q.a.includes(a);
    h+=`<div class="verdict ${ok?'ok':'bad'}">${ok?'✅ सही उत्तर!':'❌ गलत! सही उत्तर: '+q.a.map(x=>'('+L[x]+') '+esc(q.o[x])).join(' / ')}</div>`;
    if(q.e)h+=`<details class="ex" open><summary>व्याख्या</summary><div>${esc(q.e)}</div></details>`;}
  h+=`</div><div class="jump">${S.qs.map((qq,k)=>{const x=S.ans[k];const c=x==null?'':(qq.a.includes(x)?'g':'r');return `<button class="${c} ${k===S.i?'cur':''}" onclick="go(${k})">${k+1}</button>`}).join('')}</div>`;
  $('#app').innerHTML=h;
  $('#prev').disabled=S.i===0;
  $('#next').textContent=S.i===S.qs.length-1?'परिणाम देखें':'अगला →';
}
function confirm_back(){return true}
function pick(k){if(S.ans[S.i]!=null||k>=S.qs[S.i].o.length)return;S.ans[S.i]=k;render();record(S.qs[S.i],k)}
function go(k){S.i=k;render();window.scrollTo(0,0)}
$('#prev').onclick=()=>{if(S&&S.i>0)go(S.i-1)};
$('#next').onclick=()=>{if(!S)return;if(S.i<S.qs.length-1)go(S.i+1);else result()};
function result(){
  VIEW='result';$('#nav').classList.add('hide');
  const t=tally(),n=S.qs.length,skip=n-t.g-t.r,pct=Math.round(t.g/n*100);
  if(S.id.startsWith('ch')){const b=store.get('uqa_best')||{};if(b[S.id]==null||pct>b[S.id]){b[S.id]=pct;store.set('uqa_best',b)}}
  const wrong=S.qs.map((q,k)=>({q,a:S.ans[k]})).filter(x=>x.a!=null&&!x.q.a.includes(x.a));
  let h=`<div class="qcard res"><div class="kicker">${esc(S.title)}</div><div class="big">${pct}%</div>
  <p>${n} में से <b style="color:var(--ok)">${t.g} सही</b>, <b style="color:var(--bad)">${t.r} गलत</b>${skip?`, ${skip} छोड़े`:''}</p>
  <div class="mix" style="margin-top:14px"><button class="btn pri" onclick="start('${S.id==='wrong'?'still':S.id}')">फिर से दें</button>
  <button class="btn ghost" onclick="home()">मुख्य सूची</button></div>
  ${wrong.length?`<button class="btn ghost" style="width:100%;margin-top:10px" onclick="retryWrong()">केवल गलत प्रश्न दोबारा (${wrong.length})</button>`:''}</div>`;
  if(wrong.length){h+=`<div class="sec">गलत उत्तरों की समीक्षा</div><div class="rv">`;
    wrong.forEach(x=>{h+=`<div class="rvi"><div class="q">${esc(x.q.q)}</div><div class="y">आपका उत्तर: (${L[x.a]}) ${esc(x.q.o[x.a])}</div><div class="c">सही उत्तर: ${x.q.a.map(k=>'('+L[k]+') '+esc(x.q.o[k])).join(' / ')}</div></div>`});h+='</div>'}
  S.wrong=wrong.map(x=>x.q);
  $('#app').innerHTML=h;window.scrollTo(0,0);
}
function retryWrong(){start('wrong',S.wrong)}
let LF={s:'still',c:'all'};
function wrongList(){
  VIEW='list';S=null;$('#nav').classList.add('hide');
  const m=mistakes();let items=(LF.s==='still'?m.still:m.ever);if(LF.c!=='all')items=items.filter(q=>q.ch===+LF.c);
  const chs=[...new Set(m.ever.map(q=>q.ch))].sort((a,b)=>a-b);
  let h=`<div class="bar"><div class="barrow"><button class="back" onclick="home()">← सूची</button><b>मेरी गलतियाँ</b><span></span></div></div>
  <div class="filters"><select onchange="LF.s=this.value;wrongList()"><option value="still" ${LF.s==='still'?'selected':''}>अभी भी गलत (${m.still.length})</option><option value="ever" ${LF.s==='ever'?'selected':''}>कभी भी गलत हुए (${m.ever.length})</option></select>
  <select onchange="LF.c=this.value;wrongList()"><option value="all">सभी अध्याय</option>${chs.map(c=>`<option value="${c}" ${String(c)===LF.c?'selected':''}>${esc(CH[c])}</option>`).join('')}</select></div>
  ${items.length?`<button class="btn pri" style="width:100%;margin-bottom:12px" onclick="start('wrong',LISTQ)">इन ${items.length} प्रश्नों को दोबारा हल करें</button>`:''}`;
  window.LISTQ=items;
  if(!items.length)h+=`<div class="empty">${m.ever.length?'इस चयन में कोई गलत प्रश्न नहीं है।':'अभी तक कोई प्रश्न गलत नहीं हुआ।'}</div>`;
  items.forEach(q=>{const p=PROG[qid(q)];const lw=p.lw!=null?p.lw:p.l;
    h+=`<div class="rvi"><div class="top"><span><span class="tag ${p.r?'g':'r'}">${p.r?'✓ बाद में सही किया':'✗ अभी भी गलत'}</span> <span class="meta">· ${p.w} बार गलत · ${esc(CH[q.ch])}</span></span><button class="bm ${isBM(q)?'on':''}" onclick="toggleBM('${qid(q)}')">${isBM(q)?'★':'☆'}</button></div>
    <div class="q">${esc(q.q)}</div>
    ${lw!=null&&!q.a.includes(lw)?`<div class="y">आपका गलत उत्तर: (${L[lw]}) ${esc(q.o[lw])}</div>`:''}
    <div class="c">सही उत्तर: ${q.a.map(k=>'('+L[k]+') '+esc(q.o[k])).join(' / ')}</div>
    ${q.e?`<details><summary>व्याख्या</summary><div>${esc(q.e)}</div></details>`:''}</div>`});
  $('#app').innerHTML=h;window.scrollTo(0,0);
}
let SF='all';
function savedList(){
  VIEW='saved';S=null;$('#nav').classList.add('hide');
  const all=QS.filter(isBM);let items=SF==='all'?all:all.filter(q=>q.ch===+SF);
  const chs=[...new Set(all.map(q=>q.ch))].sort((a,b)=>a-b);
  let h=`<div class="bar"><div class="barrow"><button class="back" onclick="home()">← सूची</button><b>⭐ सेव किए प्रश्न</b><span></span></div></div>
  <div class="filters"><select onchange="SF=this.value;savedList()"><option value="all">सभी अध्याय (${all.length})</option>${chs.map(c=>`<option value="${c}" ${String(c)===SF?'selected':''}>${esc(CH[c])} (${all.filter(q=>q.ch===c).length})</option>`).join('')}</select></div>
  ${items.length?`<button class="btn pri" style="width:100%;margin-bottom:12px" onclick="start('wrong',SAVQ)">इन ${items.length} प्रश्नों को हल करें</button>`:''}`;
  window.SAVQ=items;
  if(!items.length)h+=`<div class="empty">${all.length?'इस अध्याय में कोई सेव किया प्रश्न नहीं है।':'अभी कोई प्रश्न सेव नहीं किया गया।'}</div>`;
  items.forEach(q=>{const p=PROG[qid(q)];
    h+=`<div class="rvi"><div class="top"><span class="meta">${esc(CH[q.ch])}${p&&p.w>0?` · <span style="color:var(--bad)">${p.w} बार गलत</span>`:''}</span><button class="bm on" onclick="toggleBM('${qid(q)}')">★ हटाएँ</button></div>
    <div class="q">${esc(q.q)}</div>
    <details><summary>उत्तर और व्याख्या देखें</summary><div><span class="c">सही उत्तर: ${q.a.map(k=>'('+L[k]+') '+esc(q.o[k])).join(' / ')}</span>${q.e?'\n\n'+esc(q.e):''}</div></details></div>`});
  $('#app').innerHTML=h;window.scrollTo(0,0);
}
document.addEventListener('keydown',e=>{if(!S||$('#nav').classList.contains('hide'))return;
  const k='abcd1234'.indexOf(e.key.toLowerCase());if(k>=0){pick(k%4);return}
  if(e.key==='ArrowRight')$('#next').click();if(e.key==='ArrowLeft')$('#prev').click()});
home();
</script>
</body>
</html>
