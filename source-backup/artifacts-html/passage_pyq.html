<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>अनुच्छेद आधारित प्रश्न — विगत वर्षों के PCS/IAS प्रश्न (टेस्ट सीरीज़)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1b16;--mut:#6b665c;--line:#e4dfd3;--acc:#b4451f;--acc2:#7a2e14;--ok:#1f7a4a;--okb:#e5f4ec;--bad:#b3261e;--badb:#fbe9e7;--chip:#efe9dc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Mukta,"Noto Sans Devanagari",system-ui,sans-serif;font-size:17px;line-height:1.55}
button{font:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 80px}
header.top{background:var(--acc2);color:#fff;padding:22px 16px 18px}
header.top .wrap{padding:0 2px}
h1{font-size:23px;margin:0 0 4px;font-weight:800;line-height:1.3}
.sub{opacity:.85;font-size:15px}
.stats{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.12);border-radius:10px;padding:6px 12px;font-size:14px}
.stat b{font-size:18px;display:block;line-height:1.2}
h2{font-size:18px;margin:22px 0 10px;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 13px;font-size:15px;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.mix{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mix button{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 6px;font-weight:700;font-size:16px}
.mix button small{display:block;font-weight:400;opacity:.85;font-size:13px}
.ch{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.ch .t{font-weight:700;font-size:16.5px;line-height:1.35}
.ch .m{color:var(--mut);font-size:14px;margin:2px 0 8px}
.parts{display:flex;flex-wrap:wrap;gap:6px}
.part{border:1px solid var(--line);background:var(--chip);border-radius:9px;padding:4px 10px;font-size:14.5px;color:var(--ink)}
.part .sc{font-size:12.5px;color:var(--ok);font-weight:700;margin-left:4px}
/* quiz */
.qbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.qbar .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.back{border:0;background:none;color:var(--acc2);font-weight:700;padding:4px 0}
.score{font-size:14.5px;color:var(--mut)}
.score b.g{color:var(--ok)}.score b.r{color:var(--bad)}
.prog{height:6px;background:var(--line);border-radius:9px;margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.qn{font-size:14px;color:var(--mut);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 10px}
.tag{font-family:system-ui,sans-serif;font-size:11.5px;background:#f3e3dc;color:var(--acc2);border-radius:6px;padding:2px 7px;font-weight:600}
.qt{white-space:pre-wrap;font-weight:600;font-size:17.5px}
.opts{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;color:var(--ink);font-size:16.5px;line-height:1.45}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13.5px;font-weight:700;font-family:system-ui,sans-serif;margin-top:1px}
.opt:not([disabled]):hover{border-color:var(--acc)}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.ok .l{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badb)}.opt.bad .l{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.fb{margin-top:12px;border-radius:12px;padding:10px 14px;font-weight:700;display:none}
.fb.ok{display:block;background:var(--okb);color:var(--ok)}
.fb.bad{display:block;background:var(--badb);color:var(--bad)}
.nav{display:flex;gap:10px;margin-top:14px}
.nav button{flex:1;border-radius:12px;padding:11px;font-weight:700;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.nav button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.nav button:disabled{opacity:.4}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:16px}
.dot{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-family:system-ui,sans-serif;padding:0;color:var(--ink)}
.dot.g{background:var(--ok);color:#fff;border-color:var(--ok)}.dot.r{background:var(--bad);color:#fff;border-color:var(--bad)}.dot.cur{outline:2px solid var(--acc);outline-offset:1px}
/* result */
.res{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:16px;text-align:center}
.big{font-size:44px;font-weight:800;color:var(--acc2);line-height:1.1}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.rgrid div{background:var(--bg);border-radius:10px;padding:8px}
.rgrid b{display:block;font-size:22px}
.rev{text-align:left;margin-top:14px}
.rev .item{border-top:1px solid var(--line);padding:12px 0}
.rev .yo{color:var(--bad);font-size:15px}.rev .co{color:var(--ok);font-size:15px;font-weight:700}
.empty{color:var(--mut);text-align:center;padding:30px}
.note{font-size:13px;color:var(--mut);margin-top:24px;text-align:center}

.mine{background:var(--card);border:1.5px solid var(--acc);border-radius:16px;padding:14px;margin-top:16px}
.mine h3{margin:0 0 4px;font-size:18px}
.mine .nums{display:flex;gap:16px;flex-wrap:wrap;font-size:15px;color:var(--mut);margin-bottom:10px}
.mine .nums b{color:var(--ink);font-size:20px;margin-right:3px}
.mine .nums b.r{color:var(--bad)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{border-radius:11px;padding:9px 14px;font-weight:700;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:15.5px}
.btn.pri{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{border:0;background:none;color:var(--mut);font-weight:500;font-size:14px;padding:9px 4px;text-decoration:underline}
.save{font-size:12.5px;color:var(--mut);margin-top:8px}
.part .wr{font-size:12.5px;color:var(--bad);font-weight:700;margin-left:4px}
.ch .m .wr{color:var(--bad);font-weight:700}
.hist{margin-top:10px;font-size:14.5px;border-radius:9px;padding:6px 10px;font-weight:600}
.hist.bad{background:var(--badb);color:var(--bad)}.hist.ok{background:var(--okb);color:var(--ok)}
.dot.pw{box-shadow:inset 0 -3px 0 var(--bad)}
.seg{display:flex;gap:6px;margin:10px 0}
.confirm{background:var(--badb);border-radius:10px;padding:10px;margin-top:10px;font-size:15px}
.rev h4{margin:18px 0 4px;font-size:16px;color:var(--acc2)}
.cnt{font-size:13px;color:var(--mut)}
.star{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:3px 12px;font-size:14px;font-weight:700;color:var(--mut);margin-top:10px}
.star.on{background:#fff4d6;border-color:#e0a400;color:#8a6200}
.mine.bm{border-color:#e0a400}
.btn.gold{background:#e0a400;border-color:#e0a400;color:#fff}
.part .bmc{font-size:12.5px;color:#a67600;font-weight:700;margin-left:4px}
.dot.bmk::after{content:'★';position:absolute;top:-7px;right:-4px;font-size:10px;color:#e0a400}
.dot{position:relative}
.rmv{border:0;background:none;color:var(--bad);font-size:13.5px;text-decoration:underline;padding:4px 0}
.exp{margin-top:12px;background:#f4f0e6;border-left:4px solid var(--acc);border-radius:10px;padding:10px 13px;font-size:15.5px;line-height:1.6}
.exp b{display:block;color:var(--acc2);margin-bottom:3px;font-size:14.5px}
.rev .exp{font-size:14.5px;margin-top:6px}
</style>
</head>

 (Pre) 2023"],"कथन I सही है – इंदिरा साहनी (1992) व एम. नागराज (2006) जैसे निर्णयों में आरक्षण को अनु. 335 की ‘प्रशासन की दक्षता’ से सीमित माना गया। कथन II गलत है – अनु. 335 इस पद की कोई परिभाषा नहीं देता।"],[2,"सूची-I (भारतीय संविधान का अनुच्छेद) को सूची-II (प्रावधान) के\nसाथ सुमेलित कीजिए और सूचियों के नीचे दिए गए कूट का प्रयोग\nकर सही उत्तर चुनिए–\nसूची-I सूची-II\n(भारतीय संविधान का अनुच्छेद) (प्रावधान)\nA. अनुच्छेद 16(2) 1. किसी भी व्यक्ति को कानून के\nप्राधिकार के सिवाय उसकी संपत्ति\nसे वंचित नहीं किया जाएगा।\nB. अनुच्छेद 29(2) 2. किसी भी व्यक्ति के साथ उसके\nवंश, धर्म अथवा जाति के आधार\nपर सार्वजनिक नियुक्ति के मामले\nमें भेदभाव नहीं किया जा सकता।\nC. अनुच्छेद 30(1) 3. सभी अल्पसंख्यकों को, चाहे वे धर्म\nके आधार पर हों या भाषा के आधार\nपर, अपनी पसंद की शैक्षिक संस्थाएं\nस्थापित करने और उन्हें संचालित\nकरने का मौलिक अधिकार होगा।\nD. अनुच्छेद 31(1) 4. किसी भी नागरिक को धर्म, वंश,\nजाति, भाषा या इनमें से किसी भी\nआधार पर राज्य द्वारा संपोषित\nअथवा राज्य से सहायता प्राप्त करने\nवाली किसी भी शैक्षिक संस्था में\nप्रवेश से वंचित नहीं किया जाएगा।\nकूट:",["A-2, B-4, C-3, D-1","A-3, B-1, C-2, D-4","A-2, B-1, C-3, D-4","A-2, B-4, C-2, D-1"],0,["I.A.S. (Pre) 2002"],"अनु. 16(2) – लोक नियोजन में धर्म, मूलवंश, जाति आदि के आधार पर विभेद नहीं; अनु. 29(2) – राज्य-पोषित/सहायता प्राप्त शिक्षण संस्थाओं में प्रवेश से वंचित नहीं; अनु. 30(1) – अल्पसंख्यकों का शिक्षण संस्थाएं स्थापित करने का अधिकार; अनु. 31(1) – संपत्ति से विधि के प्राधिकार के बिना वंचित न करना (44वें संशोधन से हटाया गया)।"],[2,"संविधान के किस प्रावधान द्वारा अस्पृश्यता का उन्मूलन किया गया\nहै?",["अनुच्छेद 14","अनुच्छेद 21","अनुच्छेद 17","अनुच्छेद 19"],2,["69th B.P.S.C. (Pre) 2023","M.P.P.C.S. (Pre) 1997","U.P.P.C.S. (Mains) 2003"],"अनु. 17 ‘अस्पृश्यता’ का अंत करता है और उसका किसी भी रूप में आचरण निषिद्ध करता है। इसके लिए अस्पृश्यता (अपराध) अधिनियम, 1955 बना, जिसका नाम 1976 में नागरिक अधिकार संरक्षण अधिनियम किया गया।"],[2,"भारतीय संविधान का कौन-सा अनुच्छेद अस्पृश्यता का उन्मूलन करता\nहै और किसी भी रूप में इसके आचरण का <script>
const D=JSON.parse(document.getElementById('data').textContent);
const CFG={"prefix": "art_pyq_", "h1": "संविधान के अनुच्छेदों पर आधारित विगत वर्षों के प्रश्न", "sub": "संविधान के भागों के क्रम में · विकल्प चुनते ही सही/गलत दिखेगा", "grp": "समूह", "listh": "अनुच्छेद-समूहवार टेस्ट", "cat": "const k=t.replace(/\\s/g,'');if(/^U\\.?P/.test(k)&&!/^Uttar/.test(k))return'up';if(/I\\.A\\.S/.test(k))return'ias';return'other'", "filters": [["all", "सभी परीक्षाएं"], ["up", "केवल UPPSC"], ["ias", "UPSC (IAS)"], ["other", "अन्य राज्य PCS (BPSC, MPPSC, RAS आदि)"]], "note": "प्रश्न व उत्तर-कुंजी अपलोड की गई पुस्तक से वे प्रश्न हैं जिनके प्रश्न या विकल्पों में संविधान के अनुच्छेद आए हैं। समूह सही उत्तर वाले अनुच्छेद के आधार पर बनाए गए हैं।"};
const CH=D.chapters, L='abcd';
function hsh(s){let h=5381;for(let i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return h.toString(36)}
const Q=D.qs.map((r,i)=>({ch:r[0],q:r[1],o:r[2],a:r[3],t:r[4],ex:r[5]||'',id:hsh(r[1]+'|'+r[2].join('|'))}));
function expBox(q){const e=el('div','exp');e.appendChild(el('b',null,'📖 व्याख्या'));e.appendChild(document.createTextNode(q.ex));return e}
const cat=new Function('t',CFG.cat);
Q.forEach(q=>q.cats=new Set(q.t.map(cat)));
const BYID={};Q.forEach(q=>BYID[q.id]=q);
const store={get(k,d){try{const v=localStorage.getItem(CFG.prefix+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(CFG.prefix+k,JSON.stringify(v))}catch(e){}}};
let filter=store.get('filter','all');
// progress: id -> [lastGiven, lastOk(0/1), timesWrong, attempts, time]
let PR=store.get('progress',{});
// bookmarks: id -> [on(1/0), time]
let BM=store.get('bookmarks',{});
function mergeBM(o){if(!o)return false;let ch=false;for(const k in o){const v=o[k];if(!Array.isArray(v))continue;if(!BM[k]||(v[1]||0)>(BM[k][1]||0)){BM[k]=v;ch=true}}return ch}
function isBM(q){const b=BM[q.id];return !!(b&&b[0])}
function toggleBM(q){BM[q.id]=[isBM(q)?0:1,Date.now()];store.set('bookmarks',BM);schedule()}
let saveMode='local', dbRef=null, writing=false, dirty=false;
function merge(other){if(!other)return false;let ch=false;for(const k in other){const o=other[k];if(!Array.isArray(o))continue;if(!PR[k]||(o[4]||0)>(PR[k][4]||0)){PR[k]=o;ch=true}}return ch}
async function flush(){if(!dbRef||writing||!dirty)return;writing=true;dirty=false;try{await dbRef.set({p:PR,b:BM,v:1})}catch(e){if(e&&e.code==='invalid_argument'){dbRef=null;saveMode='local';refreshSave()}else dirty=true}writing=false;if(dirty)setTimeout(flush,1500)}
let ft=null;function schedule(){dirty=true;clearTimeout(ft);ft=setTimeout(flush,1200)}
function record(q,g){const p=PR[q.id]||[null,0,0,0,0];const ok=g===q.a?1:0;PR[q.id]=[g,ok,p[2]+(ok?0:1),p[3]+1,Date.now()];store.set('progress',PR);schedule()}
function isWrong(q){const p=PR[q.id];return p&&p[1]===0}
function everWrong(q){const p=PR[q.id];return p&&p[2]>0}
function done(q){return !!PR[q.id]}
(async()=>{try{if(!window.claude||!claude.use)return;const db=await claude.use('db');const user=await claude.use('user');if(!db||!user)return;const id=await user.id();if(!id)return;
  const ref=db.doc('data/users/'+id+'/progress');const snap=await ref.get();const rd=snap.exists?(snap.data()||{}):{};const remote=rd.p||null;const rbm=rd.b||null;
  dbRef=ref;saveMode='account';const changed=merge(remote)|mergeBM(rbm);store.set('progress',PR);store.set('bookmarks',BM);
  let need=!remote;if(remote){for(const k in PR){if(!remote[k]||(remote[k][4]||0)<(PR[k][4]||0)){need=true;break}}}
  for(const k in BM){if(!rbm||!rbm[k]||(rbm[k][1]||0)<(BM[k][1]||0)){need=true;break}}
  if(need){dirty=true;flush()}
  if(changed&&view==='home')home();else refreshSave();
}catch(e){}})();
function saveText(){return saveMode==='account'?'✓ आपकी प्रगति और सेव किए प्रश्न आपके Claude खाते में रहते हैं — किसी भी डिवाइस पर खोलें, गलतियाँ दिखेंगी।':'✓ आपकी प्रगति और सेव किए प्रश्न इसी फ़ोन/ब्राउज़र में रहते हैं — दोबारा खोलने पर गलतियाँ दिखेंगी (ब्राउज़र डेटा मिटाने पर हट जाएगी)।'}
function refreshSave(){const e=document.getElementById('savenote');if(e)e.textContent=saveText()}
const FILTERS=CFG.filters;
let view='home';
const app=document.getElementById('app');
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
const PART=25;
function pool(){return Q.filter(q=>filter==='all'||q.cats.has(filter))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function home(){
  view='home';window.scrollTo(0,0);app.innerHTML='';
  const P=pool();
  const h=el('header','top');const w=el('div','wrap');h.appendChild(w);
  w.appendChild(el('h1',null,CFG.h1));
  w.appendChild(el('div','sub',CFG.sub));
  const st=el('div','stats');
  [[P.length,'प्रश्न'],[CH.length,CFG.grp],[Math.ceil(P.length/PART),'टेस्ट सेट (लगभग)']].forEach(([n,l])=>{const s=el('div','stat');s.appendChild(el('b',null,n));s.appendChild(document.createTextNode(l));st.appendChild(s)});
  w.appendChild(st);app.appendChild(h);
  const m=el('div','wrap');app.appendChild(m);
  // my mistakes
  const wrongNow=P.filter(isWrong), ever=P.filter(everWrong), att=P.filter(done);
  const mine=el('div','mine');mine.appendChild(el('h3',null,'📌 मेरी गलतियाँ'));
  const nums=el('div','nums');
  [[att.length,'हल किए',''],[wrongNow.length,'अभी गलत','r'],[ever.length,'कभी गलत हुए','']].forEach(([n,l,c])=>{const s=el('span');s.appendChild(el('b',c,n));s.append(l);nums.appendChild(s)});
  mine.appendChild(nums);
  const br=el('div','btnrow');
  if(wrongNow.length){const b1=el('button','btn pri','गलत प्रश्नों का टेस्ट ('+wrongNow.length+')');b1.onclick=()=>start(wrongNow,'मेरी गलतियाँ · दोबारा अभ्यास',null);br.appendChild(b1)}
  if(ever.length){const b2=el('button','btn','गलत प्रश्नों की सूची');b2.onclick=()=>wrongList('now');br.appendChild(b2)}
  if(!att.length)mine.appendChild(el('div','cnt','अभी तक कोई प्रश्न हल नहीं किया। कोई भी टेस्ट दें — जो गलत होंगे, वे यहाँ जमा होते जाएंगे।'));
  mine.appendChild(br);
  const sn=el('div','save',saveText());sn.id='savenote';mine.appendChild(sn);
  if(att.length){const rs=el('button','btn ghost','सारी प्रगति मिटाएँ');rs.onclick=()=>{if(mine.querySelector('.confirm'))return;const c=el('div','confirm','क्या आप सारी प्रगति और गलतियों का रिकॉर्ड मिटाना चाहते हैं? यह वापस नहीं आएगा। ');const y=el('button','btn pri','हाँ, मिटाएँ');y.onclick=()=>{PR={};store.set('progress',PR);store.set('best',{});schedule();home()};const n=el('button','btn','नहीं');n.onclick=()=>c.remove();c.appendChild(el('br'));c.appendChild(y);c.append(' ');c.appendChild(n);mine.appendChild(c)};mine.appendChild(rs)}
  m.appendChild(mine);
  const bms=P.filter(isBM);
  const bx=el('div','mine bm');bx.appendChild(el('h3',null,'⭐ मेरे सेव किए प्रश्न'));
  if(!bms.length)bx.appendChild(el('div','cnt','अभी कोई प्रश्न सेव नहीं है। टेस्ट देते समय किसी भी प्रश्न पर "☆ दोहराने के लिए सेव करें" दबाएँ — वह यहाँ आ जाएगा।'));
  else{const nb=el('div','nums');const s=el('span');s.appendChild(el('b',null,bms.length));s.append('सेव किए प्रश्न');nb.appendChild(s);bx.appendChild(nb);
    const r2=el('div','btnrow');const t1=el('button','btn gold','सेव किए प्रश्नों का टेस्ट ('+bms.length+')');t1.onclick=()=>start(bms,'सेव किए प्रश्न · दोहराव',null);r2.appendChild(t1);
    const t2=el('button','btn','रैंडम क्रम में');t2.onclick=()=>start(shuffle(bms),'सेव किए प्रश्न · रैंडम',null);r2.appendChild(t2);
    const t3=el('button','btn','सूची देखें');t3.onclick=bmList;r2.appendChild(t3);bx.appendChild(r2)}
  m.appendChild(bx);
  m.appendChild(el('h2',null,'परीक्षा चुनें'));
  const cf=el('div','chips');FILTERS.forEach(([k,l])=>{const c=el('button','chip'+(filter===k?' on':''),l);c.onclick=()=>{filter=k;store.set('filter',k);home()};cf.appendChild(c)});m.appendChild(cf);
  m.appendChild(el('h2',null,'मिश्रित टेस्ट (रैंडम)'));
  const mx=el('div','mix');[25,50,100].forEach(n=>{const b=el('button',null,n+' प्रश्न');b.appendChild(el('small',null,n+' मिनट सुझाव'));b.onclick=()=>start(shuffle(P).slice(0,n),'मिश्रित टेस्ट · '+n+' प्रश्न',null);mx.appendChild(b)});m.appendChild(mx);
  m.appendChild(el('h2',null,CFG.listh));
  const best=store.get('best',{});
  CH.forEach((name,ci)=>{
    const qs=P.filter(q=>q.ch===ci);if(!qs.length)return;
    const c=el('div','ch');c.appendChild(el('div','t',(ci+1)+'. '+name));
    const mm=el('div','m',qs.length+' प्रश्न · हल किए '+qs.filter(done).length);
    const wn=qs.filter(isWrong).length;if(wn){mm.append(' · ');mm.appendChild(el('span','wr','गलत '+wn))}
    c.appendChild(mm);
    const ps=el('div','parts');const n=Math.ceil(qs.length/PART);
    for(let p=0;p<n;p++){const sub=qs.slice(p*PART,(p+1)*PART);const key=filter+':'+ci+':'+p;
      const b=el('button','part',n>1?('सेट '+(p+1)+' ('+sub.length+')'):('टेस्ट शुरू करें ('+sub.length+')'));
      if(best[key]!=null)b.appendChild(el('span','sc',best[key]+'/'+sub.length));
      const sw=sub.filter(isWrong).length;if(sw)b.appendChild(el('span','wr','✗'+sw));const sbm=sub.filter(isBM).length;if(sbm)b.appendChild(el('span','bmc','★'+sbm));
      b.onclick=()=>start(sub,name+(n>1?' · सेट '+(p+1):''),key);ps.appendChild(b)}
    c.appendChild(ps);m.appendChild(c);
  });
  if(!P.length)m.appendChild(el('div','empty','इस फ़िल्टर में कोई प्रश्न नहीं।'));
  m.appendChild(el('div','note',CFG.note));
}

function wrongList(mode){
  view='list';window.scrollTo(0,0);app.innerHTML='';
  const w=el('div','wrap');app.appendChild(w);
  const bar=el('div','qbar');const row=el('div','row');const bk=el('button','back','← वापस');bk.onclick=home;row.appendChild(bk);bar.appendChild(row);w.appendChild(bar);
  w.appendChild(el('h2',null,'मेरी गलतियाँ'));
  const seg=el('div','seg');[['now','अभी गलत'],['ever','कभी भी गलत हुए']].forEach(([k,l])=>{const b=el('button','chip'+(mode===k?' on':''),l);b.onclick=()=>wrongList(k);seg.appendChild(b)});w.appendChild(seg);
  const list=pool().filter(mode==='now'?isWrong:everWrong);
  if(!list.length){w.appendChild(el('div','empty',mode==='now'?'अभी कोई प्रश्न गलत नहीं है। 👏':'कोई गलती दर्ज नहीं है।'));return}
  const sb=el('button','btn pri','इन '+list.length+' प्रश्नों का टेस्ट दें');sb.onclick=()=>start(list,mode==='now'?'मेरी गलतियाँ · दोबारा अभ्यास':'कभी गलत हुए प्रश्न',null);w.appendChild(sb);
  const rv=el('div','rev');let lastCh=-1;
  list.forEach(q=>{const p=PR[q.id];
    if(q.ch!==lastCh){rv.appendChild(el('h4',null,CH[q.ch]));lastCh=q.ch}
    const it=el('div','item');it.appendChild(el('div','qt',q.q));
    if(p[1]===0)it.appendChild(el('div','yo','आपका पिछला उत्तर: ('+L[p[0]]+') '+q.o[p[0]]));
    else it.appendChild(el('div','co','पिछली बार सही किया ✓'));
    it.appendChild(el('div','co','सही उत्तर: ('+L[q.a]+') '+q.o[q.a]));
    if(q.ex)it.appendChild(expBox(q));
    it.appendChild(el('div','cnt',p[2]+' बार गलत · '+p[3]+' प्रयास · '+q.t.join(', ')));
    rv.appendChild(it)});
  w.appendChild(rv);
}

function bmList(){
  view='list';window.scrollTo(0,0);app.innerHTML='';
  const w=el('div','wrap');app.appendChild(w);
  const bar=el('div','qbar');const row=el('div','row');const bk=el('button','back','← वापस');bk.onclick=home;row.appendChild(bk);bar.appendChild(row);w.appendChild(bar);
  w.appendChild(el('h2',null,'⭐ मेरे सेव किए प्रश्न'));
  const list=pool().filter(isBM);
  if(!list.length){w.appendChild(el('div','empty','कोई प्रश्न सेव नहीं है।'));return}
  const sb=el('button','btn gold','इन '+list.length+' प्रश्नों का टेस्ट दें');sb.onclick=()=>start(list,'सेव किए प्रश्न · दोहराव',null);w.appendChild(sb);
  const rv=el('div','rev');let lastCh=-1;
  list.forEach(q=>{if(q.ch!==lastCh){rv.appendChild(el('h4',null,CH[q.ch]));lastCh=q.ch}
    const it=el('div','item');it.appendChild(el('div','qt',q.q));
    q.o.forEach((o,k)=>it.appendChild(el('div',k===q.a?'co':'cnt','('+L[k]+') '+o+(k===q.a?'  ✓':''))));
    if(q.ex)it.appendChild(expBox(q));
    const p=PR[q.id];it.appendChild(el('div','cnt',q.t.join(', ')+(p?(' · पिछली बार: '+(p[1]?'सही':'गलत')):'')));
    const rm=el('button','rmv','सेव से हटाएँ');rm.onclick=()=>{toggleBM(q);it.remove();const n=pool().filter(isBM).length;if(!n)bmList();else sb.textContent='इन '+n+' प्रश्नों का टेस्ट दें'};it.appendChild(rm);
    rv.appendChild(it)});
  w.appendChild(rv);
}

let S=null;
function start(list,title,key){const prev={};list.forEach(q=>{if(PR[q.id])prev[q.id]=PR[q.id].slice()});S={list,title,key,prev,ans:new Array(list.length).fill(null),i:0};quiz()}
function quiz(){
  view='quiz';window.scrollTo(0,0);app.innerHTML='';
  const w=el('div','wrap');app.appendChild(w);
  const bar=el('div','qbar');const row=el('div','row');
  const bk=el('button','back','← वापस');bk.onclick=home;row.appendChild(bk);
  const sc=el('div','score');row.appendChild(sc);bar.appendChild(row);
  const pr=el('div','prog');const pi=el('i');pr.appendChild(pi);bar.appendChild(pr);w.appendChild(bar);
  const card=el('div','qcard');w.appendChild(card);
  const nav=el('div','nav');w.appendChild(nav);
  const dots=el('div','dots');w.appendChild(dots);
  function upd(){
    const c=S.ans.filter((a,i)=>a!=null&&a===S.list[i].a).length,wr=S.ans.filter((a,i)=>a!=null&&a!==S.list[i].a).length;
    sc.innerHTML='';sc.append('सही ');sc.appendChild(el('b','g',c));sc.append(' · गलत ');sc.appendChild(el('b','r',wr));sc.append(' · '+(S.i+1)+'/'+S.list.length);
    pi.style.width=(S.ans.filter(a=>a!=null).length/S.list.length*100)+'%';
    dots.innerHTML='';S.list.forEach((q,i)=>{const pv=S.prev[q.id];const d=el('button','dot'+(S.ans[i]==null?'':S.ans[i]===q.a?' g':' r')+(i===S.i?' cur':'')+(S.ans[i]==null&&pv&&pv[1]===0?' pw':'')+(isBM(q)?' bmk':''),i+1);d.onclick=()=>{S.i=i;render()};dots.appendChild(d)});
  }
  function render(){
    const q=S.list[S.i],given=S.ans[S.i];card.innerHTML='';
    const qn=el('div','qn');qn.appendChild(el('span',null,'प्रश्न '+(S.i+1)+' / '+S.list.length));qn.appendChild(el('span',null,CH[q.ch]));card.appendChild(qn);
    const tg=el('div','tags');q.t.forEach(t=>tg.appendChild(el('span','tag',t)));card.appendChild(tg);
    card.appendChild(el('div','qt',q.q));
    const stb=el('button','star'+(isBM(q)?' on':''),isBM(q)?'★ सेव है (हटाने के लिए दबाएँ)':'☆ दोहराने के लिए सेव करें');stb.onclick=()=>{toggleBM(q);render()};
    const pv=S.prev[q.id];
    if(pv){card.appendChild(pv[1]===0?el('div','hist bad','⚠ पिछली बार यह प्रश्न गलत हुआ था'+(pv[2]>1?' ('+pv[2]+' बार)':'')+(given!=null?' — तब आपने ('+L[pv[0]]+') चुना था':'')):el('div','hist ok','पिछली बार आपने यह सही किया था'+(pv[2]>0?' (पहले '+pv[2]+' बार गलत)':'')))}
    const os=el('div','opts');const fb=el('div','fb');
    q.o.forEach((o,k)=>{const b=el('button','opt');b.appendChild(el('span','l',L[k]));b.appendChild(el('span',null,o));
      if(given!=null){b.disabled=true;if(k===q.a)b.classList.add('ok');else if(k===given)b.classList.add('bad')}
      b.onclick=()=>{if(S.ans[S.i]!=null)return;S.ans[S.i]=k;record(q,k);render()};os.appendChild(b)});
    card.appendChild(os);
    if(given!=null){if(given===q.a){fb.className='fb ok';fb.textContent='✓ सही उत्तर!'}else{fb.className='fb bad';fb.textContent='✗ गलत उत्तर — सही विकल्प ('+L[q.a]+') '+q.o[q.a]}}
    card.appendChild(fb);
    if(given!=null&&q.ex)card.appendChild(expBox(q));
    card.appendChild(stb);
    nav.innerHTML='';
    const pvb=el('button',null,'← पिछला');pvb.disabled=S.i===0;pvb.onclick=()=>{S.i--;render()};nav.appendChild(pvb);
    const last=S.i===S.list.length-1;
    const nx=el('button','pri',last?'परिणाम देखें':(given==null?'छोड़ें →':'अगला →'));nx.onclick=()=>{if(last)result();else{S.i++;render()}};nav.appendChild(nx);
    upd();
  }
  render();
}
function result(){
  view='result';window.scrollTo(0,0);app.innerHTML='';
  const n=S.list.length,c=S.ans.filter((a,i)=>a===S.list[i].a).length,wr=S.ans.filter((a,i)=>a!=null&&a!==S.list[i].a).length,sk=n-c-wr;
  if(S.key){const b=store.get('best',{});if(b[S.key]==null||c>b[S.key]){b[S.key]=c;store.set('best',b)}}
  const w=el('div','wrap');app.appendChild(w);
  const r=el('div','res');w.appendChild(r);
  r.appendChild(el('div','sub',S.title));
  r.appendChild(el('div','big',c+' / '+n));
  r.appendChild(el('div',null,'सटीकता: '+(c+wr?Math.round(c/(c+wr)*100):0)+'%'));
  const fixed=S.list.filter((q,i)=>S.prev[q.id]&&S.prev[q.id][1]===0&&S.ans[i]===q.a).length;
  if(fixed)r.appendChild(el('div','cnt','👏 पिछली बार गलत हुए '+fixed+' प्रश्न इस बार सही किए'));
  const g=el('div','rgrid');[[c,'सही','var(--ok)'],[wr,'गलत','var(--bad)'],[sk,'छोड़े','var(--mut)']].forEach(([v,l,col])=>{const d=el('div');const b=el('b',null,v);b.style.color=col;d.appendChild(b);d.append(l);g.appendChild(d)});r.appendChild(g);
  r.appendChild(el('div','cnt','गलत उत्तर "मेरी गलतियाँ" में सेव हो गए हैं।'));
  const nav=el('div','nav');
  const again=el('button',null,'दोबारा दें');again.onclick=()=>start(S.list,S.title,S.key);nav.appendChild(again);
  const wrongs=S.list.filter((q,i)=>S.ans[i]!==q.a);
  if(wrongs.length){const wb=el('button',null,'गलत/छोड़े दोबारा');wb.onclick=()=>start(wrongs,S.title+' · गलत/छोड़े',null);nav.appendChild(wb)}
  const hm=el('button','pri','होम');hm.onclick=home;nav.appendChild(hm);r.appendChild(nav);
  if(wrongs.length){const rv=el('div','rev');rv.appendChild(el('h2',null,'गलत / छोड़े गए प्रश्नों का उत्तर'));
    S.list.forEach((q,i)=>{if(S.ans[i]===q.a)return;const it=el('div','item');it.appendChild(el('div','qt',(i+1)+'. '+q.q));
      it.appendChild(el('div','yo',S.ans[i]==null?'आपने छोड़ा':'आपका उत्तर: ('+L[S.ans[i]]+') '+q.o[S.ans[i]]));
      it.appendChild(el('div','co','सही उत्तर: ('+L[q.a]+') '+q.o[q.a]));if(q.ex)it.appendChild(expBox(q));const sb=el('button','star'+(isBM(q)?' on':''),isBM(q)?'★ सेव है':'☆ दोहराने के लिए सेव करें');sb.onclick=()=>{toggleBM(q);sb.className='star'+(isBM(q)?' on':'');sb.textContent=isBM(q)?'★ सेव है':'☆ दोहराने के लिए सेव करें'};it.appendChild(sb);rv.appendChild(it)});
    r.appendChild(rv)}
}
home();
</script>
