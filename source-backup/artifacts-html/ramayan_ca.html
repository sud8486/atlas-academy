<style>
/* Layout: exam-hall answer sheet — one column, admit-card band on top, OMR bubbles for options */
:root{
  --bg:#EEF1F5; --sheet:#FFFFFF; --ink:#16202E; --muted:#5B6576; --line:#D5DAE3;
  --accent:#2C3E9C; --accent-soft:#E3E7F7; --ok:#18794E; --ok-soft:#DFF3E8; --bad:#B42318; --bad-soft:#FBE4E1;
  --saffron:#C2620A;
  --f-display:"Tiro Devanagari Hindi","Noto Serif Devanagari",serif;
  --f-body:"Mukta","Noto Sans Devanagari",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F141C; --sheet:#171E29; --ink:#E6EAF2; --muted:#9AA4B5; --line:#2A3443;
  --accent:#8EA0F5; --accent-soft:#232D4D; --ok:#4CC38A; --ok-soft:#173226; --bad:#F27466; --bad-soft:#3A1D1A; --saffron:#F0A050; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141C; --sheet:#171E29; --ink:#E6EAF2; --muted:#9AA4B5; --line:#2A3443;
  --accent:#8EA0F5; --accent-soft:#232D4D; --ok:#4CC38A; --ok-soft:#173226; --bad:#F27466; --bad-soft:#3A1D1A; --saffron:#F0A050; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;margin:0}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.band{background:var(--accent);color:#fff;border-radius:14px;padding:22px 22px 18px;display:grid;gap:10px}
:root[data-theme="dark"] .band{color:#0F141C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .band{color:#0F141C}}
.band .eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.band h1{font-size:clamp(26px,5vw,38px);line-height:1.2}
.band p{margin:0;opacity:.9;font-size:15.5px}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:6px;font-size:14.5px}
.stats b{font-family:var(--f-mono);font-size:20px;display:block;line-height:1.1}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1.5px solid var(--line);background:var(--sheet);border-radius:10px;padding:9px 16px;font-weight:600;font-size:15.5px}
.btn.primary{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.btn.accent{background:var(--accent);color:var(--sheet);border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.section-h{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 10px;gap:12px;flex-wrap:wrap}
.section-h h2{font-size:23px}
.section-h span{color:var(--muted);font-size:14.5px}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:16px}
.qcard{background:var(--sheet);border:1.5px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:8px;text-align:left}
.qcard h3{font-size:19px}
.qcard p{margin:0;color:var(--muted);font-size:14.5px}
.tests{display:grid;gap:8px}
.trow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--sheet);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%}
.trow:hover{border-color:var(--accent)}
.tno{font-family:var(--f-mono);font-size:15px;color:var(--accent);border:1.5px solid var(--accent);border-radius:8px;height:36px;display:grid;place-items:center}
.ttl{min-width:0}
.ttl b{font-weight:600;display:block;line-height:1.35}
.ttl small{color:var(--muted);font-size:13.5px}
.tmeta{text-align:right;font-size:13.5px;color:var(--muted);white-space:nowrap}
.pill{display:inline-block;font-family:var(--f-mono);font-size:13px;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.settings{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:15px;color:var(--muted)}
.settings label{display:flex;gap:6px;align-items:center;cursor:pointer}
.settings input{accent-color:var(--accent);width:18px;height:18px}
/* test view */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1.5px solid var(--line);display:grid;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tb1{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tb1 #back{white-space:nowrap;flex:none}
.tb1 .name{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score{display:flex;gap:10px;font-family:var(--f-mono);font-size:14.5px;white-space:nowrap}
.score .ok{color:var(--ok)}.score .bad{color:var(--bad)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.sheet{background:var(--sheet);border:1.5px solid var(--line);border-radius:14px;padding:20px;margin-top:16px}
.qhead{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:14px;margin-bottom:8px}
.qtext{font-size:19px;line-height:1.65;white-space:pre-line;margin-bottom:16px}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--sheet);border-radius:12px;padding:11px 14px;font-size:17px;line-height:1.5}
.opt:hover:not([disabled]){border-color:var(--accent)}
.bub{width:32px;height:32px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .bub{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.opt[disabled]{cursor:default}
.verdict{margin-top:14px;border-radius:12px;padding:12px 14px;font-size:16px;display:grid;gap:4px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict b{font-size:17px}
.verdict span{color:var(--ink)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:18px}
.pal{height:36px;border-radius:8px;border:1.5px solid var(--line);background:var(--sheet);font-family:var(--f-mono);font-size:13px}
.pal.cur{border-color:var(--accent);border-width:2.5px}
.pal.ok{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.pal.bad{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
details.pd{margin-top:16px}
details.pd summary{cursor:pointer;color:var(--muted);font-size:15px}
/* result */
.result{display:grid;gap:14px}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--sheet);border:1.5px solid var(--line);border-radius:12px;padding:14px}
.tile small{color:var(--muted);font-size:13.5px;display:block}
.tile b{font-family:var(--f-mono);font-size:26px}
.wlist{display:grid;gap:10px}
.witem{background:var(--sheet);border:1.5px solid var(--line);border-left:4px solid var(--bad);border-radius:10px;padding:12px 14px;font-size:15.5px}
.witem .wq{white-space:pre-line;font-weight:500}
.witem .wa{color:var(--ok);margin-top:4px}
.witem .wy{color:var(--bad)}
.witem .we{color:var(--muted);font-size:14.5px;margin-top:2px}
.savebtn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--sheet);border-radius:99px;padding:3px 12px;font-size:14px;font-weight:600;color:var(--muted)}
.savebtn.on{border-color:var(--saffron);color:var(--saffron);background:var(--accent-soft)}
.savebtn svg{width:15px;height:15px}
.pal.sv{box-shadow:inset 0 -4px 0 var(--saffron)}
.foot{color:var(--muted);font-size:13.5px;margin-top:28px}
@media (max-width:520px){.trow{grid-template-columns:38px 1fr}.tmeta{grid-column:2;text-align:left}.qtext{font-size:17.5px}.sheet{padding:16px}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

  let h=`<header class="band"><div class="eyebrow">रामायण करेंट अफेयर्स 2026 · 199 पेज</div>
  <h1>टेस्ट सीरीज़</h1><p>हर अध्याय का अलग टेस्ट। विकल्प चुनते ही सही उत्तर और व्याख्या दिखेगी। ☆ “सहेजें” दबाकर प्रश्न बाद के लिए रखें।</p>
  <div class="stats"><div><b>${TOTAL}</b>कुल प्रश्न</div><div><b>${BANK.length}</b>टेस्ट</div><div><b>${done}</b>टेस्ट दिए</div><div><b>${wrongN}</b>दोहराने हेतु</div><div><b>${savedN}</b>सहेजे गए</div></div></header>
  <div class="quick">
   <button class="qcard" data-act="mock"><h3>मिश्रित मॉक टेस्ट</h3><p>सभी अध्यायों से 100 यादृच्छिक प्रश्न — परीक्षा जैसा अभ्यास।</p></button>
   <button class="qcard" data-act="saved" ${savedN?'':'disabled style="opacity:.55"'}><h3>सहेजे गए प्रश्न</h3><p>${savedN?savedN+' प्रश्न जो आपने ☆ दबाकर सहेजे — केवल इन्हें हल करें':'अभी कोई नहीं — टेस्ट में किसी प्रश्न पर “सहेजें” दबाएँ'}</p></button>
   <button class="qcard" data-act="wrong" ${wrongN?'':'disabled style="opacity:.55"'}><h3>गलत प्रश्न दोहराएँ</h3><p>${wrongN?wrongN+' प्रश्न जो पिछली बार गलत हुए':'अभी कोई नहीं — टेस्ट देने पर यहाँ जुड़ेंगे'}</p></button>
  </div>
  <div class="settings">
   <label><input type="checkbox" id="optShuf" ${store.opt.shuffleQ?'checked':''}> प्रश्नों का क्रम मिलाएँ</label>
   <label><input type="checkbox" id="optNeg" ${store.opt.neg?'checked':''}> परिणाम में ⅓ नकारात्मक अंकन</label>
  </div>
  <div class="section-h"><h2>अध्याय-वार टेस्ट</h2><span>PDF के क्रम में</span></div><div class="tests">`;
  BANK.forEach((t,ix)=>{const b=store.best[t.id];
    const badge=b?`<span class="pill ${b.p>=60?'ok':'bad'}">${b.c}/${b.n}</span>`:'';
    h+=`<button class="trow" data-t="${ix}"><span class="tno">${t.n?String(t.n).padStart(2,'0'):'★'}</span>
    <span class="ttl"><b>${esc(t.t)}</b><small>पृष्ठ ${t.p} · ${t.qs.length} प्रश्न</small></span><span class="tmeta">${badge||'शुरू करें →'}</span></button>`});
  h+=`</div><p class="foot">प्रगति इसी ब्राउज़र में सहेजी जाती है। ${done?'<button class="btn" data-act="reset" style="margin-left:8px;padding:4px 10px;font-size:13.5px">प्रगति मिटाएँ</button>':''}</p>`;
  app.innerHTML=h;
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>startTest(+b.dataset.t));
  app.querySelector('[data-act=mock]').onclick=startMock;
  const w=app.querySelector('[data-act=wrong]'); if(wrongN) w.onclick=startWrong;
  const sv=app.querySelector('[data-act=saved]'); if(savedN) sv.onclick=startSaved;
  const r=app.querySelector('[data-act=reset]'); if(r) r.onclick=()=>{ if(r.dataset.sure){store={best:{},wrong:{},saved:store.saved,opt:store.opt};save(store);home()} else {r.dataset.sure=1;r.textContent='पक्का? फिर दबाएँ'} };
  document.getElementById('optShuf').onchange=e=>{store.opt.shuffleQ=e.target.checked;save(store)};
  document.getElementById('optNeg').onchange=e=>{store.opt.neg=e.target.checked;save(store)};
}
function begin(name,id,list){
  let qs=prep(list); if(store.opt.shuffleQ||id==='mock'||id==='wrong'||id==='saved') qs=shuf(qs);
  S={name,id,qs,ans:new Array(qs.length).fill(null),cur:0,t0:Date.now()};
  render();
}
function startTest(ix){const t=BANK[ix];begin(t.t,t.id,t.qs.map((q,i)=>({tid:t.id,i,q,ch:t.n})))}
function startMock(){const all=[];BANK.forEach(t=>t.qs.forEach((q,i)=>all.push({tid:t.id,i,q,ch:t.n})));begin('मिश्रित मॉक टेस्ट','mock',shuf(all).slice(0,100))}
function startWrong(){const all=[];BANK.forEach(t=>t.qs.forEach((q,i)=>{if(store.wrong[t.id+':'+i])all.push({tid:t.id,i,q,ch:t.n})}));begin('गलत प्रश्न दोहराएँ','wrong',all)}
function startSaved(){const all=[];BANK.forEach(t=>t.qs.forEach((q,i)=>{if(store.saved[t.id+':'+i])all.push({tid:t.id,i,q,ch:t.n})}));begin('सहेजे गए प्रश्न','saved',all)}
function counts(){let c=0,w=0;S.ans.forEach((a,i)=>{if(a===null)return;a===S.qs[i].a?c++:w++});return{c,w}}
function render(){
  const q=S.qs[S.cur],a=S.ans[S.cur],{c,w}=counts(),n=S.qs.length,att=c+w;
  let h=`<div class="topbar"><div class="tb1"><button class="btn" id="back" style="padding:5px 12px">← सूची</button><span class="name">${esc(S.name)}</span>
  <span class="score"><span class="ok">✓ ${c}</span><span class="bad">✗ ${w}</span><span>${att}/${n}</span></span></div><div class="bar"><i style="width:${att/n*100}%"></i></div></div>
  <article class="sheet"><div class="qhead"><span class="num">प्रश्न ${S.cur+1} / ${n} · ${q.ch?'अध्याय '+q.ch:'PDF अभ्यास'}</span><button class="savebtn ${store.saved[q.tid+':'+q.i]?'on':''}" id="save" aria-pressed="${!!store.saved[q.tid+':'+q.i]}"><svg viewBox="0 0 24 24" fill="${store.saved[q.tid+':'+q.i]?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></svg>${store.saved[q.tid+':'+q.i]?'सहेजा गया':'सहेजें'}</button></div>
  <div class="qtext">${esc(q.q)}</div><div class="opts">`;
  q.o.forEach((o,k)=>{let cls='';if(a!==null){if(k===q.a)cls='right';else if(k===a)cls='wrong'}
    h+=`<button class="opt ${cls}" data-k="${k}" ${a!==null?'disabled':''}><span class="bub">${a!==null&&k===q.a?'✓':a!==null&&k===a?'✗':L[k]}</span><span>${esc(o)}</span></button>`});
  h+=`</div>`;
  if(a!==null){const ok=a===q.a;h+=`<div class="verdict ${ok?'ok':'bad'}"><b>${ok?'सही उत्तर!':'गलत — सही उत्तर: ('+L[q.a]+') '+esc(q.o[q.a])}</b>${q.e?`<span>${esc(q.e)}</span>`:''}</div>`}
  h+=`<div class="nav"><button class="btn" id="prev" ${S.cur?'':'disabled'}>← पिछला</button>
  ${S.cur<n-1?`<button class="btn ${a!==null?'primary':''}" id="next">${a!==null?'अगला →':'छोड़ें →'}</button>`:''}
  <button class="btn accent" id="fin">टेस्ट समाप्त करें</button></div>
  <details class="pd" ${n<=60?'open':''}><summary>प्रश्न सूची (हरा = सही, लाल = गलत, नारंगी रेखा = सहेजा गया)</summary><div class="palette">`;
  S.qs.forEach((x,i)=>{const v=S.ans[i];h+=`<button class="pal ${i===S.cur?'cur':''} ${v===null?'':v===x.a?'ok':'bad'} ${store.saved[x.tid+':'+x.i]?'sv':''}" data-j="${i}">${i+1}</button>`});
  h+=`</div></details></article>`;
  app.innerHTML=h;
  app.querySelectorAll('.opt:not([disabled])').forEach(b=>b.onclick=()=>choose(+b.dataset.k));
  app.querySelectorAll('.pal').forEach(b=>b.onclick=()=>{S.cur=+b.dataset.j;render();scrollQ()});
  document.getElementById('back').onclick=()=>{ if(att&&!S.leaving){S.leaving=1;document.getElementById('back').textContent='सहेजे बिना लौटें?';return} home()};
  const p=document.getElementById('prev');p.onclick=()=>{S.cur--;render();scrollQ()};
  const nx=document.getElementById('next');if(nx)nx.onclick=()=>{S.cur++;render();scrollQ()};
  document.getElementById('fin').onclick=finish;
  document.getElementById('save').onclick=()=>{const k=q.tid+':'+q.i;if(store.saved[k])delete store.saved[k];else store.saved[k]=1;save(store);render()};
}
function scrollQ(){const s=app.querySelector('.sheet');if(s&&s.getBoundingClientRect().top<0)s.scrollIntoView({block:'start'})}
function choose(k){S.ans[S.cur]=k;const q=S.qs[S.cur],key=q.tid+':'+q.i;
  if(k===q.a)delete store.wrong[key];else store.wrong[key]=1;save(store);render()}
function finish(){
  const {c,w}=counts(),n=S.qs.length,sk=n-c-w,neg=store.opt.neg,marks=neg?(c-w/3):c,secs=Math.round((Date.now()-S.t0)/1000);
  const pct=n?Math.round(c/n*100):0;
  if(S.id!=='mock'&&S.id!=='wrong'&&S.id!=='saved'&&c+w>0){const prev=store.best[S.id];if(!prev||c>prev.c)store.best[S.id]={c,n,p:pct};save(store)}
  window.scrollTo(0,0);
  let h=`<div class="result"><header class="band"><div class="eyebrow">परिणाम</div><h1>${esc(S.name)}</h1><p>${pct>=70?'बहुत अच्छा प्रदर्शन।':pct>=45?'ठीक है — गलत प्रश्न दोबारा देखें।':'इस अध्याय को नोट्स से दोहराएँ, फिर टेस्ट दें।'}</p></header>
  <div class="big"><div class="tile"><small>सही</small><b style="color:var(--ok)">${c}</b></div><div class="tile"><small>गलत</small><b style="color:var(--bad)">${w}</b></div>
  <div class="tile"><small>छोड़े</small><b>${sk}</b></div><div class="tile"><small>अंक${neg?' (−⅓)':''}</small><b>${(Math.round(marks*100)/100)} / ${n}</b></div>
  <div class="tile"><small>समय</small><b>${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}</b></div></div>
  <div class="row"><button class="btn primary" id="home">सूची पर लौटें</button><button class="btn" id="again">यही टेस्ट दोबारा</button></div>`;
  const wl=S.qs.map((q,i)=>({q,a:S.ans[i]})).filter(x=>x.a!==null&&x.a!==x.q.a);
  if(wl.length){h+=`<div class="section-h"><h2>गलत उत्तर — एक नज़र में</h2><span>${wl.length} प्रश्न</span></div><div class="wlist">`;
    wl.forEach(x=>{h+=`<div class="witem"><div class="wq">${esc(x.q.q)}</div><div class="wy">आपका उत्तर: ${esc(x.q.o[x.a])}</div><div class="wa">सही उत्तर: ${esc(x.q.o[x.q.a])}</div>${x.q.e?`<div class="we">${esc(x.q.e)}</div>`:''}</div>`});
    h+=`</div>`}
  h+=`</div>`;app.innerHTML=h;
  const id=S.id,name=S.name;
  document.getElementById('home').onclick=home;
  document.getElementById('again').onclick=()=>{if(id==='mock')startMock();else if(id==='wrong')startWrong();else if(id==='saved')startSaved();else startTest(BANK.findIndex(t=>t.id===id))};
}
home();
</script>

</body></html>
