्वृ किया; किंतु दूसरी ओर अन्य सामंतवादी तत्वों ने; जैसे-पटियाला‚ जींद‚ ग्वालियर और हैदराबाद के राजाओं ने इस विद्रोह के दमन में सहायता की। यूरोपीय इतिहासकारों ने ग्वालियर के मंत्री सर दिनकर राव और हैदराबाद के मंत्री सालारजंग की राजभक्ति की बहुत सराहना की है। रणनीति और रणकौशल की दृष्टि से भी अंग्रेजी सेनाएं भारतीय विद्रोहियों से बहुत आगे थीं। वे भारतीय सिपाहियों की तुलना में अधिक सुसज्‍जित थीं। अत: 1857 के विद्रोह की असफलता के उपर्युक्त सभी कारण जिम्मेदार थे।"},{"ch":5,"page":457,"n":80,"q":"निम्नलिखित में से किन ब्रिटिश अधिकारियों ने लखनऊ में अपना जीवन खोया था?\n1. जनरल जॉन निकल्सन 2. जनरल नील\n3. मेजर जनरल हैवलॉक 4. सर हेनरी लॉरेंस निम्नलिखित कूट की सहायता से सही उत्तर चुनिए-\nकूट :","o":["1, 2 और 3","1, 3 और 4","2, 3 और 4","उपर्युक्त सभी"],"a":[2],"t":["U.P.P.C.S. (Pre) 2008"],"e":"14 सितंबर‚ 1857 को अंग्रेजों द्वारा दिल्‍ली पर अधिकार करने के क्रम में ब्रिगेडियर-जनरल जॉन निकल्सन घायल हुए थे और 23 सितंबर‚ 1857 को उसकी मृत्यु हो गई। लखनऊ में 1857 के विद्रोह के दौरान अंग्रेज रेजीडेंसी की रक्षा करते हुए सर हेनरी मान्टगोमरी लॉरेंस तथा ब्रिगेडियर-जनरल नील की मृत्यु हुई। मेजर जनरल हैवलॉक ने 1857 के विद्रोह के दौरान लखनऊ में विद्रोहियों को पराजित करने में महत्‍वपूर्ण भूमिका निभाई थी, किंतु उनकी मृत्‍यु लखनऊ में विद्रोहियों के हमले में नहीं बल्‍कि नवंबर, 1857 में पेचिश से हुई थी।"},{"ch":5,"page":458,"n":84,"q":"1857 के संग्राम को प्रथम स्वतंत्रता संग्राम का नाम किसने दिया?","o":["वी.ए.स्मिथ","पी.ई. रॉबट्‌र्स","वी.डी. सावरकर","उपर्युक्त सभी"],"a":[2],"t":["U.P.P.C.S. (Mains) 2015"],"e":"वी. डी. सावरकर ने अपनी पुस्तक ‘‘The Indian War of Independence 1857’’ में 1857 के विद्रोह को सुनियोजित स्वतंत्रता संग्राम की संज्ञा दी। उन्होंने इसे स्वतंत्रता की पहली लड़ाई कहा था।"},{"ch":5,"page":458,"n":87,"q":"भारतीय स्वाधीनता आंदोलन का सरकारी इतिहासकार था-","o":["आर.सी. मजूमदार","ताराचंद","वी.डी. सावरकर","एस.एन. सेन"],"a":[3],"t":["U.P. P.C.S. (Pre) 2010"],"e":"1857 के भारतीय स्वाधीनता आंदोलन के सरकारी इतिहासकार सुरेंद्र नाथ सेन (एस.एन. सेन) थे‚ जिनकी पुस्तक ‘एट्टीन फिफ्टी सेवन’ 1957 मे ु की गई।"],"a":[2],"t":["U.P.P.C.S. (Mains) 2010"],"e":"1857 की क्रांति के परिणामस्वरूप भारतीय शासन की बागडोर कंपनी के हाथों से निकलकर ब्रिटिश क्राउन के हाथों में चली गई तथा इसकी शासन प्रणाली में भी आमूल-चूल परिवर्तन किया गया। अत: 1857 की क्रांति के संदर्भ में प्रश्नगत विकल्प (c) की अवधारणा ही सही है‚ जबकि अन्य कथन सही नहीं हैं।"},{"ch":5,"page":459,"n":95,"q":"साम्राज्ञी विक्टोरिया ने 1858 की घोषणा में भारतीयों को बहुत सी चीजें दिए जाने का आश्वासन दिया था। निम्न आश्वासनों में से कौन-सा ब्रिटिश शासन ने पूरा किया था?","o":["रियासतों को हड़पने की नीति समाप्‍त कर दी जाएगी","देशी रजवाड़ों की यथास्थिति बनाए रखी जाएगी","भारतीय एवं यूरोपियन सभी प्रजा को समान व्यवहार मिलेगा","भारतीयों के सामाजिक एवं धार्मिक विश्वासों में कोई हस्तक्षेप नहीं होगा"],"a":[0],"t":["U.P. P.C.S. (Pre) 1994"],"e":"1857 के विद्रोह का सबसे महत्वपूर्ण परिणाम महारानी विक्टोरिया की उद्‌घोषणा थी। यह उद्घ‌ोषणा 1 नवंबर‚ 1858 को इलाहाबाद (वर्तमान प्रयागराज) में हुए दरबार में लॉर्ड कैनिंग द्वारा उद्घ‌ोषित की गई। इसमें भारत में कंपनी के शासन को समाप्‍त कर भारत का शासन सीधे क्राउन के अधीन कर दिया गया। इस उद्‌घोषणा में भारत में ब्रिटिश साम्राज्य के विस्तार पर रोक‚ लोगों के धार्मिक मामलों में हस्तक्षेप न करना‚ एकसमान कानूनी सुरक्षा सबको उपलब्ध कराना शामिल थे। भारतीय रजवाड़ों के प्रति विजय और विलय की नीति का परित्याग कर दिया गया और देशी राजाओं के अधिकारों, गरिमा और सम्मान करने की बात भी इस उद्‍घोषणा में की गई थी।"},{"ch":6,"page":462,"n":5,"q":"‘नील दर्पण’ नाटक का लेखक कौन था?","o":["तारानाथ बंधोपाध्याय","तारानाथ घोष","दीनबंधु मित्र","बंकिम चंद्र चटर्जी"],"a":[2],"t":["U.P.P.C.S. (Mains) 2015"],"e":"1857 के विद्रोह के ठीक बाद बंगाल में नील विद्रोह (1859-60 ई.) हुआ। संन्यासी विद्रोह 1763-1800 ई. में; संथाल विद्रोह 1855-56 ई. में तथा पाबना उपद्रव 1873-76 ई. में हुआ। नील विद्रोह की शुरुआत पश्चिम बंगाल के नादिया जिले के कृष्णनगर के पास दो साहसी व्यक्‍तियों विष्णुचरण बिश्वास (विष्णु बिश्वास) और दिगंबर बिश्वास द्वारा संगठित किया गया था। चौगाछा और उसके आस-पास के गांवों ने इनके इस विद्रोह के प्रभाव में आकर एकजूट होकर नील की खेती करने से मना कर दिया। यह नील आंदोलन के इतिहास में अपनी मांगों को लेकर किए गए आंदोलनों में सर्वाधिक व्यापक और जुझारू विद्रोह था। बंगाल का नील विद्रोह शोषण के विरुद्ध किसानों की सीधी लड़ाई थी। बंगाल के वे काश्तकार जो अपने खेतों में चावल की खेती करना चाहते थे‚ उन्हें यूरोपीय नील बागान मालिक नील की खेती करने के लिए मजबूर करते थे। नील की खेती से इनकार करने वाले किसानों को नील बागान मालिकों के दमन-चक्र का सामना करना पड़ता था। मार्च, 1859 में बंगाल के हजारों रैयतों (किसानों) ने नील की खेती करने से इनकार कर दिया। जैसे-जैसे यह विद्रोह फैला, रैयतों ने बागान मालिकों को लगान चुकाने से भी इनकार कर दिया। 1860 ई. तक नील आंदोलन नादिया‚ पाबना‚ खुलना‚ ढाका‚ मालदा‚ दीनाजपुर आदि क्षेत्रों में फैल गया। किसानों की एकजुटता के कारण बंगाल में 1860 ई. तक लगभग सभी नील कारखाने बंद हो गए। बंगाल के बुद्धिजीवी वर्ग ने अखबारों में अपने लेखों द्वारा तथा जन सभाओं के माध्यम से इस विद्रोह के प्रति अपने समर्थन को व्यक्त किया। इसमें ‘हिंदू पैट्रियाट’ के संपादक हरिश्चंद्र मुखर्जी की विशेष भूमिका रही। नील बागान मालिकों के अत्याचारों का खुला चित्रण दीनबंधु मित्र ने अपने नाटक ‘नील दर्पण’ में किया है।"},{"ch":6,"page":462,"n":6,"q":"निम्नलिखित विद्रोहों पर विचार कीजिए तथा इन्हें सही कालक्रमानुसार क्रम में व्यवस्थित कीजिए।\n1. पबना 2. नील\n3. कूका 4. संन्यासी\nनीचे दिए गए कूट से सही उत्तर चुनिए :\nकूट :","o":["4, 3, 2, 1","3, 4, 1, 2","3, 4, 2, 1","4, 2, 3, 1"],"a":[3],"t":["U.P. P.C.S (Pre) 2025"],"e":"प्रश्नगत विद्रोहों का कालक्रम इस प्रकार है :  संन्यासी विद्रोह (बंगाल): लगभग 1763 ई-1800 ई. के बीच।  नील विद्रोह (बंगाल): नील की जबरन खेती के विरोध में किसानों का व्यापक आंदोलन 1859-60 ई. में।  कूका (नामधारी) विद्रोह (पंजाब): नामधारी/कूका आंदोलन के सशस्त्र टकराव और कठोर दमन की चरम घटनाएं 1871-72 ई. में हुईं।  पबना कृषक आंदोलन (बंगाल): जमींदारों के अत्याचारों व अवैध अबवाब/जबरन लेवी तथा लगान-वृद्धि के विरोध में किसानों द्वारा मुख्यत: 1873-76 ई. में चलाया गया आंदोलन। अत: इनका सही कालानुक्रमिक क्रम विकल्‍प (d) में है।"},{"ch":6,"page":463,"n":9,"q":"बंकिम चंद्र चट्टोपाध्याय के संदर्भ में निम्नलिखित कथनों पर विचार कीजिए :\n1. वह कलकत्ता विश्वविद्यालय के प्रथम स्नातक थे।\n2. ‘सीताराम’ उनका अंतिम उपन्यास था।\nनीचे दिए गए कूट का प्रयोग कर सही उत्तर का चयन कीजिए :\nकूट :","o":["केवल 2","केवल 1","न तो 1 ना ही 2","1 और 2 दोनों"],"a":[3],"t":["U.P. R.O./A.R.O. (Pre) 2023"],"e":"बंकिम चंद्र चट्टोपाध्याय अप्रैल, 1858 में कलकत्ता विश्वविद्यालय से उत्तीर्ण होने वाले प्रथम दो स्नातकों (जदुनाथ बोस और बंकिम चंद्र चटर्जी) में से एक थे। अत: कथन (1) सत्य है। ‘सीताराम’ (1887 ई. में प्रकाशित) बंकिम चंद्र चट्टोपाध्याय (चटर्जी) का अंतिम उपन्यास था। अत: कथन (2) भी सत्य है।"},{"ch":6,"page":463,"n":12,"q":"आनंदमठ उपन्यास की कथावस्तु आधारित है-","o":["चुआर विद्रोह पर","संन्यासी विद्रोह पर","पालीगर विद्रोह पर","तालुकदारों के विद्रोह पर"],"a":[1],"t":["U.P. P.C.S. (Pre) 1998"],"e":"‘वंदे मातरम्’‌ गीत बंकिमचंद्र चटर्जी की प्रसिद्ध कृति ‘आनंदमठ’ से लिया गया है। इस उपन्यास का कथानक संन्यासी विद्रोह पर आधारित है। 1896 ई. में कांग्रेस के कलकत्ता अधिवेशन में इसे पहली बार रबीन्‍द्र नाथ टैगोर द्वारा गाया गया था। नोट- बंकिम चंद्र चटर्जी ने ‘वंदे मातरम्’ गीत की रचना प्रारंभ में स्वतंत्र रूप से की थी, जो पहली बार साहित्‍यिक पत्रिका ‘बंगदर्शन’ में 7 नवंबर, 1875 को प्रकाशित हुई थी। बाद में बंकिम चंद्र चट्टोपाध्याय ने इसे अपने उपन्‍यास ‘आनंद मठ’ में शामिल किया, जो 1882 ई. में प्रकाशित हुई। वंदे मातरम् गीत को संगीतबद्ध करने का काम रबींद्रनाथ टैगोर ने किया था तथा 24 जनवरी, 1950 को भारत की संविधान सभा द्वारा इसे आधिकारिक रूप से ‘राष्ट्रीय गीत’ के रूप में अपनाया गया था।"},{"ch":6,"page":464,"n":14,"q":"निम्नलिखित में से किसने अपनी कृतियों द्वारा ‘संन्यासी विद्रोह’ को ख्याति प्रदान की?","o":["दीनबंधु मित्र","बंकिमचंद्र चटर्जी","शिशिर कुमार घोष","हरीश चंद्र"],"a":[1],"t":["U.P. P.C.S. (Mains) 2017"],"e":"‘वंदे मातरम्’‌ गीत बंकिमचंद्र चटर्जी की प्रसिद्ध कृति ‘आनंदमठ’ से लिया गया है। इस उपन्यास का कथानक संन्यासी विद्रोह पर आधारित है। 1896 ई. में कांग्रेस के कलकत्ता अधिवेशन में इसे पहली बार रबीन्‍द्र नाथ टैगोर द्वारा गाया गया था। नोट- बंकिम चंद्र चटर्जी ने ‘वंदे मातरम्’ गीत की रचना प्रारंभ में स्वतंत्र रूप से की थी, रा शीघ्र ही काबुल‚ उत्तर-पश्चिम सीमांत प्रांत‚ बंगाल‚ बिहार‚ मध्य प्रांत आदि में फैल गई। कुछ समय के लिए इन्होंने 1830 ई. में पेशावर पर कब्जा कर लिया और जे.डी. कनिंघम के अनुसार सैय्यद अहमद बरेलवी ने अपने नाम के सिक्‍के ढलवाए‚ किंतु उनके द्वारा ढलवाए गए सिक्‍कों की पुष्टि आधुनिक शोधों से पुष्ट नहीं होती है। 1831 ई. में वह बालाकोट की लड़ाई में मारे गए। सैयद अहमद बरेलवी की मृत्यु के बाद पटना इस आंदोलन का केंद्र बना। इस अवधि में आंदोलन का नेतृत्व मौलवी कासिम‚ विलायत अली‚ इनायत अली‚ इलाही बक्‍श और उनके पुत्र अहमदुल्‍ला आदि ने किया। पटना के अतिरिक्त हैदराबाद‚ मद्रास‚ बंगाल‚ संयुक्त प्रांत तथा बंबई में भी इस आंदोलन की शाखाएं स्थापित की गईं। 1857 के विद्रोह में वहाबियों ने अंग्रेज विरोधी भावनाओं के प्रसार में बहुत योगदान दिया था।"},{"ch":6,"page":465,"n":21,"q":"पागलपंथी विद्रोह वस्तुत: एक विद्रोह था-","o":["भीलों का","गारों का","गोंडों का","कोलियों का"],"a":[1],"t":["U.P. P.C.S. (Pre) 1999"],"e":"पागलपंथ एक अर्द्ध-धार्मिक संप्रदाय था। यह वस्तुत: गारों जनजाति से संबंधित विद्रोह था‚ जिसकी शुरुआत करम/करीमशाह द्वारा की गई थी। पागलपंथी विद्रोह का मुख्य केंद्र बंगाल का शेरपुर और मयमनसिंह (वर्तमान बांग्‍लादेश में स्थित) के क्षेत्र थे। करम शाह के पुत्र तथा उत्तराधिकारी टीटू (टीपू)‚ धार्मिक तथा राजनैतिक उद्देश्यों से प्रेरित थे। उसने जमींदारों के द्वारा मुजारों (Tenants) पर किए गए अत्याचारों के विरुद्ध आंदोलन किया। 1825 ई. में टीटू ने शेरपुर पर अधिकार कर लिया तथा राजा बन बैठा। वह इतना शक्तिशाली हो गया कि स्वतंत्र सत्ता का प्रयोग करने लगा और प्रशासन को चलाने के लिए उसने एक न्यायाधीश‚ एक फौजदार और एक कलेक्टर नियुक्त किया।"},{"ch":6,"page":465,"n":23,"q":"निम्नलिखित में से कौन फराजी विद्रोह का नेता था?","o":["आगा मुहम्मद रजा","दादू मियां","शमशेर गाजी","वजीर अली"],"a":[1],"t":["U.P. P.C.S. (Pre) 1999"],"e":"फराजी लोग बंगाल के फरीदपुर के हाजी शरियातुल्‍लाह द्वारा चलाए गए संप्रदाय के अनुयायी थे। ये लोग अनेक धार्मिक‚ सामाजिक तथा राजनैतिक आमूल परिवर्तनों का प्रतिपादन करते थे। शरियातुल्‍लाह के पुत्र दादू मियां (दुदु मियां) ने बंगाल से अंग्जरेों को निकालने की योजना बनाई। यह आंदोलन 1818 से 1862 ई. के दौरान चलता रहा। 1862 ई. में दूदू मियां की मृत्‍यु के उपरांत यह आंदोलन कमजोर पड़ा तथा इसके कुछ अनुयायी वहाबी आंदोलन से जुड़ गए, किंतु इसके उपरांत भी यह आंदोलन 20वीं शताब्दी के प्रारंभिक दशकों तक सक्रिय रहा।"},{"ch":6,"page":465,"n":25,"q":"वेलु थम्पी ने अंग्रेजों के विरुद्ध आंदोलन का नेतृत्व किया था-","o":["केरल में","महाराष्ट्र में","मैसूर में","तेलंगाना में"],"a":[0],"t":["U.P. P.C.S. (Mains) 2002"],"e":"त्रावणकोर (केरल) के राजा को ईस्ट इंडिया कंपनी ने 1805 ई.में सहायक संधि करने पर विवश किया, जिससे त्रावणकोर की राजनीतिक स्वतंत्रता का ह्रास हुआ तथा एक बड़ी धनराशि अपने राज्‍य में अंग्रेजी सेना के रख-रखाव के लिए देने पर विवश होना पड़ा। राज्‍य पर पड़ते आर्थिक बोझ और ब्रिटिश रेजिडेंट द्वारा राज्‍य के आंतरिक मामले में हस्तक्षेप के विरुद्ध त्रावणकोर के दीवान वेलुथम्पी ने अंग्रेजों के विरुद्ध विद्रोह कर दिया। वेलुथम्पी के इस विद्रोह को यद्यपि कोचीन राज्‍य का समर्थन मिला, किंतु अंग्रेजों द्वारा इस विद्रोह को 1809 ई. में दबा दिया गया।"},{"ch":6,"page":466,"n":29,"q":"निम्नलिखित में से कौन-सा स्थान गडकरी विद्रोह का केंद्र था?","o":["बिहार शरीफ","कोल्हापुर","सूरत","सिलहट"],"a":[1],"t":["U.P. P.C.S. (Pre) 1999"],"e":"गडकरी लोग मराठों के किलों में काम करने वाले उनके वंशानुगत सैनिक थे। उन्होंने मनमाने ढंग से भू-राजस्व की वसूली‚ मराठा सेना से उन्हें सेवा मुक्त किए जाने और उनकी जमीनों को मामलतदारों की देख-रेख के अधीन कर दिए जाने के विरुद्ध 1844 ई. में कोल्हापुर में विद्रोह कर दिया। इस विद्रोह को दबाने के लिए सरकार को काफी संघर्ष करना पड़ा।"},{"ch":6,"page":468,"n":45,"q":"निम्नलिखित युग्मों में कौन सही सुमेलित नहीं है? विद्रोह वर्ष","o":["संथाल 1855","कोल 1831","खासी 1829","अहोम 1815"],"a":[3],"t":["U.P.P.C.S. (Pre) 2018"],"e":"अहोम विद्रोह का प्रारंभ गोमधर कुवं र के नेतत्वृ में 1828 ई. में हुआ। जिसका\nकारण बर्मा युद्ध के बाद कंपनी द्वारा अहोम के अभिजात वर्ग को उनका क्षेत्र वापस नहीं करना था। अंतत: विवश होकर कंपनी ने समझौता कर लिया व उत्तरी असम के प्रदेश महाराजा पुरंदर सिंह को दे दिए।"},{"ch":6,"page":468,"n":47,"q":"1855 के ‘संथाल हूल’ के संदर्भ में‚ निम्नलिखित में से कौन-सा/से\nकथन सही है/हैं?\nनीचे दिए गए कूट से सही उत्तर चुनिए–\n1. भागलपुर के पास मेजर बरो संथालों से लड़ाई में हार गए।\n2. गोक्‍को‚ गोड्डा का एक महत्वपूर्ण नेता था।\n3. इस संदर्भ में महाजन दीन दयाल राय भी एक महत्वपूर्ण नाम है।\n4. एक समय था‚ जब मुजफ्फरपुर के निकट गंगा घाटी के क्षेत्र पर संथालों का पूर्ण वर्चस्व था।\nकूट :","o":["केवल 1","1, 3, 4","1, 2, 3","केवल 2 तथा 3"],"a":[2],"t":["U.P. P.C.S. (Mains) 2017"],"e":"जुलाई‚ 1855 में संथालों ने विद्रोह का बिगुल बजाया। कलकत्ता के मेजर बरो और पूर्णिया से सेना की एक टुकड़ी संथालों का दमन करने के लिए भेजी गई‚ जो भागलपुर के निकट पीर पैंती के मैदान में संथालों से संघर्ष में पराजित हो गई। बाद में विद्रोह का दमन कैप्टन एलेक्जेंडर ने किया। गोड्डा वर्तमान में झारखंड राज्य के अंतर्गत संथाल परगना में आता है। गोक्‍को यहां का एक महत्वपूर्ण नेता था। महाजन दीन दयाल राय भी शोषणकर्ताओं में शामिल थे। गंगा घाटी क्षेत्र पर संथालों का वर्चस्व नहीं था। यह विद्रोह भागलपुर से राजमहल के पहाड़ी क्षेत्र के मध्य फैला था।"},{"ch":6,"page":469,"n":50,"q":"निम्नांकित में से कौन-सी घटना महाराष्ट्र में घटित हुई?","o":["भील विद्रोह","कोल विद्रोह","रम्पा विद्रोह","संथाल विद्रोह"],"a":[0],"t":["U.P. P.C.S. (Pre) 1998"],"e":"भील विद्रोह भीलों की आदिम जाति महाराष्ट्र के उत्तर-पश्चिम में स्थित खानदेश में रहती थी। 1818-31 ई. तक इन लोगों ने अपने नए स्वामी अंग्रेजों के विरुद्ध विद्रोह कर दिया। कंपनी के अधिकारियों का कथन था कि इस विद्रोह को पेशवा बाजीराव द्वितीय के विद्रोही मंत्री त्रयम्बकजी दांगलिया ने प्रोत्साहित किया था। वास्तव में कृषि संबंधी कष्ट तथा नई सरकार का भय ही इस विद्रोह का कारण था। 1825 ई. में सेवारम ने इस विद्रोह का नेतृत्‍व किया। ब्रिटिश सेना काफी प्रयास के बाद इस विद्रोह को कुचल सकी। कोल विद्रोह-रांची‚ सिंहभूम‚ हजारीबाग‚ पालामऊ (पलामू) और मानभूम के पश्चिमी क्षेत्रों में फैला। रम्पा विद्रोह-आंध्र प्रदेश के गोदावरी क्षेत्र के उत्तर में स्थित ‘रम्पा’ पहाड़ी क्षेत्र में हुआ। आदिवासियों का यह विद्रोह साहूकारों के शोषण और वन कानूनों के विरुद्ध हुआ। संथाल विद्रोह-1855-56 ई. में हुआ। यह विद्रोह मुख्यत: भागलपुर से राजमहल के बीच के क्षेत्र में केंद्रित था।"},{"ch":6,"page":470,"n":55,"q":"मुंडा विद्रोह का नेता कौन था?","o":["बिरसा","कान्हू","तिलक मांझी","सिद्धू"],"a":[0],"t":["U.P. P.C.S. (Pre) 1998","47th B.P.S.C. (Pre) 2005"],"e":"मुंडा विद्रोह के नेता बिरसा मुंडा को धरती आबा (जगत पिता) और इनके विद्रोह को ‘उलगुलान’ (महाविद्रोह या महान हलचल ) के नाम से जाना गया। यह विद्रोह इस अवधि का सर्वाधिक प्रसिद्ध आदिवासी विद्रोह था। मुंडों की पारंपरिक सामूहिक खेती वाली भूमि व्यवस्था मुंडारी खुंटकट्टी के जमींदारी या व्यक्तिगत भू-स्वामित्व वाली भूमि व्यवस्था में परिवर्तन के विरुद्ध मुंडा विद्रोह की शुरुआत हुई। लेकिन कालांतर में बिरसा ने इसे धार्मिक‚ राजनीतिक आंदोलन का रूप प्रदान किया। मुंडा आदिवासियों का विद्रोह 1899-1900 ई. के बीच हुआ। 1895 ई. में बिरसा ने अपने आप को ‘भगवान का दूत’ घोषित किया और हजारों मुंडाओं का नेता बन गया। उसने कहा कि “दिकुओं (गैर-आदिवासियों) से हमारी लड़ाई होगी और उनके खून से जमीन इस तरह लाल होगी जैसे लाल झंडा।” 1899 ई. में क्रिसमस की पूर्व संध्या पर बिरसा ने मुंडा जाति का शासन स्थापित करने के लिए विद्रोह का एलान किया। लगभग 6000 मुंडा तीर-तलवार तथा कुल्हाड़ी लेकर बिरसा के साथ हो लिए। लेकिन बिरसा को 3 फरवरी‚ 1900 को चक्रधरपुर के जामकोपई जंगल में गिरफ्तार कर लिया गया और 9 जून‚ 1900 को जेल में ही उनकी मृत्यु हो गई। विद्रोह कुचल दिया गया पर बिरसा अमर हो गए।"},{"ch":6,"page":472,"n":73,"q":"सूची-I को सूची-II से सुमेलित कीजिए और सूचियों के नीचे दिए गए\nकूटों में से सही उत्तर चुनिए -\nसूची-I सूची-II (आंदोलन) (वर्ष)\nA. पाबना 1. 1855-56\nB. एका 2. 1873-85\nC. संथाल 3. 1922\nD. ताना भगत 4. 1914\nकूट :\nA B C D","o":["1 2 4 3","2 3 1 4","3 1 4 2","4 3 2 1"],"a":[1],"t":["U.P.P.C.S. (Pre) 2019"],"e":"प्रश्नगत आंदोलनों तथा उनके कालक्रम का सही सुमेलन इस प्रकार हैपाबना विद्रोह – 1873-85 एका आंदोलन – 1922\nसंथाल विद्रोह – 1855-56\nताना भगत आंदोलन – 1914 नोट- 1885 ई. में बंगाल काश्तकारी अधिनियम द्वारा कृषकों को भूमि पर अधिकार स्पष्ट किया गया था‚ जो पाबना आंदोलन की मुख्य मांग थी। इस आंदोलन की तीव्रता 1873-1876 ई. तक थी। उसके पश्चात यह केवल कानूनी विवाद था।"},{"ch":6,"page":472,"n":74,"q":"एका आंदोलन का प्रारंभ किया गया था–","o":["महाराष्ट्र के किसानों द्वारा","बंगाल के किसानों द्वारा","पंजाब के किसानों द्वारा","उत्तर प्रदेश के हरदोई‚ बाराबंकी एवं अन्य स्थानों के किसानों द्वारा"],"a":[3],"t":["U.P. P.C.S. (Mains) 2007"],"e":"एका आंदोलन (1921-22 ई.) का प्रारंभ उत्तर प्रदेश के हरदोई‚ बहराइच‚ सीतापुर आदि जिलों में किसानों द्वारा प्रारंभ किया गया था। प्रसिद्ध इतिहासकार सुमित सरकार के अनुसार एका आंदोलन की शुरुआत कुछ स्थानीय कांग्रेस कार्यकर्ताओं द्वारा की गई थी। इस आंदोलन का नेतृत्‍व आगे चलकर उग्र नेता मदारी पासी के हाथों में चला गया। इस आंदोलन का मुख्य मुद्दा निर्धारित लगान से 50 प्रतिशत अधिक लगान वसूलना था।"},{"ch":6,"page":473,"n":75,"q":"सूची-I को सूची-II के साथ सुमेलित कीजिए तथा नीचे दिए गए कूट से सही उत्तर का चयन कीजिए -\nसूची-I सूची-II\nA. रम्पा विद्रोह 1. 1859-60\nB. पाबना किसान विद्रोह 2. 1879-80\nC. बंगाल नील विद्रोह 3. 1860-63\nD. जयंतिया विद्रोह 4. 1873-76\nकूट :\nA B C D","o":["2 1 3 4","2 4 1 3","1 2 3 4","4 2 1 3"],"a":[1],"t":["U.P. R.O./ A.R.O. (Re-Exam) (Pre) 2016"],"e":"सुमेलित हैं-\nसूची-I सूची-II रम्पा विद्रोह 1879-80 पाबना किसान विद्रोह 1873-76 बंगाल नील विद्रोह 1859-60 जयंतिया विद्रोह 1860-63"},{"ch":6,"page":473,"n":77,"q":"1921 का ‘मोपला विद्रोह’ हुआ था-","o":["तेलंगाना में","विदर्भ में","मालाबार में","मराठवाड़ा में"],"a":[2],"t":["U.P.P.C.S (Mains) 2016","Jharkhand P.C.S. (Pre) 2003","U.P.P.S.C. (GIC) 2010"],"e":"दक्षिणी मालाबार (केरल) के मुसलमान पट्टेदारों (कनामदार) तथा खेतिहरों (वेरुमपट्टमदार) को मोपला कहते थे। यहां जमींदार‚ हिंदुओं की ऊंची जातियों नम्बूदरी तथा नायर जातियों से थे। वर्ष 1921 के मोपला विद्रोह के दो कारण थे। पहला जमींदारों का अत्याचार‚ दूसरा अंग्रेजी सरकार की खिलाफत विरोधी नीतियां।"},{"ch":6,"page":473,"n":78,"q":"सूची-I को सूची-II से सुमेलित कीजिए तथा नीचे दिए गए कूट से सही उत्तर चुनिए-\nसूची-I (घटनाएं) सूची-III (तिथियां)\nA. बैरकपुर विद्रोह 1. जुलाई‚ 1806\nB. बरहामपुर विद्रोह 2. नवंबर‚ 1824\nC. संथाल विद्रोह 3. 1855-56\nD. बेल्‍लोर विद्रोह 4. फरवरी‚ 1857\nकूट :\nA B C D","o":["2 4 3 1","2 1 4 3","3 4 2 1","1 2 4 3"],"a":[0],"t":["U.P.P.C.S. (Mains) 2006"],"e":"बैरकपुर में विद्रोह नवंबर‚ 1824 को 47वीं बंगाल नेटिव इंफट्रीैं के एक सिपाही बिंदे तिवारी द्वारा किया गया था। बरहामपुर का विद्रोह फरवरी‚ 1857 में हुआ। संथालों का विद्रोह सीदो (सिद्धू) तथा कान्हू के नेतृत्व में 1855-56 ई. में हुआ। 1806 ई. में सैनिकों ने अपने सामाजिक तथा धार्मिक रीति-रिवाजों में हस्तक्षेप करने के कारण बेल्‍लोर (वेल्‍लोर या वेलूर विद्रोह) में विद्रोह कर वेल्‍लोर के किले पर टीपू सुल्‍तान के झंडे को फहरा दिया था।"},{"ch":6,"page":474,"n":80,"q":"निम्नलिखित में कौन-सा सही सुमेलित नहीं है?","o":["मोपला विद्रोह-केरल","कूका विद्रोह-पंजाब","कोली विद्रोह-गुजरात","चुआर विद्रोह-मध्य प्रदेश"],"a":[3],"t":["U.P.P.C.S. (Mains) 2015"],"e":"मोपला विद्रोह वर्ष 1921 में केरल के मालाबार क्षेत्र में मोपलाओं द्वारा किया गया था। महात्मा गांधी‚ शौकत अली‚ मौलाना अबुल कलाम आजाद जैसे नेताओं का सहयोग इस आंदोलन को प्राप्‍त था। ‘कूका विद्रोह’ का आरंभिक स्वरूप धार्मिक था; किंतु बाद में यह राजनीतिक विद्रोह के रूप में परिवर्तित हो गया। इस विद्रोह की शुरुआत पंजाब में 1840 के दशक में ‘भगत जवाहर मल’ द्वारा की गई थी। इन्हें ‘सियान साहब’ के नाम से भी जाना जाता था। राम सिंह के समय में यह आंदोलन जोर पकड़ा लेकिन अंग्रेजों ने 1857 ई. में इन्हें गिरफ्तार कर म्यांमार में निर्वासित कर दिया। 1857 ई. के प्रथम स्वतंत्रता संग्राम के दौरान‚ विभिन्‍न जनजातियों ने ब्रिटिश शोषण के विरुद्ध लड़ाई लड़ी। इनमें गुजरात के मेहसाणा जिले के तरंगा पहाड़ियों में कोली जनजातियों का विद्रोह भी ऐसा ही वीरतापूर्ण प्रयास था। चुआर विद्रोह (1767-1802 ई.) में तत्कालीन बंगाल के मिदनापुर और बांकुरा क्षेत्र के चुआर आदिवासियों द्वारा किया गया। यह विद्रोह ‘भूमिकर’ तथा ‘अकाल’ के कारण उत्पन्‍न आर्थिक संकट का परिणाम था।"},{"ch":6,"page":474,"n":82,"q":"निम्नलिखित युग्मों में कौन-सा सुमेलित नहीं है?","o":["मुंडा - बिरसा","संथाल - कान्हू","अहोम - गोमधर कुंवर","नायक - ताना भगत"],"a":[3],"t":["U.P. P.C.S. (Spl) (Pre) 2008"],"e":"मुंडा विद्रोह का प्रारंभ 1899-1900 ई. में रांची के दक्षिणी क्षेत्रों में हुआ था। इस विद्रोह का नेता बिरसा मुंडा था। संथाल विद्रोह 1855-56 ई. में प्रारंभ हुआ था। इस विद्रोह के नेता सीदो (सिद्धू) और कान्हू थे। अहोम विद्रोह 1828 ई. में प्रारंभ हुआ था। इसके नेता गोमधर कुंवर थे। ताना भगत आंदोलन का प्रारंभ उरांव आदिवासियों के मध्य वर्ष 1914 में छोटानागपुर में हुआ था। इस आंदोलन के नेतृत्वकर्ता जतरा भगत‚ बलराम भगत तथा देवमानिया भगत आदि थे।"},{"ch":6,"page":474,"n":84,"q":"19वीं सदी के कृषक विद्रोहों को उनसे संबद्ध क्षेत्रों के साथ सुमेलित कीजिए-\nA. कूकी विद्रोह 1. पंजाब\nB. कूका विद्रोह 2. बंगाल\nC. पाबना कृषक विद्रोह 3. बिहार\nD. बिरसा मुंडा विद्रोह 4. त्रिपुरा अपना उत्तर दिए गए कूट की सहायता से चुनिए-\nकूट :\nA B C D","o":["4 2 1 3","2 3 1 4","4 1 3 2","4 1 2 3"],"a":[3],"t":["U.P. P.C.S. (Pre) 2010"],"e":"कूकी विद्रोह (1917-19 ई.) मणिपुर एवं त्रिपुरा में; कूका विद्रोह (1840 ई. के दशक में प्रारंभ) पंजाब में; पाबना विद्रोह (1873-76 ई.) बंगाल में; तथा बिरसा मुंडा विद्रोह (1899-1900 ई.) बिहार (वर्तमान झारखंड) में हुआ था।"},{"ch":6,"page":475,"n":86,"q":"सूची-I को सूची-II से सुमेलित कीजिए और सूचियों के नीचे दिए गए कूट का प्रयोग कर सही उत्तर चुनिए-\nसूची-I सूची-II (विद्रोह) (नेतृत्वकर्ता)\nA. पाइका विद्रोह 1. एडाचना कुंगन\nB. बरेली विद्रोह 2. राधाराम\nC. मालाबार विद्रोह 3. मुफ्ती मोहम्मद ऐवाज\nD. सिलहट विद्रोह 4. जगबंधु विद्याधर महापात्र\nकूट :\nA B C D","o":["4 3 1 2","3 4 1 2","3 2 1 4","2 1 3 4"],"a":[0],"t":["U.P.P.C.S. (Pre) 2024"],"e":"बक्शी जगबंधु 1817 ई. के पाइका विद्रोह के नायक थे‚ जो खोर्दा (वर्तमान ओडिशा राज्य में स्थित) में हुआ था। उनका जन्म पुरी के समीप रोरुंगा (Rorunga) में हुआ था और उनका वास्तविक नाम जगबंधु विद्याधर महापात्र भ्रमरबर रॉय था। 1816 ई. का बरेली विद्रोह नए पुलिस कर के विरोध में हुआ था‚ जिसका नेतृत्व धार्मिक नेता मुफ्ती मोहम्मद ऐवाज ने किया था। एडाचना कुंगन नायर वायनाड में केरल वर्मा पाजहस्सीराजा (Kerala Verma Pazhassi Raja) की नायर सेना के सैन्य कमांडर (1797-1805 ई.) थे‚ जिन्होंने ब्रिटिश उपनिवेशी अत्याचार के विरुद्ध विद्रोह किया‚ जिसे मालाबार विद्रोह के नाम से जाना जाता है। 1786 ई. का सिलहट विद्रोह जिसे चारगोला विद्रोह तथा प्रतापगढ़ विद्रोह के नाम से जाना जाता है‚ ब्रिटिश शासन के विरुद्ध एक विद्रोह था जिसका नेतृत्व चारगोला के जमींदार राधाराम ने किया था।"},{"ch":6,"page":475,"n":87,"q":"सूची-I को सूची-II से सुमेलित कीजिए और नीचे दिए गए कूट का प्रयोग कर सही उत्तर चुनिए :\nसूची-I सूची-II\nA. जाट विद्रोह i. 1554 ई.\nB. बुंदेला विद्रोह ii. 1672 ई.\nC. सतनामी विद्रोह iii. 1669 ई.\nD. सिख विद्रोह iv. 1675 ई.\nकूट:","o":["A-i, B-ii, C-iv, D-iii","A-ii, B-iv, C-i, D-iii","A-iv, B-iii, C-ii, D-i","A-iii, B-i, C-ii, D-iv"],"a":[3],"t":["U.P. R.O./A.R.O. (Re-Exam) (Pre) 2023"],"e":"सूची-I का सूची-II से सही सुमेलन इस प्रकार है-\nसूची-I (विद्रोह) सूची-II (वर्ष)\nजाट विद्रोह - 1669 ई.\nबुंदेला विद्रोह - 1554 ई.\nसतनामी विद्रोह - 1672 ई.\nसिख विद्रोह - 1675 ई."},{"ch":7,"page":477,"n":1,"q":"भारत में अंग्रेजों ने प्रथम मदरसा कहां स्थापित किया था?","o":["मद्रास में","बंबई में","अलीगढ़ में","कलकत्ता में"],"a":[3],"t":["U.P.P.C.S. (Pre) 2006"],"e":"1780 ई. में वॉरेन हेस्टिंग्स (Warren Hastings) ने कलकत्ता में मदरसा की स्थापना की थी।"},{"ch":7,"page":477,"n":2,"q":"‘एशियाटिक सोसाइटी ऑफ बंगाल’ के संस्थापक थे-","o":["सर विलियम जोंस","विल्किंस","मैक्समूलर","जेम्स प्रिंसेप"],"a":[0],"t":["R.A.S./R.T.S. (Pre) 1999","U.P. P.C.S. (Mains) 2006","Chhattisgarh P.C.S. (Pre) 2003","U.P. P.C.S. (Spl.) (Mains) 2004"],"e":"1784 ई. में हेस्टिंग्स के सहयोगी सर विलियम जोंस ने ‘एशियाटिक सोसाइटी ऑफ बंगाल’ (स्थापना के समय नाम- एशियाटिक सोसाइटी) की स्थापना की‚ ताकि एशिया के सामाजिक तथा प्राकृतिक इतिहास‚ पुरातत्व संबंधी कला‚ विज्ञान तथा साहित्य का अध्ययन किया जा सके। 1791 ई. में बनारस के ब्रिटिश रेजिडेंट जोनाथन डंकन के प्रयत्नों के फलस्वरूप बनारस में एक (प्रथम) संस्कृत कॉलेज खोला गया।"},{"ch":7,"page":477,"n":4,"q":"कथन (A) : बंगाल की एशियाटिक सोसाइटी की स्थापना वॉरेन हेस्टगिं्स के काल में हुई थी और उसने सर विलियम जोंस के पक्ष में उक्त विद्वत संस्था की अध्यक्षता का प्रस्ताव अस्वीकार कर दिया था।\nकारण (R) : वॉरेन हेस्टिंग्स स्वयं एक उद्‌भट विद्वान तथा प्राच्य विद्या का प्रखर समर्थक था जो संस्कृत‚ फारसी व अरबी के अध्ययन को प्रोत्साहित करता था।\nनीचे दिए कूटों में से सही उत्तर चुनिए-\nकूट :","o":["(A) और (R) दोनों सही हैं और (R) कथन (A) की सही व्याख्या है।","(A) और (R) दोनों सही हैं; किंतु (R) कथन (A) की सही व्याख्या नहीं है।","(A) सही है; किंतु (R) गलत है।","(A) गलत है; किंतु (R) सही है।"],"a":[1],"t":["U.P.P.C.S. (Pre) 2019"],"e":"वॉरेन हेस्टिंग्स 1774-85 ई. के दौरान बंगाल का गवर्नर जनरल था। वह स्वयं एक उद्‌भट विद्वान तथा प्राच्य विद्या का प्रखर समर्थक था‚ जो संस्कृत‚ फारसी और अरबी के अध्ययन को प्रोत्साहित करता था। उसके सहयोग और समर्थन से ही 1784 ई. में बंगाल में ‘एशियाटिक सोसाइटी’ की स्थापना हुई थी‚ हालांकि उपलब्ध साक्ष्यों से पता चलता है कि इस संस्थान की अध्यक्षता प्रदान करने का प्रस्ताव प्रस्तुत किया गया था, किंतु समय/अवकाश की कमी के कारण उसे स्वीकार नहीं किया तथा उसने इस संस्था की योजना बनाने वाले व्यक्‍ति (विलियम जोंस) को इसका नेतृत्‍व देने की बात कही। इसके बाद फरवरी, 1784 में विलियम जोंस को इस संस्था का अध्यक्ष चुन लिया गया। अत: कथन (A) सही है। हेस्टिंग्‍स ने प्राच्‍य विद्या या स्थानीय भाषाई-शैक्षिक परंपराओं का समर्थन किया। उदाहरण के लिए 1780 ई. में हेस्टिंग्‍स के प्रयासों से कलकत्ता में एक मदरसा स्थापित हुआ, जिससे अरबी, फारसी और मुस्लिम कानून के अध्ययन को बढ़ावा मिला। हेस्टिंग्‍स के ही प्रोत्‍साहन से चार्ल्स विल्‍किंस ने ‘भगवद्‍गीता’ अंग्रेजी में अनुवाद किया। अंग्रेजी में अनुवादित ‘भगवद्‍गीता’ की प्रस्तावना स्वयं हेस्टिंग्‍स ने ही लिखी थी। अत: कारण (R) भी सही है। किंतु हेस्टिंग्‍स द्वारा संस्था की अध्यक्षता ठुकराने का प्रत्‍यक्ष कारण प्राच्‍य विद्या का समर्थक होना नहीं था, बल्‍कि उसके पास समय/अवकाश की कमी और यह विचार था कि संस्था का नेतृत्‍व उसके योजनाकार (सर विलियम जोंस) को मिलना चाहिए। अत: यह निष्कर्ष निकलता है कि (A) और (R) दोनों सही हैं, किंतु (R), (A) की सही व्याख्या नहीं करता है।"},{"ch":7,"page":478,"n":6,"q":"निम्नलिखित में से किसे पेरिस की रॉयल एशियाटिक सोसाइटी की सदस्यता प्रदान की गई थी?","o":["दादाभाई नौरोजी","माइकल मधुसूदन दत्त","राजा राममोहन राय","विवेकानंद"],"a":[2],"t":["U.P. P.C.S. (Mains) 2007"],"e":"पेरिस में ‘एशियाटिक सोसाइटी’ (फ्रांसीसी नाम- The Societe Asiatique) की स्थापना 1822 ई. में की गई थी, जिसे फ्रांस की एशियाटिक सोसाइटी भी कहा जाता है। इसका उद्देश्य एशियाई भाषाओं, संस्कृतियों और इतिहास के अध्ययन को बढ़ावा देना था। 1824 ई. में इस सोसाइटी ने राजाराम मोहन राय के कार्यों की सराहना करते हुए उन्‍हें सोसाइटी की मानद सदस्यता के लिए चुना। नोट- फ्रांस के पेरिस में स्थित इस ‘एशियाटिक सोसाइटी’ को ‘पेरिस की रॉयल एशियाटिक सोसायटी’ के नाम से नहीं जाना जाता है। ‘रॉयल एशियाटिक सोसाइटी’ (पूरा नाम- रॉयल एशियाटिक सोसाइटी ग्रेट ब्रिटेन एंड आयरलैंड) की स्थापना लंदन में 1823 ई. में की गई थी, न कि पेरिस में।"},{"ch":7,"page":478,"n":7,"q":"निम्नलिखित में से किसने कालिदास की प्रसिद्ध रचना ’शकुंतला’ का पहली बार अंग्रेजी में अनुवाद किया था?","o":["चार्ल्स विल्किंस ने","हेनरी कोलब्रुक ने","योहान वोल्फगांग फॉन गेटे ने","सर विलियम जोंस ने"],"a":[3],"t":["U.P.U.D.A./L.D.A. (Mains) 2010"],"e":"सर विलियम जोंस वॉरेन हेस्टिंग्स के समय कलकत्ता स्थित फोर्ट विलियम में उच्‍चतम न्यायालय के न्यायाधीश नियुक्त हुए। इनकी प्रेरणा पर 1784 ई. में कलकत्ता में एशियाटिक सोसाइटी की स्थापना हुई एवं ये स्वयं इसके सभापति नियुक्त हुए। इस संस्था ने ‘एशियाटिक रिसर्चेज’ नामक पत्रिका के माध्यम से भारत के अतीत को प्रकाश में लाने का कार्य किया। इसी क्रम में इन्होंने 1789 ई. में कालिदास रचित ‘अभिज्ञानशाकुंतलम्‌’ का अंग्रेजी में अनुवाद किया एवं इसके कई संस्करण/पुनर्मुद्रण बाद के वर्षों में प्रकाशित हुए।"},{"ch":7,"page":478,"n":9,"q":"ब्रिटिश सरकार के किस अधिनियम ने सबसे पहली बार भारत में शिक्षा के लिए एक लाख रुपये दिए थे?","o":["वुड्‌स का डिस्पैच‚ 1854","चार्टर अधिनियम‚ 1813","चार्टर अधिनियम‚ 1853","भारतीय परिषद अधिनियम‚ 1892"],"a":[1],"t":["U.P. P.C.S. (Mains) 2009"],"e":"1813 के चार्टर अधिनियम के तहत कंपनी ने पहली बार शिक्षा के प्रति सरकारी उत्तरदायित्व उठाया। प्रतिवर्ष शिक्षा के लिए एक लाख रुपये खर्च करने की व्यवस्था इस अधिनियम ने की थी।"},{"ch":7,"page":479,"n":14,"q":"हंटर कमीशन की रिपोर्ट में विकास पर विशेष जोर दिया गया -","o":["बािलकाओं की शिक्षा को","उच्‍च शिक्षा को","प्राथमिक शिक्षा को","तकनीकी शिक्षा को"],"a":[2],"t":["U.P. P.C.S. (Pre) 2004","U.P. Lower Sub. (Pre) 2004"],"e":"1854 ई. के पश्चात शिक्षा के क्षेत्र में हुई प्रगति की समीक्षा करने के लिए 1882 ई. में लॉर्ड रिपन ने डब्ल्यू. डब्ल्यू. हंटर की अध्यक्षता में प्रथम भारतीय शिक्षा आयोग नियुक्त किया गया। इस आयोग की रिपोर्ट में प्राथमिक शिक्षा के सुधार एवं विकास पर विशेष जोर दिया गया था।"},{"ch":7,"page":480,"n":17,"q":"सैडलर आयोग संबंधित था-","o":["न्यायपालिका से","राजस्व प्रशासन से","शिक्षा से","पुलिस प्रशासन से"],"a":[2],"t":["UP Lower Sub. (Spl.) (Pre) 2010"],"e":"सैडलर आयोग (पूरा नाम-कलकत्ता विश्वविद्यालय आयोग) शिक्षा से संबंधित था। वर्ष 1917 में ब्रिटिश सरकार ने कलकत्ता विश्वविद्यालय की संभावनाओं के अध्ययन तथा रिपोर्ट के लिए एक आयोग नियुक्त किया। डॉ. एम.ई. सैडलर‚ जो लीड्स‌ विश्वविद्यालय के कुलपति थे‚ इसके अध्यक्ष नियुक्त किए गए। इस आयोग का यह विचार था कि यदि विश्वविद्यालय शिक्षा का सुधार करना है‚ तो माध्यमिक शिक्षा का सुधार आवश्यक है। इसने वर्ष 1904 के विश्वविद्यालय अधिनियम की कड़ी निंदा की और यह भी बताया कि इससे कॉलेज तथा विश्वविद्यालय शिक्षा का ठीक-ठीक समन्वय नहीं हो सकता है।"},{"ch":7,"page":480,"n":21,"q":"लॉर्ड मैकाले संबंधित है-","o":["सेना के सुधार से","सती प्रथा की समाप्‍ति से","अंग्रेजी शिक्षा से","स्थायी बंदोबस्त से"],"a":[2],"t":["U.P.P.C.S. (Pre) 2007"],"e":"भारतीय शिक्षा पद्धति में भाषा संबंधी विवाद पर अपना विवरण देने के लिए विलियम बेंटिक ने अपनी कौंसिल के विधि-सदस्य लॉर्ड मैकाले को 1834 ई. में ‘लोक शिक्षा की सामान्‍य समिति’ (General Committee of Public Instruction) का प्रमुख नियुक्त किया। मैकाले ने भारत में शिक्षा हेतु अंग्रेजी भाषा का समर्थन किया था।"},{"ch":7,"page":480,"n":23,"q":"भारत की शैक्षणिक नीति में ‘फिल्टरेशन थ्योरी’ के प्रतिपादक थे-","o":["चार्ल्स वुड","मैकाले","जे.एस. मिल","कॉर्नवालिस"],"a":[1],"t":["U.P. Lower Sub. (Pre) 2013"],"e":"भारत के औपनिवेशिक काल में ‘अधोमुखी निस्यंदन सिद्धांत’ (The theory of downward filtration) शिक्षा के क्षेत्र से संबंधित था। इस सिद्धांत का अर्थ था कि शिक्षा समाज के उच्‍च वर्ग को ही दी जाए‚ इस वर्ग से छन-छनकर ही शिक्षा का असर जन सामान्य तक पहुंचे। मैकाले का कहना था कि सीमित साधनों से समस्त जनता को शिक्षित करना असंभव है।"},{"ch":7,"page":481,"n":26,"q":"किसने ईस्ट इंडिया कंपनी के बारे में यह टिप्पणी की कि ‘‘कंपनी एक असंगति है; परंतु यह उस व्यवस्था का भाग है‚ जहां सब कुछ ही असंगत है।’’?","o":["वॉरेन हेस्टिंग्स","टी.बी. मैकाले","लॉर्ड क्‍लाइव","हेनरी डुंडास"],"a":[1],"t":["U.P. P.C.S. (Pre) 2017"],"e":"लॉर्ड थॉमस बेबिंगटन मैकाले ब्रिटेन का राजनीतिज्ञ तथा इतिहासकार था। 1834 से 1838 ई. तक वह भारत के गवर्नर जनरल के काउंसिल (इसे सुप्रीम काउंसिल भी कहा जाता था) में लॉ मेंबर रहा। प्रसिद्ध दंड विधान ग्रंथ ‘द इंडियन पीनल कोड’ की पांडुलिपि इसी के निर्देशन में तैयार की गई थी। अंग्रेजी को भारत में शिक्षा का माध्यम और यूरोपीय साहित्य‚ दर्शन तथा विज्ञान को भारतीय शिक्षा का लक्ष्य बनाने में इसकी महत्वपूर्ण भूमिका थी। ईस्ट इंडिया कंपनी की नीतियों पर टिप्पणी करते हुए मैकाले ने 1833 ई. में अपने भाषण में कहा था कि ‘‘कंपनी एक असंगति है; परंतु यह उस व्यवस्था का भाग है‚ जहां सब कुछ ही असंगत है।’’"},{"ch":7,"page":481,"n":28,"q":"किसके शासनकाल में भारत में अंग्रेजी शिक्षा आरंभ की गई?","o":["लॉर्ड विलियम केवेंडिश बेंटिक","लॉर्ड हार्डिंग","लॉर्ड मिंटो","लॉर्ड डलहौजी"],"a":[0],"t":["U.P.P.C.S. (Mains) 2011"],"e":"ईस्ट इंडिया कंपनी ने ओरिएंटल शिक्षा की प्रचलित प्रणाली को हतोत्साहित किया तथा पश्चिमी शिक्षा और अंग्रेजी भाषा को बढ़ावा दिया। 1813 के चार्टर अधिनियम में भारत में शिक्षा के प्रसार के लिए प्रतिवर्ष एक लाख रुपये खर्च करने के प्रावधान को अपनाया गया। 1823 ई. में जनरल कमेटी ऑफ पब्लिक इंस्ट्रक्शन का गठन किया गया‚ जिसकी जिम्मेदारी शिक्षा के लिए एक लाख रुपये देने (Grant) की थी। समिति में 10 यूरोपीय सदस्य शामिल थे। लार्ड बेंटिक 1834 ई. में लॉर्ड मैकाले को इस कमेटी का अध्यक्ष बनाया गया। भारतीय शिक्षा नीति में सुधार करने तथा ‘प्राच्‍च पाश्चात्‍य विवाद’ (Orientalist-Anglicist Congtroversy) को सुलझाने के लिए मैकाले ने अपना विवरण पत्र (Macaulay's minute) प्रस्तुत किया, जिसे 7 मार्च, 1835 को विलियम बेंटिक ने स्वीकार कर लिया तथा प्रस्ताव के अनुरूप उच्‍च शिक्षा में अंग्रेजी माध्यम को प्राथमिकता दी। भारत में आंग्ल (Anglicist) शिक्षा के समर्थकों का नेतृत्व मुनरो एवं एल्‍फिंस्टन‚ जबकि एच.टी. प्रिंसेप प्राच्य (Orientalist) शिक्षा के समर्थकों के नेतृत्वकर्ता थे।"},{"ch":7,"page":482,"n":30,"q":"किसके सतत प्रयत्नों से बंबई में प्रथम महिला विश्वविद्यालय की स्थापना हुई?","o":["दयाराम गिंडुमल","डी.के. कर्वे","रमाबाई","महादेव गोविंद रानाडे"],"a":[1],"t":["U.P. U.D.A./L.D.A. (Pre) 2006","U.P. P.S.C. (GIC) 2010","U.P. P.C.S. (Mains) 2002"],"e":"डी.के. कर्वे के सतत प्रयत्नों से वर्ष 1916 में पुणे में प्रथम महिला विश्वविद्यालय की स्थापना हुई। वर्ष 1936 में यह विश्वविद्यालय पुणे से मुंबई स्थानांतरित हो गया। ये महाराष्ट्र के समाज सुधारक एवं सामाजिक कार्यकर्ता थे। इन्‍होंने विधवाओं के उत्‍थान के लिए विधवा विवाह प्रतिबंध निवारक मंडली की स्थापना की थी। 1896 ई. में उन्‍होंने पूना (पुणे) में ‘हिंदू विडो होम एसोसिएशन’ (कर्वे ने अपनी आत्‍मकथात्‍मक कृति ‘Looking Back’ में इस संस्था का नाम ‘अनाथ बालिका आश्रम’ लिखा है)की स्थापना की थी। उन्होंने स्वयं एक ब्राह्मणी विधवा से विवाह किया था। वर्ष 1958 में इन्हें ‘भारत रत्न’ प्रदान किया गया।"},{"ch":7,"page":482,"n":31,"q":"डेक्‍कन एजुकेशनल सोसाइटी की स्थापना से कौन संबंधित था?","o":["जस्टिस रानाडे","फिरोज शाह मेहता","बी.जी. तिलक","दयानंद सरस्वती"],"a":[2],"t":["U.P. P.C.S. (Pre) 2013","U.P. U.D.A./L.D.A. (Spl.) (Pre) 2010"],"e":"शिक्षा को सस्ती व सुगम बनाने हेतु वी.के. चिपलूणकर ने लोकमान्‍य तिलक और एम.बी. नामजोशी के साथ मिलकर पुणे में ‘न्‍यू इंग्‍लिश स्कूल’ की स्थापना की थी। आगे चलकर गोपाल गणेश अगरकर और बाल गंगाधर तिलक आदि ने मिलकर 24 अक्‍टूबर, 1884 ‘डेक्‍कन एजुकेशन सोसाइटी’ की स्थापना की तथा ‘न्‍यू इंग्‍लिश स्कूल’ को उसके प्रबंधन के अधीन कर दिया गया। डेक्‍कन एजुकेशन सोसाइटी से जुड़े प्रमुख नेताओं में शामिल थे- वी.के. चिपलूणकर, महादेव गोविंद रानाडे, एम.बी. नामजोशी, वी.एस. आप्‍टे, वी.बी. केलकर, एम.एस. गोले और एन.के. धराप। महादेव गोविंद रानाडे इस संस्था के सदस्य थे, किंतु इस संस्था के संस्थापक सदस्य नहीं थे।"},{"ch":7,"page":482,"n":32,"q":"मोहम्मडन एंग्लो-ओरिएंटल कॉलेज, अलीगढ़ की स्थापना निम्नलिखित में से किस वर्ष हुई?","o":["1876","1891","1875","1874"],"a":[2],"t":["U.P. R.O./ A.R.O. (Mains) 2016"],"e":"मोहम्मडन एंग्लो-ओरिएंटल कॉलेज की स्थापना सर सैयद अहमद खान ने 1875 ई. में अलीगढ़ में ‘मदरसातुल उलुम’ के नाम पर की थी। 1877 ई. में उन्होंने इसका नाम बदलकर ‘मोहम्मडन एंग्लो-ओरिएंटल कॉलेज’ रखा। आगे चलकर 1920 ई. में इस कॉलेज का नाम बदलकर ‘अलीगढ़ मुस्लिम विश्वविद्यालय’ कर दिया गया। चूंकि ‘मदरसातुल उलुम’ (1877 ई. में इसका नामकरण मोहम्मडन एंग्लो-ओरिएंटल कॉलेज) की स्थापना 1875 ई. हुई थी इसीलिए मोहम्मडन एंग्लो-ओरिएंटल कॉलेज का स्थापना वर्ष भी 1875 ई. ही माना जाता है।"},{"ch":7,"page":482,"n":34,"q":"निम्नलिखित कॉलेजों में सर्वप्रथम किसकी स्थापना हुई थी?","o":["हिंदू कॉलेज‚ कलकत्ता","दिल्‍ली कॉलेज","मेयो कॉलेज","मुस्लिम एंग्लो-ओरिएंटल कॉलेज"],"a":[0],"t":["U.P.P.C.S. (Pre) 2012"],"e":"राजा राममोहन राय आधुनिक शिक्षा के सबसे प्रारंभिक प्रचारकों में से एक थे। 1817 ई. में इन्होंने डेविड हेयर एवं राधाकांत देव के साथ मिलकर कलकत्ता में प्रसिद्ध हिंदू कॉलेज की स्थापना की थी। मेयो कॉलेज की स्थापना 1875 ई. में अजमेर में‚ मुस्लिम एंग्लो-ओरिएंटल कॉलेज की स्थापना 1875 ई. में अलीगढ़ में एवं दिल्‍ली कॉलेज की स्थापना 1825 ई. में हुई थी।"},{"ch":7,"page":482,"n":35,"q":"1817 में‚ डेविड हेअर द्वारा प्रसिद्ध हिंदू कॉलेज की स्थापना की गई थी-","o":["आगरा में","कलकत्ता में","पटना में","वाराणसी में"],"a":[1],"t":["U.P. R.O/A.R.O. (Mains), 2021"],"e":"राजा राममोहन राय आधुनिक शिक्षा के सबसे प्रारंभिक प्रचारकों में से एक थे। 1817 ई. में इन्होंने डेविड हेयर एवं राधाकांत देव के साथ मिलकर कलकत्ता में प्रसिद्ध हिंदू कॉलेज की स्थापना की थी। मेयो कॉलेज की स्थापना 1875 ई. में अजमेर में‚ मुस्लिम एंग्लो-ओरिएंटल कॉलेज की स्थापना 1875 ई. में अलीगढ़ में एवं दिल्‍ली कॉलेज की स्थापना 1825 ई. में हुई थी।"},{"ch":7,"page":484,"n":41,"q":"फोर्ट विलियम कॉलेज कलकत्ता के संदर्भ में‚ कौन-सा/से कथन सत्य है/हैं?\n1. इसकी स्थापना 10 जून‚ 1800 को कलकत्ता के फोर्ट विलियम कॉम्पलेक्स में हुई थी।\n2. इसकी स्थापना का मुख्य उद्देश्य ब्रिटिश अधिकारियों को भारतीय भाषाओं की शिक्षा देना था।\nनीचे दिए गए कूट का प्रयोग करके सही उत्तर का चयन कीजिए-\nकूट :","o":["केवल 1","केवल 2","1 और 2 दोनों","न तो 1 ना ही 2"],"a":[1],"t":["U.P.R.O./A.R.O. (Pre) 2021"],"e":"कलकता में ईस्ट इंडिया कंपनी के तत्कालीन गवर्नर जनरल वेलेजली द्वारा 1800 ई. में फोर्ट विलियम की स्थापना की गई थी। ध्यातव्य है कि फोर्ट विलियम कॉलेज के गठन से संबंधित कानूनी/प्रशासनिक विनियम 10 जुलाई, 1800 को स्वीकृत हुआ, जबकि कॉलेज की औपचारिक स्थापना 4 मई, 1800 को की गई थी। इस कॉलेज की स्थापना का मुख्य उद्देश्य ब्रिटिश सिविल सेवकों को भारत में प्रशासन हेतु फारसी और हिंदुस्तानी भाषा की शिक्षा देना था।"},{"ch":7,"page":484,"n":42,"q":"निम्नलिखित में से किसने भारतीय विश्वविद्यालयों में धार्मिक शिक्षा के लिए प्रबल रूप से वकालत की थी?","o":["बाल गंगाधर तिलक","स्वामी विवेकानंद","महात्मा गांधी","मदन मोहन मालवीय"],"a":[3],"t":["U.P. P.C.S. (Mains) 2005"],"e":"भारतीय विश्वविद्यालयों में धार्मिक शिक्षा की प्रबल वकालत मदन मोहन मालवीय ने की थी। हिंदू विश्वविद्यालय की परिकल्‍पना करते हुए उन्‍होंने शिक्षा के साथ धर्म-नीति और चरित्र निर्माण को जोड़ने पर बल दिया। वर्ष 1915 के बनारस हिंदू विश्वविद्यालय विधेयक पर बहस में मालवीय जी ने विश्वविद्यालय में धार्मिक शिक्षण के प्रावधान का समर्थन किया, जिसे उन्‍होंने नैतिक अनुशासन का आधार माना।"},{"ch":7,"page":484,"n":44,"q":"बनारस का सेंट्रल हिन्दू कॉलेज (Central Hindu College), जो आगे चल कर बनारस हिन्दू विश्वविद्यालय (BHU) का केन्द्र-बिन्दु बना, की स्थापना किसने की थी?","o":["स्वामी दयानन्द","बाल गंगाधर तिलक","एनी बेसेन्ट","मदन मोहन मालवीय"],"a":[2],"t":["U.P. R.O./A.R.O. (Re-Exam) (Pre) 2023"],"e":"उपर्युक्‍त प्रश्न की व्याख्या देखें।"},{"ch":7,"page":484,"n":45,"q":"बनारस हिंदू विश्वविद्यालय का शिलान्यास निम्न में से किसने किया था?","o":["मदन मोहन मालवीय","महाराजा विभूति नारायण सिंह","लॉर्ड हार्डिंग","एनी बेसेंट"],"a":[2],"t":["U.P. P.C.S. (Mains) 2003"],"e":"बनारस हिंदू विश्वविद्यालय का शिलान्यास 4 फरवरी‚ 1916 को तत्कालीन वायसराय लॉर्ड हार्डिंग II द्वारा किया गया था।"},{"ch":7,"page":484,"n":46,"q":"निम्नलिखित में से किसे सर्वप्रथम केंद्रीय विश्वविद्यालय घोषित किया गया?","o":["अलीगढ़ मुस्लिम विश्वविद्यालय‚ अलीगढ़","डॉ. भीमराव अम्बेडकर विश्वविद्यालय‚ लखनऊ","बनारस हिंदू विश्वविद्यालय‚ वाराणसी","इलाहाबाद विश्वविद्यालय"],"a":[2],"t":["U.P. P.C.S. (Mains) 2011"],"e":"दिए गए केंद्रीय विश्वविद्यालयों में से बनारस हिंदू विश्वविद्यालय‚ वाराणसी को सबसे पहले केंद्रीय विश्वविद्यालय का दर्जा प्रदान किया गया था। इसकी स्थापना (1916) का श्रेय महामना मदन मोहन मालवीय जी को जाता है।"},{"ch":8,"page":486,"n":2,"q":"भारत का पहला समाचार-पत्र था-","o":["बंगाल गजट","हिंदुस्तान टाइम्स","पायनियर","संवाद कौमुदी"],"a":[0],"t":["U.P. P.C.S. (Spl.) (Mains) 2004"],"e":"भारत का पहला समाचार-पत्र ‘बंगाल गजट’ था। प्रारंभ में विलियम बोल्ट्‌स द्वारा एक समाचार-पत्र के प्रकाशन का प्रयास किया गया था, परंतु ईस्ट इंडिया कंपनी ने उनको इंग्लैंड भेज दिया। 1780 ई. में जे.ए. हिक्‍की ने ‘बंगाल गजट’ (अन्‍य नाम- हिक्‍कीस बंगाल गजट, द ओरिजिनल कलकत्ता जनरल एडवरटाइजर) नामक समाचार-पत्र प्रकाशित करना आरंभ किया था। हिक्‍की को कंपनी की आलोचना करने के अपराध में सजा भी भुगतनी पड़ी थी; परंतु उसके पत्र ने अपनी नीति नहीं बदली। हिक्‍की के प्रेस को जब्त कर लिया गया और इस प्रकार से ‘बंगाल गजट’ का अंत हो गया।"},{"ch":8,"page":486,"n":3,"q":"भारत में प्रकाशित पहला समाचार-पत्र निम्नलिखित में से कौन-सा था?","o":["द बंगाल गजट","द कलकत्ता गजट","मद्रास कोरियर","बॉम्बे हेराल्ड"],"a":[0],"t":["U.P. U.D.A./L.D.A. (Spl.) (Mains) 2010"],"e":"भारत का पहला समाचार-पत्र ‘बंगाल गजट’ था। प्रारंभ में विलियम बोल्ट्‌स द्वारा एक समाचार-पत्र के प्रकाशन का प्रयास किया गया था, परंतु ईस्ट इंडिया कंपनी ने उनको इंग्लैंड भेज दिया। 1780 ई. में जे.ए. हिक्‍की ने ‘बंगाल गजट’ (अन्‍य नाम- हिक्‍कीस बंगाल गजट, द ओरिजिनल कलकत्ता जनरल एडवरटाइजर) नामक समाचार-पत्र प्रकाशित करना आरंभ किया था। हिक्‍की को कंपनी की आलोचना करने के अपराध में सजा भी भुगतनी पड़ी थी; परंतु उसके पत्र ने अपनी नीति नहीं बदली। हिक्‍की के प्रेस को जब्त कर लिया गया और इस प्रकार से ‘बंगाल गजट’ का अंत हो गया।"},{"ch":8,"page":486,"n":4,"q":"निम्न में से किसने सर्वप्रथम प्रेस सेंसरशिप लागू की थी?","o":["वेलेजली","हेस्टिंग्स","जॉन एडम्स","डलहौजी"],"a":[0],"t":["U.P. P.C.S. (Pre) 2001"],"e":"लॉर्ड वेलेजली ने 1799 ई. में सभी समाचार-पत्रों पर सेंसर लगा दिया। उसने मई, 1799 ई. में प्रेस विनियमन (Press Regulation) लागू किया और समाचार-पत्रों पर युद्धकालीन सेंसर लागू कर दिया। इसके अनुसार-\n1. समाचार-पत्र को संपादक‚ मुद्रक और स्वामी का नाम स्पष्ट रूप से छापना पड़ता था।\n2. प्रकाशक को प्रकाशित किए जाने वाले तत्वों को सरकार के सचिव के सम्मुख पूर्व-पत्रेक्षण के लिए भेजना होता था।"},{"ch":8,"page":486,"n":6,"q":"निम्नलिखित में से किसने वर्नाकुलर/वर्नाक्यूलर प्रेस एक्ट का प्रवर्तन किया?","o":["लॉर्ड लिटन","लॉर्ड रिपन","लॉर्ड कर्जन","लॉर्ड हेस्टिंग्‍स"],"a":[0],"t":["U.P. P.C.S. (Mains) 2007"],"e":"लॉर्ड रिपन ने 1882 ई. में वर्नाक्यूलर प्रेस एक्ट अथवा देशी भाषा प्रेस अधिनियम को निरस्त कर दिया और भारतीय भाषाओं के समाचार-पत्रों को अंग्रेजी भाषा के समाचार-पत्रों के समान ही स्वतंत्रता दे दी। ज्ञातव्य है कि वर्नाक्युलर प्रेस एक्ट‚ 1878 में लॉर्ड लिटन के कार्यकाल (1876-1880 ई.) में पारित हुआ था। इस अधिनियम को ‘मुंह बंद करने वाला अधिनियम’ कहा गया।"},{"ch":8,"page":487,"n":7,"q":"किस गवर्नर जनरल के समय भारतीय भाषा प्रेस अधिनियम समाप्‍त किया गया?","o":["लॉर्ड रिपन","लॉर्ड लिटन","लॉर्ड कर्जन","लॉर्ड डफरिन"],"a":[0],"t":["U.P. P.C.S. (Mains) 2009"],"e":"लॉर्ड रिपन ने 1882 ई. में वर्नाक्यूलर प्रेस एक्ट अथवा देशी भाषा प्रेस अधिनियम को निरस्त कर दिया और भारतीय भाषाओं के समाचार-पत्रों को अंग्रेजी भाषा के समाचार-पत्रों के समान ही स्वतंत्रता दे दी। ज्ञातव्य है कि वर्नाक्युलर प्रेस एक्ट‚ 1878 में लॉर्ड लिटन के कार्यकाल (1876-1880 ई.) में पारित हुआ था। इस अधिनियम को ‘मुंह बंद करने वाला अधिनियम’ कहा गया।"},{"ch":8,"page":488,"n":13,"q":"फारसी साप्‍ताहिक ‘मिरातुल अखबार’ को प्रकाशित करते थे-","o":["लाला लाजपत राय","राजा राममोहन राय","सर सैयद अहमद खां","मौलाना शिबली नोमानी"],"a":[1],"t":["U.P. P.C.S. (Pre) 2000"],"e":"राजा राममोहन राय ने अपने विचारों को प्रेस के माध्यम से प्रचारित एवं प्रसारित किया। दिसंबर‚ 1821 में उन्होंने बांग्ला साप्‍ताहिक ‘संवाद कौमुदी’ अथवा ‘प्रज्ञा का चांद’ का प्रकाशन प्रारंभ किया। इसके एक वर्ष पश्चात इन्होंने फारसी भाषा में एक अन्य साप्‍ताहिक समाचार-पत्र ‘मिरातुल अखबार’ या ‘खबरों का दर्पण’ (Mirror of News) का प्रकाशन प्रारंभ किया। जॉन एडम जब कार्यवाहक गवर्नर जनरल था‚ तब (1823 ई. में) उसने भारतीय प्रेस पर लाइसेंस संबंधी प्रावधानों को और अधिक कठोर बना दिया। लाइसेंस के बिना प्रकाशन करने पर चार सौ रुपये जुर्माना या कारावास का दंड दिया जा सकता था। मजिस्ट्रेट को मुद्रणालय जब्त करने का भी अधिकार था। यह नियम मुख्य रूप से भारतीय भाषाओं तथा भारतीयों द्वारा संपादित एवं उनके स्वामित्व वाले पत्रों के लिए था। इसी कारण राजा राममोहन राय को साप्‍ताहिक समाचार-पत्र ‘मिरातुल अखबार’ का प्रकाशन बंद करना पड़ा था।"},{"ch":8,"page":488,"n":14,"q":"1880 के दशक में ‘इंडियन मिरर’ अखबार का प्रकाशन कहां से होता था?","o":["बंबई","कलकत्ता","मद्रास","पांडिचेरी"],"a":[1],"t":["U.P. P.C.S. (Mains) 2007"],"e":"‘इंडियन मिरर’ अखबार का प्रकाशन कलकत्ता से होता था। ‘इंडियन मिरर’ का प्रारंभ (1861 ई.) मनमोहन घोष ने देबें‍द्रनाथ टैगोर द्वारा प्रदत्त आर्थिक सहायता से किया था। केशव चंद्र सेन तथा नरेंद्र नाथ सेन इसके संपादकीय विभाग में थे। यह प्रारंभ में पाक्षिक (14-15 दिन में) रूप से प्रकाशित होता था, किंतु बाद में यह दैनिक रूप से प्रकाशित होने लगा।"},{"ch":8,"page":488,"n":15,"q":"गदर पत्र का प्रथम अंक निम्नलिखित में से किस भाषा में प्रकाशित हुआ?","o":["उर्दू","हिंदी","अंग्रेजी","मराठी"],"a":[0],"t":["U.P. P.C.S. (Mains) 2007"],"e":"1 नवंबर‚ 1913 को ‘गदर’ समाचार-पत्र का पहला अंक प्रकाशित हुआ‚ जो ‘उर्दू’ भाषा में था। 9 दिसंबर‚ 1913 से यह गुरुमुखी में भी छपने लगा। यह पत्र मराठी‚ हिंदी‚ अंग्रेजी‚ गुजराती आदि भाषाओं में भी प्रकाशित हुआ। इसका एक अंक पख्तूनी (पश्तो) भाषा में भी छपा था।"},{"ch":8,"page":488,"n":16,"q":"गदर पार्टी का पत्र ‘गदर’ था-","o":["एक मासिक-पत्र","एक पाक्षिक-पत्र","एक साप्‍ताहिक-पत्र","एक दैनिक-पत्र"],"a":[2],"t":["U.P.P.C.S. (Mains) 2013"],"e":"भारत को ब्रिटिश राज से मुक्त कराने हेतु संयुक्त राज्य अमेरिका और कनाडा में रहने वाले भारतीयों लाला हरदयाल‚ सोहन सिंह भाकना और पं. कांशीराम आदि ने मिलकर हिंदुस्तान गदर पार्टी (गदर पार्टी) की स्थापना की थी। इस पार्टी का मुखपत्र ‘गदर’ एक साप्‍ताहिक-पत्र था‚ जिसके प्रथम संस्करण का प्रकाशन 1 नवंबर‚ 1913 को सैन फ्रांसिस्को से किया गया था।"},{"ch":8,"page":489,"n":19,"q":"लोकमान्य बाल गंगाधर तिलक ने भारतीय स्वतंत्रता संग्राम की सेवा के उद्देश्य से कौन-सा समाचार-पत्र प्रारंभ किया था?","o":["गदर","केसरी","फ्री हिंदुस्तान","स्वदेश मित्र"],"a":[1],"t":["Uttarakhand P.C.S. (Pre) 2010","M.P.P.C.S. (Pre) 2008","U.P. P.C.S. (Pre) 1990"],"e":"लोकमान्य बाल  गिरफ्तारी के बाद, इसका दायित्‍व महात्‍मा गांधी के हाथों में सौंप दिया गया। ‘यंग इंडिया’ 7 मई‚ 1919 से महात्मा गांधी के पर्यवेक्षण में बंबई से द्वि-साप्‍ताहिक के रूप में प्रकाशित होता था। इसके प्रारंभिक संस्करणों में जमनादास द्वारकादास इसके संपादक रहे। 8 अक्टूबर‚ 1919 से यंग इंडिया के संपादक महात्मा गांधी बने और यह अहमदाबाद से साप्‍ताहिक रूप में प्रकाशित होने लगा। जमनादास द्वारकादास तथा शंकरलाल बैंकर‚ एनी बेसटें की होमरूल लीग के सदस्य थे।"},{"ch":8,"page":490,"n":30,"q":"हिंदी का पहला समाचार-पत्र ‘उदन्‍त मार्तंड’ (30 मई‚ 1826) प्रकाशित हुआ था-","o":["कोलकाता से","पटना से","इलाहाबाद से","लखनऊ से"],"a":[0],"t":["U.P.P.C.S. (Mains) 2016"],"e":"उदन्त मार्तंड हिंदी का पहला समाचार-पत्र था। इसका प्रकाशन 30 मई‚ 1826 को कोलकाता से एक साप्‍ताहिक-पत्र के रूप में शुरू हुआ। इसके प्रकाशक एवं संपादक पं. जुगल किशोर शुक्‍ल थे।"},{"ch":8,"page":490,"n":31,"q":"भारतीयों द्वारा अंग्रेजी भाषा में प्रकाशित प्रथम समाचार-पत्र था-","o":["हिंदू पैट्रियाट","दि हिंदू","यंग इंडिया","नेटिव ओपीनियन"],"a":[0],"t":["U.P. P.C.S. (Mains) 2006"],"e":"किसी भी भारतीय द्वारा अंग्रेजी में प्रकाशित प्रथम समाचार-पत्र गंगाधर भट्टाचार्य का साप्‍ताहिक ‘बंगाल गजट’ था। दिए गए विकल्पों में हिंदू पैट्रियाट भारतीयों द्वारा अंग्रेजी में प्रकाशित प्रथम समाचार-पत्र था। इसका प्रकाशन 1853 ई. में हुआ। इस समाचार-पत्र के प्रथम संपादक गिरीश चंद्र घोष (1853-55 ई.) थे। हरिश चंद्र मुखर्जी (1855-61 ई.) एवं क्रिस्टो पाल दास (1861-1884 ई.) भी इसके संपादक रहे थे। सुरेन्‍द्रनाथ बनर्जी ने अपनी पुस्तक ‘ए नेशन इन मेकिंग’ में उन्‍होंने उल्‍लेख किया है कि वे 1874-75 ई. के बीच लंदन में तथा 1877 ई. में दिल्‍ली में इस पत्र के संवाददाता बने थे। बाद में ब्रिटिश इंडियन एसोसिएशन ने इसे खरीद लिया। अब यह भूस्वामियों के हितों का प्रतिनिधित्व करने लगा और राष्ट्र हितों से अलग हो गया।"},{"ch":8,"page":490,"n":32,"q":"नील आंदोलन का जमकर समर्थन करने वाले ‘हिंदू पैट्रियाट’ के संपादक थे-","o":["हेम चंद्राकर","हरिश्चंद्र मुखर्जी","दीनबंधु मित्र","दिगंबर विश्वास"],"a":[1],"t":["U.P. P.C.S. (Pre) 1998"],"e":"नील आंदोलन की एक खास बात यह थी कि बंगाल के उस समय के बुद्धिजीवियों ने भी इसमें सक्रिय भूमिका निभाई थी और संघर्षरत किसानों के समर्थन में सशक्त अभियान चलाया था। नील आंदोलन इतिहास में अपनी मांगों को लेकर किए गए आंदोलनों में सर्वाधिक व्यापक और जुझारू था। बंगाल का नील विद्रोह शोषण के विरुद्ध किसानों की सीधी लड़ाई थी। ‘हिंदू पैट्रियाट’ के संपादक हरिश चंद्र मुखर्जी ने तो इस आंदोलन में काफी काम किया। हिंदू पैट्रियाट के पहले दो वर्षों (1853-55 ई.) में गिरीश चंद्र घोष संपादक थे। 1855 ई. में हरिश चंद्र मुखर्जी इसके संपादक हो गए। वह निर्भीकता से बागान-मालिकों के अत्याचारों की पोल खोलने तथा सताए हुए किसानों की सहायता में लगे रहे। 1861 ई. में क्रिस्टो दास पाल इसके संपादक बने। वह ब्रिटिश शासन के प्रशंसक थे और ब्रिटिश उदारवाद का प्रतिपादन करते थे। उनके प्रभाव में हिंदू पैट्रियाट उच्‍च-मध्यम वर्गीय बंगाली जमींदारों के हितों का प्रतिनिधित्व करता था।"},{"ch":8,"page":491,"n":33,"q":"अंग्रेजी साप्‍ताहिक ‘वंदे मातरम्‌’ के साथ निम्नांकित में से किसने अपने को संबद्ध किया?","o":["अरबिंद घोष","एम.जी.रानाडे","सुभाष चंद्र बोस","लोकमान्य तिलक"],"a":[0],"t":["U.P. P.C.S. (Pre) 1996"],"e":"अंग्रेजी साप्‍ताहिक ‘वंदे मातरम्’‌ के साथ अरबिंद घोष संपादक के रूप में जुड़े थे।"},{"ch":8,"page":491,"n":35,"q":"‘स्वदेशवाहिनी’ के संपादक थे-","o":["सी.वी. रामन पिल्‍लै","सी.एन. मुदालियार","के. रामकृष्ण पिल्‍लै","सी.आर. रेड्डी"],"a":[2],"t":["U.P. P.C.S. (Pre) 2005"],"e":"‘स्वदेशाभिमानी’ के संपादक के. रामकृष्ण पिल्‍लै थे। के. रामकृष्ण पिल्‍लै का जन्म 1878 ई. में तत्कालीन ट्रावनकोर/त्रावणकोर राज्य के नेयात्तीनकारा के नायर परिवार में हुआ था। दिए गए प्रश्न में ‘स्वदेशवाहिनी’ का उल्‍लेख किया गया है, जो कि त्रुटिपूर्ण है।"},{"ch":8,"page":491,"n":36,"q":"अंग्रेजी पत्र ‘इंडिपेंडेंट’ जुड़ा था-","o":["महात्मा गांधी से","सी.आर. दास से","जवाहरलाल नेहरू से","मोतीलाल नेहरू से"],"a":[3],"t":["U.P. P.C.S. (Mains) 2012"],"e":"भारत के लिए स्वशासन की मांग करते हुए मोतीलाल नेहरू ने अंग्रेजी दैनिक समाचार-पत्र ‘दि इंडिपेंडेंट’ प्रारंभ किया था।"},{"ch":8,"page":491,"n":37,"q":"सूची-I को सूची-II से सुमेलित कीजिए तथा सूचियों के नीचे दिए गए कूट से सही उत्तर का चयन कीजिए-\nसूची-I सूच ains) 2008","U.P. U.D.A./L.D.A. (Spl.) (Pre) 2010","U.P. U.D.A./L.D.A. (Spl.) (Mains) 2010"],"e":"भारतीय ब्रह्म समाज के संस्थापक केशव चंद्र सेन थे। देबेंद्रनाथ ने 1865 ई. में केशव चंद्र सेन से आचार्य की उपाधि छीन ली। फलस्वरूप केशव चंद्र सेन मौलिक ब्रह्म समाज से अलग हो गए और देबेंद्रनाथ टैगोर के तहत समाज की मूल शाखा ने स्वयं को ‘आदि ब्रह्म समाज’ के नाम से पुकारा। आचार्य केशव चंद्र सेन के नेतृत्व वाले गुट ने अपने को ‘भारतीय ब्रह्म समाज’ या ‘नवीन ब्रह्म समाज’ का नाम दिया। 1878 ई. में ‘नवीन ब्रह्म समाज’ में पुन: फूट पड़ी‚ जब केशव चंद्र सेन द्वारा अपनी 14 वर्ष से कम आयु की पुत्री का विवाह कूच बिहार के राजा से किए जाने के विरोध में आनंद मोहन बोस, उमेश चंद्र दत्त, शिवनाथ शास्त्री आदि लोगों द्वारा ‘साधारण ब्रह्म समाज’ की स्थापना की गई। नोट : 20 अगस्त‚ 1828 को राजा राममोहन राय ने फेरंजी कमल बोस के मकान (जो इस कार्य हेतु किराए पर लिया गया था) में ब्रह्म समाज की स्थापना की थी। ताराचंद चक्रवर्ती इसके प्रथम सचिव थे। देबेंद्रनाथ टैगोर इस समाज में 1843 ई. में तथा केशव चंद्र सेन 1857 ई. में सम्मिलित हुए। देबेंद्रनाथ टैगोर एवं केशव चंद्र सेन के मध्य वैचारिक मतभेद होने पर जब 11 नवंबर‚ 1866 को केशव चंद्र सेन ने औपचारिक रूप से पृथक ब्रह्म समाज का गठन किया‚ तो इसका नामकरण ‘भारतीय ब्रह्म समाज’ (Brahmo Samaj of India) किया गया। जबकि पूर्व स्थापित ब्रह्म समाज को ‘आदि ब्रह्म समाज’ के नाम से जाना गया। ब्रह्म समाज की मूल वेबसाइट www. the brahmosamaj.net‚ गजेटियर ऑफ इंडिया (Vol-II : इतिहास एवं संस्कृति) एवं मैकमिलन प्रकाशित ‘भारत का सामाजिक‚ सांस्कृतिक और आर्थिक इतिहास’(लेखक-बी.एन. पुरी‚ एम.एन. दास‚ पी.एन. चोपड़ा) में ये तथ्य दर्शित हैं। बाद में इतिहास लेखन के दौरान प्रख्यात इतिहासविदों प्रो. बी.एल. ग्रोवर एवं प्रो. आर.एल. शुक्‍ल आदि ने आधुनिक भारतीय इतिहास की अपनी पुस्तकों में पता नहीं क्यों केशव चंद्र सेन के नवीन ब्रह्म समाज को ‘आदि ब्रह्म समाज’ बताया। वर्ष 2022 में MPPSC विवाद में विशेषज्ञ समिति और मध्य प्रदेश उच्‍च न्‍यायालय ने ब्रह्म समाज की वेबसाइट और गजेटियर ऑफ इंडिया (Vol-II) के आधार पर इस तथ्य को स्वीकार किया कि 1866 ई. में ब्रह्म समाज में हुए विभाजन के उपरांत यह दो गुटों में बंट गया जिसमें ‘आदि ब्रह्म समाज’ का नेतृत्‍व देबेन्‍द्र नाथ टैगोर ने तथा ‘भारतीय ब्रह्म समाज’ का नेतृत्‍व केशवचंद्र सेन ने किया था।"},{"ch":9,"page":503,"n":24,"q":"ब्रह्म समाज का सिद्धांत आधारित है-","o":["नास्तिकता पर","अद्वैतवाद पर","एकदेववाद पर","बहुदेववाद पर"],"a":[2],"t":["U.P. P.C.S. (Pre) 1999","U.P. P.C.S. (Pre) 2005"],"e":"1828 ई. में राजा राममोहन राय ने ब्रह्म समाज की नींव डाली। ब्रह्म समाज की स्थापना का उद्देश्य था- एकेश्वरवाद की उपासना‚ मूर्ति पूजा का विरोध तथा अवतारवाद का खंडन। ब्रह्म समाज ने सार्वभौम ईश्वर की उपासना पर बल दिया।"},{"ch":9,"page":503,"n":25,"q":"राजा राममोहन राय ने निम्न में किसका विरोध नहीं किया था?","o":["बाल विवाह","सती प्रथा","पाश्चात्य शिक्षा","मूर्ति पूजा"],"a":[2],"t":["U.P. P.C.S. (Pre) 1992"],"e":"शिक्षा के क्षेत्र में राजा राममोहन राय अंग्रेजी शिक्षा के पक्षधर थे। उनके अनुसार‚ एक उदारवादी पाश्चात्य शिक्षा ही अज्ञान के अंधकार से हमें निकाल सकती है और भारतीयों को देश के प्रशासन में भाग दिला सकती है।"},{"ch":9,"page":503,"n":26,"q":"निम्न में से किसे राममोहन राय के धार्मिक/सामाजिक विचारों के विरोध में प्रारंभ किया गया?","o":["दिग्दर्शन","समाचार चन्द्रिका","संवाद कौमुदी","बंगाल गजट"],"a":[1],"t":["U.P. P.C.S. (Mains) 2017"],"e":"राममोहन राय के धार्मिक और सामाजिक विचारों के विरोध में भवानीचरण बंधोपाध्याय ने 1822 ई. में समाचार चन्द्रिका (पत्रिका) का प्रकाशन शुरू किया। इससे पूर्व वे संवाद कौमुदी के संपादक थे।"},{"ch":9,"page":503,"n":29,"q":"नीचे दो कथन दिए गए हैं‚ जिसमें से एक को अभिकथन (A) और दूसरे को कारण (R) कहा गया है :\nअभिकथन (A) : ‘संवाद कौमुदी’‚ एक बंगाली साप्‍ताहिक के संपादक राजा राम मोहन राय थे।\nकारण (R) : विधवा जलाने की प्रथा की निंदा करते हुए उनके लेख इसमें प्रकाशित हुए थे।\nनीचे दिए गए कूट से सही उत्तर का चुनाव कीजिए -\nकूट :","o":["(A) और (R) दोनों सत्य हैं और (R), (A) की सही व्याख्या करता है।","(A) असत्य है‚ किंतु (R) सत्य है।","(A) और (R) दोनों सत्य हैं‚ किंतु (R), (A) की सही व्याख्या नहीं करता है।","(A) सत्य है‚ किंतु (R) असत्य है।"],"a":[1],"t":["U.P. R.O./A.R.O. (Pre) 2023"],"e":"4 दिसंबर‚ 1821 में राजा राममोहन राय ने ‘संवाद कौमुदी’ नामक बांग्ला साप्‍ताहिक समाचार-पत्र प्रारंभ किया। दिलचस्प बात यह है कि इस अखबार के क्रेडिट में राजा राममोहन राय का नाम नहीं था। इसके बजाय‚ अखबार को शुरुआती तौर पर भवानीचरण बंदोपाध्याय द्वारा संपादित किया गया था। जिसमें दीवान ताराचंद दत्त उनके सहायक/सह-संपादक के रूप में कार्यरत थे। यह अखबार न केवल सती-दाह (विधवा जलाने की प्रथा) को खत्म करने के आंदोलन में सबसे आगे था‚ बल्कि इसने कई अन्य प्रगतिशील मूल्यों जैसे- महिला शिक्षा‚ जाति आधारित उत्पीड़न‚ सामाजिक सुधारों आदि का समर्थन किया। सती-दाह की निंदा करते हुए राजा राममोहन राय के कई लेख इसमें प्रकाशित हुए थे।"},{"ch":9,"page":504,"n":32,"q":"विवेकानंद नेिशकागो में आयोजित ‘पार्लियामेंट ऑफ वल्ड्‌र्स रिलीजन्स’ में भाग लिया था-","o":["1872 में","1890 में","1893 में","1901 में"],"a":[2],"t":["U.P. P.C.S. (Pre) 2015"],"e":"रामकृष्ण परमहंस की शिक्षाओं की व्याख्या को साकार करने का श्रेय स्वामी विवेकानंद (1863-1902 ई.) को है। उन्होंने इस शिक्षा का साधारण भाषा में वर्णन किया। स्वामी विवेकानंद इस नवीन हिंदू धर्म (Neo-Hinduism) के प्रचारक के रूप में उभरे। 1893 ई. में वे शिकागो गए जहां उन्होंने ‘पार्लियामेंट ऑफ द वर्ल्ड रिलीजन्स’ (विश्व धर्म संसद) में अपना सुप्रसिद्ध भाषण दिया। इस भाषण से उन्होंने पश्चिमी संसार के सामने भारत की संस्कृति की महत्ता को प्रभावकारी तरीके से प्रस्तुत किया। उन्‍नीसवीं शताब्दी के उत्तरार्द्ध में स्वामी विवेकानंद नव-हिंदूवाद के सर्वश्रेष्ठ प्रतिनिधि थे।"},{"ch":9,"page":504,"n":34,"q":"वर्ष 1893 में शिकागो में आयोजित अंतरराष्ट्रीय धर्मों की संसद से किसका नाम जुड़ा है?","o":["स्वामी दयानंद सरस्वती","रामकृष्ण परमहंस","स्वामी विवेकानंद","राममोहन राय"],"a":[2],"t":["M.P. P.C.S. (Pre) 1993","U.P.P.C.S. (Spl.) (Mains) 2004"],"e":"मध्य प्रदेश लोक सेवा आयोग ने प्रश्न को गलत मानते हुए इसके लिए बोनस अंक दिया है। सही उत्तर के लिए"},{"ch":9,"page":504,"n":35,"q":"किस वर्ष स्वामी विवेकानंद ने ‘विश्व धर्म संसद’ में भाग लिया?","o":["1893","1895","1897","1899"],"a":[0],"t":["U.P. P.C.S. (Spl.) (Pre) 2008"],"e":"मध्य प्रदेश लोक सेवा आयोग ने प्रश्न को गलत मानते हुए इसके लिए बोनस अंक दिया है। सही उत्तर के लिए"},{"ch":9,"page":505,"n":38,"q":"इनमें से किस प्रख्यात समाज सुधारक ने ज्ञानयोग‚ कर्मयोग तथा राजयोग नामक पुस्तकें लिखीं?","o":["स्वामी विवेकानंद","रानाडे","राजा राममोहन राय","रामकृष्ण परमहंस"],"a":[0],"t":["U.P. Lower Sub. (Pre) 2015"],"e":"स्वामी विवेकानंद ने ज्ञानयोग‚ कर्मयोग तथा राजयोग नामक पुस्तकें लिखीं। 1893 ई. में वे शिकागो गए‚ जहां उन्होंने ‘पार्लियामेंट ऑफ द वर्ल्ड रिलीजन्स’ (विश्व धर्म संसद) में अपना सुप्रसिद्ध भाषण दिया। 1897 ई. में इन्होंने ‘रामकृष्ण मिशन’ की स्थापना की।"},{"ch":9,"page":505,"n":39,"q":"रामकृष्ण मिशन की स्थापना किसने की थी?","o":["रामकृष्ण परमहंस","एम.एन. दासगुप्‍ता","स्वामी विवेकानंद","स्वामी रंगनाथनंद"],"a":[2],"t":["M.P. P.C.S. (Pre) 1996","U.P. P.C.S. (Mains) 2004"],"e":"रामकृष्ण मिशन की स्थापना स्वामी विवेकानंद ने 1 मई, 1897 को कलकत्ता के बलराम बसु के घर पर की थी (1909 में 1860 के सोसाइटी पंजीकरण अधिनियम XXI के अंतर्गत इसे विधिवत औपचारिक रूप से पंजीकृत कराया गया)। वर्तमान समय में रामकृष्ण मिशन का मुख्यालय हावडा के बेलूर में है।"},{"ch":9,"page":505,"n":46,"q":"‘‘ईश्वर के बारे में सोचने के लिए मेरे पास वक्त नहीं है; क्योंकि अभी इस धरती पर ही बहुत काम किया जाना है;’’ उपर्युक्त कथन किसका है?","o":["स्वामी विवेकानंद","स्वामी दयानंद सरस्वती","स्वामी रामकृष्ण परमहंस","स्वामी ईश्वरचंद्र विद्यासागर"],"a":[3],"t":["U.P. R.O./ A.R.O. (Re-Exam) (Pre) 2016"],"e":"ईश्वर है या नहीं यह पूछे जाने पर विद्यासागर का जवाब था- ‘‘ईश्वर के बारे में सोचने के लिए मेरे पास वक्त नहीं है; क्योंकि अभी इस धरती पर ही बहुत काम किया जाना है।’’"},{"ch":9,"page":506,"n":49,"q":"आर्य समाज की स्थापना का वर्ष है-","o":["1865","1870","1875","1880"],"a":[2],"t":["U.P. Lower sub. (Pre) 2009"],"e":"दयानंद सरस्वती (मूलशंकर) ने अप्रैल‚ 1875 में बंबई में आर्य समाज की स्थापना की‚ जिसका मुख्य उद्देश्य प्राचीन वैदिक धर्म की शुद्ध रूप से पुन: स्थापना करना था। आर्य समाज आंदोलन का प्रसार प्राय: पाश्चात्य प्रभावों की प्रतिक्रिया के रूप में हुआ। 1877 ई. में आर्य समाज का मुख्यालय लाहौर में स्थापित किया गया‚ जिसके उपरांत आर्य समाज का अधिक प्रचार हुआ।"},{"ch":9,"page":506,"n":51,"q":"वेदों के पुनरुत्थान का श्रेय किसे है?","o":["रामकृष्ण परमहंस","रामानुज","स्वामी दयानंद सरस्वती","स्वामीिववेकानंद"],"a":[2],"t":["U.P. P.C.S. (Pre) 1995"],"e":"आर्य समाज के संस्थापक स्वामी दयानंद सरस्वती शुद्ध वैदिक परंपरा में विश्वास करते थे। उन्होंने पुन: ‘वेदों की ओर लौटो’ का नारा दिया। स्वामी दयानंद ने वेदों को सर्वोच्‍च माना और मूर्ति पूजा, बहुदेववाद, कर्मकांड तथा वेद-विरुद्ध मानी गई बाद की परंपराओं/मतों की आलोचना की। 1867 ई. में उन्होंने हरिद्वार में झूठे धर्मों का खंडन करने के लिए ‘पाखंड खंडिनी पताका’ लहराई। स्वामी दयानंद सरस्वती वेदों को ‘भारत के आधार स्तंभ’ के रूप में देखते थे। उनका विश्वास था कि हिंदू धर्म और वेद जिस पर भारत का पुरातन समाज टिका था‚ शाश्वत‚ अपरिवर्तनीय‚ धर्मातीत तथा दैवीय हैं। इसलिए उन्होंने ‘वेदों की ओर लौटो’ तथा ‘वेद ही समस्त ज्ञान के स्रोत हैं’ का नारा दिया। स्वामी दयानंद को उनके धार्मिक सुधार प्रयासों के कारण ‘भारत का मार्टिन लूथर’ कहा जाता है।"},{"ch":9,"page":506,"n":53,"q":"निम्न में से कौन ‘भारत का मार्टिन लूथर’ कहलाता है?","o":["स्वामी दयानंद सरस्वती","राजा राममोहन राय","स्वामी विवेकानंद","स्वामी श्रद्धानंद"],"a":[0],"t":["U.P. P.C.S. (Mains) 2005","Uttarakhand U.D.A./L.D.A. (Pre) 2007"],"e":"आर्य समाज के संस्थापक स्वामी दयानंद सरस्वती शुद्ध वैदिक परंपरा में विश्वास करते थे। उन्होंने पुन: ‘वेदों की ओर लौटो’ का नारा दिया। स्वामी दयानंद ने वेदों को सर्वोच्‍च माना और मूर्ति पूजा, बहुदेववाद, कर्मकांड तथा वेद-विरुद्ध मानी गई बाद की परंपराओं/मतों की आलोचना की। 1867 ई. में उन्होंने हरिद्वार में झूठे धर्मों का खंडन करने के लिए ‘पाखंड खंडिनी पताका’ लहराई। स्वामी दयानंद सरस्वती वेदों को ‘भारत के आधार स्तंभ’ के रूप में देखते थे। उनका विश्वास था कि हिंदू धर्म और वेद जिस पर भारत का पुरातन समाज टिका था‚ शाश्वत‚ अपरिवर्तनीय‚ धर्मातीत तथा दैवीय हैं। इसलिए उन्होंने ‘वेदों की ओर लौटो’ तथा ‘वेद ही समस्त ज्ञान के स्रोत हैं’ का नारा दिया। स्वामी दयानंद को उनके धार्मिक सुधार प्रयासों के कारण ‘भारत का मार्टिन लूथर’ कहा जाता है।"},{"ch":9,"page":506,"n":54,"q":"‘सत्यार्थ प्रकाश’ की रचना की गई थी-","o":["राजा राममोहन राय द्वारा","महात्मा गांधी द्वारा","स्वामी विवेकानंद द्वारा","स्वामी दयानंद सरस्वती द्वारा"],"a":[3],"t":["47th B.P.S.C. (Pre) 2005","Uttarakhand P.C.S. (Mains) 2006","U.P.R.O./A.R.O. (Mains) 2013"],"e":"मूलशंकर (स्वामी दयानंद) का जन्म 1824 ई. में गुजरात की मोरबी रियासत (काठियावाड़ क्षेत्र) के टंकारा (Tankara) में एक ब्राह्मण कुल में हुआ था। उन्होंने 1860 ई. में मथुरा में स्वामी विरजानंद जी से वेदों के शुद्ध अर्थ तथा वैदिक धर्म के प्रति अगाध श्रद्धा प्राप्‍त की। 1867 ई. में उन्होंने ‘पाखंड खंडिनी पताका’ लहराई। 1875 ई. में उन्होंने बंबई में आर्य समाज की स्थापना की। उनके विचार उनकी प्रसिद्ध पुस्तक ‘सत्यार्थ प्रकाश’ में वर्णित हैं। उनकी अन्य रचनाओं में‚ ऋग्वेदादीभाष्यभूमिका‚ अद्वैतमत खंडन‚ पंच महायज्ञ विधि वेदविरूद्धमतखंडनम्‌‚ पाखंड-खंडन (अन्‍य नाम वैष्णव मत खण्डन, भागवतखण्डनम्) आदि प्रमुख हैं।"},{"ch":9,"page":506,"n":55,"q":"‘सत्यार्थ प्रकाश’ किसके द्वारा लिखा गया है?","o":["राजा राममोहन राय","बाल गंगाधर तिलक","स्वामी विवेकानंद","दयानंद सरस्वती"],"a":[3],"t":["U.P. P.C.S. (Mains) 2017"],"e":"मूलशंकर (स्वामी दयानंद) का जन्म 1824 ई. में गुजरात की मोरबी रियासत (काठियावाड़ क्षेत्र) के टंकारा (Tankara) में एक ब्राह्मण कुल में हुआ था। उन्होंने 1860 ई. में मथुरा में स्वामी विरजानंद जी से वेदों के शुद्ध अर्थ तथा वैदिक धर्म के प्रति अगाध श्रद्धा प्राप्‍त की। 1867 ई. में उन्होंने ‘पाखंड खंडिनी पताका’ लहराई। 1875 ई. में उन्होंने बंबई में आर्य समाज की स्थापना की। उनके विचार उनकी प्रसिद्ध पुस्तक ‘सत्यार्थ प्रकाश’ में वर्णित हैं। उनकी अन्य रचनाओं में‚ ऋग्वेदादीभाष्यभूमिका‚ अद्वैतमत खंडन‚ पंच महायज्ञ विधि वेदविरूद्धमतखंडनम्‌‚ पाखंड-खंडन (अन्‍य नाम वैष्णव मत खण्डन, भागवतखण्डनम्) आदि प्रमुख हैं।"},{"ch":9,"page":507,"n":59,"q":"निम्नलिखित संगठनों में से किसने शुद्धि आंदोलन का समर्थन किया?","o":["आर्य समाज","ब्रह्म समाज","देव समाज","प्रार्थना समाज"],"a":[0],"t":["U.P. P.C.S. (Pre) 2010"],"e":"स्वामी दयानंद सरस्वती द्वारा 1875 ई. में बंबई में स्थापित आर्य समाज ने धर्म परिवर्तित हिंदुओं की हिंदू धर्म में वापसी हेतु शुद्धि आंदोलन का समर्थन किया था।"},{"ch":9,"page":507,"n":60,"q":"नीचे दो कथन दिए गए हैं, एक को कथन (A) तथा दूसरे को कारण (R) के रूप में दिया गया है।\nकथन (A) : आर्य समाज आंदोलन ने हिंदुओं में आत्मविश्वास और आत्मनिर्भरता प्रदान किया।\nकारण (R) : आर्य समाज आंदोलन ने श्वेत जाति की श्रेष्ठता में विश्वास की जड़ों को कमजोर किया।\nनीचे दिए गए कूट से सही उत्तर का चयन कीजिए-\nकूट :","o":["(A) और (R) दोनों सही हैं और (R), (A) की सही व्याख्या करता है।","(A) और (R) दोनों सही हैं; परंतु (R), (A) की सही व्याख्या नहीं करता है।","(A) सही है; परंतु (R) गलत है।","(A) गलत है; परंतु (R) सही है।"],"a":[1],"t":["U.P. B.E.O. (Pre) 2019"],"e":"आर्य समाज की स्थापना दयानंद सरस्वती (मूलशंकर) के द्वारा अप्रैल, 1875 में बंबई में की गई। इसका मुख्य उद्देश्य वैदिक धर्म के मूल सिद्धांतों की ओर लौटते हुए हिंदू समाज में व्याप्‍त कुरीतियों, अस्पृश्यता, जातिगत कठोरता और सामाजिक रूढ़ियों का विरोध करना था। औपनिवेशिक काल में अंग्रेज भारतीय समाज, धर्म और परंपराओं को हीन सिद्ध करने का प्रयास करते थे। ऐसे समय में दयानंद सरस्वती और आर्य समाज ने भारतीयों को अपनी परंपरा, संस्कृति और बौद्धिक क्षमता पर विश्वास दिलाया। इस प्रकार कथन\n(A) एवं कारण (R) दोनों सही हैं, लेकिन कारण (R), कथन (A) की सही व्याख्या नहीं करता है। अत: विकल्प (b) सही उत्तर है।"},{"ch":9,"page":508,"n":65,"q":"निम्नलिखित में से किसने महाराष्ट्र में ‘प्रार्थना समाज’ की स्थापना की थी?","o":["आत्माराम पांडुरंग ने","ज्योतिबा फुले ने","एम.जी. चंद्राकर ने","एम.जी. रानाडे ने"],"a":[0],"t":["U.P.U.D.A./L.D.A. (Mains) 2010"],"e":"प्र्ाार्थना समाज की स्थापना मार्च, 1867 में बंबई में आचार्य केशव चंद्र सेन की प्रेरणा से आत्माराम पांडुरंग द्वारा की गई थी। महादेव गोविंद रानाडे इस संस्था से बाद में जुड़े तथा इसके मुख्य संचालक बने। इस संस्था का प्रमुख उद्देश्य जाति प्रथा का विरोध‚ स्त्री-पुरुष की विवाह की आयु में वृद्धि‚ विधवा विवाह एवं स्त्री शिक्षा को प्रोत्साहन देना था। रानाडे का सामाजिक सुधार आंदोलन 19वीं शताब्दी के अंत तक सफलतापूर्वक जारी रहा।"},{"ch":9,"page":508,"n":69,"q":"महाराष्ट्र में प्रार्थना समाज का मुख्य संचालक कौन था?","o":["आर.जी. भंडारकर","एम.जी. रानाडे","पंडिता रमाबाई","गोपाल गणेश आगरकर"],"a":[1],"t":["U.P. Lower Sub. (Pre) 2004"],"e":"प्र्ाार्थना समाज की स्थापना मार्च, 1867 में बंबई में आचार्य केशव चंद्र सेन की प्रेरणा से आत्माराम पांडुरंग द्वारा की गई थी। महादेव गोविंद रानाडे इस संस्था से बाद में जुड़े तथा इसके मुख्य संचालक बने। इस संस्था का प्रमुख उद्देश्य जाति प्रथा का विरोध‚ स्त्री-पुरुष की विवाह की आयु में वृद्धि‚ विधवा विवाह एवं स्त्री शिक्षा को प्रोत्साहन देना था। रानाडे का सामाजिक सुधार आंदोलन 19वीं शताब्दी के अंत तक सफलतापूर्वक जारी रहा।"},{"ch":9,"page":508,"n":70,"q":"‘देव समाज’ का संस्थापक निम्न में से कौन था?","o":["वल्‍लभभाई पटेल","दादाभाई नौरोजी","शिवनारायण अग्‍निहोत्री","रामकृष्ण परमहंस"],"a":[2],"t":["U.P. P.C.S. (Pre) 2002","U.P. Lower Sub. (Pre) 2002","U.P. Lower Sub. (Pre) 2003"],"e":"‘देव समाज’ की स्थापना 1887 ई. में शिवनारायण अग्‍निहोत्री ने लाहौर में की थी। ये ब्रह्म समाज के पूर्व अनुयायी थे। इस समाज के उपदेशों को ‘देवशास्त्र’ नामक एक पुस्तक में संकलित किया गया है, यह पुस्तक चार भाग/चार वाल्‍यूम में है। इसमें सामाजिक सुधारों‚ गुरु की महत्ता और सत्कार्यों की आवश्यकता पर बल दिया गया है। वर्ष 1913 के बाद शिवनारायण अग्‍निहोत्री द्वारा अपने द्वितीय पुत्र देवानंद को आध्यात्मिक उत्तराधिकारी नियुक्त करने के बाद इस आंदोलन की सार्वजनिक लोकप्रियता में कमी आई।"},{"ch":9,"page":508,"n":71,"q":"किसने 1873 ई. में ‘सत्यशोधक समाज’ की स्थापना की?","o":["गोपाल कृष्ण गोखले","ज्योतिबा फुले","शिवनाथ शास्त्री","उपर्युक्त में से कोई नहीं"],"a":[1],"t":["40th B.P.S.C. (Pre) 1995","U.P. P.C.S. (Pre) 1997"],"e":"1873 ई. में सत्यशोधक समाज की स्थापना ज्योतिबा फुले/ज्‍योतिराव फुले ने की थी। इनका जन्म 1827 ई. में एक माली के घर हुआ था। इन्होंने गैर-ब्राह्मण आंदोलन का संचालन किया। इन्होंने अपनी पुस्तक ‘गुलामगिरी’ एवं अपने संगठन ‘सत्यशोधक समाज’ के द्वारा पाखंडी ब्राह्मणों एवं उनके अवसरवादी धर्म ग्थरंों से निम्न जातियों की रक्षा की आवश्यकता पर बल दिया।"},{"ch":9,"page":509,"n":74,"q":"‘गुलामगीरी’ का लेखक कौन था?","o":["बी.आर. अम्बेडकर","ज्योतिबा फुले","महात्मा गांधी","पेरियार"],"a":[1],"t":["U.P. P.C.S. (Pre) 2000"],"e":"1873 ई. में सत्यशोधक समाज की स्थापना ज्योतिबा फुले/ज्‍योतिराव फुले ने की थी। इनका जन्म 1827 ई. में एक माली के घर हुआ था। इन्होंने गैर-ब्राह्मण आंदोलन का संचालन किया। इन्होंने अपनी पुस्तक ‘गुलामगिरी’ एवं अपने संगठन ‘सत्यशोधक समाज’ के द्वारा पाखंडी ब्राह्मणों एवं उनके अवसरवादी धर्म ग्थरंों से निम्न जातियों की रक्षा की आवश्यकता पर बल दिया।"},{"ch":9,"page":509,"n":76,"q":"सत्यशोधक आंदोलन चलाया था-","o":["छत्रपति शाहूजी महाराज ने","बी.आर. अम्बेडकर ने","ज्योतिबाराव फुले ने","टी.एन. नायर ने"],"a":[2],"t":["U.P.P.C.S. (Mains) 2009"],"e":"1873 ई. में सत्यशोधक समाज की स्थापना ज्योतिबा फुले/ज्‍योतिराव फुले ने की थी। इनका जन्म 1827 ई. में एक माली के घर हुआ था। इन्होंने गैर-ब्राह्मण आंदोलन का संचालन किया। इन्होंने अपनी पुस्तक ‘गुलामगिरी’ एवं अपने संगठन ‘सत्यशोधक समाज’ के द्वारा पाखंडी ब्राह्मणों एवं उनके अवसरवादी धर्म ग्थरंों से निम्न जातियों की रक्षा की आवश्यकता पर बल दिया।"},{"ch":9,"page":509,"n":79,"q":"‘सत्यशोधक समाज’ के संस्थापक कौन थे‚ जिनका प्राथमिक जोर सत्य की खोज पर था?","o":["एम. जी. रानाडे","राजा राममोहन राय","ताराबाई शिन्दे","ज्योतिबा फुले"],"a":[3],"t":["U.P.P.C.S. (Pre) 2022"],"e":"पिछड़े वर्गों का उत्थान सत्यशोधक समाज का मुख्य कार्यक्रम था। इसकी स्थापना 1873 ई. में ज्योतिबा फुले ने की थी। यह आंदोलन दलितों, निम्न जाति के लोगों तथा अन्‍य वंचित समुदायों के कल्याण के लिए चलाया गया। अपनी ब्राह्मण-विरोधी गतिविधियों का संगठित रूप में प्रसार करने के लिए उन्होंने आलोचनात्मक ग्रंथों-‘सार्वजनिक सत्य धर्म पुस्तक’ तथा ‘गुलामगिरी’ की रचना की।"},{"ch":9,"page":509,"n":81,"q":"ज्योतिबा फुले संबंधित थे-","o":["श्रमिक संघ आंदोलन से","कृषक आंदोलन से","सविनय अवज्ञा आंदोलन से","जाति-विरोधी आंदोलन से"],"a":[3],"t":["U.P.P.C.S. (Pre) 2022"],"e":"1873 ई. में सत्यशोधक समाज की स्थापना ज्योतिबा फुले ने पुणे (महाराष्ट्र) में की थी। सत्यशोधक समाज से पहले भी इस देश में सामाजिक और धार्मिक सुधार आंदोलन चले; किंतु सत्यशोधक समाज इन सबसे अलग एवं विशिष्ट है। इसमें ऊंचे वर्णों एवं श्रेणियों के प्रति पिछड़ी जातियों का विद्रोह प्रमुख था।"},{"ch":9,"page":510,"n":83,"q":"वह बंगाली नेता कौन था‚ जिसने सामाजिक-धार्मिक सुधारों का विरोध किया और रूढ़िवादिता का समर्थन किया?","o":["राधाकांत देव","नेमई साधन बोस","हेमचंद्र विश्वास","हेमचंद्र डे"],"a":[0],"t":["U.P. Lower Sub. (Pre) 2008"],"e":"राजा राधाकांत देव ने अपने सहयोगियों के साथ मिलकर 1830 ई. में कलकत्ता में ‘धर्म सभा’ की स्थापना कर सामाजिक-धार्मिक सुधारों का विरोध किया और रूढ़िवादिता का समर्थन किया।"},{"ch":9,"page":510,"n":84,"q":"राधास्वामी सत्संग के संस्थापक कौन थे?","o":["हरिदास स्वामी","शिवदयाल साहब","शिवनारायण अग्‍निहोत्री","स्वामी श्रद्धानंद"],"a":[1],"t":["U.P. P.C.S. (Pre) 2002"],"e":"राधास्वामी सत्संग आंदोलन की स्थापना 1861 ई. में आगरा के एक महाजन या बैंकर शिवदयाल साहब/शिव दयाल सिंह (स्वामी जी महाराज) ने की। कुछ पुस्तकों में शिवदयाल साहब का मूल नाम तुलसी राम भी मिलता है। राधास्वामी मत को मानने वाले लोग एक ही परमेश्वर‚ गुरु की महत्ता‚ संतों का साथ (सत्संग) तथा साधारण सामाजिक जीवन में विश्वास करते थे। उनका मानना था कि आध्यात्‍मिक उन्‍नति के लिए गृहस्थ जीवन का त्‍याग आवश्यक नहीं है। इस पंथ ने पारंपरिक मंदिर पूजा, मूर्तिपूजा और तीर्थयात्रा का खंडन किया, पर इसने अपने सत्‍संग स्थलों, समाधि स्थलों को महत्‍व दिया तथा धर्म और दान के कार्य‚ सेवा और प्रार्थना की भावना इसके आवश्यक कर्तव्य थे।"},{"ch":9,"page":510,"n":86,"q":"‘लोकहितवादी’ उपनाम से किसे जाना जाता था?","o":["गोपाल हरि देशमुख को","महादेव गोविंद रानाडे को","ज्योतिबा फुले को","बाल गंगाधर तिलक को"],"a":[0],"t":["U.P. P.C.S. (Pre) (Re-Exam) 2015"],"e":"महाराष्ट्र के समाज सुधारक गोपाल हरि देशमुख (1823-92 ई.) ‘लोकहितवादी’ के रूप में प्रख्यात थे। पेशे की दृष्टि से न्यायाधीश गोपाल हरि देशमुख 1880 ई. में बाॅम्बे के गवर्नर के लेजिस्लेटिव काउंसिल/बाॅम्बे के गवर्नर के काउंसिल के सदस्य भी रहे। ये महान समाज सुधारक तथा बौद्धिक चिंतक थे। इन्होंने बौद्धिक दृष्टिकोण का परिष्कार करने तथा देश की समस्याओं का समाधान करने के लिए लोगों के सम्मुख आत्मनिर्भर बनने तथा पश्चिमी शिक्षा की आवश्यकता का पक्ष प्रस्तुत किया। उन्होंने स्त्री आंदोलन का समर्थन करते हुए स्त्री शिक्षा के प्रसार का पक्ष लिया। ये राष्ट्रीय आत्मनिर्भरता के समर्थक के रूप में हाथ से बुने हुए खादी के वस्त्र पहनकर 1877 ई. में दिल्‍ली दरबार में भी उपस्थित हुए थे।"},{"ch":9,"page":510,"n":87,"q":"महाराष्ट्र में विधवा पुनर्विवाह हेतु अभियान का नेतृत्व किया-","o":["विष्णु परशुराम पंडित ने","बी.एम. मालाबारी ने","गोपाल हरि देशमुख ने","दादाभाई नौरोजी ने"],"a":[0],"t":["U.P. Lower Sub. (Pre) 2013"],"e":"महाराष्ट्र में विधवा विवाह को प्रोत्‍साहन देने वाले समाज सुधारकों में विष्णु शास्त्री पंडित (विष्णु परशुराम पंडित) का नाम उल्‍लेखनीय है। इनके द्वारा 1860 के दशक में ‘विधवा विवाह उत्तेजक मंडल’ का गठन किया गया और साथ ही विधवा पुनर्विवाह आंदोलन भी चलाया गया। बी.एम. मालाबारी बाल विवाह प्रथा को वैधानिक रूप से समाप्‍त करने के लिए प्रसिद्ध हैं।"},{"ch":9,"page":510,"n":90,"q":"सहमति की आयु अधिनियम‚ 1891 के संदर्भ में निम्नलिखित कथनों पर विचार कीजिए-\n1. यह बंबई के एक पारसी सुधारक‚ बेहरामजी मालाबारी थे‚ जिन्होंने इस कानून की वकालत की थी।\n2. इस अधिनियम को बाल गंगाधर तिलक के नेतृत्व वाली चरमपंथी शाखा ने समर्थन दिया था।\nउपर्युक्त में से कौन-सा/से कथन सही है/हैं?","o":["केवल 2","न तो 1 न ही 2","केवल 1","1 और 2 दोनों"],"a":[2],"t":["U.P. P.C.S. (Pre) 2024"],"e":"19वीं सदी के महान पारसी समाज सुधारक बेहरामजी एम. मालाबारी थे। हालांकि इनका जन्म बड़ौदा (गुजरात) में हुआ था तथापि आगे चलकर बंबई इनकी कर्मभूमि बनी। इन्होंने महिलाओं की स्थिति में सुधार के लिए बाल विवाह के खिलाफ तथा विधवा विवाह के समर्थन में जन-जागरण का प्रयास किया था। 1891 ई. का सहमति की आयु अधिनियम (Age of consent Act) को पारित कराने में, इन्‍होंने महत्‍वपूर्ण भूमिका निभाई। बाल गंगाधर तिलक ने इस अधिनियम का विरोध किया था।"},{"ch":9,"page":512,"n":98,"q":"पश्चिमी भारत के डी.के. कर्वे का नाम निम्नलिखित में से किस संदर्भ में आता है?","o":["सती प्रथा","बाल (शिशु) हत्या","स्त्री शिक्षा","विधवा पुनर्विवाह"],"a":[2,3],"t":["U.P.P.C.S. (Pre) 2016"],"e":"डी.के. कर्वे प्रसिद्ध समाज सुधारक थे। उन्होंने विधवा विवाह एवं महिला शिक्षा के क्षेत्र में महत्वपूर्ण योगदान दिया। इन्होंने रानाडे के साथ विधवा पुनर्विवाह आंदोलन का संचालन किया और विधवाओं को शिक्षा देने के लिए ‘हिंदू विडो होम एसोसिएशन’ (अन्‍य नाम- अनाथ बालिका आश्रम) की स्थापना की। इस आश्रम का उद्देश्य विधवाओं को शिक्षिकाओं‚ परिचारिकाओं अथवा दाइयों के रूप में प्रशिक्षित करके आत्मनिर्भर बनाना था। इन्होंने वर्ष 1916 में पुणे में प्रथम महिला विश्वविद्यालय की स्थापना की और आगे चलकर यह विश्वविद्यालय पुणे से मुम्बई स्थानांतरित कर दिया गया।"},{"ch":9,"page":512,"n":99,"q":"निम्नलिखित में से किसने प्रमखु रूप से विधवा पुनर्विवाह के लिए संघर्ष किया और उसे कानूनी रूप से वैध बनाने में सफलता प्राप्‍त की?","o":["एनी बेसेंट","ईश्वरचंद्र विद्यासागर","एम.जी. रानाडे","राजा राममोहन राय"],"a":[1],"t":["U.P. P.C.S. (Mains) 2012"],"e":"कलकत्ता के संस्कृत कॉलेज के आचार्य ईश्वरचंद्र विद्यासागर ने विधवा पुनर्विवाह के लिए अथक संघर्ष किया। इन्होंने यह प्रमाणित करने का प्रयास किया कि वेदों में विधवा विवाह को मान्यता दी गई है। इनके प्रयासों के फलस्वरूप जुलाई‚ 1856 को ‘हिंदू विधवा पुनर्विवाह अधिनियम’ पारित हुआ।"},{"ch":9,"page":513,"n":102,"q":"1843 के एक्ट V ने किस बात को गैर-कानूनी बना दिया?","o":["बाल विवाह","शिशु हत्या","सती","गुलामी"],"a":[3],"t":["U.P. P.C.S. (Mains) 2007"],"e":"लॉर्ड एलनबरो के काल में 1843 का एक्ट V (Indian Slavery Act, 1843) ईस्ट इंडिया कंपनी के क्षेत्रों में दासता की कानूनी मान्‍यता तथा दासता आधारित दावों के न्‍यायालयीय प्रवर्तन को समाप्‍त करने वाला अधिनियम था। इस अधिनियम ने किसी व्यक्‍ति अथवा उसके बाध्य श्रम/सेवाओं की बिक्री पर रोक लगाई तथा दास होने के आधार पर संपत्ति से वंचित करने से रोका और दास माने जाने वाले व्यक्‍तियों को भी स्वतंत्र व्यक्‍तियों की तरह कानून के समक्ष सुरक्षा प्रदान की।"},{"ch":9,"page":513,"n":103,"q":"निम्नलिखित में से किसने 1872 में नेटिव मैरिज एक्ट को पारित कराने में महत्वपूर्ण भूमिका निभाई थी?","o":["देवेंद्रनाथ टैगोर","ईश्वरचंद्र विद्यासागर","केशवचंद्र सेन","श्यामचंद्र दास"],"a":[2],"t":["U.P. P.C.S. (Mains) 2011"],"e":"केशवचंद्र सेन ने 1872 ई. के नेटिव मैरिज एक्ट को पारित कराने में महत्वपूर्ण भूमिका निभाई थी। इस एक्ट से लड़कियों के लिए विवाह की न्यूनतम आयु 14 वर्ष तथा लड़कों के लिए न्यूनतम आयु 18 वर्ष निर्धारित की गई थी। इसे ब्रह्म विवाह अधिनियम भी कहा जाता है।"},{"ch":9,"page":513,"n":104,"q":"‘नेटिव मैरिज एक्ट’ किस वर्ष पारित किया गया था?","o":["1870","1872","1874","1876"],"a":[1],"t":["U.P.P.C.S. (Pre) 2019"],"e":"केशवचंद्र सेन ने 1872 ई. के नेटिव मैरिज एक्ट को
