h":9,"page":519,"n":141,"q":"निम्नलिखित समाज सुधारकों में से कौन संस्कृत भाषा में प्रवीणता के लिए जाना जाता है?","o":["दयानंद सरस्वती","ईश्वरचंद्र विद्यासागर","राजा राममोहन राय","उपर्युक्त सभी"],"a":[3],"t":["U.P.P.C.S. (Mains) 2013"],"e":"दयानंद सरस्वती‚ ईश्वरचंद्र विद्यासागर और राजा राममोहन राय ने अंग्रेजी शासन के दौरान भारत में धार्मिक-सामाजिक सुधार हेतु अथक प्रयत्न किए। तीनों ही संस्कृत भाषा में प्रवीण थे और हिंदू धर्म तथा समाज में फैली कुरीतियों का खंडन किया।"},{"ch":9,"page":520,"n":149,"q":"‘दार-उल-उलूम’ की स्थापना की थी-","o":["मौलाना शिब्ली नुमानी ने","मौलाना हुसैन अहमद ने","मौलवी अब्दुल्‍लाह चक्रलवी ने","मौलाना अहमद ऱिजा खान ने"],"a":[0],"t":["U.P.P.C.S. (Mains) 2014"],"e":"दार-उल-उलूम नदवातुल उलमा‚ जो सामान्यत: दार-उल-उलूम नाम से जाना जाता है‚ की स्थापना 1898 ई. में लखनऊ में की गई थी। इसकी स्थापना नदवातुल उलमा द्वारा की गई थी। नदवातुल उलमा का गठन 1892/1893 ई. को कानपुर में किया गया था। जिसके संस्थापकों में मौलाना शिब्ली नुमानी शामिल थे। मौलाना सैय्यद अहमद मुंगेरी के प्रयासों से नदवातुल उलमा ने दार-उल-उलूम (लखनऊ में) की स्थापना की। शिब्ली नुमानी दार-उल-उलूम के प्रमुख शिक्षक भी थे।"},{"ch":9,"page":521,"n":152,"q":"देवबंद आंदोलन‚ यू.पी. (संयुक्त प्रांत) में किस वर्ष में आरंभ हुआ था?","o":["1900 ई.","1888 ई.","1885 ई.","1866 ई."],"a":[3],"t":["U.P.P.C.S. (Pre) 2016"],"e":"देवबंद आंदोलन की शुरुआत मुहम्मद कासिम अल ननौतवी द्वारा 1866 ई. में देवबंद‚ यू.पी. (संयुक्त प्रांत) में दार-उल-उलूम की स्थापना के साथ हुई। इसके सह-संस्थापक रशीद अहमद गंगोही‚ सैयद मुहम्मद आबिद‚ जुल्फिकार अली आदि थे।"},{"ch":9,"page":521,"n":155,"q":"1924 का बंगाल का ‘तारकेश्वर आंदोलन’ निम्न में से किसके विरुद्ध था?","o":["मंदिरों में भ्रष्टाचार","हिंसा","राजनैतिक नेताओं की गिरफ्तारी","सांप्रदायिकता"],"a":[0],"t":["U.P. P.C.S. (Pre) (Re-Exam) 2015"],"e":"वर्ष 1924 में बंगाल के तारकेश्वर शिव मंदिर के भ्रष्ट महंतों के विरुद्ध तारकेश्वर आंदोलन चला था। यहां के महंतों पर तीर्थयात्रियों के साथ दुर्व्यवहार‚ उत्पीड़न और अन्यायपूर्ण वित्तीय मांग के आरोप लगे थे।"},{"ch":9,"page":521,"n":156,"q":"‘हाली पद्धति’ संबंधित थी-","o":["बंधुआ मजदूर से","किसानों के शोषण से","छुआछूत से","अशिक्षा से"],"a":[0],"t":["U.P. P.C.S. (Pre) 2015"],"e":"‘हाली पद्धति’ बंधुआ मजदूरी तथा बंधुआ मजदूराें से संबंधित है। ये कृषक बंधुआ मजदूर होते हैं‚ जो किसी दूसरे की भूमि पर कृषि करते हैं।"},{"ch":9,"page":521,"n":157,"q":"निम्नलिखित नेताओं में किसने क्रांतिकारी संगठन‚ ‘अभिनव भारत समाज’ की स्थापना की?","o":["भगत सिंह","विनायक दामोदर सावरकर","बारींद्र कुमार घोष","पुलिन बिहारी"],"a":[1],"t":["U.P.P.C.S. (Pre) 2018"],"e":"विनायक दामोदर सावरकर ने ‘मित्र मेला’ नामक संगठन शुरू किया था‚ जिसे वर्ष 1904 में नासिक में वी.डी. सावरकर ने नाम परिवर्तित कर ‘अभिनव भारत समाज’ (Young India Society) नामक क्रांतिकारी संगठन के रूप में स्थापित कर दिया था।"},{"ch":10,"page":522,"n":2,"q":"नीचे दो कथन दिए गए हैं‚ जिनमें से एक को अभिकथन (A) तथा दूसरे को कारण (R) कहा गया है :\nअभिकथन (A) : बंगाल ब्रिटिश इंडिया सोसाइटी की स्थापना 1843 ई. में जॉर्ज थॉम्पसन के प्रयासों का परिणाम था।\nकारण (R) : जॉर्ज थॉम्पसन को द्वारकानाथ टैगोर‚ इंग्लैंड से भारत‚ राजनीतिक आंदोलन संगठित करने के लिए लाए थे।\nनीचे दिए गए कूट का प्रयोग कर सही उत्तर का चुनाव कीजिए :\nकूट :","o":["(A) और (R) दोनों सत्य हैं‚ किंतु (R), (A) की सही व्याख्या नहीं करता है।","(A) असत्य है‚ किंतु (R) सत्य है।","(A) और (R) दोनों सत्य हैं और (R), (A) की सही व्याख्या करता है।","(A) सत्य है‚ किंतु (R) असत्य है।"],"a":[2],"t":["U.P. R.O./A.R.O. (Pre) 2023"],"e":"बंगाल ब्रिटिश इंडिया सोसाइटी की स्थापना 1843 ई. में कलकत्ता में हुई थी। इसकी स्थापना जॉर्ज थॉम्पसन के प्रयासों का परिणाम था। जॉर्ज थॉम्पसन को द्वारकानाथ टैगोर‚ बंगाल में राजनीतिक संगठन के गठन और राजनीतिक जागरण को प्रोत्‍साहित करने के लिए इंग्लैंड से भारत लाए थे। अत: कथन और कारण दोनों सही हैं तथा कारण‚ कथन की सही व्याख्या है।"},{"ch":10,"page":523,"n":6,"q":"निम्नलिखित में से कौन ‘इंडियन एसोसिएशन’ का संस्थापक था?","o":["विपिनचंद्र पाल","दादाभाई नौरोजी","गोपाल कृष्ण गोखले","एस.एन. बनर्जी"],"a":[3],"t":["U.P. P.C.S. (Mains) 2008"],"e":"26 जुलाई‚ 1876 को सुरेंद्रनाथ बनर्जी ने आनंद मोहन बोस के सहयोग से इंडियन एसोसिएशन या भारत संघ की स्थापना कलकत्ता में की। इंडियन एसोसिएशन पूर्व कांग्रेस काल की सबसे महत्‍वपूर्ण और सक्रिय राजनीतिक संस्था थी। इस संस्था का दृष्टिकोण अखिल भारतीय था तथा इस मामले में वह कांग्रेस की अग्रगामी थी। इस संस्था ने सिविल सेवा परीक्षा प्रणाली में सुधार की मांग तथा इल्बर्ट बिल विवाद जैसे मामलों को लेकर आंदोलन चलाया। इंडियन एसोसिएशन (भारत संघ) में जमींदारों के स्थान पर मध्यम वर्ग को प्रधानता दी गई थी।"},{"ch":10,"page":523,"n":10,"q":"सरु द्रें नाथ बनर्जी द्वारा स्थापित उस संगठन का नाम बतलाइए जिसका 1886 में इंडियन नेशनल कांग्रेस में विलय हो गया-","o":["ईस्ट इंडिया एसोसिएशन","लंदन इंडिया सोसाइटी","इंडियन एसोसिएशन","इंडियन नेशनल कॉन्‍फ्रेंस"],"a":[3],"t":["U.P. P.C.S. (Mains) 2007"],"e":"भारतीय राष्ट्रीय कांग्रेस का पहला अधिवेशन 1885 ई. में बंबई में हुआ। इसका सभापतित्व डब्ल्यू.सी. बनर्जी नामक एक बंगाली बैरिस्टर ने किया। 26 जुलाई‚ 1876 को सुरेंद्रनाथ बनर्जी ने आनंद मोहन बोस के सहयोग से इंडियन एसोसिएशन या भारत संघ की स्थापना कलकत्ता में की। दिसंबर‚ 1883 ई. में इंडियन एसोसिएशन ने भारतीय राष्ट्रीय सम्मेलन (इंडियन नेशनल कॉन्फ्रेंस) का आयोजन किया। भारतीय राष्ट्रीय कांग्रेस की स्थापना के समय (1885 ई.) सुरेंद्रनाथ बनर्जी की अध्यक्षता में इंडियन एसोसिएशन का दूसरा अधिवेशन भारतीय राष्ट्रीय सम्मेलन (इंडियन नेशनल कॉन्फ्रेंस) कलकत्ता में हुआ। ऐसा मालूम पड़ता है कि दोनों आंदोलन समकालिक एवं स्वतंत्र थे तथा दोनों में से किसी के भी संगठनकर्ताओं को दूसरे के बारे में उसके अधिवेशनों के पहले कोई जानकारी न थी‚ अधिवेशनों के ठीक पहले आकर यह जानकारी हुई। दोनों संगठन एक ही ढंग पर सोचे गए तथा दोनों ने एक ही प्रकार का कार्यक्रम अपनाया। यह स्पष्टत: अवांछनीय था कि दो ऐसे संघ हों‚ जो भारत के दो विभिन्‍न भागों में स्वतंत्र रूप से काम करें। अत: 1886 ई. के बाद इंडियन नेशनल कॉन्फ्रेंस के नेताओं ने अपनी पृथक पहचान को छोड़कर कांग्रेस के साथ अपनी एकरूपता स्वीकार की। इसलिए इंडियन नेशनल कॉन्‍फ्रेंस का आयोजन 1885 ई. के बाद कभी नहीं किया गया। इंडियन एसोसिएशन का कभी भी कांग्रेस में विलय नहीं हुआ। चूंकि 1886 ई. के बाद इंडियन नेशनल कॉन्फ्रेंस का आयोजन नहीं हुआ; इसलिए विकल्प (d) को सही उत्तर माना जा सकता है।"},{"ch":10,"page":524,"n":14,"q":"निम्नलिखित में से कौन 1885 में स्थापित बंबई (बॉम्बे) प्रेसीडेंसी एसोसिएशन के संस्थापकों में से एक था?","o":["फिरोजशाह मेहता","पी. आनंद चार्लू","एम.वी. राघव चेरियार","एस.एन. बनर्जी"],"a":[0],"t":["U.P.P.C.S. (Mains) 2016"],"e":"1885 ई. में फिरोजशाह मेहता‚ बदरुद्दीन तैयब जी तथा के.टी. तैलंग के प्रयास से बॉम्बे प्रेसीडेंसी एसोसिएशन की स्थापना हुई थी। इसका उद्देश्य लोगों में राजनीतिक विचारों का प्रचार-प्रसार करना था। दादाभाई नौरोजी भी इस संगठन से जुड़े हुए थे और उन्‍हें इसका उपाध्यक्ष भी बनाया गया था।"},{"ch":10,"page":524,"n":16,"q":"निम्न युग्मों में से कौन सुमेलित नहीं है? अपना उत्तर दिए गए कूट से पाइए- (1) ब्रिटिश इंडिया सोसाइटी - लंदन (2) ईस्ट इंडिया एसोसिएशन - कलकत्ता (3) नेशनल इंडियन एसोसिएशन - लंदन (4) इंडियन एसोसिएशन - बंबई\nकूट :","o":["1 और 2","3 और 4","1 और 3","2 और 4"],"a":[3],"t":["U.P. Lower sub. (Spl.) (Pre) 2008"],"e":"विकल्प में दी गई संस्थाएं एवं उनसे संबंधित स्थानों एवं संस्थापकों का सुमेलन निम्नानुसार हैब्रिटिश इंडिया सोसाइटी (1839 ई.) - लंदन‚ विलियम एडम ईस्ट इंडिया एसोसिएशन (1866 ई.) - लंदन‚ दादाभाई नौरोजी नेशनल इंडियन एसोसिएशन (1870 ई.) - लंदन‚ मैरी कारपेंटर (प्रारंभ में यह ब्रिस्टल में स्थापित की गई थी। 1871 ई. बाद में इसकी एक शाखा लंदन में खोली गई) इंडियन एसोसिएशन (1876 ई.) - कलकत्ता‚ सुरेंद्रनाथ बनर्जी एवं आनंद मोहन बोस"},{"ch":10,"page":525,"n":18,"q":"निम्नलिखित में से कौन‚ कांग्रेस के पूर्व चरण में स्थापित राजनैतिक संस्थाओं में से एक नहीं थी?","o":["दि ब्रिटिश इंडिया एसोसिएशन","दि इंडियन एसोसिएशन","मद्रास नेटिव एसोसिएशन","लैंड होल्डर्स सोसाइटी‚ कलकत्ता"],"a":[1],"t":["U.P. P.C.S. (Mains) 2017"],"e":"सितंबर‚ 1870 में ब्रिस्टल में इंडियन एसोसिएशन की स्थापना केशव चंद्र की प्रेरणा से मेरी कारपेंटर ने की थी। अक्टूबर‚ 1870 में इसका नाम ‘दि इंडियन एसोसिएशन’ कर दिया गया। 1871 में मिस मैनिंग और उनकी सौतेली बेटी (Step daughter) एलिजा बेथ एडिलेड मैनिंग ने लंदन में इसकी एक शाखा खोली। अत: यह राजनैतिक संस्था नहीं थी। 1871 ई. में पुन: इसका नाम बदलकर ‘नेशनल इंडियन एसोसिएशन’ कर दिया गया था। आगे चलकर लंदन ही इस संस्था का मुख्यालय बना।"},{"ch":10,"page":525,"n":19,"q":"नीचे दो कथन दिए गए हैं‚ एक को अभिकथन (A) और दूसरे को\nकारण (R) कहा गया है-\nअभिकथन (A) : भारतीय प्रश्नों पर विवेचना के लिए दादाभाई नौरोजी ने 1866 में लंदन में ईस्ट इंडिया एसोसिएशन का गठन किया।\nकारण (R) : वह ब्रिटिश जनमानस को प्रभावित करना चाहते थे।\nनीचे दिए गए कूट से सही उत्तर का चयन कीजिए-\nकूट:","o":["(A) सही है; किंतु (R) गलत है।","(A) गलत है; किंतु (R) सही है।","(A) और (R) दोनों सही हैं और (R)‚ (A) की सही व्याख्या है।","(A) और (R) दोनों सही हैं और (R)‚ (A) की सही व्याख्या नहीं है।"],"a":[2],"t":["U.P.R.O./A.R.O. (Pre) 2021"],"e":"दादाभाई नौरोजी को ‘ग्रैंड ओल्ड मैन ऑफ इंडिया’ भी कहा जाता है। दादाभाई नौरोजी ने 1866 ई. (लंदन) में ईस्ट इंडिया एसोसिएशन का गठन किया। इस संस्था के गठन के पीछे का उद्देश्य भारतीय विषयों पर चर्चा करना तथा भारत को लेकर ब्रिटिश जनता को जागरूक करना था। दादाभाई नौरोजी ने ‘पावर्टी एंड अन-ब्रिटिश रूल इन इंडिया’ नामक पुस्तक भी लिखी थी।"},{"ch":10,"page":525,"n":20,"q":"निम्नलिखित संस्थाओं पर विचार कीजिए -\n1. बंगभाषा प्रकाशिका सभा\n2. लैंड होल्डर्स सोसाइटी\n3. बंगाल ब्रिटिश इंडिया सोसाइटी\n4. इंडियन लीग इन संस्थाओं की स्थापना वर्ष के सही कालानुक्रम को निम्नलिखित\nकूट से चुनिए -","o":["1, 2, 3, 4","1, 3, 2, 4","2, 1, 3, 4","2, 3, 4, 1"],"a":[0],"t":["U.P.R.O./A.R.O. (Pre) 2016"],"e":"(संस्था) (स्थापना वर्ष)\nबंगभाषा प्रकाशिका सभा - 1836\nलैंड होल्डर्स सोसाइटी - 1838 बंगाल ब्रिटिश इंडिया सोसाइटी - 1843 इंडियन लीग - 1875"},{"ch":10,"page":525,"n":21,"q":"सूची-I को सूची-II से सुमेलित कीजिए तथा नीचे दिए गए कूट से सही उत्तर का चयन कीजिए-\nसूची-I सूची-II (संगठन) (संस्थापक)\nA. लैंड होल्डर्स सोसाइटी 1. एस.एन. बनर्जी\nB. ब्रिटिश इंडिया सोसाइटी 2. आनंद मोहन बोस\nC. इंडियन सोसाइटी 3. विलियम एडम्स\nD. इंडियन एसोसिएशन 4. द्वारकानाथ टैगोर\nकूट :\nA B C D","o":["4 3 2 1","4 2 3 1","3 2 4 1","4 1 2 3"],"a":[0],"t":["U.P.P.C.S. (Mains) 2014"],"e":"सूची-I में दिए गए संगठन का सूची-II में दिए गए संस्थापक से सुमेलन इस प्रकार है-\nसूची-I सूची-II (संगठन) (संस्थापक)\nलैंड होल्डर्स सोसाइटी - द्वारकानाथ टैगोर ब्रिटिश इंडिया सोसाइटी - विलियम एडम्स इंडियन सोसाइटी - आनंद मोहन बोस इंडियन एसोसिएशन - एस.एन. बनर्जी"},{"ch":10,"page":526,"n":22,"q":"निम्नलिखित घटनाओं पर विचार कीजिए तथा इन्हें कालानुक्रम में व्यवस्थित कीजिए-\n1. ईस्ट इंडिया एसोसिएशन\n2. नेशनल इंडियन एसोसिएशन\n3. इंडियन सोसाइटी\n4. इंडियन एसोसिएशन\nनीचे दिए गए कूट में से सही उत्तर चुनिए-","o":["1, 2, 4, 3","1, 3, 2, 4","2, 1, 4, 3","1, 2, 3, 4"],"a":[3],"t":["U.P. P.C.S. (Pre) 2024"],"e":"संस्थाएं (स्थापना वर्ष) संस्थापक ईस्ट इंडिया एसोसिएशन (1866) - दादाभाई नौरोजी नेशनल इंडियन एसोसिएशन (1870) - मैरी कारपेंटर इंडियन सोसाइटी (1872) - आनंद मोहन बोस इंडियन एसोसिएशन (1876) - सुरेंद्रनाथ बनर्जी एवं आनंद मोहन बोस अत: प्रश्नगत संस्थाओं का सही कालानुक्रम विकल्प (d) में प्राप्‍त हो रहा है। कुछ स्रोतों में नेशनल इंडियन एसोसिएशन की गठन की तिथि 1871 ई. भी मिलती है।"},{"ch":10,"page":526,"n":23,"q":"सूची-I को सूची-II से सुमेलित कीजिए-\nसूची - I सूची - II\nA. इंडिया लीग 1. शिशिर कुमार घोष\nB. इंडियन एसोसिएशन 2. आनंद मोहन बोस\nC. भारतीय राष्ट्रीय उदार 3. सैयद अहमद खान संघ\nD. यूनाइटेड इंडिया 4. सुरेंद्रनाथ बनर्जी पैट्रियाटिक एसोसिएशन\nकूट :\nA B C D","o":["1 3 4 2","2 1 4 3","3 2 4 1","1 2 4 3"],"a":[3],"t":["U.P. Lower sub. (Spl.) (Pre) 2008"],"e":"1875 ई. में बंगाल में शिशिर कुमार घोष ने इंडियन लीग की स्थापना की जिसका उद्देश्य था भारतीयों में राष्ट्रवाद की भावना को जगाना तथा राजनीतिक शिक्षा को प्रोत्साहित करना। 26 जुलाई‚ 1876 को इंडियन एसोसिएशन का गठन किया गया। इसे आनंद मोहन बोस और सुरेंद्रनाथ बनर्जी ने स्थापित किया था। इस संस्था का उद्देश्य मध्यम वर्ग को ही नहीं‚ अपितु सर्वसाधारण को इसमें लाना था और इसीलिए इसका चंदा पांच रुपये वार्षिक रखा गया‚ जबकि ब्रिटिश इंडियन एसोसिएशन का चंदा 50 रुपये वार्षिक था। शीघ्र ही इंडियन एसोसिएशन शिक्षित वर्ग के प्रतिनिधियों की मुख्य संस्था बन गई। भारतीय राष्ट्रीय उदारवादी संघ (इंडियन नेशनल लिबरल फेडरेशन) को सुरेंद्रनाथ बनर्जी और यूनाइटेड इंडियन पैट्रियाटिक एसोसिएशन को सर सैयद अहमद खां तथा राजा शिव प्रसाद ‘सितार-एहिंद’ ने स्थापित किया था।"},{"ch":10,"page":526,"n":24,"q":"सूची-I को सूची-II से सुमेलित कीजिए तथा नीचे दिए गए कूट का प्रयोग करते हुए सही उत्तर का चयन कीजिए -\nसूची-I सूची-II\nA. इंडियन एसोसिएशन 1. आनंद चार्लू\nB. पूना सार्वजनिक सभा 2. सुरेंद्रनाथ बनर्जी\nC. बंबई प्रेसीडेंसी 3. महादेव गोविंद रानाडे\nD. मद्रास महाजन सभा 4. फिरोजशाह मेहता\nकूट :\nA B C D","o":["2 3 4 1","2 4 3 1","3 2 4 1","3 4 2 1"],"a":[0],"t":["U.P. R.O./ A.R.O. (Re-Exam) (Pre) 2016"],"e":"सूची-I का सूची-II से सही मिलान इस प्रकार हैइंडियन एसोसिएशन - सुरेंद्रनाथ बनर्जी\nपूना सार्वजनिक सभा - महादेव गोविंद रानाडे बंबई प्रेसीडेंसी एसोसिएशन - फिरोजशाह मेहता\nमद्रास महाजन सभा - आनंद चार्लू"},{"ch":10,"page":527,"n":25,"q":"निम्नलिखित में से कौन सैयद अहमद खान के साथ, ‘यूनाइटेड इंडियन पैट्रियाटिक एसोसिएशन’ का संस्थापक था?","o":["अब्दुल अजीज","मोहम्मद-उल-हसन","राजा शिवप्रसाद","गोविंद दास"],"a":[2],"t":["U.P. R.O./ A.R.O. (Mains) 2016"],"e":"एक राजनीतिक संगठन के रूप में ‘यूनाइटेड इंडियन पैट्रियाटिक एसोसिएशन’ की स्थापना 1888 ई. में सर सैयद अहमद खान तथा बनारस के राजा शिवप्रसाद ‘सितार-ए-हिद’ ने की थी। ध्यातव्य है कि उक्त संगठन की स्थापना ‘भारतीय राष्ट्रीय कांग्रेस’ के विरोध एवं मुस्लिम समुदाय तथा ब्रिटिशरों के मध्य घनिष्ठ संबंधों को विकसित करने के उद्देश्य से की गई थी।"},{"ch":10,"page":527,"n":27,"q":"कलकत्ता में एशियाटिक सोसाइटी ऑफ बंगाल की स्थापना 1784 में किसने की?","o":["जोनाथन डंकन","विलियम जोंस","वॉरेन हेस्टिंग्स","चार्ल्स ग्रांट"],"a":[1],"t":["U.P. P.C.S. (Mains) 2017"],"e":"एशियाटिक सोसाइटी ऑफ बंगाल की स्थापना 1784 ई. में विलियम जोंस ने की थी।"},{"ch":10,"page":527,"n":28,"q":"‘एशियाटिक सोसाइटी ऑफ बंगाल’ का संस्थापक कौन था?","o":["जोनाथन डंकन","सर विलियम जोंस","वॉरेन हेस्टिंग्स","विलियम बेंटिक"],"a":[1],"t":["U.P.P.C.S. (Pre) 2021"],"e":"एशियाटिक सोसाइटी ऑफ बंगाल की स्थापना 1784 ई. में विलियम जोंस ने की थी।"},{"ch":10,"page":527,"n":30,"q":"सूची-I को सूची-II से सुमेलित कीजिए तथा नीचे दिए गए कूट से सही उत्तर चुनिए-\nसूची-I सूची-II\nA. ब्रिटिश इंडियन एसोसिएशन 1. गोपाल कृष्ण गोखले\nB. बॉम्बे प्रेसीडेंसी एसोसिएशन 2. के.टी. तैलंग\nC. सेंट्रल मोहम्मडन नेशनल 3. राधाकांत देव एसोसिएशन\nD. सर्वेंट्‌स ऑफ इंडिया सोसाइटी ":533,"n":35,"q":"निम्नलिखित में से कौन भारतीय राष्ट्रीय कांग्सरे का अध्यक्ष कभी नहीं चुना जा सका?","o":["लाला लाजपत राय","एनी बेसेंट","मोतीलाल नेहरू","बाल गंगाधर तिलक"],"a":[3],"t":["U.P. P.C.S. (Mains) 2006","U.P. P.C.S. (Spl.) (Mains) 2008","Uttarakhand U.D.A./L.D.A. (Pre) 2007"],"e":"लाला लाजपत राय‚ जिन्हें लोग प्राय: ‘शेरे पंजाब’ (पंजाब का सिंह) कहते थे‚ वर्ष 1920 में कलकत्ता के विशेष अधिवेशन में भारतीय राष्ट्रीय कांग्रेस के अध्यक्ष बने‚ वे ‘अनहैप्पी इंडिया’ (Unhappy India) के लेखक थे। श्रीमती एनी बेसटें वर्ष 1907 से 1933 तक थियोसोफिकल सोसाइटी की प्रधान रहीं‚ वर्ष 1916 में होमरूल लीग का गठन किया तथा कलकत्ता में वर्ष 1917 को हुए कांग्रेस के अधिवेशन की अध्यक्षता भी की। वह भारतीय राष्ट्रीय कांग्रेस की पहली महिला अध्यक्ष थीं। मोतीलाल नेहरू वर्ष 1919 और वर्ष 1928 में कांग्रेस के अध्यक्ष रहे तथा वर्ष 1923 में उन्होंने ‘स्वराज पार्टी’ के गठन में मुख्य भूमिका निभाई। तिलक महाराष्ट्र के चितपावन ब्राह्मण थे‚ उन्होंने ‘केसरी’ तथा ‘मराठा’ का संपादन किया‚ और ‘स्वराज्य मेरा जन्मसिद्ध अधिकार है’ का प्रसिद्ध नारा दिया; किंतु वे कांग्रेस के अध्यक्ष कभी नहीं रहे।"},{"ch":11,"page":534,"n":37,"q":"निम्नलिखित में से किसने कभी भी भारतीय राष्ट्रीय कांग्सरे के किसी भी अधिवेशन की अध्यक्षता नहीं की?","o":["लाला लाजपत राय","बाल गंगाधर तिलक","गोपाल कृष्ण गोखले","सुभाष चंद्र बोस"],"a":[1],"t":["U.P.P.C.S. (Pre) 2021"],"e":"लाला लाजपत राय‚ जिन्हें लोग प्राय: ‘शेरे पंजाब’ (पंजाब का सिंह) कहते थे‚ वर्ष 1920 में कलकत्ता के विशेष अधिवेशन में भारतीय राष्ट्रीय कांग्रेस के अध्यक्ष बने‚ वे ‘अनहैप्पी इंडिया’ (Unhappy India) के लेखक थे। श्रीमती एनी बेसटें वर्ष 1907 से 1933 तक थियोसोफिकल सोसाइटी की प्रधान रहीं‚ वर्ष 1916 में होमरूल लीग का गठन किया तथा कलकत्ता में वर्ष 1917 को हुए कांग्रेस के अधिवेशन की अध्यक्षता भी की। वह भारतीय राष्ट्रीय कांग्रेस की पहली महिला अध्यक्ष थीं। मोतीलाल नेहरू वर्ष 1919 और वर्ष 1928 में कांग्रेस के अध्यक्ष रहे तथा वर्ष 1923 में उन्होंने ‘स्वराज पार्टी’ के गठन में मुख्य भूमिका निभाई। तिलक महाराष्ट्र के चितपावन ब्राह्मण थे‚ उन्होंने ‘केसरी’ तथा ‘मराठा’ का संपादन किया‚ और ‘स्व परिकल्‍पना 1890 के दशक में प्रारंभ हुई थी। विद्वानों का मानना है कि तिलक के करीबी सहयोगी जोसेफ ''काका'' बैपटिस्टा ने सबसे पहले यह वाक्‍य गढ़ा था। माना जाता है कि बैपटिस्टा ने मराठी में संभवत: यह पंक्‍ति रची थी- ''स्वराज्‍य हा माझा जन्‍मसिद्ध हक्‍क आहे, आणि तो मी मिलवणारच'' और तिलक ने इस नारे को अपनाकर जन-जन तक पहुंचाया। प्राप्‍त साक्ष्यों के आधार पर यह कहा जा सकता है कि इस नारे का उपयोग सार्वजनिक मंचों से तिलक ने होमरूल आंदोलन के दौरान अप्रैल-मई, 1916 में किया था। कुछ स्रोतों में इस बात पर जोर दिया गया है कि सर्वप्रथम 1916 के कांग्रेस के लखनऊ अधिवेशन में तिलक ने इस नारे का उपयोग किया था, किंतु इसके समर्थन में पर्याप्‍त ऐतिहासिक साक्ष्य उपलब्ध नहीं है।"},{"ch":11,"page":536,"n":52,"q":"“स्वराज मेरा जन्मसिद्ध अधिकार है‚ और मैं इसे लेकर रहूंगा” यह वक्तव्य किससे संबंधित है?","o":["लाला लाजपत राय","महात्मा गांधी","बाल गंगाधर तिलक","सुभाष चंद्र बोस"],"a":[2],"t":["42nd B.P.S.C. (Pre) 1997","46th B.P.S.C. (Pre) 2003","U.P P.C.S. (Pre) 2005","Uttarakhand P.C.S. (Mains) 2006"],"e":"भारतीय राष्ट्रीय कांग्सरे के लखनऊ अधिवेशन‚ 1916 में बाल गंगाधर तिलक ने कहा था‚ ‘‘स्वराज मेरा जन्मसिद्ध अधिकार है‚ और मैं उसे लेकर रहूंगा।’’ हालांकि इस अधिवेशन से पूर्व तिलक ने इस नारे का प्रयोग 1916 में हुए होमरूल आंदोलन में किया था। नोट- बाल गंगाधर तिलक द्वारा‚ प्रयुक्‍त नारा ‘‘स्वराज मेरा जन्मसिद्ध अधिकार है‚ और मैं इसे लेकर रहूंगा।’’ तिलक द्वारा सर्वप्रथम कब दिया गया, इसे लेकर विद्वानों के मध्य काफी मतभेद देखने को मिलता है। दरअसल, इस नारे की परिकल्‍पना 1890 के दशक में प्रारंभ हुई थी। विद्वानों का मानना है कि तिलक के करीबी सहयोगी जोसेफ ''काका'' बैपटिस्टा ने सबसे पहले यह वाक्‍य गढ़ा था। माना जाता है कि बैपटिस्टा ने मराठी में संभवत: यह पंक्‍ति रची थी- ''स्वराज्‍य हा माझा जन्‍मसिद्ध हक्‍क आहे, आणि तो मी मिलवणारच'' और तिलक ने इस नारे को अपनाकर जन-जन तक पहुंचाया। प्राप्‍त साक्ष्यों के आधार पर यह कहा जा सकता है कि इस नारे का उपयोग सार्वजनिक मंचों से तिलक ने होमरूल आंदोलन के दौरान अप्रैल-मई, 1916 में किया था। कुछ स्रोतों में इस बात पर जोर दिया गया है कि सर्वप्रथम 1916 के कांग्रेस के लखनऊ अधिवेशन में तिलक  लिखे पत्र में कहा था- “कांग्रेस अब लड़खड़ा रही है और जल्द ही गिरने वाली है। मेरा सबसे बड़ा मकसद भी यही है कि मेरे भारत प्रवास के दौरान ही इस पार्टी का अंत हो जाए।” वर्ष 1903 में उन्होंने मद्रास गवर्नर को लिखा-“जब से मैं भारत आया हूं‚ मेरी नीति यही रही है कि किसी भी तरह कांग्रेस को नपुंसक बना दूं।” वर्ष 1904 में कर्जन ने कांग्रेस अध्यक्ष के नेतृत्व में एक कांग्रेसी प्रतिनिधिमंडल से मिलने से इनकार कर दिया था।"},{"ch":11,"page":537,"n":61,"q":"भारत के स्वातंत्र्य-प्राप्‍ति के बाद निम्नलिखित में से किसने सुझाव दिया था कि भारतीय राष्ट्रीय कांग्रेस को समाप्‍त कर दिया जाए?","o":["सी. राजगोपालाचारी","आचार्य कृपलानी","महात्मा गांधी","जयप्रकाश नारायण"],"a":[2],"t":["I.A.S. (Pre) 1996","U.P. Lower Sub. (Spl.) (Pre) 2004","Uttarakhand P.C.S. (Pre) 2005"],"e":"भारत की स्वतंत्रता प्राप्‍ति के बाद महात्मा गांधी ने भारतीय राष्ट्रीय कांग्रेस को समाप्‍त करने का सुझाव दिया था।"},{"ch":11,"page":537,"n":62,"q":"अमृतसर के भारतीय राष्ट्रीय कांग्रेस अधिवेशन‚ 1919 के प्रस्ताव के अनुसार महात्मा गांधी द्वारा कांग्रेस का नया संविधान लिखने हेतु निम्नलिखित में से किन्हें उनके सहयोग हेतु चुना गया?\n1. बी.जी. तिलक 2. एन.सी. केलकर\n3. सी.आर. दास 4. आई.बी. सेन\nनीचे दिए हुए कूट से सही उत्तर का चयन कीजिए-\nकूट :","o":["2 एवं 4","1 एवं 2","3 एवं 4","1 एवं 3"],"a":[0],"t":["U.P.P.C.S. (Mains) 2014"],"e":"कांग्रेस के संविधान लिखने हेतु महात्मा गांधी‚ बी.जी. तिलक एवं सी.आर. दास का सहयोग चाहते थे; किंतु कार्याधिक्य के कारण इस हेतु ये नेता उपलब्ध नहीं हो सके। इन शीर्ष नेताओं के स्थानापन्‍न के रूप में इन्हीं नेताओं के कनिष्ठ सहयोगी एन.सी. केलकर एवं आई.बी. सेन को कांग्रेस संविधान के लेखन में महात्मा गांधी के सहयोग हेतु चुना गया।"},{"ch":11,"page":537,"n":63,"q":"कांग्रेस के एक अधिवेशन में एक गवर्नर जनरल ने भाग लिया था। उक्त गवर्नर जनरल तथा अधिवेशन स्थल निम्न में से कौन-सा था?","o":["लॉर्ड इर्विन - कराची - 1931","लॉर्ड विलिंगडन - बंबई - 1915","लॉर्ड डफरिन - बंबई - 1885","लॉर्ड हार्डिंग - लखनऊ - 1916"],"a":[1],"t":["U.P. Lower Sub. (Spl.) (Pre) 2008"],"e":"लाॅर्ड विलिंगडन ने कांग्रेस के बंबई अधिवेशन में भाग लिया था। इस दौरान वह बंबई का गवर्नर था। यह अधिवेशन बंबई में वर्ष 1915 में आयोजित किया गया। ध्यातव्य है कि तब विलिंगडन भारत का वायसराय नहीं था। भारत के गवर्नर जनरल एवं वायसराय के रूप में उसका कार्यकाल वर्ष 1931-36 था।"},{"ch":11,"page":537,"n":64,"q":"भारतीय राष्ट्रीय कांग्रेस के निम्नलिखित अधिवेशनों में से किसकी अध्यक्षता सी. विजय राघवा चारियर ने की थी?","o":["लखनऊ अधिवेशन (1916)","नागपुर अधिवेशन (1920)","गया अधिवेशन (1922)","उपर्युक्त में से कोई नहीं"],"a":[1],"t":["U.P.P.C.S. (Mains) 2016"],"e":"सी.विजय राघवा चारियर (सी. विजय राघव चेरियार) ने भारतीय राष्ट्रीय कांग्रेस के नागपुर अधिवेशन (1920) की अध्यक्षता की थी। लखनऊ अधिवेशन (1916) की अध्यक्षता अंबिका चरण मजूमदार ने की थी‚ जबकि गया अधिवेशन (1922) की अध्यक्षता चित्तरंजन दास (चितरंजन दास) ने की थी। नागपुर अधिवेशन (1920) में ही सदस्यता शुल्क 4 आना प्रति वर्ष किया गया‚ ताकि गरीब से गरीब व्यक्ति भी कांग्रेस से जुड़ सके।"},{"ch":11,"page":537,"n":65,"q":"निम्नलिखित में से किस अधिवेशन में कांग्रेस ने पहली बार भारतीय रियासतों के प्रति अपनी नीति घोषित की थी?","o":["नागपुर अधिवेशन में","गया अधिवेशन में","कलकत्ता अधिवेशन में","लखनऊ अधिवेशन में"],"a":[0],"t":["U.P. P.C.S. (Pre) 2015"],"e":"वर्ष 1920 में भारतीय राष्ट्रीय कांग्रेस ने अपने नागपुर अधिवेशन में रियासतों के प्रति अपनी नीति की घोषणा करते हुए उनके शासकों से यह मांग की कि प्रजा को पूर्ण उत्तरदायी सरकार दी जाए।"},{"ch":11,"page":538,"n":70,"q":"निम्नलिखित में से किसने अखिल भारतीय हरिजन सेवक संघ की वर्ष 1932 में स्थापना की?","o":["बी.जी. गोखले","एम.के. गांधी","बी.आर. अम्बेडकर","उपर्युक्त में से कोई नहीं"],"a":[1],"t":["U.P. P.C.S. (Mains) 2017"],"e":"अखिल भारतीय हरिजन सेवक संघ की स्थापना वर्ष 1932 में एम.के. गांधी ने की थी।"},{"ch":11,"page":538,"n":71,"q":"नीचे उन व्यक्तियों की सूची दी गई है‚ जो भारतीय राष्ट्रीय कांग्रेस के अध्यक्ष हुए। तिथ्यानुसार उन्हें क्रमबद्ध कीजिए। नीचे दिए गए कूट का उपयोग कर अपना उत्तर दीजिए-\n1. महात्मा गांधी\n2. जवाहरलाल नेहरू\n3. वल्‍लभभाई पटेल\n4. श्रीमती सरोजिनी नायडू\nकूट :","o":["1, 2, 3 तथा 4","1, 3, 4 तथा 2","1, 4, 2 तथा 3","4, 3, 1 तथा 2"], ],"t":["U.P. P.C.S. (Spl.) (Mains) 2008"],"e":"कांग्रेस का इक्यावनवां अधिवेशन 19-21 फरवरी‚ 1938 के दौरान गुजरात के हरिपुरा में संपन्‍न हुआ था। इस अधिवेशन की अध्यक्षता सुभाष चंद्र बोस ने की थी। इस अधिवेशन में आर्थिक नियोजन की आवश्यकता पर बल दिया गया। अक्‍टूबर, 1938 में सुभाष चंद्र बोस, पं. जवाहर लाल नेहरू की अध्यक्षता में ‘आर्थिक नियोजन समिति’ का गठन किया गया। राजेंद्र प्रसाद को वर्ष 1934 में कांग्सरे अध्यक्ष चुना गया था। आगे चलकर वर्ष 1940-1946 तक अबुल कलाम आजाद कांग्रेस के अध्यक्ष रहे‚ जबकि जे.बी. कृपलानी को वर्ष 1946 में मेरठ कांग्रेस अधिवेशन में अध्यक्ष निर्वाचित किया गया था।"},{"ch":11,"page":540,"n":82,"q":"सूची-I को सूची-II से सुमेलित कीजिए तथा सूचियों के नीचे दिए गए कूट से सही उत्तर का चयन कीजिए-\nसूची-I सूची-II (कांग्रेस अध्यक्ष) (अधिवेशन स्थान)\nA. डॉ. एम. ए. अंसारी 1. हरिपुरा\nB. पुरुषोत्तम दास टंडन 2. कानपुर\nC. सरोजिनी नायडू 3. मद्रास\nD. सुभाष चंद्र बोस 4. नासिक\nकूट :\nA B C D","o":["1 2 4 3","2 3 1 4","3 4 2 1","4 1 3 2"],"a":[2],"t":["U.P.P.C.S. (Pre) 2012"],"e":"हरिपुरा कांग्रेस अधिवेशन (1938) की अध्यक्षता सुभाष चंद्र बोस ने‚ नासिक अधिवेशन (1950) की अध्यक्षता पुरुषोत्तम दास टंडन ने‚ मद्रास अधिवेशन (1927) की अध्यक्षता डॉ. एम.ए. अंसारी ने एवं कानपुर अधिवेशन (1925) की अध्यक्षता सरोजिनी नायडू ने की थी।"},{"ch":11,"page":540,"n":83,"q":"निम्नलिखित में से कौन लगातार छ: वर्ष तक भारतीय राष्ट्रीय कांग्रेस का अध्यक्ष था?","o":["जवाहरलाल नेहरू","अबुल कलाम आजाद","जी.के. गोखले","दादाभाई नौरोजी"],"a":[1],"t":["U.P.P.C.S. (Mains) 2016"],"e":"अबुल कलाम आजाद वर्ष 1940-46 तक लगातार छ: वर्षों तक भारतीय राष्ट्रीय कांग्रेस के अध्यक्ष थे। आजादी के पूर्व यह सबसे लंबा कार्यकाल था। आजादी के बाद लंबे कार्यकाल वाले अध्यक्ष इस प्रकार थे- (1) इंदिरा\nगांधी - वर्ष 1978-84‚ (2) राजीव गांधी- वर्ष 1985-91 तथा (3) सोनिया\nगांधी - वर्ष 1998 - 2017 तक (सबसे लंबा कार्यकाल) तथा वर्ष 2019 से 2022 तक।"},{"ch":11,"page":541,"n":86,"q":"‘जन-गण-मन’ पहली बार किस अवसर पर गाया गया था?","o":["भारतीय राष्ट्रीय कांग्रेस का अधिवेशन - 1896","भारतीय राष्ट्रीय कांग्रेस का अधिवेशन - 1905","भारतीय राष्ट .P.P.C.S. (Mains) 2016"],"e":"गोपाल कृष्ण गोखले उदारवादी खेमे से संबद्ध थे। वह समभाव और मृदु न्यायप्रियता में विश्वास करते थे। उन्हें पूर्ण विश्वास था कि देश का पुनरुद्धार उत्तेजना के बवंडरों में नहीं हो सकता। वे साधन और साध्य दोनों की पवित्रता में विश्वास करते थे।"},{"ch":12,"page":544,"n":10,"q":"किसने भारतीय राष्ट्रीय कांग्रेस पर प्रार्थना‚ याचना तथा विरोध की राजनीति करने का आरोप लगाया?","o":["लाला हरदयाल","बाल गंगाधर तिलक","सुभाष चंद्र बोस","सरदार भगत सिंह"],"a":[1],"t":["U.P. U.D.A./L.D.A. (Pre) 2002","U.P. Lower Sub. (Spl.) (Pre) 2002"],"e":"वर्ष 1906 के आस-पास भारतीय राजनीतिक कांग्रेस के भीतर उग्रवादी विचारधारा का उभार स्पष्ट हुआ तथा देश में गुप्‍त क्रांतिकारी संगठन जो 1890 के दशक में सक्रिय होने लगे थे उनकी क्रांतिकारी गतिविधियां वर्ष 1906 के बाद अधिक तीव्र हुईं। उग्रवादी विचारधारा के चार प्रमुख नेता थेबाल गंगाधर तिलक‚ लाला लाजपत राय‚ बिपिन चंद्र पाल तथा अरबिंद घोष। इन नेताओं ने स्वराज्य प्राप्‍ति को ही अपना लक्ष्य बनाया। उन्हें उदारवादी नेताओं की तरह संवैधानिक दायरे के अंदर अपनी मांगें मनवाने में विश्वास नहीं था। तिलक ने कहा कि-“हमारा उद्देश्य आत्मनिर्भरता है‚ भिक्षावृत्ति नहीं।” उन्होंने कांग्रेस पर प्रार्थना‚ याचना तथा विरोध की राजनीति करने का आरोप लगाया।"},{"ch":12,"page":544,"n":11,"q":"किसने भारतीय राष्ट्रीय कांग्सरे के विरुद्ध ‘अननु य‚ विनय और विरोध’ की राजनीति का दोष लगाया था?","o":["बी.जी. तिलक","एम.ए. जिन्‍ना","एस.सी. बोस","एनी बेसेंट"],"a":[0],"t":["U.P.P.C.S. (Pre) 2005","U.P.P.C.S. (Mains) 2002"],"e":"वर्ष 1906 के आस-पास भारतीय राजनीतिक कांग्रेस के भीतर उग्रवादी विचारधारा का उभार स्पष्ट हुआ तथा देश में गुप्‍त क्रांतिकारी संगठन जो 1890 के दशक में सक्रिय होने लगे थे उनकी क्रांतिकारी गतिविधियां वर्ष 1906 के बाद अधिक तीव्र हुईं। उग्रवादी विचारधारा के चार प्रमुख नेता थेबाल गंगाधर तिलक‚ लाला लाजपत राय‚ बिपिन चंद्र पाल तथा अरबिंद घोष। इन नेताओं ने स्वराज्य प्राप्‍ति को ही अपना लक्ष्य बनाया। उन्हें उदारवादी नेताओं की तरह संवैधानिक दायरे के अंदर अपनी मांगें मनवाने में विश्वास नहीं था। तिलक ने कहा कि-“हमारा उद्देश्य आत्मनिर्भरता है‚ भिक्षावृत्ति नहीं।” उन्होंने कांग्रेस पर प्रार्थना‚ याचना तथा विरोध की राजनीति करने का आरोप लगाया।"},{"ch":12,"page":544,"n":13,"q":"भारतीय राष्ट्रीय कांग्सरे को किसने ‘‘भीख मांगने वाली संस्था’’ (बेगिगं इंस्टीट्‌यूट) कहा था?","o":["बी.सी. पाल ने","तिलक ने","अरबिंद घोष ने","इनमें से किसी ने नहीं"],"a":[0],"t":["U.P. Lower Sub. (Spl.) (Pre) 2008"],"e":"उग्र विचारधारा वाले नेताओं ने कांग्रेस के बारे में नकारात्मक टिप्पणियां कीं। उनमें से एक बिपिन चंद्र पाल ने भारतीय राष्ट्रीय कांग्रेस और उसकी लंदन स्थित ब्रिटिश कमेटी को ‘याचना संस्थाएं’ (बेगिगं इंस्टीट्‌यूट स) की संज्ञा दी।"},{"ch":12,"page":544,"n":14,"q":"बिपिन चन्द्र पाल के संदर्भ में कौन सा कथन सत्य है?\n1. वह ब्रह्मसमाजी नेता तथा समाज सुधारक थे।\n2. न्यू इंडिया नाम की साप्‍ताहिक पत्रिका प्रकाशित किया।\nनीचे दिए गए कूट का प्रयोग कर सही उत्तर चुनिए-\nकूट :","o":["1 और 2 दोनों","केवल 1","न तो 1 ना ही 2","केवल 2"],"a":[0],"t":["U.P. R.O./A.R.O. (Pre) 2023"],"e":"बिपिन चंद्र पाल‚ ब्रह्म समाज से जुड़े थे। वह समाज सुधारक और राष्ट्रवादी थे। उनका उल्‍लेख अक्सर लाला लाजपत राय और बाल गंगाधर तिलक जैसे उग्रपंथी राजनेताओं के साथ किया जाता है। इन्होंने वर्ष 1901 में ‘न्यू इंडिया’ नामक साप्‍ताहिक पत्रिका के माध्यम से पंथनिरपेक्षता‚ राष्ट्रवाद और तर्कवाद की घोषणा की। अत: स्पष्ट है कि दोनों कथन सत्य हैं।"},{"ch":12,"page":545,"n":17,"q":"निम्नलिखित में से कौन एक उग्रवादी था?","o":["फिरोजशाह मेहता","गोपाल कृष्ण गोखले","बिपिन चंद्र पाल","उपर्युक्त में से कोई नहीं"],"a":[2],"t":["U.P. U.D.A./L.D.A. (Pre) 2013"],"e":"अरबिंद घोष कांग्रेस के उग्रवादी विचारधारा अथवा गरम पक्ष के नेता थे। वे गरम दल के चार स्तंभों (लाला लाजपत राय‚ बाल गंगाधर तिलक‚ बिपिन चंद्र पाल और अरबिंद घोष) में से एक थे। 1893-94 ई. में अपने एक लेख में उन्होंने कहा था कि कांग्रेस श्रमिक वर्ग से दूर है‚ अराष्ट्रवादी है और पूर्णतया असफल रही है तथा कांग्रेस की ‘अप्रसन्‍न होने के भय से स्पष्ट न कहने की नीति को उन्होंने कायरता की संज्ञा दी। उनके अनुसार‚ कांग्रेस क्षय रोग से मरने वाली है। वर्ष 1908 में पुलिस द्वारा मणिकतल्‍ला उद्यान (अन्‍य नाममुरारी पुकुर बागान-बारी) में छापा मारकर 14 क्रांतिकारियों को गिरफ्तार किया गया और अरबिंद घोष को कलकत्ता में ग्रे स्ट्रीट में स्थित उनके घर से गिरफ्तार किया गया। सभी गिरफ्तार क्रांतिकारियों के ऊपर मुकदमा चलाया गया, जिसे ‘अलीपुर षड्‍यंत्र केस’ के नाम से जाना जाता है। इस मुकदमें में अरबिंद घोष पर लगभग एक साल तक मुकदमा चला, किंतु बाद में साक्ष्य के अभाव में उन्‍हें छोड़ दिया गया। कालांतर में वे राजनीतिक क्रियाकलापों से अलग होकर संन्‍यासी बन गए तथा पांडिचेरी (अब पुडुचेरी) चले गए।"},{"ch":12,"page":545,"n":20,"q":"निम्नलिखित में से कौन भारतीय राष्ट्रीय कांग्रेस में उदारवादियों से जुड़ा नहीं था?","o":["फिरोजशाह मेहता","दादाभाई नौरोजी","गोपाल कृष्ण गोखले","लाला लाजपत राय"],"a":[3],"t":["U.P.P.C.S. (Mains) 2011"],"e":"लाला लाजपत राय ‘शेर-ए-पंजाब’ के नाम से भी जाने जाते थे। ये भारतीय राष्ट्रीय कांग्रेस में गरम दल के नेता तथा पंजाब के प्रतिनिधि थे। इन्हें ‘पंजाब केसरी’ भी कहा जाता है।"},{"ch":12,"page":545,"n":21,"q":"निम्न में से किस एक को लाला लाजपत राय ने अपना राजनीतिक गुरु माना था?","o":["गैरिबॉल्डी को","विवेकानंद को","दादाभाई नौरोजी को","मैजिनी को"],"a":[3],"t":["U.P.R.O./A.R.O. (Mains) 2013"],"e":"लाला लाजपत राय ने सुरेन्‍द्र नाथ बनर्जी के भाषण संग्रह में से मेजनी पर लिखे उनके भाषण से प्रभावित होकर, उन्‍होंने मेजनी को अपना राजनीतिक गुरु माना तथा बाद में उन्होंने मैजिनी की उत्कृष्ट रचना ‘द ड्‌यूटीज ऑफ मैन’ का उर्दू में अनुवाद भी किया।"},{"ch":12,"page":545,"n":24,"q":"निम्न में कौन मध्यममार्गी नहीं था?","o":["गोपाल कृष्ण गोखले","बाल गंगाधर तिलक","ए.ओ. ह्यूम","मदन मोहन मालवीय"],"a":[1],"t":["U.P. P.C.S. (Pre) 1995"],"e":"कांग्सरे की प्रारंभिक उदारवादी अथवा मध्यममार्गी नीतियों से नव राष्ट्रवादियों के रूप में प्रसिद्ध लाल‚ बाल‚ पाल का मोह भंग हो गया। बाल गंगाधर तिलक इस नई विचारधारा के अग्रदूत थे। वे मध्यममार्गी न होकर उग्र नीतियों के समर्थक थे।"},{"ch":12,"page":546,"n":25,"q":"निम्नलिखित नेताओं में से कौन एक ‘स्वदेशी’ के समर्थक थे?","o":["अरबिंद घोष","फिरोजशाह मेहता","दादाभाई नौरोजी","सुभाष चंद्र बोस"],"a":[0],"t":["U.P. P.C.S. (Pre) 2009"],"e":"बंगाल के विभाजन के विरोध में चलाए गए ‘स्वदेशी आंदोलन’ के अरबिंद घोष प्रमुख नेता थे। इस आ ins) 2006"],"e":"शिव वर्मा हिंदुस्तान रिपब्लिकन एसोसिएशन (एच.आर.ए.) के सदस्य नहीं थे। बाद में ये इसके परवर्ती संगठन हिंदुस्तान सोशलिस्ट रिपब्लिकन एसोसिएशन (H.S.R.A.) से जुड़े। शेष तीनों (भगत सिंह‚ चंद्रशेखर आजाद तथा राम प्रसाद बिस्मिल) एच.आर.ए. के सदस्य रहे थे। शिव वर्मा को लाहौर षड्‌यंत्र मामले में आजीवन कारावास की सजा हुई थी।"},{"ch":13,"page":553,"n":28,"q":"अपनी फांसी से पूर्व निम्नलिखित क्रांतिकारियों में से किस एक ने पीने हेतु दिए गए दूध को अस्वीकार कर दिया और कहा‚ ‘‘अब मैं केवल अपनी मां का दूध लूंगा।’’?","o":["राजगुरु","अशफाक उल्‍लाह","रामप्रसाद बिस्मिल","भगत सिंह"],"a":[2],"t":["U.P.P.C.S. (Pre) 2014"],"e":"प्रसिद्ध क्रांतिकारी पंडित रामप्रसाद बिस्मिल को फांसी (19 दिसंबर, 1927) से एक दिन पहले (18 दिसंबर, 1927) जब दूध पीने हेतु दिया गया तो इन्होंने अस्वीकार कर दिया और कहा‚ ‘‘अब मैं केवल अपनी मां का दूध लूंगा।’’ पंडित बिस्मिल एक उम्दा शायर भी थे। फांसी के तख्त पर जाने से पहले 19 दिसंबर‚ 1927 को इन्होंने अपना अंतिम शेर पढ़ा था‚ जो इस प्रकार था‘‘मालिक तेरी रजा रहे‚ और तू ही तू रहे बाकी न मैं रहूं न मेरी आरजू रहे‚ जब तक तन में सांस‚ रगों में लहू रहे तेरा ही जिक्रेयार और तेरी ही जुस्तजू रहे।’’ उ.प्र. लोक सेवा आयोग ने अपने प्रारंभिक उत्तर-पत्रक में इस प्रश्न के उत्तर के रूप में विकल्प (c) को प्रदर्शित किया था‚ जबकि संशोधित उत्तर-पत्रक में इस प्रश्न को विलोपित कर दिया गया।"},{"ch":13,"page":554,"n":32,"q":"काकोरी षडयंत्र केस किस वर्ष में हुआ?","o":["1920 में","1925 में","1930 में","1935 में"],"a":[1],"t":["U.P. Lower Sub. (Pre) 2008"],"e":"अक्टूबर‚ 1924 में शचींद्रनाथ सान्याल‚ राम प्रसाद बिस्मिल आदि लोगों ने कानपुर में क्रांतिकारी संस्था “हिंदुस्तान रिपब्लिकन एसोसिएशन” की स्थापना की। इस संस्था द्वारा 9 अगस्त‚ 1925 को ईस्ट इंडियन रेलवे के लखनऊ-सहारनपुर संभाग के काकोरी नामक स्थान पर ‘‘आठ डाउन सहारनपुर-लखनऊ पैसेंजर ट्रेन’’ पर डकैती डालकर सरकारी खजाना लूटा गया। यह घटना काकोरी कांड (वर्तमान नाम-काकोरी ट्रेन एक्शन) के नाम से प्रसिद्ध हुई। इस कांड में 43 क्रांतिकारियों को गिरफ्तार किया गया‚ जिसमें रामप्रसाद बिस्मिल‚ अशफाकउल्‍लाह‚ रोशन लाल तथा राजेंद्र लाहिड़ी को फांसी हुई‚ जब ‚ 1931 को भारत मां के इन अमर सपूतों को फांसी दे दी गई‚ जबकि बटुकेश्वर दत्त को कालापानी की सजा देकर सेल्युलर जेल (अंडमान और निकोबार द्वीप समूह) भेज दिया गया।"},{"ch":13,"page":557,"n":61,"q":"भारतीय स्वतंत्रता के लिए फांसी पाने वाले प्रथम रिकार्डेड मुस्लिम का नाम बताएं।","o":["मोहम्मद अली","शौकत अली","अशफाकउल्‍लाह खां","अजीजुद्दीन"],"a":[2],"t":["U.P. Lower Sub. (Pre) 2004"],"e":"अशफाकउल्‍लाह खां भारतीय स्वतंत्रता के लिए फांसी पाने वाले पहले रिकार्डेड मुस्लिम थे‚ उन्हें काकोरी षड्‌यंत्र केस में फैजाबाद (वर्तमान अयोध्या) जेल में 19 दिसंबर‚ 1927 को 27 वर्ष की उम्र में फांसी दे दी गई थी। उनका जन्म 22 अक्टूबर‚ 1900 को शाहजहांपुर (उ.प्र.) में हुआ था‚ तथापि यदि 1857 के विद्रोह का संदर्भ भी लिया जाए‚ तो इस प्रश्न का उत्तर अजीजुद्दीन होगा; क्योंकि 1857 ई. में दिल्‍ली विद्रोह को दबाने के बाद अंग्रेजों द्वारा मुगल शहजादे मिर्जा अजीजुद्दीन को नवंबर‚ 1857 में 6 अन्य मुगल शहजादों के साथ दिल्‍ली दरवाजे पर फांसी पर लटका दिया गया था।"},{"ch":13,"page":558,"n":62,"q":"नीचे कुछ मुकदमों की सूची दी गई है। अंत में दिए गए कूट का प्रयोग करते हुए उनके तिथ्यानुसार सही क्रम का चयन कीजिए-\n1. लाहौर मुकदमा\n2. काकोरी मुकदमा\n3. मेरठ मुकदमा\n4. कानपुर मुकदमा\nकूट :","o":["1, 3, 2 और 4","2, 4, 3 और 1","1, 4, 2 और 3","1, 4, 3 और 2"],"a":[2],"t":["U.P. P.S.C. (GIC) 2010"],"e":"लाहौर का प्रथम षड्‌यंत्र तथा द्वितीय षड्‌यंत्र में निर्णय का वर्ष क्रमश: 1916 तथा 1930 है। कानपुर षड्‌यंत्र मुकदमा वर्ष 1924 का‚ काकोरी षड्‌यंत्र वर्ष 1925 का तथा मेरठ षड्‌यंत्र मामला वर्ष 1929 का है। प्रथम लाहौर षड्य‌ंत्र केस के संदर्भ में अभीष्ट उत्तर विकल्प (c) होगा।"},{"ch":13,"page":558,"n":63,"q":"निम्नलिखित युग्मों में से कौन सही सुमेलित नहीं है?","o":["हावड़ा षड्‌यंत्र प्रकरण - 1910","विक्टोरिया षड्‌यंत्र प्रकरण - 1914","लाहौर षड्‌यंत्र प्रकरण - 1916 और 1930","काकोरी षड्‌यंत्र प्रकरण - 1924"],"a":[3],"t":["U.P. P.C.S. (Pre) 2015"],"e":"काकोरी षड्‌यंत्र प्रकरण 9 अगस्त‚ 1925 को क्रांतिकारी रामप्रसाद बिस्मिल के नेतृत्व में हुई ट्रेन डकैती को कहते हैं। इस डकैती में क्रांतिकारियों ने लखनऊ के पास काकोरी नामक स्थान पर ट्रेन स करतार सिंह सराभा तथा पंडित कांशीराम प्रमुख थे, जबकि खुदीराम बोस का संबंध 30 अप्रैल, 1908 को हुए मुजफ्फरपुर कांड से है। इस प्रकार स्पष्ट है कि खुदीराम बोस का गदर पार्टी से कोई संबंध नहीं था। अत: विकल्प (d) सही उत्तर है।"},{"ch":14,"page":566,"n":22,"q":"निम्नांकित में वह कौन व्यक्ति था‚ जिसने विदेश में गणतंत्रात्मक सरकार की संस्थापना की थी?","o":["महेंद्र प्रताप","सुभाष चंद्र बोस","रास बिहारी बोस","उपर्युक्त में से कोई नहीं"],"a":[0],"t":["U.P. P.C.S. (Spl.) (Pre) 2008"],"e":"राजा महेंद्र प्रताप ने अपने सहयोगी बरकतुल्‍लाह के साथ प्रथम महायुद्ध के दौरान वर्ष 1915 में काबुल (अफगानिस्तान) में भारत की प्रथम अस्थायी सरकार, अनंतिम सरकार (Provisional Government) का गठन किया था। इसमें राजा महेंद्र प्रताप स्वयं राष्ट्रपति तथा बरकतुल्‍लाह प्रधानमंत्री थे। इसे जर्मनी तथा रूस ने मान्यता भी दी थी।"},{"ch":14,"page":566,"n":23,"q":"प्रथम महायुद्ध के दौरान कहां पर भारत की एक अनंतिम सरकार बनी थी‚ जिसके प्रेसीडेंट राजा महेंद्र प्रताप थे?","o":["अफगानिस्तान में","जर्मनी में","सिंगापुर में","तुर्की में"],"a":[0],"t":["U.P.P.C.S. (Pre) 2012","U.P.U.D.A/L.D.A. (Spl.) (Mains) 2010"],"e":"राजा महेंद्र प्रताप ने अपने सहयोगी बरकतुल्‍लाह के साथ प्रथम महायुद्ध के दौरान वर्ष 1915 में काबुल (अफगानिस्तान) में भारत की प्रथम अस्थायी सरकार, अनंतिम सरकार (Provisional Government) का गठन किया था। इसमें राजा महेंद्र प्रताप स्वयं राष्ट्रपति तथा बरकतुल्‍लाह प्रधानमंत्री थे। इसे जर्मनी तथा रूस ने मान्यता भी दी थी।"},{"ch":14,"page":566,"n":25,"q":"कौन ‘भारतीय क्रांति की मां’ कहलाती हैं?","o":["एनी बेसेंट","सरोजिनी नायडू","रमाबाई","भीकाजी रुस्तम कामा"],"a":[3],"t":["U.P. P.C.S. (Pre) 2003","U.P. U.D.A./L.D.A. (Pre) 2002"],"e":"भीकाजी रुस्तम कामा क्रांतिकारी राष्ट्रवाद की समर्थक थीं। उन्‍होंने विदेश में रहकर भारतीय स्वतंत्रता आंदोलन के लिए प्रचार, साहित्‍य वितरण और संगठनात्‍मक सहयोग दिया। वर्ष 1907 में इन्होंने स्टुटगार्ट (जर्मनी) में आयोजित अंतरराष्ट्रीय समाजवादी कांग्रेस में भाग लिया। वह विदेशी धरती पर भारतीय ध्वज को फहराने वाली प्रथम भारतीय महिला थीं। इसी सम्मेलन में इन्होंने अपनी पूरी शक्ति के साथ स्वतंत्रता के लिए संघर्ष करने के संकल्प की उद्घ‌ोषणा की। ये पेरिस में भारत की स्वतंत्रता के लिए काम करती रहीं। वर्ष 1935 में बंबई लौटकर आईं और अगस्त‚ 1936 में उनका देहांत हो गया। वह ‘भारतीय क्रांति की मां’ के रूप में विख्यात हैं।"},{"ch":14,"page":567,"n":28,"q":"निम्नलिखित में से किस महिला ने भारतीय तिरंगा सबसे पहले फहराया था?","o":["अरुणा आसफ अली ने","भीकाजी कामा ने","दुर्गा भाभी ने","कमला देवी चट्टोपाध्याय ने"],"a":[1],"t":["U.P.P.C.S. (Mains) 2010"],"e":"मैडम कामा (Madam Cama) का जन्म 24 सितंबर‚ 1861 को हुआ था। उनके माता-पिता (Parents) पारसी थे। सोराबजी फ्रामजी पटेल उनके पिता थे। उनका विवाह रुस्तम के.आर. कामा (Rustam K.R. Cama) से हुआ‚ जो एक प्रसिद्ध वकील थे। मैडम कामा ने राष्ट्रीय आंदोलन के महान अग्रणी भारतीय नेता दादाभाई नौरोजी की निजी सचिव के रूप में सेवा की। बाद में वे कुछ देशभक्त विद्यार्थियों एवं यूरोपियन बौद्धिक लोगों के संपर्क में आकर स्वतंत्रता आंदोलन से जुड़ गईं। वह ‘भारतीय क्रांति की मां’ के रूप में विख्यात हैं। 22 अगस्त‚ 1907 को जर्मनी के स्टुटगार्ट में आयोजित अंतरराष्ट्रीय समाजवादी कांग्रेस (International Socialist Congress) में भाग लिया‚ वह विदेशी भूमि पर भारत के तिरंगे (त्रिरंगी) ध्वज को फहराने वाली प्रथम व्यक्ति थीं। यहां फहराया गया झंडा कलकत्ता में स्वदेशी आंदोलन के दौरान प्रयुक्त झंडे का ही संशोधित रूप था। अत: प्रथम कथन गलत है‚ क्योंकि यह सम्मेलन जर्मनी में आयोजित हुआ था न कि पेरिस में। शेष दोनों कथन सही हैं। नोट- 1907 में मैडम भीका जी कामा द्वारा फहराए गए भारतीय झंडे के निर्माण/डिजाइन के श्रेय को लेकर स्रोतों में भिन्‍नता है, कुछ स्रोत मैडम भीका जी कामा, वी.डी. सावरकर और श्याम जी कृष्ण वर्मा को डिजाइन का श्रेय देते हैं, तो कुछ स्रोत हेम चंद्र कानूनगो अथवा स्वयं मैडम कामा को इसकी डिजाइन का श्रेय देते हैं।"},{"ch":14,"page":567,"n":31,"q":"निम्नलिखित में से किस युग्म को इंग्लैंड में अंग्रेज अधिकारियों की हत्या के आरोप में फांसी की सजा मिली?","o":["राजगुरु तथा सुखदेव","खुदीराम बोस तथा सूर्यसेन","मदनलाल ढींगरा तथा ऊधम सिंह","करतार सिंह सराभा तथा अशफाकउल्‍लाह खां"],"a":[2],"t":["U.P. P.C.S. (Spl.) (Pre) 2004"],"e":"इंग्लैंड में अंग्रेज अधिकारियों की हत्या के आरोप में मदनलाल ढींगरा तथा ऊधम सिंह को फांसी की सजा मिली थी। ध्यातव्य है कि मदनलाल ढींगरा ने 1 जुलाई‚ 1909 को लंदन में नेशनल इंडियन एसोसिएशन के वार्षिक समारोह की बैठक में भारत के राज्य सचिव के राजनीतिक सलाहकार (Political aide-de-camp) कर्जन वायली पर गोली चलाई तथा कर्जन वायली के बचाव मे आए डॉ. कवास लालकाका भी इस हमले में मारे गए। फलत: उन्हें फांसी की सजा दी गई। ऊधम सिंह ने जलियांवाला बाग के अप्रत्यक्ष रूप से जिम्मेदार पंजाब के लेफ्टिनेंट गवर्नर माइकल ओ‘डायर की लंदन में मार्च‚ 1940 में हत्या कर दी थी‚ फलत: इन्हें भी फांसी की सजा हुई थी।"},{"ch":14,"page":568,"n":37,"q":"निम्नलिखित में से कौन ‘कामागाटामारू घटना’ से संबंधित था?","o":["सरदार अजित सिंह","बाबा गुरदीप सिंह","वी.डी. सावरकर","सरदार भगत सिंह"],"a":[1],"t":["U.P.P.C.S. (Mains) 2014"],"e":"कनाडा में प्रवेश न मिलने पर जब कामगाटामारू जहाज कलकत्ता के बजबज पहुंचा वो क्रुद्ध यात्रियों और पुलिस के मध्य मुठभेड़ में कुल 21 यात्रियों की मौत (कामागाटामारू शहीद स्मारक के अनुसार) हो गई। इन मृत 21 यात्रियों में से एक नाम भगत सिंह था। विकल्‍प में गुरुदित सिंह को त्रुटिवश गुरुदीप सिंह कर दिया गया है। इसलिए विकल्‍प (b) को सत्‍य माना गया है। मारे गए यात्रियों में से एक नाम संयोगवश भगत सिंह था, इसलिए हम विकल्‍प में दिए गए सरदार भगत सिंह की समता महान क्रांतिकारी शहीद-ए-अाजम सरदार भगत सिंह से करते हुए विकल्‍प (d) को सही नहीं मानते हैं।"},{"ch":14,"page":568,"n":38,"q":"‘कामागाटामारू’ क्या था?","o":["औद्योगिक केंद्र","एक बंदरगाह","एक जहाज","सेना की एक टुकड़ी"],"a":[2],"t":["U.P. P.C.S. (Re-Exam) (Pre) 2015"],"e":"‘कामागाटामारू’ भाप शक्ति से चलने वाला एक जापानी समुद्री जहाज था। पंजाब के 376 यात्रियों को लेकर यह जहाज वर्ष 1914 में हांगकांग से कनाडा के लिए रवाना हुआ था‚ लेकिन तब कनाडा में एशियाई मूल के प्रवासियों से संबंधित कड़े कानूनों के कारण उन्हें कनाडा में प्रवेश की अनुमति नहीं दी गई थी।"},{"ch":14,"page":568,"n":39,"q":"निम्नलिखित घटनाओं पर विचार कीजिए तथा उनको कालक्रमानुसार व्यवस्थित कीजिए।\nI. गदर पार्टी की स्थापना\nII. चटगांव शस्त्रागार छापा\nIII. बर्लिन में ‘इंडियन इंडिपेंडेंस कमेटी’ की स्थापना\nIV. केंद्रीय एसेम्बली बम कांड\nनीचे दिए गए कूट से सही उत्तर का चयन कीजिए -\nकूट :","o":["I, III, IV तथा II","III, I, II तथा IV","III, I, IV तथा II","I, III, II तथा IV"],"a":[0],"t":["U.P.P.C.S. (Pre) 2022"],"e":"प्रश्नगत घटनाओं का कालक्रम है गदर पार्टी की स्थापना - वर्ष‚ 1913 बर्लिन में ‘इंडियन इंडिपेंडेंस कमेटी’ की स्थापना - वर्ष 1914 केंद्रीय एसेम्बली बम कांड - 8 अप्रैल‚ 1929 चटगांव शस्त्रागार छापा - 18 अप्रैल‚ 1930"},{"ch":14,"page":569,"n":41,"q":"वह कौन थे‚ जिन्होंने ‘इंडिपेंडेंस लीग’ की स्थापना की थी?","o":["मोतीलाल नेहरू","महात्मा गांधी","रास बिहारी बोस","लाला लाजपत राय"],"a":[2],"t":["U.P. P.C.S. (Spl.) (Pre) 2008","U.P.U.D.A./L.D.A. (Mains) 2010","U.P. Lower Sub. (Spl.) (Pre) 2008"],"e":"रास बिहारी बोस जापान में रह रहे भारतीय अप्रवासी थे। 28-30 मार्च‚ 1942 के दौरान राजनीतिक समस्याओं पर विचार-विमर्श हेतु इन्होंने टोक्यो में भारतीयों का एक सम्मेलन आयोजित किया। 15 -23 जून‚ 1942 के बैंकॉक सम्मेलन में इसको विधिवत रूप प्रदान किया गया एवं सुभाष चंद्र बोस को निमंत्रित किया गया। इसी सम्मेलन में रास बिहारी बोस ने ‘इंडियन इंडिपेंडेंस लीग’ की स्थापना की। नोट- इंडियन इंडिपेंडेंस लीग के गठन की पृष्ठभूमि फरवरी-मार्च, 1942 में टोक्‍यो (जापान) में बनी थी, किंतु इस संगठन को मूर्त रूप बैकाॅक सम्मेलन में मिला।"},{"ch":15,"page":570,"n":1,"q":"निम्नलिखित में सबसे बाद में क्या हुआ?","o":["हड़प नीति","बंगाल का विभाजन","स्थायी बंदोबस्त","सहायक संधि"],"a":[1],"t":["U.P. P.C.S. (Pre) 2000"],"e":"उपर्युक्त घटनाओं में सर्वप्रथम 1793 ई. में लॉर्ड काॅर्नवालिस ने स्थायी बंदोबस्त प्रणाली लागू की। लॉर्ड वेलजे ली (1798-1805) ने भारतीय राज्यों को अंग्रेजी राजनीतिक परिधि में लाने के लिए सहायक संधि प्रणाली का प्रयोग किया। लॉर्ड डलहौजी (1848-56) ने अंग्रेजी साम्राज्य का विस्तार करने हेतु हड़प नीति का प्रयोग किया। प्रश्नगत विकल्पों में सबसे बाद में लॉर्ड कर्जन द्वारा वर्ष 1905 में बंगाल का विभाजन किया गया।"},{"ch":15,"page":570,"n":2,"q":"बंग-भंग विरोधी आंदोलन का प्रारंभ किस तिथि से हुआ?","o":["20 जुलाई‚ 1905","7 अगस्त‚ 1905","16 अक्टूबर‚ 1905","7 नवंबर‚ 1905"],"a":[1],"t":["U.P. P.C.S. (Pre) 1994"],"e":"ब्रिटिश सरकार ने 20 जुलाई‚ 1905 को बंगाल विभाजन के निर्णय की घोषणा कर दी। 7 अगस्त‚ 1905 को कलकत्ता के टाउन हॉल में एक ऐतिहासिक बैठक में स्वदेशी आंदोलन की विधिवत घोषणा कर दी गई। इसमें ऐतिहासिक बहिष्कार प्रस्ताव पारित हुआ। इसी के बाद से बंगाल के विभिन्‍न क्षेत्रों में बंग-भंग विरोधी आंदोलन औपचारिक रूप से एकजुट होकर प्रारंभ हो गया। 16 अक्टूबर‚ 1905 को बंगाल विभाजन प्रभावी हो गया। नोट- बंगाल विभाजन के निर्णय की घोषणा को लेकर दो तिथियां मिलती है- पहली 19 जुलाई, 1905 तथा दूसरी 20 जुलाई, 1905। प्राथमिक स्रोत जैसे गेजेटियर ऑफ इंडिया और अन्‍य स्रोत बंगाल विभाजन के घोषणा की तिथि के 19 जुलाई, 1905 को स्वीकार करते हैं, किंतु कुछ पुस्तकों में यह तिथि 20, 1905 जुलाई भी मिलती है।"},{"ch":15,"page":570,"n":4,"q":"कलकत्ता के टाउन हॉल में एक विशाल प्रदर्शन के साथ विभाजन के विरोध में आंदोलन कब प्रारंभ हुआ?","o":["16 अक्टूबर, 1905","7 अगस्त, 1905","16 अगस्त, 1905","5 अगस्त, 1905"],"a":[1],"t":["U.P. R.O./A.R.O. (Re-Exam) (Pre) 2023"],"e":"उपर्युक्‍त प्रश्न की व्याख्या देखें।"},{"ch":15,"page":571,"n":9,"q":"बंगाल का विभाजन करने वाला गवर्नर जनरल कौन था?","o":["कर्जन","कैनिंग","मिंटो","मेयो"],"a":[0],"t":["U.P.P.C.S. (Mains) 2011"],"e":"बंगाल का विभाजन लॉर्ड कर्जन (1899-1905 ई.) के काल में वर्ष 1905 में किया गया था। इसके निर्णय की घोषणा 19 जुलाई‚ 1905 को की गई थी तथा यह 16 अक्टूबर‚ 1905 से लागू हुआ। वर्ष 1911 के दिल्‍ली दरबार में बंगाल के विभाजन को निरस्त करने की घोषणा की गई।"},{"ch":15,"page":571,"n":10,"q":"बंगाल के विभाजन के समय‚ बंगाल का लेफ्टिनेंट गवर्नर था-","o":["सर एंड्जरू फ्रेजर","एच.एच. रिजले","ब्रोड्रिक","ए.टी. अरुन्डेल"],"a":[0],"t":["U.P.P.C.S. (Pre) 2014"],"e":"सर एंड्रू हेंडरसन लीथ फ्रेजर भारतीय सिविल सेवा के अधिकारी थे। इन्होंने वर्ष 1903 से 1908 तक बंगाल के लेफ्टिनेंट गवर्नर के रूप में अपनी सेवाएं दी थीं। बंगाल विभाजन (1905) की योजना में इनकी महत्वपूर्ण भूमिका रही थी।"},{"ch":15,"page":571,"n":11,"q":"निम्नलिखित में से किसने बंगाल के विभाजन (1905) के विरोध में हुए आंदोलन का नेतृत्व किया था?","o":["सुरेंद्रनाथ बनर्जी ने","सी.आर. दास ने","आशुतोष मुखर्जी ने","रबींद्रनाथ टैगोर ने"],"a":[0],"t":["U.P.P.C.S. (Pre) 2011"],"e":"उपर्युक्‍त विकल्‍पों के अनुसार बंगाल-विभाजन विरोधी आंदोलन का प्रारंभिक राजनीतिक नेतृत्‍व सुरेन्‍द्र नाथ बनर्जी ने किया था, जबकि रबींद्रनाथ टैगोर ने इस आंदोलन में सांस्कृतिक व जनजागरण कारी भूमिका निभाई।"},{"ch":15,"page":571,"n":13,"q":"निम्नलिखित में से कौन ‘स्वदेशी’ आंदोलन का आलोचक था एवं पूर्व तथा पाश्चात्य के मध्य एक बेहतर संबंध का समर्थक थे?","o":["डब्ल्यू.सी. बनर्जी","एस.एन. बनर्जी","आर.एन. टैगोर","बी.जी. तिलक"],"a":[2],"t":["U.P. Lower Sub. (Pre) 2009"],"e":"रबींद्रनाथ टैगोर ‘स्वदेशी’ आंदोलन के आलोचक थे तथा पूर्व (East) एवं पाश्चात्य (West) सभ्यता के मध्य एक बेहतर समन्वय संबंध के समर्थक थे। ध्यातव्य है कि टैगोर स्वदेशी आंदोलन के समग्र आलोचक नहीं थे, वे उसके नकारात्‍मक, क्रोध-आधारित और विद्वेषपरक राजनीतिक रूप के आलोचक थे।"},{"ch":15,"page":571,"n":14,"q":"बंगाल में ब्रिटेन की वस्तुओं के बहिष्कार का सुझाव सर्वप्रथम किसने दिया था?","o":["अरबिंद घोष ने","कृष्ण कुमार मित्र ने","मोतीलाल घोष ने","सतीश चंद्र मुखर्जी ने"],"a":[1],"t":["U.P. Lower Sub. (Pre) 2004","U.P.P.C.S. (Mains) 2011"],"e":"बंगाल में ब्रिटेन की वस्तुओं के बहिष्कार का प्रारंभिक सुझाव बांग्ला पत्रिका ‘संजंीवनी’ के संपादक कृष्ण कुमार मित्र ने अपनी पत्रिका के 13 जुलाई‚ 1905 के अंक में दिया था।"},{"ch":15,"page":572,"n":15,"q":"ब्रिटिश वस्तुओं के बहिष्कार को राष्ट्रीय नीति के रूप में अपनाया गया था-","o":["1899 में","1901 में","1903 में","1905 में"],"a":[3],"t":["U.P.R.O./A.R.O. (Pre) 2014"],"e":"लॉर्ड कर्जन ने 19 जुलाई‚ 1905 को बंगाल विभाजन की घोषणा की‚ जिसके परिणामस्वरूप 7 अगस्त‚ 1905 को कलकत्ता के टाउन हॉल में स्वदेशी आंदोलन की घोषणा की गई। इसी बैठक में ऐतिहासिक ‘बहिष्कार प्रस्ताव’ पारित हुआ‚ जिसमें ब्रिटिश वस्तुओं के बहिष्कार को राष्ट्रीय नीति के रूप में अपनाया गया।"},{"ch":15,"page":572,"n":17,"q":"बंगाल का विभाजन मुख्यत: किया गया था-","o":["हिंदुओं और मुसलमानों को विभाजित करने के लिए","प्रशासनिक सुविधा के लिए","बंगाली राष्ट्रवाद की वृद्धि को दुर्बल करने के लिए","बंगाल के विकास के लिए"],"a":[2],"t":["U.P. Lower Sub. (Pre) 1998"],"e":"ऊपरी तौर पर यद्यपि ब्रिटिश सरकार ने इसका उद्देश्य प्रशासनिक सुविधा बताया था‚ परंतु वास्तव में बंगाल विभाजन मुख्यत: बंगाली राष्ट्रवाद की वृद्धि को दुर्बल करने के लिए किया गया था। तत्कालीन वायसराय लॉर्ड कर्जन के अनुसार‚ अंग्रेजी हुकूमत का यह प्रयास कलकत्ता को सिंहासनाच्युत करना तथा बंगाली आबादी का बंटवारा करना था‚ एक ऐसे केंद्र को समाप्‍त करना था‚ जहां से बंगाल एवं पूरे देश में कांग्रेस पार्टी का संचालन होता था और साजिशें रची जाती थीं।"},{"ch":15,"page":574,"n":27,"q":"लॉर्ड कर्जन द्वारा वर्ष 1905 में किया गया बंगाल विभाजन रद्द किस वर्ष हुआ?","o":["1911","1904","1906","1907"],"a":[0],"t":["48th to 52nd B.P.S.C. (Pre) 2008","U.P. P.C.S. (Pre) 1993","U.P. P.C.S. (Pre) 1991"],"e":"दिसंबर‚ 1911 में ब्रिटिश सम्राट जॉर्ज पंचम और महारानी मैरी के भारत आगमन तथा उनके भारत के सम्राट और साम्राज्ञी के रूप में राज्‍याभिषेक के उपलक्ष्य में दिल्‍ली में एक दरबार का आयोजन किया गया। दिल्‍ली दरबार में ही 12 दिसंबर‚ 1911 को सम्राट ने बंगाल विभाजन को रद्द घोषित किया‚ साथ ही कलकत्ता की जगह दिल्‍ली को भारत की नई राजधानी बनाए जाने की घोषणा की। इस घोषणा के अनुसार बंगाल के पूर्वी और पश्चिमी भागों को फिर से जोड़कर ‘बंगाल प्रांत’ बनाया गया साथ ही बंगाल से बिहार, उड़ीसा और छोटानागपुर को अलग कर संयुक्‍त रूप से एक नया प्रांत ‘बिहार और उड़ीसा’ बनाया गया। इस घोषणा के अनुरूप असम को फिर से एक चीफ कमिश्नर प्रांत के रूप में स्थापित किया गया।"},{"ch":15,"page":574,"n":29,"q":"मद्रास में स्वदेशी आंदोलन का नेतृत्व किसने किया था?","o":["श्रीनिवास शास्त्री","राजगोपालाचारी","चिदंबरम पिल्‍लै","चिंतामणि"],"a":[2],"t":["U.P. Lower Sub. (Pre) 2008"],"e":"बंगाल से प्रारंभ हुए स्वदेशी आंदोलन का लोकमान्य तिलक ने देश के विभिन्‍न भागों विशेषकर बंबई और पुणे में‚ अजीत सिंह और लाला लाजपत राय ने पंजाब एवं भारत के अन्‍य हिस्सों में‚ सैयद हैदर रजा ने दिल्‍ली में तथा चिदंबरम पिल्‍लै ने मद्रास प्रेसीडेंसी में नेतृत्व किया था।"},{"ch":15,"page":574,"n":30,"q":"निम्नलिखित में से किसने स्वदेशी आंदोलन का नेतृत्व दिल्‍ली में किया था?","o":["बाल गंगाधर तिलक ने","अजीत सिंह ने","लाजपत राय ने","सैयद हैदर रजा ने"],"a":[3],"t":["U.P.P.C.S. (Pre) 2011"],"e":"बंगाल से प्रारंभ हुए स्वदेशी आंदोलन का लोकमान्य तिलक ने देश के विभिन्‍न भागों विशेषकर बंबई और पुणे में‚ अजीत सिंह और लाला लाजपत राय ने पंजाब एवं भारत के अन्‍य हिस्सों में‚ सैयद हैदर रजा ने दिल्‍ली में तथा चिदंबरम पिल्‍लै ने मद्रास प्रेसीडेंसी में नेतृत्व किया था।"},{"ch":15,"page":574,"n":32,"q":"निम्नांकित में से किस आंदोलन के दौरान ‘वंदे मातरम्’‌ भारतीय राष्ट्रीय आंदोलन का शीर्षक गीत बना?","o":["स्वदेशी आंदोलन","चंपारन सत्याग्रह","रौलेट कानून विरोधी आंदोलन","असहयोग आंदोलन"],"a":[0],"t":["U.P. P.C.S. (Mains) 2002","U.P. P.C.S. (Pre) 2005","Uttarakhand P.C.S (Mains) 2006","U.P. P.S.C. (GIC) 2010"],"e":"स्वदेशी आंदोलन के दौरान 16 अक्टूबर‚ 1905 का दिन (जिस दिन विभाजन प्रभावी हुआ) पूरे बंगाल में शोक दिवस के रूप में मनाया गया। घरों में चूल्हा नहीं जला‚ लोगों ने उपवास रखा और कलकत्ता में हड़ताल घोषित कर दी। जनता ने जुलूस निकाला। सवेरे जत्थे-के-जत्थे लोगों ने गंगा स्नान किया और फिर सड़कों पर ‘वंदे मातरम्’‌ गाते हुए प्रदर्शन करने लगे। ‘वंदे मातरम्’‌ इस आंदोलन का शीर्षक गीत बना । लोगों ने एक-दूसरे के हाथ पर राखियां बांधी थीं-यह जताने के लिए कि बंगाल को बांटकर अंग्रेज उनकी एकता में दरार नहीं डाल सकते।"},{"ch":15,"page":575,"n":34,"q":"स्वदेशी आंदोलन के संबधं में निम्न में से कौन-सा कथन सही नहीं है?","o":["कुछ विशिष्ट मुसलमान आंदोलन में शामिल हुए","स्त्रियों ने आंदोलन में सक्रिय भागीदारी की","आंदोलन ने बंगाल के किसानों को न तो अधिक प्रभावित किया और न ही वे इसमें शामिल हुए","यह बंगाल तक ही सीमित रहा"],"a":[3],"t":["U.P. Lower Sub. (Pre) 2002"],"e":"स्वदेशी आंदोलन समाज के विभिन्‍न तबकों के कुछ विशिष्ट मुसलमानों को ही अपने साथ ले सका। पहली बार इस आंदोलन में स्त्रियां घर से बाहर निकलीं‚ प्रदर्शनों में हिस्सा लेने लगीं तथा धरने पर बैठने लगीं, परंतु यह आंदोलन बंगाल के किसानों को प्रभावित नहीं कर सका‚ केवल बारिसाल ही इसका अपवाद रहा। मुख्यत: यह आंदोलन शहरों के उच्‍च एवं मध्यम वर्ग तक ही सीमित रहा। स्वदेशी आंदोलन केवल बंगाल तक ही सीमित नहीं रहा बल्कि लाला लाजपत राय‚ तिलक, अरबिंद घोष ने अपने अन्‍य सहयोगियों के साथ देश में इसका प्रचार किया। इस प्रकार कथन (d) सही नहीं है।"},{"ch":15,"page":575,"n":36,"q":"ब्रिटिश पत्रकार एच.डब्ल्यू. नेविन्सन जुड़े थे-","o":["असहयोग आंदोलन से","सविनय अवज्ञा आंदोलन से","स्वदेशी आंदोलन से","भारत छोड़ो आंदोलन से"],"a":[2],"t":["U.P.P.C.S. (Pre) 2014"],"e":"एच.डब्ल्यू. नेविन्सन स्वदेशी आंदोलन के दौरान रिपोर्टिंग करने आये ब्रिटिश पत्रकार थे। इन्होंने लगभग चार महीने तक भारत के विभिन्‍न भागों का दौरा कर मानचेस्टर गार्जियन‚ ग्लास्गो हेराल्ड तथा डेली क्रॉनिकल के लिए रिपोर्टिंग की थी। बाद में इन्होंने अपने अनुभवों, प्रेस-लेखा/रिपोर्टों को आधार बनाकर ‘द न्यू स्पिरिट इन इंडिया’ नाम से पुस्तक लिखा।"},{"ch":15,"page":575,"n":37,"q":"भारत की प्राचीन कला परंपराओं को पुनर्जीवित करने के लिए एक ‘इंडियन सोसाइटी ऑफ ओरिएंटल आर्ट’ की स्थापना की थी-","o":["अबनींद्रनाथ टैगोर ने","नंदलाल बोस ने","असितकुमार हलधर ने","अमृता शेरगिल ने"],"a":[0],"t":["U.P. P.C.S. (Mains) 2007"],"e":"राष्ट्रीय आंदोलन के बढ़ते प्रभाव के वातावरण में अबनींद्रनाथ टैगोर ने अप्रैल, 1907 में अपने बड़े भाई गगनेंद्रनाथ टैगोर और अन्‍य कलाप्रेमियों के साथ मिलकर ‘इंडियन सोसाइटी ऑफ ओरिएंटल आर्ट’ की स्थापना की‚ जिसके द्वारा प्राच्य कला-मूल्यों का पुनर्जीवन एवं आधुनिक भारतीय कला में नई चेतना जागृत हुई। कांग्रेस : बनारस‚ कलकत्ता एवं सूरत अधिवेशन"},{"ch":16,"page":576,"n":2,"q":"गोपाल कृष्ण गोखले ने कांग्सरे के लिए अधिवेशन में अध्यक्षता की?","o":["1902","1905","1906","1909"],"a":[1],"t":["U.P. Lower Sub. (Pre) 2003","U.P. Lower Sub. (Pre) 2004"],"e":"गोपाल कृष्ण गोखले ने कांग्रेस के बनारस अधिवेशन (1905) की अध्यक्षता की।"},{"ch":16,"page":576,"n":3,"q":"भारतीय राष्ट्रीय कांग्रेस के 1905 के बनारस अधिवेशन का अध्यक्ष कौन था?","o":["सुरेंद्रनाथ बनर्जी","फिरोजशाह मेहता","गोपाल कृष्ण गोखले","दिनशाॅ वाचा"],"a":[2],"t":["U.P. P.C.S. (Pre) 1999"],"e":"गोपाल कृष्ण गोखले ने कांग्रेस के बनारस अधिवेशन (1905) की अध्यक्षता की।"},{"ch":16,"page":577,"n":7,"q":"कांग्रेस के मंच से भारतीय राष्ट्रीय कांग्रेस के किस अधिवेशन में प्रथम बार ‘स्वराज’ शब्द व्यक्त किया गया था?","o":["बनारस अधिवेशन‚ 1905","कलकत्ता अधिवेशन‚ 1906","सूरत अधिवेशन‚ 1907","उपर्युक्त में से कोई नहीं"],"a":[1],"t":["U.P.P.C.S. (Pre) 2014"],"e":"प्रसिद्ध इतिहासकार बिपिन चंद्र की पुस्तक ‘India's Struggle for Independence, 1857-1947’ के अनुसार स्वराज/स्वशासन (SelfGovernment) की मांग को लेकर कांग्रेस के भीतर सबसे मुखर वक्‍ताओं में दादाभाई नौरोजी सबसे आगे थे। वर्ष 1904 में अंतरराष्ट्रीय समाजवादी कांग्रेस में ‘धन निकासी’ के विषय पर बोलते हुए उन्‍होंने स्वशासन की मांग रखी तथा वर्ष 1905 में भारतीय राष्ट्रीय कांग्रेस के बनारस अधिवेशन में दादाभाई नौरोजी ने अपने संदेश में स्पष्ट रूप से कहा ‘‘भारत के दुखों और अन्‍यायों का एकमात्र उपाय स्वशासन है।’’ इसके बाद वर्ष 1906 में भारतीय राष्ट्रीय कांग्रेस का कलकत्ता अधिवेशन, जिसकी अध्यक्षता स्वयं दादाभाई नौरोजी ने की थी में राष्ट्रीय आंदोलन का लक्ष्य ‘स्वराज/स्वशासन’ रखा गया था। इस प्रकार कांग्रेस ने पहली बार अपना लक्ष्य ‘स्वराज/स्वशासन’ को बनाया। प्रारंभ में उ.प्र. लोक सेवा आयोग ने इस प्रश्न का उत्तर विकल्प (b) माना था; परंतु बाद में उत्तर पत्रक से इस प्रश्न को हटा दिया गया। चूंकि स्वराज शब्द को अभिव्यक्त करने की तिथियों में भिन्‍नता मिलती है। इसलिए उत्तर निरस्त कर दिया गया।"},{"ch":16,"page":577,"n":9,"q":"‘स्वराज’ शब्द का प्रयोग सर्वप्रथम किसने किया?","o":["बाल गंगाधर तिलक ने","लाला लाजपत राय ने","एस.सी. बोस ने","महात्मा गांधी ने"],"a":[0],"t":["U.P.R.O./A.R.O. (Mains) 2013"],"e":"बाल गंगाधर तिलक का कथन था कि ‘‘स्वराज मेरा जन्मसिद्ध अधिकार है और मैं इसे लेकर रहूंगा।’’ हालांकि ‘स्वराज’ शब्द का सर्वप्रथम प्रयोग दयानंद सरस्वती ने किया था‚ किंतु दिए गए विकल्पों के अनुसार तिलक ने ही पहली बार स्वराज की मांग का समर्थन किया।"},{"ch":16,"page":577,"n":10,"q":"दादाभाई नौरोजी आमतौर पर किस नाम से जाने जाते थे?","o":["पंजाब केसरी","गुजरात रत्न","गुरुदेव","ग्रैंड ओल्ड मैन ऑफ इंडिया"],"a":[3],"t":["U.P. P.C.S. (Pre) 1991"],"e":"दादाभाई नौरोजी को लोग श्रद्धा से ‘भारत के वयोवृद्ध नेता’ (Grand Old Man of India) के नाम से स्मरण करते हैं। 1892 ई. में वे पहले भारतीय थे‚ जो उदारवादी दल की ओर से सेंट्रल फिंसबरी चुनाव क्षेत्र से ब्रिटिश संसद के सदस्य चुने गए। वह भारतीय राष्ट्रीय कांग्सरे के 1886 ई., 1893 ई. और वर्ष 1906 में अध्यक्ष भी रहे। सी.वाई. चिंतामणि ने दादाभाई नौरोजी के विषय में कहा था कि “भारत के सार्वजनिक जीवन को अनेक बुद्धिमान और नि:स्वार्थ नेताओं ने सुशोभित किया है; परंतु हमारे युग में कोई भी दादाभाई नौरोजी जैसा नहीं था।” दूसरी ओर गोखले ने कहा था-“यदि मनुष्य में कहीं देवत्व है‚ तो वह दादाभाई में है।”"},{"ch":16,"page":578,"n":12,"q":"इनमें से किसे ‘दि ग्रैंड ओल्ड मैन’ के नाम से जाना जाता है?","o":["खान अब्दुल गफ्फार खां","डब्ल्यू.सी. बनर्जी","दादाभाई नौरोजी","मोतीलाल नेहरू"],"a":[2],"t":["U.P.R.O./A.R.O. (Pre) 2014"],"e":"दादाभाई नौरोजी को लोग श्रद्धा से ‘भारत के वयोवृद्ध नेता’ (Grand Old Man of India) के नाम से स्मरण करते हैं। 1892 ई. में वे पहले भारतीय थे‚ जो उदारवादी दल की ओर से सेंट्रल फिंसबरी चुनाव क्षेत्र से ब्रिटिश संसद के सदस्य चुने गए। वह भारतीय राष्ट्रीय कांग्सरे के 1886 ई., 1893 ई. और वर्ष 1906 में अध्यक्ष भी रहे। सी.वाई. चिंतामणि ने दादाभाई नौरोजी के विषय में कहा था कि “भारत के सार्वजनिक जीवन को अनेक बुद्धिमान और नि:स्वार्थ नेताओं ने सुशोभित किया है; परंतु हमारे युग में कोई भी दादाभाई नौरोजी जैसा नहीं था।” दूसरी ओर गोखले ने कहा था-“यदि मनुष्य में कहीं देवत्व है‚ तो वह दादाभाई में है।”"},{"ch":16,"page":578,"n":13,"q":"निम्नलिखित में से कौन कथन दादाभाई नौरोजी के विषय में सत्य नहीं है?","o":["उन्होंने ‘पॉवर्टी एंड अन-ब्रिटिश रूल इन इंडिया’ पुस्तक लिखी थी।","उन्होंने गुजराती के प्रोफेसर के रूप में यूनिवर्सिटी कॉलेज लंदन में कार्य किया था।","उन्होंने बंबई में महिला शिक्षा की नींव रखी थी।","वे ब्रिटिश पार्लियामेंट के सदस्य के रूप में अनुदारवादी पार्टी के टिकट पर चुने गए थे।"],"a":[3],"t":["U.P. Lower Sub. (Pre) 2008"],"e":"दादाभाई नौरोजी 1892 ई. में ब्रिटिश पार्लियामेंट के सदस्य के रूप में उदारवादी पार्टी (Liberal Party) के टिकट पर चुने गए थे। अत: कथन (d) सही नहीं है‚ अन्य तीनों कथन सत्य हैं।"},{"ch":16,"page":578,"n":14,"q":"दादाभाई नौरोजी के विषय में निम्नलिखित में से कौन-सा एक कथन असत्य है?","o":["वह पहले भारतीय थे‚ जो एलफिंस्टन कॉलेज‚ बंबई में गणित एवं भौतिकी के प्रोफेसर नियुक्त हुए थे।","1892 में उन्हें ब्रिटिश पार्लियामेंट का एक सदस्य निर्वाचित किया गया था।","उन्होंने एक गुजराती पत्रिका‚ ‘रास्त गोफ्तार’ का आरंभ किया था।","उन्होंने चार बार भारतीय राष्ट्रीय कांग्रेस की अध्यक्षता की थी।"],"a":[3],"t":["U.P.P.C.S. (Pre) 2014"],"e":"दादाभाई नौरोजी पहले भारतीय थे‚ जो एलफिंस्टन कॉलेज‚ बंबई में गणित एवं नेचरु ल फिलॉसफी (नेचरु ल फिलॉसफी आधुनिक विज्ञान विषय का पूर्ववर्ती रूप है‚ जिसमें मुख्य रूप से भौतिकी‚ खगोलशास्त्र‚ रसायन विज्ञान‚ जीव विज्ञान‚ भू-विज्ञान जैसे विषय शामिल हैं) के प्रोफेसर नियुक्त हुए थे। 1892 से 1895 ई. तक ये उदारवादी दल से ब्रिटिश पार्लियामेंट के सदस्य रहे। इन्होंने एक गुजराती पत्रिका ‘रास्त गोफ्तार’ की शुरुआत 1851 ई. में की थी। दादाभाई नौरोजी ने 1886 ई. , 1893 ई. तथा वर्ष 1906 में कुल तीन बार भारतीय राष्ट्रीय कांग्रेस की अध्यक्षता की थी।"},{"ch":16,"page":578,"n":15,"q":"ब्रिटिश पार्लियामेंट में चुना जाने वाला प्रथम भारतीय कौन था?","o":["रास बिहारी बोस","सुरेंद्रनाथ बनर्जी","दादाभाई नौरोजी","विट्ठलभाई पटेल"],"a":[2],"t":["U.P.P.C.S. (Pre) 1992"],"e":"दादाभाई नौरोजी (Grand Old Man of India) प्रथम भारतीय थे‚ जो 1892 ई. में उदारवादी दल की ओर से सेंट्रल फिंसबरी से ब्रिटिश संसद के सदस्य चुने गए। अपने लंदन प्रवास (1855-69) के दौरान दादाभाई नौरोजी ने अंग्रेजों को भारतीयों की समस्याओं से अवगत कराने के उद्देश्य से-‘लंदन इंडियन सोसाइटी’ (1865) तथा ‘ईस्ट इंडिया एसोसिएशन’ (1866) नामक संस्थाएं स्थापित की थीं।"},{"ch":16,"page":578,"n":16,"q":"नरम दल और गरम दल के रूप में भारतीय राष्ट्रीय कांग्रेस का विभाजन किस अधिवेशन में हुआ?","o":["बंबई","सूरत","इलाहाबाद","लाहौर"],"a":[1],"t":["U.P.P.C.S. (Pre) 1990"],"e":"वर्ष 1907 में सूरत में आयोजित कांग्रेस के 23वें वार्षिक अधिवेशन में उदारवादियों (नरम दल) और उग्रवादियों (गरम दल) में अध्यक्ष पद को लेकर कांग्रेस का विभाजन हो गया, लेकिन विभाजन का मूल कारण उदारवादी और उग्रवादी नेताओं के बीच पैदा हुआ वैचारिक मतभेद और वर्ष 1906 में कलकत्ता अधिवेशन के प्रस्तावों पर हुआ मतभेद था। उग्रपंथी जहां लाला लाजपत राय को अध्यक्ष बनाना चाहते थे‚ वहीं उदारवादी रास बिहारी घोष को अध्यक्ष बनाना चाहते थे। अंतत: रास बिहारी घोष अध्यक्ष बनने में सफल हुए। सम्मेलन में उग्रवादियों द्वारा वर्ष 1906 में पास करवाए गए प्रस्तावस्वदेशी‚ बहिष्कार‚ राष्ट्रीय शिक्षा और स्वशासन के प्रयोग को लेकर विवाद और गहरा ह {"ch":16,"page":579,"n":24,"q":"भारतीय राष्ट्रीय कांग्रेस का प्रथम विभाजन कब हुआ?","o":["1907","1906","1969","1911"],"a":[0],"t":["U.P.P.C.S. (Pre) 1991"],"e":"वर्ष 1907 में कांग्रेस के वार्षिक अधिवेशन की अध्यक्षता रास बिहारी घोष ने की थी। वर्ष 1907 के कांग्रेस के सूरत अधिवेशन में कांग्रेस चरमपंथी एवं नरमपंथी गुट में विभाजित हुई। वर्ष 1916 के कांग्रेस के वार्षिक अधिवेशन (लखनऊ अधिवेशन) में नरमपंथी एवं चरमपंथी एक हो गए। इस अधिवेशन की अध्यक्षता अंबिका चरण मजूमदार ने की।"},{"ch":17,"page":580,"n":1,"q":"निम्नलिखित में किसने ऑल इंडिया मुस्लिम लीग की स्थापना की थी?","o":["सर सैयद अहमद खां","सर मोहम्मद इकबाल","आगा खां","नवाब सलीमुल्‍लाह खान"],"a":[3],"t":["41st B.P.S.C. (Pre) 1996","U.P.P.C.S. (Pre) 2007"],"e":"अक्टूबर‚ 1906 को आगा खां (आगा खां III) के नेतृत्व में मुस्लिमों के शिमला प्रतिनिधिमंडल ने वायसराय लॉर्ड मिंटो के समक्ष मुसलमानों के राजनीतिक प्रतिनिधित्‍व, पृथक निर्वाचन व्यवस्था एवं उनके हितों को सुरक्षित रखने की मांगे रखी। हालांकि एक अखिल भारतीय मुस्लिम राजनीतिक संगठन की स्थापना की धारणा इस भेंट से पूर्व ही आकार लेने लगी थी, जिसमें गति इसके बाद मिली। दिसंबर, 1906 ढाका में संपन्‍न अखिल भारतीय मुस्लिम शैक्षिक सम्मेलन (All India Mohammadan Educational Conference) के समाप्‍ति के उपरांत 30 दिसंबर, 1906 को ढाका में हुए एक राजनीतिक सभा में राजनीतिक बैठक के संयोजक ढाका के नवाब सलीमुल्‍लाह खान ने अखिल भारतीय मुस्लिम लीग के गठन का प्रस्ताव किया। नवाब वकार-उल-मुल्क की अध्यक्षता में अखिल भारतीय मुस्लिम लीग की स्थापना हुई। औपनिवेशिक भारत के विभिन्‍न भागों से 60 सदस्यीय (कुछ स्रोतों में 55 सदस्यों का भी उल्‍लेख) अस्थायी समिति (Provisional Committee) का चयन किया गया और मोहसिन-उलमुल्क तथा वकार-उल-मुल्क को संयुक्त रूप से इस अस्थायी समिति का संयुक्त सचिव नियुक्त किया गया। इस अस्थायी समिति का उद्देश्य नवगठित लीग के लिए एक संविधान तैयार करना था। मुस्लिम लीग के गठन के उपरांत उसका प्रारंभिक मुख्यालय/केंद्रीय कार्यालय अलीगढ़ तथा उसके उपरांत लखनऊ और अंतत: दिल्‍ली को इसका मुख्यालय बनाया गया, जो भारत के विभाजन तक मुस्लिम लीग का मुख्यालय बना रहा। आगा खां (आगा खां III) को नवगठित मुस्लिम लीग का स्थायी अध्यक्ष बनाया गया, जिस पर वह वर्ष 1914 तक इस पद से इस्तीफा देने तक बने रहे।। विकल्प में इन तीनों नामों के रहने या इनमें से कोई 2 नाम रहने पर संस्थापक के रूप में चयन का वरीयता क्रम इस प्रकार रहेगा-\n1. सलीमुल्‍लाह खान 2. आगा खां 3. मोहसिन-उल-मुल्क प्रस्तुत प्रश्न में चूंकि प्रथम 2 नाम दिए गए हैं। अत: सलीमुल्‍लाह खान को प्रथम वरीयता देते हुए संस्थापक के रूप में चुना जाएगा।"},{"ch":17,"page":581,"n":2,"q":"मुस्लिम लीग के संस्थापक थे-","o":["लियाकत अली","शौकत अली","नवाब सलीमुल्‍लाह","एम.ए. जिन्‍ना"],"a":[2],"t":["U.P. P.C.S. (Mains) 2006"],"e":"अक्टूबर‚ 1906 को आगा खां (आगा खां III) के नेतृत्व में मुस्लिमों के शिमला प्रतिनिधिमंडल ने वायसराय लॉर्ड मिंटो के समक्ष मुसलमानों के राजनीतिक प्रतिनिधित्‍व, पृथक निर्वाचन व्यवस्था एवं उनके हितों को सुरक्षित रखने की मांगे रखी। हालांकि एक अखिल भारतीय मुस्लिम राजनीतिक संगठन की स्थापना की धारणा इस भेंट से पूर्व ही आकार लेने लगी थी, जिसमें गति इसके बाद मिली। दिसंबर, 1906 ढाका में संपन्‍न अखिल भारतीय मुस्लिम शैक्षिक सम्मेलन (All India Mohammadan Educational Conference) के समाप्‍ति के उपरांत 30 दिसंबर, 1906 को ढाका में हुए एक राजनीतिक सभा में राजनीतिक बैठक के संयोजक ढाका के नवाब सलीमुल्‍लाह खान ने अखिल भारतीय मुस्लिम लीग के गठन का प्रस्ताव किया। नवाब वकार-उल-मुल्क की अध्यक्षता में अखिल भारतीय मुस्लिम लीग की स्थापना हुई। औपनिवेशिक भारत के विभिन्‍न भागों से 60 सदस्यीय (कुछ स्रोतों में 55 सदस्यों का भी उल्‍लेख) अस्थायी समिति (Provisional Committee) का चयन किया गया और मोहसिन-उलमुल्क तथा वकार-उल-मुल्क को संयुक्त रूप से इस अस्थायी समिति का संयुक्त सचिव नियुक्त किया गया। इस अस्थायी समिति का उद्देश्य नवगठित लीग के लिए एक संविधान तैयार करना था। मुस्लिम लीग के गठन के उपरांत उसका प्रारंभिक मुख्यालय/केंद्रीय कार्यालय अलीगढ़ तथा उसके उपरांत लखनऊ और अंतत: दिल्‍ली को इसका मुख्यालय बनाया गया, जो भारत के विभाजन तक मुस्लिम लीग का मुख्यालय बना रहा। आगा खां (आगा खां III) को नवगठित मुस्लिम लीग का स्थायी अध्यक्ष बनाया गया, जिस पर वह वर्ष 1914 तक इस पद से इस्तीफा देने तक बने रहे।। विकल्प में इन तीनों नामों के रहने या इनमें से कोई 2 नाम रहने पर संस्थापक t":["U.P P.C.S. (Pre) 1996"],"e":"भारतीय परिषद अधिनियम‚ 1909 (मार्ले-मिंटो सुधार) का सबसे बड़ा दोष सांप्रदायिक प्रतिनिधित्व प्रणाली के तहत मुसलमानों के लिए पृथक निर्वाचन मंडल की व्यवस्था करना था।"},{"ch":18,"page":583,"n":3,"q":"राष्ट्रीय आंदोलन की अवधि में जिस घटना में मतभेद के बीज थे और वह जिसने अंतत: देश का विभाजन कराया‚ थी-","o":["वर्ष 1906 में मुस्लिम लीग की स्थापना","वर्ष 1905 में बंगाल का विभाजन","गांधी जी द्वारा खिलाफत आंदोलन को समर्थन","विधानसभाओं में मुसलमानों के लिए पृथक निर्वाचन क्षेत्रों और स्थानों का आरक्षण"],"a":[3],"t":["U.P U.D.A./L.D.A. (Pre) 2001","U.P P.C.S. (Spl.) (Pre) 2004"],"e":"वर्ष 1909 के मॉर्ले-मिंटो सुधारों का सबसे बुरा पक्ष था‚ मुसलमानों को पृथक अथवा सांप्रदायिक निर्वाचन पद्धति की सुविधा प्रदान करना। इस सुविधा ने कालांतर में भारत के सार्वजनिक और सांप्रदायिक जीवन को विषाक्त कर दिया और अंतत: देश के विभाजन के बीजारोपण का काम किया। इसके विषय में जवाहरलाल नेहरू ने कहा था-“इससे उनके (मुसलमानों) चारों ओर एक राजनीतिक प्रतिरोध बन गए‚ जिन्होंने उन्हें शेष भारत से अलग कर दिया और इसने शताब्दियों से चली आ रही एकीकरण और समन्‍वय की प्रक्रिया को उलट दिया।”"},{"ch":19,"page":584,"n":1,"q":"बंगाल का विभाजन रद्द करना\n2. राजधानी का कलकत्ता से दिल्‍ली परिवर्तन\n3. कांग्रेस तथा मुस्लिम लीग के बीच लखनऊ समझौता\nनीचे दिए गए कूट से सही उत्तर चुनिए :\nकूट :","o":["1 और 2","केवल 3","2 और 3","केवल 1"],"a":[0],"t":["U.P. P.C.S (Pre) 2025"],"e":"बंगाल का विभाजन रद्द (1911) : वर्ष 1905 में किए गए बंगाल विभाजन को 12 दिसंबर, 1911 के दिल्‍ली दरबार में रद्द करने की घोषणा की गई। प्रशासनिक पुनर्गठन (जैसे– बंगाल से अलग कर बिहार और उड़ीसा प्रांत का गठन) वर्ष 1912 में प्रभावी हुआ, परंतु रद्द करने की घोषणा वर्ष 1911 में हुई, इसलिए यह घटना 1911 से संबद्ध मानी जाती है। राजधानी का कलकत्ता से दिल्‍ली परिवर्तन (1911) : उसी दिल्‍ली दरबार (12 दिसंबर, 1911) में भारत की राजधानी कलकत्ता से दिल्‍ली करने का निर्णय घोषित किया गया। औपचारिक स्थानांतरण और दफ्तरों का क्रमिक स्थानांतरण 1912 में पूरा हुआ; किंतु निर्णय/घोषणा 1911 में हुई थी। लखनऊ समझौता (1916) : कांग्रेस और मुस्लिम लीग के बीच लखनऊ समझौता वर्ष 1916 में हुआ था। अत: इसका अभीष्ट उत्तर विकल्‍प (a) होगा।"},{"ch":19,"page":584,"n":3,"q":"वर्ष 1912 में जब राजधानी कलकत्ता से दिल्‍ली लाई गई‚ उस समय भारत का वायसराय कौन था?","o":["लॉर्ड मेयो","लॉर्ड लॉरेंस","लॉर्ड मिंटो","लॉर्ड हार्डिंग"],"a":[3],"t":["U.P P.C.S. (Pre) 1990","U.P. Lower Sub. (Pre) 2008"],"e":"ब्रिटिश काल में दिल्‍ली से पहले भारत की राजधानी कलकत्ता थी। ब्रिटेन के राजा जॉर्ज पंचम का भारत आगमन 2 दिसंबर‚ 1911 को हुआ तथा 12 दिसंबर‚ 1911 को तीसरे दिल्‍ली दरबार में बंगाल विभाजन रद्द कर भारत की राजधानी कलकत्ता से दिल्‍ली स्थानांतरित करने की घोषणा की गई। लॉर्ड हार्डिंग (लॉर्ड हार्डिंग II) के कार्यकाल में यह कलकत्ता से दिल्‍ली स्थानांतरित हुई। वर्ष 1912 में दिल्‍ली राजधानी बनाई गई।"},{"ch":19,"page":585,"n":7,"q":"किस वर्ष भारत की राजधानी कलकत्ता से दिल्‍ली आई?","o":["1905","1909","1910","1911"],"a":[3],"t":["U.P. P.C.S. (Spl.) (Mains) 2008"],"e":"उल्‍लेखनीय है कि दिल्‍ली को राजधानी बनाने की घोषणा वर्ष 1911 में की गई थी‚ जबकि कलकत्ता से दिल्‍ली उसका स्थानांतरण वर्ष 1912 में हुआ था। अत: स्थानांतरण के संबंध में यदि विकल्प में 1911 एवं 1912 दोनों वर्ष दिए गए हैं‚ तो इस संदर्भ में दूसरा वर्ष (1912) अधिक मान्य होगा।"},{"ch":19,"page":585,"n":8,"q":"दिल्‍ली में उनके राजकीय प्रवेश के अवसर पर बम फेंका गया था-","o":["लॉर्ड कर्जन पर","लॉर्ड मेयो पर","लॉर्ड मिंटो पर","लॉर्ड हार्डिंग पर"],"a":[3],"t":["U.P. Lower Sub. (Spl.) (Pre) 2008"],"e":"वर्ष 1911 के दिल्‍ली दरबार में हुए शाही ऐलानो के बाद प्रशासन को यह आभास हुआ कि राजनीतिक शांति स्थापित हो चुकी है, परंतु शीघ्र ही उस समय उसका मोहभंग हो गया‚ जब 23 दिसंबर‚ 1912 को नई राजधानी दिल्‍ली में राजकीय प्रवेश के अवसर पर चांदनी चौक से गुजरते समय हाथी पर सवार वायसराय हार्डिंग के ऊपर बम फेंका गया। इस जानलेवा हमले में वायसराय हार्डिंग गंभीर रूप से घायल हुए‚ किंतु बच गए।"},{"ch":19,"page":585,"n":11,"q":"निम्नलिखित में से कौन-सा संगठन दिल्‍ली में वायसरॉय लॉर्ड हार्डिंग पर बम फेंकने के लिए उत्तरदायी था?","o":["अनुशीलन समिति","अखिल भारतीय मजदूर संघ","युगांतर","यूनाइटेड पेट्रियॉटिक संघ"],"a":[0],"t":["U.P. P.C.S. (Pre) 20
