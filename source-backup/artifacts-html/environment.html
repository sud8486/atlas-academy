<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UPPSC टेस्ट सीरीज़ – पर्यावरण एवं पारिस्थितिकी</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2a24;--mut:#6b7a72;--pri:#1f6f4a;--pri2:#e5f2ea;--ok:#1e8a4c;--okb:#e3f6ea;--bad:#c23a32;--badb:#fde8e6;--line:#e3e0d8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Devanagari',system-ui,sans-serif;font-size:17px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 60px}
header h1{font-size:22px;margin:6px 0 2px;color:var(--pri)}header p{margin:0;color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:16px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.tcard:hover{border-color:var(--pri)}.tcard b{display:block;font-size:17px}.tcard small{color:var(--mut);font-size:13px}
.tcard .best{color:var(--pri);font-weight:600;font-size:13px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:var(--pri2);color:var(--pri)}.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--mut)}
.bar{height:6px;background:var(--line);border-radius:4px;margin:8px 0 14px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.tag{display:inline-block;background:#fff4dc;color:#8a5a00;font-size:12.5px;border-radius:6px;padding:2px 8px;margin-bottom:8px}
.qt{font-weight:600;margin-bottom:12px}.qt table{border-collapse:collapse;margin:8px 0;font-weight:400;width:100%}
.qt td,.qt th{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}.qt th{background:var(--pri2)}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;font:inherit;color:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--pri)}.opt:disabled{cursor:default}
.opt .l{font-weight:700;color:var(--mut)}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.ok .l{color:var(--ok)}
.opt.bad{background:var(--badb);border-color:var(--bad)}.opt.bad .l{color:var(--bad)}
.fb{border-radius:10px;padding:10px 12px;margin-top:6px;font-weight:600}
.fb.ok{background:var(--okb);color:var(--ok)}.fb.bad{background:var(--badb);color:var(--bad)}
.score{font-size:40px;font-weight:700;color:var(--pri);margin:4px 0}
.rev{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;font-size:15.5px}
.rev .y{color:var(--bad)}.rev .c{color:var(--ok)}
.hide{display:none}a.lnk{color:var(--pri);cursor:pointer;text-decoration:underline}
</style></head><body><div class="wrap" id="app"></div>
<script>
const Q=[{"q": "सामान्यतया पर्यावरण को निम्न प्रकार से वर्गीकृत किया जा सकता है। निम्नलिखित में से कौन-सा एक इस वर्गीकरण का अंश नहीं है?", "o": ["परिचालन पर्यावरण", "भौतिक पर्यावरण", "सांस्कृतिक पर्यावरण", "जैविक पर्यावरण"], "a": 0, "t": "U.P.P.C.S. (Pre) 2020"}, {"q": "नीचे दो कथन दिए गए हैं‚ जिनमें एक को कथन (A) तथा दूसरे को\nकारण (R) कहा गया है।\nकथन (A) : सतत विकास मानव समाज के कल्याण हेतु महत्वपूर्ण है।\nकारण (R) : सतत विकास से अभिप्राय ऐसे विकास से है‚ जो भावी पीढ़ियों की जरूरतें पूरी करने की योग्यता को प्रभावित किए बिना वर्तमान समय की आवश्यकता पूरी करे।\nनीचे दिए कूटों में से सही उत्तर चुनिए–\nकूट :", "o": ["(A) तथा (R) दोनों सही हैं तथा (R) कथन (A) की सही व्याख्या है।", "(A) तथा (R) दोनों सही हैं‚ परंतु (R) कथन (A) की सही व्याख्या नहीं है।", "(A) सही है‚ परंतु (R) गलत है।", "(A) गलत है‚ परंतु (R) सही है।"], "a": 0, "t": "U.P.P.C.S. (Pre) 2019"}, {"q": "वर्ष 1987 में संयुक्त राष्ट्र में पर्यावरण से संबंधित एक प्रतिवेदन की प्रस्तुति के उपरांत ‘धारणीय विकास’ (सस्टेनेबल डेवलपमेंट) पर चर्चा आरंभ हुई। वह प्रतिवेदन था", "o": ["जलवायु परिवर्तन पर पहला प्रतिवेदन", "अवर कॉमन फ्यूचर", "जलवायु परिवर्तन पर दूसरा प्रतिवेदन", "पांचवां मूल्यांकन प्रतिवेदन"], "a": 1, "t": "U.P.P.C.S. (Pre) 2020"}, {"q": "निम्नलिखित घटनाओं को कालानुक्रमिक क्रम में व्यवस्थित कीजिए तथा नीचे दिए गए कूट से सही उत्तर चुनिए।\nI. रियो पृथ्वी शिखर सम्मेलन\nII. ब्रंटलैंड आयोग रिपोर्ट का प्रकाशन\nIII. मॉन्ट्रियल प्रोटोकॉल का प्रवर्तन\nIV. ‘द लिमिट्स टू ग्रोथ’ रिपोर्ट का प्रकाशन\nनीचे दिए गए कूट से सही उत्तर चुनिए।\nकूट :", "o": ["I, IV, III, II", "IV, II, III, I", "IV, III, II, I", "IV, I, III, II"], "a": 1, "t": "U.P.P.C.S. (Pre) 2020"}, {"q": "वर्ष 1972 1987 1989 1992 धारणीय विकास किसके उपयोग के संदर्भ में अंतर-पीढ़ीगत संवेदनशीलता का विषय है?", "o": ["प्राकृतिक संसाधन", "भौतिक संसाधन", "औद्योगिक संसाधन", "सामाजिक संसाधन"], "a": 0, "t": "U.P.P.C.S. (Pre) 2012"}, {"q": "सतत विकास के लिए आवश्यक है", "o": ["जैविक विविधता का संरक्षण", "प्रदूषण का निरोध एवं नियंत्रण", "निर्धनता को घटाना", "उपर्युक्त सभी"], "a": 3, "t": "U.P. Lower Sub. (Pre) 2004"}, {"q": "निम्नलिखित में से कौन-सा सतत विकास का लक्ष्य नहीं है‚ जिसे वर्ष 2030 तक प्राप्त करने का लक्ष्य रखा गया है?", "o": ["लैंगिक समानता", "अंतरिक्ष अनुसंधान", "शून्य भूख", "अच्छा स्वास्थ्य एवं भलाई"], "a": 1, "t": "U.P.P.C.S.(Pre) 2023"}, {"q": "‘सतत विकास लक्ष्य‚ 2017’ के सूचकांक में भारत का कौन-सा स्थान है?", "o": ["116वां", "125वां", "108वां", "95वां"], "a": 0, "t": "U.P.P.C.S. (Pre) 2017"}, {"q": "निम्नलिखित में से कौन-सा राज्य भारत के धारणीय विकास लक्ष्य सूचकांक 2019-20 के शीर्ष पांच राज्यों की सूची में नहीं है?", "o": ["गुजरात", "हिमाचल प्रदेश", "आंध्र प्रदेश", "तमिलनाडु"], "a": 0, "t": "U.P.B.E.O. (Pre) 2019"}, {"q": "नीति आयोग द्वारा हाल ही में जारी ‘सतत विकास लक्ष्य (एस. डी.जी.) इंडिया सूचकांक‚ 2019’ के अनुसार‚ कौन-सा राज्य प्रथम स्थान पर है?", "o": ["उत्तर प्रदेश", "बिहार", "झारखंड", "केरल"], "a": 3, "t": "U.P.B.E.O. (Pre) 2019"}, {"q": "धारणीय कृषि (Sustainable Agriculture) का अर्थ है", "o": ["आत्मनिर्भरता", "विश्व व्यापार संगठन के मानकों के अंतर्गत कृषि निर्यात तथा आयात कर सकना", "भूमि का इस प्रकार प्रयोग कि उसकी गुणवत्ता अक्षुण्ण बनी रहे", "कृषि प्रयोग हेतु अप्रयुक्त भूमि को प्रयोग में लाना"], "a": 2, "t": "U.P. P.C.S. (Pre) 2001"}, {"q": "‘वर्तमान में जनसंख्या के सुखों का परित्याग किए बिना भविष्य के लिए ऊर्जा तथा अन्य संसाधनों की बचत’ निम्न में से कौन-सी अवधारणा की परिभाषा है?", "o": ["आर्थिक वृद्धि", "आर्थिक विकास", "संपोषणीय विकास", "मानव विकास"], "a": 2, "t": "U.P. P.C.S. (Pre) 2018"}, {"q": "निम्नलिखित में से कौन-सा भारत में सतत विकास लक्ष्यों के कार्यान्वयन के लिए एक नोडल संस्था है?", "o": ["योजना आयोग", "विनिवेश आयोग", "नीति आयोग", "वित्त आयोग"], "a": 2, "t": "U.P.P.C.S. (Pre) 2019"}, {"q": "अधोलिखित में से कौन-सा पृ थ् वी के कार्ब न -चक्र में कार्ब न डाइऑक्साइड की मात्रा को नहीं बढ़ाता है?", "o": ["श्वसन", "प्रकाश संश्लेषण", "जैविक पदाथ का क्षय", "ज्वालामुखी क्रिया"], "a": 1, "t": "U.P.P.C.S. (Mains) 2012"}, {"q": "सौर विकिरण की सबसे महत्वपूर्ण भूमिका है", "o": ["कार्बन चक्र में", "हाइड्रोजन चक्र में", const PER=24, L='abcd';
const tests=[];for(let i=0;i<Q.length;i+=PER)tests.push(Q.slice(i,i+PER).map((_,k)=>i+k));
let st=null;
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function fmtQ(t){
  let ls=t.split('\n'),out=[],rows=[],hdr=null;
  // collapse lone A B C D lines
  let tmp=[];for(let i=0;i<ls.length;i++){if(/^[A-D]$/.test(ls[i].trim())&&tmp.length&&/(^|\s)[A-D]$/.test(tmp[tmp.length-1].trim())&&/कूट|[A-D]$/.test(tmp[tmp.length-1]))tmp[tmp.length-1]+=' '+ls[i].trim();else tmp.push(ls[i])}
  ls=tmp;
  const flush=()=>{if(rows.length){let h='<table>';if(hdr)h+='<tr><th>'+esc(hdr[0])+'</th><th>'+esc(hdr[1])+'</th></tr>';rows.forEach(r=>h+='<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td></tr>');out.push(h+'</table>');}rows=[];hdr=null};
  for(let i=0;i<ls.length;i++){
    let a=ls[i],b=ls[i+1]||'';
    if(/सूची\s*[-–]?\s*I\b(?!I)/.test(a)&&/सूची\s*[-–]?\s*II/.test(b)&&a.length<40){hdr=[a,b];i++;continue}
    if(/^(\([A-D]\)|[A-D]\.)\s/.test(a)&&/^\d\.\s/.test(b)){rows.push([a,b]);i++;continue}
    flush();out.push(esc(a));
  }
  flush();return out.join('<br>').replace(/<br><table>/g,'<table>').replace(/<\/table><br>/g,'</table>');
}
function home(){
  st=null;let h=`<header><h1>UPPSC टेस्ट सीरीज़</h1><p>पर्यावरण एवं पारिस्थितिकी · UPPSC परीक्षाओं में पूछे गए ${Q.length} प्रश्न · ${tests.length} टेस्ट</p></header>
  <div class="row" style="margin-top:14px"><button class="btn" onclick="start('mix')">🎲 मिश्रित टेस्ट (25 रैंडम प्रश्न)</button></div><div class="grid">`;
  tests.forEach((t,i)=>{const b=store('best'+i);h+=`<button class="tcard" onclick="start(${i})"><b>टेस्ट ${i+1}</b><small>${t.length} प्रश्न</small>${b!=null?`<div class="best">सर्वश्रेष्ठ: ${b}/${t.length}</div>`:''}</button>`});
  app.innerHTML=h+'</div>';scrollTo(0,0);
}
function start(i){
  let ids=i==='mix'?[...Q.keys()].sort(()=>Math.random()-.5).slice(0,25):tests[i];
  st={id:i,ids,pos:0,ans:[]};show();
}
function show(){
  const n=st.ids.length,x=Q[st.ids[st.pos]],done=st.ans[st.pos]!=null,right=st.ans.filter((a,k)=>a===Q[st.ids[k]].a).length;
  let h=`<div class="top"><a class="lnk" onclick="home()">← सभी टेस्ट</a><span>${st.id==='mix'?'मिश्रित टेस्ट':'टेस्ट '+(st.id+1)} · प्रश्न ${st.pos+1}/${n} · सही: ${right}</span></div>
  <div class="bar"><i style="width:${(st.pos+(done?1:0))/n*100}%"></i></div>
  <div class="q"><span class="tag">${esc(x.t)}</span><div class="qt">${st.pos+1}. ${fmtQ(x.q)}</div>`;
  x.o.forEach((o,k)=>{let c='';if(done){if(k===x.a)c='ok';else if(k===st.ans[st.pos])c='bad'}
    h+=`<button class="opt ${c}" ${done?'disabled':''} onclick="pick(${k})"><span class="l">(${L[k]})</span><span>${esc(o)}</span></button>`});
  if(done){const ok=st.ans[st.pos]===x.a;h+=`<div class="fb ${ok?'ok':'bad'}">${ok?'✓ सही उत्तर!':'✗ गलत उत्तर — सही उत्तर है ('+L[x.a]+') '+esc(x.o[x.a])}</div>`}
  h+=`</div><div class="row" style="margin-top:14px;justify-content:space-between"><button class="btn sec" ${st.pos?'':'disabled'} onclick="st.pos--;show()">← पिछला</button>
  <button class="btn" ${done?'':'disabled'} onclick="next()">${st.pos===n-1?'परिणाम देखें':'अगला →'}</button></div>`;
  app.innerHTML=h;
}
function pick(k){st.ans[st.pos]=k;show()}
function next(){if(st.pos<st.ids.length-1){st.pos++;show();scrollTo(0,0)}else result()}
function result(){
  const n=st.ids.length;let r=0,w=0,rev='';
  st.ids.forEach((id,k)=>{const x=Q[id];if(st.ans[k]===x.a)r++;else{w++;rev+=`<div class="rev"><div class="qt" style="margin:0 0 6px">${k+1}. ${fmtQ(x.q)}</div><div class="y">आपका उत्तर: (${L[st.ans[k]]}) ${esc(x.o[st.ans[k]])}</div><div class="c">सही उत्तर: (${L[x.a]}) ${esc(x.o[x.a])}</div><small style="color:var(--mut)">${esc(x.t)}</small></div>`}});
  if(st.id!=='mix'){const b=store('best'+st.id);if(b==null||r>b)store('best'+st.id,r)}
  const neg=(r-w/3).toFixed(2);
  app.innerHTML=`<div class="top"><a class="lnk" onclick="home()">← सभी टेस्ट</a></div><div class="q" style="text-align:center;margin-top:12px">
  <div>${st.id==='mix'?'मिश्रित टेस्ट':'टेस्ट '+(st.id+1)} का परिणाम</div><div class="score">${r} / ${n}</div>
  <div>${Math.round(r/n*100)}% · सही ${r} · गलत ${w}</div><div style="color:var(--mut);font-size:14px">⅓ नेगेटिव मार्किंग के साथ अंक: ${neg}</div>
  <div class="row" style="justify-content:center;margin-top:14px"><button class="btn" onclick="start(st.id)">दोबारा दें</button>${st.id!=='mix'&&st.id<tests.length-1?`<button class="btn sec" onclick="start(${st.id+1})">अगला टेस्ट →</button>`:''}</div></div>
  ${w?'<h3 style="margin-top:22px">गलत प्रश्नों की समीक्षा</h3>'+rev:'<p style="text-align:center;margin-top:20px">🎉 सभी उत्तर सही!</p>'}`;
  scrollTo(0,0);
}
home();
</script></body></html>
