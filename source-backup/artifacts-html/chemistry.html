<title>UPPSC रसायन विज्ञान टेस्ट सीरीज़ (पेज 312–431)</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1f24;--mut:#6b6f78;--line:#e3e0d8;--acc:#2f5bd3;--ok:#1f8a4c;--okbg:#e5f5ec;--bad:#c63b32;--badbg:#fbe9e7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Devanagari","Mangal",system-ui,sans-serif;line-height:1.6}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px}
.wrap{max-width:760px;margin:0 auto;padding:14px}
h1{font-size:18px;margin:0}
.sub{color:var(--mut);font-size:13px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
select,button{font:inherit;font-size:14px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink)}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.score{font-size:14px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.tcard b{display:block;font-size:16px}
.tcard small{color:var(--mut)}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.qn{font-weight:700;color:var(--acc)}
.qt{white-space:pre-wrap;font-weight:600;margin:4px 0 10px}
.qimg{width:100%;max-width:700px;border:1px solid var(--line);border-radius:6px;margin:4px 0 10px;display:block}
.tag{font-size:12px;color:var(--mut);margin-bottom:8px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(60px,1fr));gap:8px}
.opt{display:block;width:100%;text-align:center;margin:0;padding:10px 0;font-weight:700;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:15px}
.opt:hover:not([disabled]){border-color:var(--acc)}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:#0f5130}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:#7d1d17}
.opt[disabled]{cursor:default}
.verdict{font-weight:700;margin-top:8px}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.exp{margin-top:6px;display:none}
.exp.show{display:block}
.toggle{font-size:13px;color:var(--acc);background:none;border:none;padding:4px 0;cursor:pointer}
.res{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center;margin:16px 0}
.res .big{font-size:28px;font-weight:700}
.note{font-size:12px;color:var(--mut);margin-top:24px}
</style>
</head>

const Q = [].concat(...tests);
const PER = 25;
const loaded = {};
function loadTest(i, cb){
  if (loaded[i]) return cb();
  $('#main').innerHTML = '<p class="sub" style="text-align:center;margin-top:40px">टेस्ट लोड हो रहा है…</p>';
  const s = document.createElement('script'); s.src = `t/${i+1}.js`;
  s.onload = () => { loaded[i] = true; cb(); };
  s.onerror = () => { $('#main').innerHTML = '<p class="sub">टेस्ट लोड नहीं हो सका, दोबारा कोशिश करें।</p>'; };
  document.head.appendChild(s);
}
const IMG = p => (window.__IMG && window.__IMG[p]) || '';
const ok = (q, j) => (q.acc ? q.acc.includes(j) : j === q.ans);
const L = ['a','b','c','d','e'];
let state = {};
try { state = JSON.parse(localStorage.getItem('uppsc_chem_312_431') || '{}'); } catch(e) { state = {}; }
function save(){ try { localStorage.setItem('uppsc_chem_312_431', JSON.stringify(state)); } catch(e) {} }
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
document.getElementById('sub').textContent = `कुल ${Q.length} प्रश्न · ${tests.length} टेस्ट · विकल्प चुनते ही सही/गलत दिखेगा`;

function stats(t){ let a=0,c=0; tests[t].forEach(q=>{ const s=state[q.id]; if(s!==undefined){a++; if(ok(q,s))c++;} }); return {a,c}; }

function home(){
  $('#bar').innerHTML = '';
  let h = '<div class="grid">';
  tests.forEach((t,i)=>{ const s=stats(i);
    h += `<div class="tcard" onclick="openTest(${i})"><b>टेस्ट ${i+1}</b><small>${t.length} प्रश्न</small><br><small>${s.a?`हल: ${s.a}/${t.length} · सही: ${s.c}`:'शुरू करें'}</small></div>`; });
  h += '</div><p class="note">प्रश्न PDF (पेज 312–431) से लिए गए हैं — केवल वे प्रश्न जो UPPSC द्वारा आयोजित परीक्षाओं (U.P.P.C.S. प्री/मेन्स, लोअर सबऑर्डिनेट, R.O./A.R.O., U.D.A./L.D.A., GIC, BEO आदि) में पूछे गए। उत्तर पुस्तक के अनुसार हैं; जिन प्रश्नों में आयोग ने दो विकल्प सही माने, उनमें दोनों विकल्प सही गिने जाते हैं। आपकी प्रगति इसी ब्राउज़र में सेव रहती है।</p>';
  $('#main').innerHTML = h; window.scrollTo(0,0);
}

function openTest(i){ loadTest(i, () => renderTest(i)); }
function renderTest(i){
  const t = tests[i];
  $('#bar').innerHTML = `<button onclick="home()">← सभी टेस्ट</button><span class="score" id="sc"></span><button onclick="resetTest(${i})">रीसेट</button>`;
  let h = '';
  t.forEach((q,k)=>{
    h += `<div class="q" id="q_${q.id}"><div><span class="qn">प्रश्न ${k+1} / ${t.length}</span></div>`;
    h += `<img class="qimg" loading="lazy" src="${IMG(q.img)}" alt="प्रश्न ${k+1}">`;
    h += '<div class="opts">';
    for (let j = 0; j < q.n; j++) h += `<button class="opt" data-q="${q.id}" data-j="${j}" onclick="pick(${i},'${q.id}',${j})">(${L[j]})</button>`;
    h += '</div>';
    h += `<div class="verdict" id="v_${q.id}"></div>`;
    if (q.exp) h += `<button class="toggle" id="tg_${q.id}" style="display:none" onclick="togExp('${q.id}','${q.exp}')">व्याख्या देखें ▾</button><div class="exp" id="e_${q.id}"></div>`;
    h += '</div>';
  });
  h += `<div class="res" id="res"></div>`;
  if (i+1 < tests.length) h += `<button class="pri" style="width:100%" onclick="openTest(${i+1})">अगला टेस्ट →</button>`;
  $('#main').innerHTML = h; window.scrollTo(0,0);
  t.forEach(q=>{ if(state[q.id]!==undefined) show(q, state[q.id]); });
  upd(i);
}
function show(q, j){
  document.querySelectorAll(`.opt[data-q="${q.id}"]`).forEach(b=>{
    b.disabled = true; const k=+b.dataset.j;
    if (ok(q,k)) b.classList.add('ok'); else if (k===j) b.classList.add('bad');
  });
  const v = document.getElementById('v_'+q.id);
  const right = q.acc ? q.acc.map(x=>'('+L[x]+')').join(' व ') : '('+L[q.ans]+')';
  if (ok(q,j)){ v.className='verdict ok'; v.textContent='✔ सही उत्तर!' + (q.acc ? ` (आयोग ने ${right} दोनों सही माने)` : ''); }
  else { v.className='verdict bad'; v.textContent=`✘ गलत — सही उत्तर: ${right}`; }
  const tg = document.getElementById('tg_'+q.id); if (tg) tg.style.display='inline-block';
}
function pick(i, id, j){
  const q = tests[i].find(x=>x.id===id); if (state[id]!==undefined) return;
  state[id]=j; save(); show(q,j); upd(i);
}
function upd(i){
  const s = stats(i), n = tests[i].length;
  $('#sc').textContent = `सही ${s.c} / हल ${s.a} / कुल ${n}`;
  const r = $('#res');
  if (s.a===n) r.innerHTML = `<div>टेस्ट ${i+1} पूरा हुआ</div><div class="big">${s.c} / ${n}</div><div>${Math.round(100*s.c/n)}% · गलत: ${n-s.c}</div>`;
  else r.innerHTML = `<div class="sub">${n-s.a} प्रश्न बाकी</div>`;
}
function togExp(id, src){ const e=document.getElementById('e_'+id); if(!e.firstChild){ const im=document.createElement('img'); im.src=IMG(src); im.className='qimg'; im.alt='व्याख्या'; e.appendChild(im);} e.classList.toggle('show'); }
function resetTest(i){ tests[i].forEach(q=>delete state[q.id]); save(); renderTest(i); }
home();
</script>
