<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>सम-सामयिक आर्थिकी 2026 – ऑब्जेक्टिव टेस्ट सीरीज़</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1f24;--mut:#6b6f78;--line:#e4e1d8;--acc:#b5471b;--acc2:#7a2e10;--ok:#1f7a4a;--okbg:#e5f4ec;--bad:#b42318;--badbg:#fdecea;--chip:#f0ece2}
@media (prefers-color-scheme:dark){:root{--bg:#16171a;--card:#202226;--ink:#eceae4;--mut:#9a9da5;--line:#33353b;--acc:#f08a5d;--acc2:#ffb08a;--ok:#5fd394;--okbg:#18342a;--bad:#ff7b6e;--badbg:#3a1f1d;--chip:#2a2c31}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Mukta','Noto Sans Devanagari',system-ui,sans-serif;font-size:17px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:1.45rem;margin:4px 0 2px;line-height:1.25}
.sub{color:var(--mut);font-size:.95rem;margin:0 0 14px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;flex:1;min-width:96px}
.stat b{display:block;font-size:1.25rem;color:var(--acc)}
.stat span{font-size:.82rem;color:var(--mut)}
.btn{appearance:none;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--acc);color:#fff}
.btn.sec{background:var(--chip);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.mix{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tl{display:grid;gap:10px}
.tc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;cursor:pointer}
.tc:hover{border-color:var(--acc)}
.num{flex:0 0 44px;height:44px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-weight:700;color:var(--acc2)}
.tc .t{flex:1;min-width:0}
.tc .t div{font-weight:600;font-size:.98rem;line-height:1.3}
.tc .t small{color:var(--mut);font-size:.82rem}
.bar{height:5px;background:var(--chip);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.badge{font-size:.8rem;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--chip);white-space:nowrap}
.badge.done{background:var(--okbg);color:var(--ok)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:12px}
.toprow{display:flex;align-items:center;gap:8px}
.toprow .ttl{flex:1;font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc{font-size:.9rem;font-weight:700}
.sc .g{color:var(--ok)}.sc .r{color:var(--bad)}
.qc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.qmeta{display:flex;justify-content:space-between;color:var(--mut);font-size:.85rem;margin-bottom:6px}
.ctx{background:var(--chip);border-radius:10px;padding:8px 10px;font-size:.88rem;color:var(--mut);margin-bottom:10px}
.ctx b{color:var(--ink);font-weight:600}
.qt{font-size:1.12rem;font-weight:600;margin:0 0 14px;line-height:1.45}
.op{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px;font:inherit;color:inherit;cursor:pointer}
.op:hover:not(:disabled){border-color:var(--acc)}
.op .l{flex:0 0 28px;height:28px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.op.ok{border-color:var(--ok);background:var(--okbg)}
.op.ok .l{background:var(--ok);color:#fff}
.op.bad{border-color:var(--bad);background:var(--badbg)}
.op.bad .l{background:var(--bad);color:#fff}
.op:disabled{cursor:default}
.fb{border-radius:10px;padding:10px 12px;font-weight:600;margin-top:4px}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.fb span{display:block;font-weight:500;color:var(--ink);margin-top:2px}
.nav{display:flex;gap:10px;margin-top:14px}
.nav .btn{flex:1}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:18px}
.pal button{height:38px;border-radius:8px;border:1px solid var(--line);background:var(--card);font:inherit;font-size:.85rem;color:var(--ink);cursor:pointer}
.pal button.g{background:var(--ok);border-color:var(--ok);color:#fff}
.pal button.r{background:var(--bad);border-color:var(--bad);color:#fff}
.pal button.cur{outline:2px solid var(--acc);outline-offset:1px}
.res{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 16px}
.big{font-size:2.6rem;font-weight:700;color:var(--acc);line-height:1.1}
.rrow{display:flex;justify-content:center;gap:18px;margin:12px 0;flex-wrap:wrap}
.rrow div b{display:block;font-size:1.3rem}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.rev{margin-top:16px;text-align:left}
.ri{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;font-size:.95rem}
.ri .q{font-weight:600;margin-bottom:4px}
.ri .y{color:var(--bad)}.ri .c{color:var(--ok)}
.link{background:none;border:0;color:var(--acc);font:inherit;font-weight:600;cursor:pointer;padding:4px 0}
.note{font-size:.82rem;color:var(--mut);margin-top:22px;text-align:center}
.hidden{display:none}
</style>
</head>

  <div class="rrow"><div><b style="color:var(--ok)">${sc.g}</b>सही</div><div><b style="color:var(--bad)">${sc.r}</b>गलत</div><div><b>${un}</b>छोड़े</div></div>
  <div class="acts">${un?`<button class="btn" onclick="cont()">बाकी प्रश्न हल करें</button>`:''}<button class="btn sec" onclick="retry()">दोबारा शुरू करें</button><button class="btn sec" onclick="home()">सभी टेस्ट</button></div></div>`;
  if(wrong.length){h+=`<div class="rev"><h3>गलत उत्तरों की समीक्षा (${wrong.length})</h3>`;
    wrong.forEach(i=>{const q=Q[i];h+=`<div class="ri"><div class="q">${esc(q.q)}</div><div class="y">आपका उत्तर: ${esc(q.o[cur.ans[i]])}</div><div class="c">सही उत्तर: ${esc(q.o[q.c])}</div></div>`});h+='</div>'}
  app.innerHTML=h;window.scrollTo(0,0);
}
function cont(){const f=cur.idx.findIndex(i=>cur.ans[i]===undefined);cur.pos=f<0?0:f;quiz()}
function retry(){for(const k in cur.ans)delete cur.ans[k];save();cur.pos=0;quiz()}
home();
</script>
</body>
</html>
